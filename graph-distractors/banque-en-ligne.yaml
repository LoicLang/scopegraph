nodes:

  # ── Système 1 : Portail Espace Web Particuliers ─────────────────────────────
  - type: system
    id: sys-dbel-portail-web-particuliers
    name: Portail Espace Web Particuliers
    description: Interface web pour les clients particuliers permettant la consultation de comptes, la gestion documentaire et l'accès aux services en ligne. Constitue le canal historique de la banque en ligne avant le développement des applications mobiles.
    owner_team: Équipe Canal Web
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-tableau-de-bord-web
    name: Tableau de bord personnalisé web
    description: Agrège sur une page d'accueil unique les soldes des comptes, les dernières opérations et les alertes en attente pour le client connecté sur le portail web.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-telechargement-releves
    name: Téléchargement des relevés de compte
    description: Permet au client de télécharger ses relevés mensuels au format PDF depuis l'espace documentaire du portail. Les relevés sont générés à la demande et archivés pendant la durée réglementaire applicable.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-messagerie-securisee
    name: Messagerie sécurisée client-conseiller
    description: Canal d'échange chiffré entre le client particulier et son conseiller bancaire, intégré au portail web. Chaque message est horodaté et archivé dans le dossier client pendant dix ans.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-modification-donnees-contact
    name: Modification des données de contact
    description: Permet au client de mettre à jour son adresse postale, son numéro de téléphone et son courriel directement depuis le portail. Toute modification déclenche une notification de sécurité sur l'ancien canal certifié.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 2 : Agrégateur de comptes externes ──────────────────────────────
  - type: system
    id: sys-dbel-agregateur-comptes-externes
    name: Agrégateur de comptes externes
    description: Service d'agrégation DSP2 permettant aux clients de visualiser dans l'espace web et mobile leurs comptes détenus dans d'autres établissements. S'appuie sur des connecteurs vers les API d'établissements tiers agréés.
    owner_team: Équipe Open Banking
    domains: [banque-en-ligne, dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-dbel-ajout-compte-tiers
    name: Ajout de compte externe agrégé
    description: Parcours d'ajout guidé permettant au client d'associer un compte détenu dans un autre établissement bancaire. Le consentement est recueilli selon le protocole OAuth2 DSP2 et stocké avec une durée de validité de quatre-vingt-dix jours.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-synchronisation-comptes-tiers
    name: Synchronisation des soldes et opérations tiers
    description: Déclenche la mise à jour des données des comptes externes agrégés à intervalles réguliers et à la demande du client. En cas d'échec de connexion à l'établissement tiers, une alerte est affichée sans bloquer l'affichage des autres comptes.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-revocation-consentement-agregation
    name: Révocation du consentement d'agrégation
    description: Offre au client la possibilité de révoquer à tout moment l'accès de l'agrégateur à un compte externe. La révocation est transmise en temps réel à l'établissement tiers via l'API de notification DSP2.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 3 : Coffre-fort numérique ───────────────────────────────────────
  - type: system
    id: sys-dbel-coffre-fort-numerique
    name: Coffre-fort numérique client
    description: Espace de stockage sécurisé proposé aux clients pour conserver leurs documents personnels et bancaires importants. Les fichiers sont chiffrés au repos avec une clé propre à chaque client et ne sont accessibles qu'à lui.
    owner_team: Équipe Coffre Numérique
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-depot-document-coffre
    name: Dépôt de document dans le coffre
    description: Permet au client d'uploader un document personnel (pièce d'identité, contrat, justificatif) depuis le portail web ou l'application mobile. Le fichier est chiffré et indexé avant d'être stocké dans le coffre-fort.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-partage-document-coffre
    name: Partage sécurisé de document depuis le coffre
    description: Génère un lien de partage à durée limitée permettant au client de transmettre un document coffre-fort à un tiers (conseiller, notaire) sans le télécharger au préalable. Le lien expire automatiquement après soixante-douze heures ou à la première consultation.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-suppression-document-coffre
    name: Suppression définitive d'un document coffre
    description: Efface de manière irréversible un fichier stocké dans le coffre-fort, après confirmation explicite du client. Une trace horodatée de la suppression est conservée à des fins d'audit sans conserver le contenu du fichier.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 4 : Moteur de notifications client ──────────────────────────────
  - type: system
    id: sys-dbel-moteur-notifications
    name: Moteur de notifications client
    description: Orchestrateur centralisé d'envoi de notifications vers les canaux push mobile, courriel et SMS. Gère les préférences de notification par client, le routage multicanal et la déduplication des envois.
    owner_team: Équipe Engagement Client
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-notification-operation-carte
    name: Notification d'opération carte en temps réel
    description: Envoie une notification push ou SMS au client dès qu'une transaction carte est autorisée sur son compte. Le message inclut le montant, le marchand et le solde estimé après opération.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-alerte-seuil-solde
    name: Alerte seuil de solde configurable
    description: Déclenche un avertissement par courriel ou push lorsque le solde d'un compte franchit un seuil défini par le client. Le seuil est paramétrable par compte et par sens (solde inférieur ou supérieur au montant cible).
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-notification-echeance-pret
    name: Notification d'échéance de prêt
    description: Rappelle au client par courriel et notification push la prochaine échéance de remboursement de son prêt, sept jours avant la date de prélèvement. Le message précise le montant et le compte débité.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-gestion-preferences-notifications
    name: Gestion des préférences de notification
    description: Interface permettant au client de choisir les événements pour lesquels il souhaite être notifié, le canal préféré (push, email, SMS) et les plages horaires d'envoi. Les préférences sont prises en compte en moins de cinq minutes.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 5 : Moteur de personnalisation ──────────────────────────────────
  - type: system
    id: sys-dbel-moteur-personnalisation
    name: Moteur de personnalisation de l'expérience
    description: Calcule et expose des recommandations contextuelles pour adapter l'interface et les offres présentées au client selon son profil d'usage. S'appuie sur des règles métier et des modèles de segmentation mis à jour quotidiennement.
    owner_team: Équipe Data Client
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-recommandation-produit
    name: Recommandation de produits bancaires
    description: Affiche au client des suggestions de produits adaptées à son profil (épargne, assurance, crédit) dans la zone merchandising du portail web et de l'application mobile. Les recommandations sont recalculées à chaque connexion.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-personnalisation-menu
    name: Personnalisation du menu et des raccourcis
    description: Laisse le client réorganiser les raccourcis de son menu principal selon ses usages les plus fréquents. La configuration est synchronisée entre le portail web et l'application mobile via un profil cloud.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-mode-sombre
    name: Mode sombre et préférences d'affichage
    description: Propose un mode sombre et plusieurs tailles de police pour adapter l'interface aux préférences visuelles du client. Ces paramètres sont persistés dans le profil utilisateur et appliqués dès la connexion.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 6 : Plateforme d'accessibilité numérique ───────────────────────
  - type: system
    id: sys-dbel-plateforme-accessibilite
    name: Plateforme d'accessibilité numérique
    description: Ensemble de composants et de services transversaux garantissant la conformité RGAA des interfaces web et mobiles. Fournit des guides, un scanner automatique et un référentiel de composants accessibles à destination des équipes produit.
    owner_team: Équipe Accessibilité & Inclusion
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-scan-accessibilite-automatique
    name: Scan d'accessibilité automatique des pages
    description: Analyse les pages web publiées à la recherche de violations RGAA de niveaux A et AA et génère un rapport priorisé par équipe. L'analyse est déclenchée à chaque déploiement en environnement de recette.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-composants-accessibles-bibliotheque
    name: Bibliothèque de composants accessibles
    description: Met à disposition des équipes de développement une librairie de composants UI (formulaires, tableaux, modales) testés et conformes RGAA. Chaque composant est documenté avec ses attributs ARIA requis et ses cas d'usage recommandés.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 7 : Portail Espace Pro ──────────────────────────────────────────
  - type: system
    id: sys-dbel-portail-espace-pro
    name: Portail Espace Pro
    description: Interface web dédiée aux clients professionnels et TPE pour la consultation de comptes professionnels, la gestion des remises et le suivi de leur activité financière. Distinct du portail particuliers, il embarque des fonctions de gestion multi-comptes et de délégation d'accès.
    owner_team: Équipe Canal Web Pro
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-delegation-acces-pro
    name: Délégation d'accès collaborateur
    description: Permet au dirigeant d'accorder à un ou plusieurs collaborateurs un accès limité au portail pro selon un profil de droits (lecture seule, validation de virements). Les délégations sont auditées et révocables à tout moment.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-gestion-remises-cheques
    name: Gestion des remises de chèques
    description: Permet au client pro de constituer et transmettre électroniquement ses bordereaux de remise de chèques sans se déplacer en agence. Le traitement est intégré au système de compensation bancaire sous quarante-huit heures ouvrées.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-export-comptable-pro
    name: Export comptable des opérations
    description: Génère pour le client professionnel un fichier d'export au format OFX ou CSV des opérations bancaires d'une période sélectionnée, prêt à importer dans son logiciel de comptabilité tiers.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 8 : Service d'authentification forte ────────────────────────────
  - type: system
    id: sys-dbel-service-authentification-forte
    name: Service d'authentification forte
    description: Orchestrateur de l'authentification multifacteur pour l'ensemble des canaux numériques de la banque en ligne. Gère les méthodes SCA (OTP SMS, OTP applicatif, biométrie) et expose une API d'orchestration consommée par les portails web et mobiles.
    owner_team: Équipe Sécurité Accès
    domains: [banque-en-ligne, dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-dbel-enregistrement-biometrie
    name: Enregistrement de la biométrie mobile
    description: Permet au client de s'inscrire à l'authentification par empreinte digitale ou reconnaissance faciale sur l'application mobile. L'enregistrement est conditionné à une validation forte initiale par OTP SMS et stocke un gabarit local sans transmission au serveur.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-otp-applicatif
    name: Génération d'OTP applicatif
    description: Produit des codes à usage unique TOTP dans l'application mobile pour valider les opérations sensibles sans recourir au SMS. L'OTP applicatif est accepté comme second facteur SCA conformément à la norme DSP2.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-gestion-sessions-actives
    name: Gestion et révocation des sessions actives
    description: Affiche au client la liste de ses sessions ouvertes sur tous les appareils (portail web, mobile) avec le détail de l'appareil et de la localisation approchée. Le client peut révoquer toute session à distance en un clic.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-blocage-acces-temporaire
    name: Blocage temporaire de l'accès en ligne
    description: Offre au client la possibilité de bloquer immédiatement l'ensemble de ses accès numériques (web et mobile) en cas de doute sur la sécurité de son compte. Le déblocage nécessite une ré-authentification renforcée avec validation du conseiller.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 9 : Hub de souscription en ligne ────────────────────────────────
  - type: system
    id: sys-dbel-hub-souscription-ligne
    name: Hub de souscription en ligne
    description: Orchestrateur des parcours de souscription de produits bancaires depuis les canaux numériques (épargne, assurance-vie, carte supplémentaire). Centralise la validation d'éligibilité, la signature électronique et la transmission aux systèmes back-office.
    owner_team: Équipe Souscription Digitale
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-souscription-livret-epargne
    name: Souscription d'un livret d'épargne en ligne
    description: Parcours intégralement dématérialisé permettant à un client d'ouvrir un livret d'épargne réglementé ou non depuis le portail web ou l'application mobile. La souscription est validée en moins de vingt-quatre heures après vérification d'éligibilité.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-souscription-carte-supplementaire
    name: Souscription d'une carte bancaire supplémentaire
    description: Permet à un client titulaire de commander une carte additionnelle pour un co-titulaire ou un enfant mineur depuis l'espace client. Le formulaire intègre la configuration des plafonds personnalisés dès la demande.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-signature-electronique
    name: Signature électronique des contrats
    description: Intègre une solution de signature électronique qualifiée permettant au client de signer tout contrat bancaire depuis le portail web sans impression papier. Chaque signature produit un dossier de preuve archivé pendant la durée légale du contrat.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 10 : Configurateur de virements programmés ──────────────────────
  - type: system
    id: sys-dbel-configurateur-virements-programmes
    name: Configurateur de virements programmés
    description: Service de planification et d'exécution des virements permanents et à terme initiés depuis les canaux numériques. Gère les récurrences (hebdomadaire, mensuelle, libre), les suspensions temporaires et les révisions de montant.
    owner_team: Équipe Paiements Digitaux
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-creation-virement-permanent
    name: Création d'un virement permanent
    description: Permet au client de configurer un virement récurrent vers un bénéficiaire enregistré avec un montant fixe, une périodicité et une date de première exécution. La mise en place est effective dès le lendemain ouvré.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-modification-virement-programme
    name: Modification d'un virement programmé existant
    description: Offre la possibilité de changer le montant, la périodicité ou la date de fin d'un virement permanent sans devoir le supprimer et le recréer. La modification prend effet à partir de la prochaine échéance non encore traitée.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-suspension-virement-programme
    name: Suspension et reprise d'un virement permanent
    description: Autorise le client à suspendre temporairement l'exécution d'un virement programmé pour une durée déterminée sans le supprimer. La reprise automatique à la date indiquée est notifiée par courriel.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 11 : Moteur de recherche transactionnel ─────────────────────────
  - type: system
    id: sys-dbel-moteur-recherche-transactionnel
    name: Moteur de recherche transactionnel
    description: Permet aux clients de rechercher et filtrer leurs opérations bancaires selon des critères multiples (libellé, montant, date, catégorie). Expose une API de recherche full-text indexée quotidiennement sur l'historique des vingt-quatre derniers mois.
    owner_team: Équipe Expérience Compte
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-recherche-operation-libelle
    name: Recherche d'opérations par libellé
    description: Offre une recherche textuelle dans l'historique des opérations d'un compte selon le libellé saisi par le client. Les résultats sont classés par pertinence et présentent un extrait du libellé avec mise en évidence du terme recherché.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-categorisation-depenses
    name: Catégorisation automatique des dépenses
    description: Classe automatiquement chaque opération dans une catégorie de dépenses (alimentation, transport, loisirs) à l'aide d'un algorithme de correspondance sur les libellés marchands. Le client peut corriger la catégorie d'une opération pour enrichir le modèle personnel.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-bilan-depenses-mensuel
    name: Bilan mensuel des dépenses par catégorie
    description: Présente chaque mois une synthèse visuelle des dépenses du client regroupées par catégorie, avec comparaison au mois précédent et au budget cible s'il a été défini. Le bilan est disponible dès le premier jour du mois suivant.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 12 : Gestionnaire de mandats de prélèvement ─────────────────────
  - type: system
    id: sys-dbel-gestionnaire-mandats-prelevement
    name: Gestionnaire de mandats de prélèvement SEPA
    description: Référentiel et interface de gestion des mandats SEPA SDD attachés aux comptes des clients particuliers et professionnels. Permet la consultation, la révocation et le signalement de prélèvements non autorisés.
    owner_team: Équipe Paiements Digitaux
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-consultation-mandats-actifs
    name: Consultation des mandats SEPA actifs
    description: Affiche la liste de tous les mandats de prélèvement SEPA en cours associés à un compte, avec le créancier, la référence unique de mandat et la date du dernier prélèvement. La liste est mise à jour à chaque opération SDD reçue.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-opposition-prelevement
    name: Opposition sur prélèvement non autorisé
    description: Permet au client de contester un prélèvement SEPA qu'il n'a pas autorisé directement depuis son espace client, sans appel à son conseiller. L'opposition est enregistrée et transmise au service contentieux sous deux heures ouvrées.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 13 : Outil de simulation financière ─────────────────────────────
  - type: system
    id: sys-dbel-outil-simulation-financiere
    name: Outil de simulation financière
    description: Propose aux clients des simulateurs en ligne pour estimer leur capacité d'emprunt, le coût d'un crédit immobilier ou la projection d'une épargne. Les simulations sont anonymes et ne nécessitent pas d'authentification pour les calculs de base.
    owner_team: Équipe Conseils Digitaux
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-simulateur-credit-immobilier
    name: Simulateur de crédit immobilier
    description: Calcule pour un projet immobilier saisi par l'utilisateur les mensualités estimées, le coût total du crédit et le taux d'endettement résultant. Les résultats intègrent l'assurance emprunteur estimée et peuvent être enregistrés dans l'espace client pour un suivi ultérieur.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-simulateur-epargne-projet
    name: Simulateur d'épargne par objectif
    description: Aide le client à planifier son épargne pour atteindre un objectif financier en calculant le versement mensuel nécessaire selon le capital cible, l'horizon et le taux de rendement estimé. Le résultat peut être converti en ouverture de livret d'épargne en quelques clics.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 14 : Service de parrainage digital ───────────────────────────────
  - type: system
    id: sys-dbel-service-parrainage-digital
    name: Service de parrainage digital
    description: Gère les programmes de parrainage client-à-client de la banque en ligne, depuis la génération du lien personnalisé jusqu'au versement de la prime de parrainage. Intègre la détection des tentatives de fraude au parrainage et le plafonnement des primes.
    owner_team: Équipe Croissance & Acquisition
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-generation-lien-parrainage
    name: Génération du lien de parrainage personnalisé
    description: Crée pour chaque client un lien de parrainage unique et traçable à partager avec ses proches. Le lien encode l'identifiant du parrain et la campagne active, avec une durée de validité configurable par campagne.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-suivi-cooptations
    name: Suivi des cooptations en cours
    description: Présente au parrain un tableau de suivi listant les prospects ayant cliqué sur son lien, leur statut de souscription et l'avancement vers le déclenchement de la prime. Les données sont actualisées quotidiennement.
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Système 15 : Plateforme de satisfaction client ──────────────────────────
  - type: system
    id: sys-dbel-plateforme-satisfaction-client
    name: Plateforme de satisfaction client
    description: Collecte et centralise les avis et notes attribués par les clients après les interactions digitales clés (souscription, virement, appel conseiller). Alimente un tableau de bord NPS et CSAT utilisé par le comité produit mensuel.
    owner_team: Équipe Expérience Client
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-enquete-satisfaction-post-acte
    name: Enquête de satisfaction post-acte
    description: Déclenche un questionnaire court (trois questions maximum) à l'issue d'un acte clé réalisé sur le portail ou l'application mobile. Le taux de réponse cible est de quinze pourcent ; la sollicitation est limitée à une enquête par client par quinzaine.
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dbel-traitement-verbatim-client
    name: Traitement automatique des verbatims clients
