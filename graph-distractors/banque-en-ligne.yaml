  # ── Decisions ────────────────────────────────────────────────────────────────
  - type: decision
    id: dec-dbel-design-system-commun
    title: Adoption d'un design system commun web et mobile
    statement: Un design system unique est adopté pour l'ensemble des interfaces numériques de la banque en ligne. Tout nouveau composant ou toute modification de composant existant doit être intégré au design system avant d'être utilisé dans un produit.
    rationale: Les interfaces web et mobile avaient divergé visuellement au point de nuire à la cohérence de la marque et d'allonger les délais de développement. Un design system commun réduit la duplication et accélère la mise en conformité accessibilité.
    date: "2023-06-15"
    decided_by: Comité Produit Digital
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-stockage-biometrie-local
    title: Stockage local exclusif du gabarit biométrique
    statement: Le gabarit biométrique enrôlé par le client (empreinte, reconnaissance faciale) est conservé exclusivement sur l'appareil mobile et n'est jamais transmis aux serveurs de la banque. Toute solution nécessitant une centralisation du gabarit est exclue.
    rationale: Réduire le risque en cas de compromission des serveurs et respecter le principe de minimisation des données personnelles sensibles imposé par le RGPD. La solution locale est également plus performante (aucun aller-retour réseau).
    date: "2022-11-30"
    decided_by: Comité Sécurité & Conformité
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-api-gateway-unique
    title: Passerelle API unique pour l'ensemble des services banque en ligne
    statement: Tous les appels entre les canaux numériques et les systèmes back-end de la banque en ligne transitent exclusivement par l'API Gateway centralisée. Toute connexion directe entre un portail et un système back-end est interdite.
    rationale: Centraliser la gestion de l'authentification, de la limitation de débit et de la journalisation évite de dupliquer ces mécanismes dans chaque système et simplifie l'audit de sécurité.
    date: "2023-03-01"
    decided_by: Comité d'Architecture SI
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-consentement-granulaire
    title: Consentement RGPD granulaire par finalité
    statement: Chaque finalité de traitement de données personnelles non obligatoire doit donner lieu à un consentement indépendant, avec une case à cocher distincte et un libellé explicite. Le regroupement de finalités dans un consentement unique est interdit.
    rationale: Les contrôles de la CNIL ont démontré que les consentements groupés ne satisfont pas à l'exigence de libre choix du RGPD. La granularité facilite également la gestion des retraits partiels.
    date: "2023-09-20"
    decided_by: Comité DPO
    still_active: true
    domains: [banque-en-ligne, referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dbel-session-expiration-30min
    title: Expiration automatique des sessions web après trente minutes d'inactivité
    statement: Toute session sur le portail web est automatiquement invalidée après trente minutes d'inactivité consécutive. L'utilisateur est averti cinq minutes avant l'expiration et peut prolonger sa session s'il est encore présent.
    rationale: Réduire le risque d'accès non autorisé depuis un poste laissé sans surveillance. Le délai de trente minutes représente un compromis entre sécurité et confort d'utilisation validé par les tests utilisateurs.
    date: "2022-04-12"
    decided_by: Comité Sécurité Accès
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-otp-applicatif-prefere
    title: OTP applicatif préféré à l'OTP SMS pour la SCA
    statement: Pour les clients disposant de l'application mobile avec OTP applicatif activé, ce canal est utilisé en priorité sur l'OTP SMS pour les opérations SCA. Le SMS reste le mécanisme de repli pour les clients sans application ou en cas d'indisponibilité de l'OTP applicatif.
    rationale: L'OTP SMS est vulnérable aux attaques de type SIM swap. L'OTP TOTP applicatif offre une résistance supérieure et une meilleure expérience utilisateur (pas d'attente de SMS).
    date: "2023-01-18"
    decided_by: Comité Sécurité Accès
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-notifications-non-desactivables
    title: Certaines alertes de sécurité ne sont pas désactivables par le client
    statement: Les notifications relatives aux changements d'identifiants de connexion, à l'enrôlement d'un nouveau facteur d'authentification et aux connexions depuis un nouvel appareil ne peuvent pas être désactivées par le client dans ses préférences de notification.
    rationale: Ces alertes constituent le dernier filet de sécurité contre les prises de contrôle de compte. Leur désactivation par un attaquant ayant pris la main sur la session aurait des conséquences irréversibles pour le client.
    date: "2022-07-05"
    decided_by: Comité Sécurité Accès
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-audit-trail-coffre-fort
    title: Traçabilité des opérations sur le coffre-fort
    statement: Toute opération sur le coffre-fort numérique (dépôt, suppression, partage, consultation) est journalisée avec l'identité du client, l'horodatage et le hash du document concerné. Ce journal est conservé pendant dix ans et ne peut être modifié ni supprimé par le client.
    rationale: Le coffre-fort peut contenir des pièces à valeur probante (contrats, actes). La traçabilité complète des opérations est nécessaire pour répondre aux exigences légales en cas de litige.
    date: "2023-10-02"
    decided_by: Comité Juridique
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-chatbot-escalade-24h
    title: Escalade humaine obligatoire en cas d'échec du chatbot
    statement: Lorsque le chatbot ne peut pas résoudre la demande du client après deux tentatives, il doit proposer systématiquement une mise en relation avec un conseiller humain ou une prise de rendez-vous. Le client ne peut pas être renvoyé indéfiniment vers le chatbot sur le même sujet.
    rationale: Éviter la frustration des clients bloqués dans des boucles conversationnelles et préserver la qualité de service perçue du canal digital.
    date: "2024-02-14"
    decided_by: Comité Expérience Client
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-mentions-legales-bloquantes
    title: Non-conformité des mentions légales bloquante au déploiement
    statement: Toute page produit ou contenu publicitaire ne satisfaisant pas aux contrôles automatiques des mentions légales obligatoires est bloquée en déploiement jusqu'à correction et validation manuelle de l'équipe Conformité.
    rationale: Les manquements aux obligations d'information précontractuelle exposent la banque à des sanctions de l'ACPR. Un blocage automatique est plus fiable qu'un contrôle a posteriori.
    date: "2024-04-30"
    decided_by: Comité Conformité Digitale
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-refresh-consentement-agregation-90j
    title: Renouvellement obligatoire du consentement d'agrégation tous les 90 jours
    statement: Le consentement accordé par un client pour l'agrégation d'un compte externe expire automatiquement après quatre-vingt-dix jours, conformément à la réglementation DSP2. Le client doit le renouveler explicitement ; en l'absence de renouvellement, la synchronisation est suspendue.
    rationale: Conformité avec l'article 36 de la directive DSP2 délégué par le RTS sur l'authentification forte. Le renouvellement garantit que le client maintient un consentement éclairé et actif.
    date: "2022-12-01"
    decided_by: Comité DSP2
    still_active: true
    domains: [banque-en-ligne, dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-dbel-versioning-api-6mois
    title: Préavis minimal de six mois avant retrait d'une version API
    statement: Toute version d'API publiée doit être maintenue pendant au minimum six mois après l'annonce de sa dépréciation. Ce délai est porté à douze mois pour les API exposées à des partenaires externes.
    rationale: Les consommateurs d'API (équipes internes et partenaires) ont besoin de temps suffisant pour migrer sans rupture de service. Un délai trop court génère des incidents en production.
    date: "2023-05-10"
    decided_by: Comité d'Architecture SI
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-nps-cible-mensuel
    title: Suivi mensuel du NPS digital en comité produit
    statement: Le Net Promoter Score des canaux numériques est présenté chaque mois en comité produit avec une décomposition par parcours et par segment client. Tout parcours dont le NPS est inférieur à zéro fait l'objet d'un plan d'action dans les trente jours.
    rationale: Institutionnaliser le pilotage par la satisfaction client au niveau du comité produit pour prioriser les améliorations UX de façon objective et régulière.
    date: "2024-01-10"
    decided_by: Directeur Digital
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-portail-pro-delegation-4-yeux
    title: Validation à quatre yeux pour les virements délégués sur le portail pro
    statement: Tout virement initié par un collaborateur ayant un accès délégué sur le portail professionnel dont le montant dépasse dix mille euros doit être validé par le titulaire du compte avant exécution. Cette règle ne peut pas être désactivée par la configuration de délégation.
    rationale: Maintenir le contrôle du dirigeant sur les opérations significatives tout en permettant la délégation des tâches courantes de faible montant à ses collaborateurs.
    date: "2024-06-01"
    decided_by: Comité des Risques Opérationnels
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-simulateurs-non-contractuels
    title: Les résultats des simulateurs financiers sont non contractuels
    statement: Les simulations produites par les outils en ligne sont des estimations non contractuelles affichées à titre indicatif. Une mention explicite de non-contractualité doit figurer sur chaque écran de résultat, avec un renvoi vers les conditions définitives applicables au produit souscrit.
    rationale: Éviter tout engagement implicite de la banque sur les paramètres simulés, notamment les taux, qui peuvent évoluer entre la simulation et la souscription effective.
    date: "2023-07-15"
    decided_by: Direction Juridique
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-prime-parrainage-plafonnee
    title: Plafonnement des primes de parrainage par client et par an
    statement: Un même client parrain ne peut bénéficier de plus de dix primes de parrainage par année civile, quel que soit le programme actif. Ce plafond est appliqué automatiquement par le service de parrainage avant tout déclenchement de prime.
    rationale: Prévenir les abus de type ferme de parrainages tout en maintenant l'attractivité du programme pour les clients recommandant de bonne foi leur entourage.
    date: "2024-03-20"
    decided_by: Comité Croissance & Risques
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-donnees-personalisation-optout
    title: Personnalisation basée sur les données d'usage soumise à opt-out
    statement: La personnalisation de l'interface et des recommandations produit basée sur l'analyse des données d'usage du client est active par défaut mais peut être désactivée à tout moment depuis les préférences de confidentialité. Seule la personnalisation nécessaire à la sécurité reste obligatoire.
    rationale: Offrir une expérience personnalisée par défaut tout en respectant les droits des clients opposés à l'analyse de leurs comportements numériques.
    date: "2023-11-05"
    decided_by: Comité DPO
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-historique-operations-24mois
    title: Historique de consultation des opérations limité à 24 mois
    statement: Le moteur de recherche transactionnel indexe et rend accessibles en ligne les opérations des vingt-quatre derniers mois. Les opérations plus anciennes sont archivées et accessibles uniquement sur demande au conseiller.
    rationale: Équilibrer les besoins de consultation des clients avec les contraintes de performance de l'index de recherche et les coûts de stockage. La grande majorité des besoins de consultation porte sur les opérations récentes.
    date: "2023-04-03"
    decided_by: Comité Produit Digital
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-single-sign-on-portails
    title: Authentification unique entre portail web et portail pro
    statement: Un client disposant à la fois d'un compte particulier et d'un compte professionnel peut basculer entre les deux espaces sans ressaisir ses identifiants, via un mécanisme de single sign-on interne. Les habilitations de chaque espace restent strictement séparées.
    rationale: Simplifier l'expérience des clients multi-statuts et réduire les abandons de session dus aux écrans de connexion répétitifs.
    date: "2024-09-10"
    decided_by: Comité Produit Digital
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-scan-rgaa-chaque-deploiement
    title: Scan RGAA déclenché à chaque déploiement en recette
    statement: L'outil de scan d'accessibilité est intégré au pipeline de déploiement en environnement de recette et s'exécute automatiquement sur l'ensemble des pages modifiées. Un rapport d'anomalies est envoyé à l'équipe responsable de la page concernée.
    rationale: Détecter les régressions d'accessibilité au plus tôt dans le cycle de livraison, avant qu'elles n'atteignent la production et ne nécessitent une correction d'urgence plus coûteuse.
    date: "2024-11-20"
    decided_by: Comité Accessibilité
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-alertes-securite-log-centralise
    title: Journal de sécurité centralisé et immuable pour toutes les alertes
    statement: Chaque alerte de sécurité émise par le gestionnaire d'alertes est écrite dans un journal centralisé immuable (append-only). Ce journal alimente les investigations en cas d'incident et est transmis mensuellement au responsable de la sécurité des systèmes d'information.
    rationale: Disposer d'une trace inviolable des événements de sécurité facilite la détection des attaques sophistiquées et la réponse aux exigences réglementaires de traçabilité.
    date: "2023-08-14"
    decided_by: RSSI
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: decision
    id: dec-dbel-ifu-disponible-15-fevrier
    title: Mise à disposition des IFU au plus tard le 15 février
    statement: Les Imprimés Fiscaux Uniques des clients investisseurs doivent être disponibles dans l'espace documentaire du portail au plus tard le quinze février de l'année suivant l'exercice fiscal concerné. Tout retard doit être signalé au directeur de l'offre Épargne.
    rationale: Permettre aux clients de respecter les délais fiscaux de déclaration de revenus financiers. Un retard expose la banque à des réclamations clients et à un risque réputationnel.
    date: "2023-12-01"
    decided_by: Direction Épargne & Investissement
    still_active: true
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Constraints ──────────────────────────────────────────────────────────────
  - type: constraint
    id: con-dbel-rgaa-aa-obligatoire
    title: Conformité RGAA niveau AA obligatoire pour les interfaces publiques
    statement: Toutes les pages du portail web et de l'application mobile accessibles aux clients doivent atteindre le niveau de conformité AA du Référentiel Général d'Amélioration de l'Accessibilité. Cette obligation découle de la loi pour une République Numérique.
    source: Loi pour une République Numérique (2016)
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-sca-dsp2-operations-sensibles
    title: SCA obligatoire pour les opérations sensibles DSP2
    statement: Toute opération considérée comme sensible au sens de la DSP2 (accès au compte après inactivité, initiation de paiement, modification de données de sécurité) doit être précédée d'une authentification forte à deux facteurs. Aucune dérogation n'est possible sans exemption réglementaire explicite.
    source: Directive DSP2 / RTS EBA sur l'authentification forte
    severity: high
    domains: [banque-en-ligne, dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-dbel-chiffrement-repos-coffre
    title: Chiffrement AES-256 au repos pour le coffre-fort
    statement: Tous les documents stockés dans le coffre-fort numérique doivent être chiffrés au repos avec AES-256 minimum. La clé de chiffrement est propre à chaque client et gérée par un service de gestion de clés certifié HSM.
    source: Politique de sécurité des données de la banque (v4.2)
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-conservation-messages-10ans
    title: Conservation des messages sécurisés pendant dix ans
    statement: Les messages échangés dans la messagerie sécurisée entre les clients et leurs conseillers doivent être archivés pendant dix ans à compter de la date d'envoi. L'archivage est horodaté et non modifiable.
    source: Code monétaire et financier — archivage des communications clients
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-taux-affichage-taeg
    title: Affichage obligatoire du TAEG sur toutes les fiches crédit
    statement: Toute fiche produit crédit publiée sur le portail web doit afficher le Taux Annuel Effectif Global selon la formule et les conditions de lisibilité définies par le Code de la consommation. L'omission ou la présentation non conforme du TAEG est un motif de blocage de publication.
    source: Code de la consommation — Articles L. 312-1 et suivants
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-limitation-sollicitation-enquetes
    title: Une seule enquête de satisfaction par client par quinzaine
    statement: Un même client ne peut pas recevoir plus d'une enquête de satisfaction toutes les deux semaines, tous parcours et canaux confondus. Le gestionnaire de déclenchement des enquêtes maintient un compteur par client et bloque toute sollicitation excédentaire.
    source: Charte de sollicitation client (interne)
    severity: low
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-disponibilite-portail-99-5
    title: Disponibilité du portail web de 99,5 % par mois
    statement: Le portail web particuliers doit afficher une disponibilité mensuelle d'au moins quatre-vingt-dix-neuf virgule cinq pourcent, mesurée par les sondes de supervision externalisées. Tout dépassement des seuils de dégradation fait l'objet d'un incident P1.
    source: Engagement de niveau de service (SLA interne)
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-temps-reponse-api-200ms
    title: Temps de réponse API en dessous de 200 ms au P95
    statement: Les endpoints de l'API Gateway doivent répondre en moins de deux cents millisecondes au quatre-vingt-quinzième percentile en conditions de charge nominale. Les endpoints dépassant ce seuil font l'objet d'un plan de performance avant toute mise en production.
    source: Standard de performance API (interne)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-validite-consentement-agregation
    title: Validité du consentement d'agrégation limitée à 90 jours
    statement: Conformément au RTS DSP2, le consentement accordé pour l'agrégation d'un compte externe expire automatiquement après quatre-vingt-dix jours. Passé ce délai, la synchronisation est suspendue et le client est invité à renouveler son consentement.
    source: RTS EBA sur l'authentification forte (Art. 36)
    severity: high
    domains: [banque-en-ligne, dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-dbel-isolation-donnees-coffre
    title: Isolation stricte des données du coffre entre clients
    statement: L'architecture du coffre-fort numérique doit garantir qu'aucun utilisateur, y compris un agent de support, ne peut accéder au contenu des documents d'un autre client. L'accès est conditionné à la possession de la clé dérivée du mot de passe client.
    source: Politique RSSI – données personnelles sensibles
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-portee-delegation-pro
    title: Délégation d'accès pro limitée aux collaborateurs déclarés
    statement: Seuls les collaborateurs figurant dans le répertoire employés de l'entreprise cliente peuvent bénéficier d'une délégation d'accès sur le portail pro. La délégation vers un tiers externe à l'entreprise est techniquement bloquée.
    source: Politique de gestion des accès (PGA v3)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-non-contractualite-simulateurs
    title: Mention de non-contractualité obligatoire sur les simulateurs
    statement: Chaque écran présentant le résultat d'une simulation financière doit afficher en caractères lisibles la mention indiquant que le résultat est une estimation non contractuelle. Cette mention ne peut pas être affichée uniquement dans les conditions générales.
    source: Décision de la Direction Juridique (2023-07-15)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-alertes-securite-non-desactivables
    title: Alertes de sécurité critiques non désactivables
    statement: Les alertes relatives aux changements d'identifiants, à l'enrôlement biométrique et aux connexions depuis un nouvel appareil ne peuvent être ni désactivées ni filtrées par le client dans ses préférences. Ces alertes sont systématiquement envoyées sur le canal de contact principal certifié.
    source: Décision Comité Sécurité Accès (2022-07-05)
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-taille-max-document-coffre
    title: Taille maximale d'un document coffre-fort limitée à 10 Mo
    statement: Chaque fichier déposé dans le coffre-fort numérique ne peut pas dépasser dix mégaoctets. Le quota total par client est fixé à cinq cents mégaoctets. Tout dépassement de quota bloque le dépôt et déclenche une notification au client.
    source: Politique de capacité coffre-fort (v1.1)
    severity: low
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-historique-transactions-24mois
    title: Historique de transactions en ligne limité aux 24 derniers mois
    statement: Le moteur de recherche transactionnel ne donne accès qu'aux opérations des vingt-quatre derniers mois. Les opérations antérieures sont accessibles uniquement via une demande formelle traitée dans les cinq jours ouvrés.
    source: Décision Comité Produit Digital (2023-04-03)
    severity: low
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-politique-cookies-conforme
    title: Politique de cookies conforme aux recommandations CNIL
    statement: Le portail web doit proposer une bannière de gestion des cookies permettant au visiteur d'accepter, de refuser ou de paramétrer finement les cookies non essentiels. Le refus doit être aussi simple que l'acceptation ; aucun cookie analytique ou publicitaire n'est posé avant consentement.
    source: Recommandations CNIL sur les cookies (2020)
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-plafond-primes-parrainage
    title: Plafond de dix primes de parrainage par an et par client
    statement: Le système de parrainage applique automatiquement un plafond de dix primes par année civile et par client parrain. Au-delà de ce seuil, les nouvelles cooptations sont enregistrées mais la prime n'est pas versée. Le client est notifié de l'atteinte du plafond.
    source: Décision Comité Croissance & Risques (2024-03-20)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-version-os-minimale-mobile
    title: Support des deux dernières versions majeures des OS mobiles
    statement: L'application mobile est garantie fonctionnelle sur les deux dernières versions majeures d'iOS et d'Android disponibles au moment du déploiement. Les versions antérieures sont supportées en best-effort sans engagement de correction de bug spécifique.
    source: Politique de support des plateformes mobiles (v2.0)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-transfert-donnees-agregation-hors-ue
    title: Pas de transfert de données d'agrégation hors UE
    statement: Les données des comptes externes agrégés ne peuvent pas transiter ou être stockées sur des serveurs situés hors de l'Union Européenne. Cette contrainte s'applique également aux sous-traitants du service d'agrégation.
    source: RGPD — Chapitre V (transferts vers pays tiers)
    severity: high
    domains: [banque-en-ligne, dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-dbel-perimetre-pci-dss-web
    title: Portail web hors périmètre PCI DSS direct
    statement: Le portail web particuliers ne doit pas stocker, traiter ni transmettre directement des données de porteur de carte. Toute fonctionnalité impliquant des données PAN doit déléguer le traitement à un composant certifié PCI DSS via tokenisation.
    source: Standard PCI DSS v4.0
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-sla-notifications-5min
    title: Délai maximum de cinq minutes pour les notifications de sécurité
    statement: Les alertes de sécurité (connexion nouvel appareil, changement d'identifiants, opération atypique) doivent être envoyées au client dans un délai maximal de cinq minutes après détection de l'événement. Un dépassement systémique de ce délai constitue un incident de niveau 2.
    source: Engagement de niveau de service notifications (SLA-NOTIF-001)
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-conformite-eidas-signature
    title: Signature électronique qualifiée conforme eIDAS niveau QES
    statement: Les contrats bancaires signés électroniquement depuis le portail web doivent utiliser une solution de signature qualifiée (QES) conforme au règlement eIDAS. L'usage d'une signature simple ou avancée est limité aux documents non contractuels.
    source: Règlement eIDAS (n° 910/2014)
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-duree-session-mobile-7jours
    title: Durée maximale d'une session mobile persistent à 7 jours
    statement: La session persistante de l'application mobile (mémorisation de l'authentification) expire automatiquement après sept jours sans connexion active. À l'issue de cette période, le client doit se ré-authentifier avec son mot de passe principal.
    source: Politique de sécurité des accès mobiles (v2.3)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-anonymisation-verbatims
    title: Anonymisation des verbatims avant analyse automatique
    statement: Les commentaires libres des enquêtes de satisfaction doivent être anonymisés (suppression des noms, numéros de compte, IBAN) avant d'être traités par les outils d'analyse automatique du langage. L'anonymisation est appliquée en temps réel à la soumission du formulaire.
    source: Recommandation DPO (2024-02-28)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-disponibilite-coffre-99
    title: Disponibilité du coffre-fort numérique de 99 % par mois
    statement: Le service de coffre-fort numérique doit être disponible au moins quatre-vingt-dix-neuf pourcent du temps chaque mois. Les opérations de maintenance planifiée doivent être programmées entre vingt-deux heures et six heures et annoncées aux clients vingt-quatre heures à l'avance.
    source: SLA Coffre-fort (CFN-SLA-001)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-audit-delegation-pro
    title: Traçabilité complète des actions des délégués sur le portail pro
    statement: Toute action réalisée par un collaborateur via un accès délégué sur le portail pro (consultation, virement, export) est journalisée avec l'identité du délégué, du titulaire du compte et l'horodatage. Ce journal est consultable par le titulaire depuis l'espace de gestion des délégations.
    source: Politique de gestion des accès (PGA v3)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-score-accessibilite-cible-80
    title: Score d'accessibilité moyen supérieur à 80/100 par fin d'année
    statement: Chaque équipe produit doit maintenir un score d'accessibilité moyen (tel que calculé par le moteur de scoring RGAA) supérieur à quatre-vingts sur cent sur l'ensemble des pages de son périmètre, mesuré à fin d'année civile.
    source: Programme de conformité RGAA 2025 (décision CODIR)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-partage-lien-coffre-72h
    title: Expiration automatique des liens de partage du coffre-fort sous 72 heures
    statement: Tout lien de partage de document coffre-fort expire automatiquement soixante-douze heures après sa génération ou à la première consultation, selon ce qui arrive en premier. Il n'est pas possible de générer un lien de partage permanent.
    source: Politique de sécurité du coffre-fort numérique (v1.1)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-no-donnees-perso-chatbot-logs
    title: Pas de données personnelles non anonymisées dans les logs du chatbot
    statement: Les journaux de conversations du chatbot de support ne doivent pas contenir de données personnelles identifiantes (nom, IBAN, numéro de compte) en clair. Ces données doivent être masquées ou remplacées par des jetons avant écriture dans les logs.
    source: Recommandation DPO (2024-05-10)
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-ifu-transmission-drfip
    title: Transmission des IFU à la DRFiP dans les délais légaux
    statement: Les Imprimés Fiscaux Uniques des clients investisseurs doivent être transmis à la Direction Régionale des Finances Publiques selon les modalités et délais définis par l'administration fiscale. Tout retard ou anomalie de transmission doit être signalé au responsable fiscal.
    source: Code général des impôts — Article 242 ter
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-refresh-cours-marche-15min
    title: Valorisation des portefeuilles titres en différé de 15 minutes maximum
    statement: Les cours utilisés pour la valorisation des portefeuilles titres sur le portail investisseur ne peuvent pas être décalés de plus de quinze minutes par rapport aux cours de marché disponibles. Tout écart supérieur doit déclencher une alerte de supervision.
    source: Règlement MIFID II — obligations d'information
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-rib-signature-electronique
    title: RIB téléchargeable portant une signature électronique valide
    statement: Tout Relevé d'Identité Bancaire généré à la demande sur le portail web doit porter la signature électronique de la banque attestant de l'authenticité du document. La validité de la signature doit être vérifiable par le destinataire via un service public de vérification.
    source: Recommandation CCSF sur les documents bancaires dématérialisés
    severity: medium
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: constraint
    id: con-dbel-blocage-acces-apres-5-echecs
    title: Blocage du compte numérique après 5 échecs d'authentification
    statement: Le compte numérique d'un client est temporairement bloqué pour une durée de trente minutes après cinq tentatives d'authentification incorrectes consécutives. Un déblocage anticipé nécessite une vérification d'identité via un canal alternatif.
    source: Politique de sécurité des accès (v5.1)
    severity: high
    domains: [banque-en-ligne]
    created_from: synthetic

  # ── Risks ─────────────────────────────────────────────────────────────────────
  - type: risk
    id: risk-dbel-prise-de-controle-compte
    title: Prise de contrôle de compte client (Account Takeover)
    statement: Un attaquant disposant des identifiants d'un client (phishing, credential stuffing) peut prendre le contrôle de son espace numérique et initier des opérations frauduleuses avant que l'alerte de sécurité ne soit détectée par le client.
    likelihood: medium
    impact: high
    mitigations:
      - Authentification forte obligatoire pour les opérations sensibles
      - Alertes de sécurité non désactivables sur les actions critiques
      - Détection des connexions depuis des IP ou appareils inconnus
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-indisponibilite-fournisseur-aggregation
    title: Indisponibilité prolongée d'un fournisseur d'API d'agrégation tiers
    statement: Si un établissement bancaire tiers dont les comptes sont agrégés subit une indisponibilité de son API, les données de ses comptes ne se mettent plus à jour, ce qui peut induire en erreur les clients sur leur situation financière réelle.
    likelihood: medium
    impact: medium
    mitigations:
      - Affichage explicite de la date du dernier rafraîchissement réussi
      - Alerte client lors de toute indisponibilité dépassant vingt-quatre heures
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-derive-modele-categorisation
    title: Dérive du modèle de catégorisation des dépenses
    statement: La qualité de la catégorisation automatique peut se dégrader au fil du temps en raison de l'évolution des libellés marchands, entraînant une augmentation du taux d'erreur de catégorisation et une perte de confiance des clients dans les outils d'analyse.
    likelihood: medium
    impact: low
    mitigations:
      - Ré-entraînement trimestriel du modèle sur les corrections manuelles des clients
      - Suivi mensuel du taux d'erreur de catégorisation
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-fraude-parrainage
    title: Fraude au programme de parrainage par création de faux filleuls
    statement: Des clients malveillants peuvent créer de faux comptes ou utiliser des identités proches pour déclencher des primes de parrainage sans apport réel de nouveaux clients. Ce risque est amplifié par la dématérialisation complète du parcours de parrainage.
    likelihood: medium
    impact: medium
    mitigations:
      - Délai de carence avant versement de la prime
      - Détection des comptes liés par IP, appareil ou iban identiques
      - Plafonnement des primes à dix par an et par client
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-regression-accessibilite
    title: Régression d'accessibilité lors de déploiements fréquents
    statement: La cadence élevée de déploiements sur le portail web augmente le risque d'introduction de régressions d'accessibilité non détectées avant la mise en production, dégradant l'expérience des clients en situation de handicap.
    likelihood: medium
    impact: medium
    mitigations:
      - Scan RGAA automatique déclenché à chaque déploiement en recette
      - Tests manuels mensuels avec utilisateurs non-voyants
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-non-renouvellement-consentement-agregation
    title: Suspension massive des agrégations à l'expiration des consentements
    statement: L'expiration simultanée des consentements DSP2 de nombreux clients (vague d'enrôlement initiale) peut générer un pic de contacts clients et une désactivation massive du service d'agrégation si le mécanisme de relance préventive est insuffisant.
    likelihood: low
    impact: medium
    mitigations:
      - Notification de renouvellement envoyée quatorze jours avant expiration
      - Échelonnement des dates d'expiration pour lisser les vagues
    domains: [banque-en-ligne, dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-dbel-perte-cle-chiffrement-coffre
    title: Perte ou corruption de la clé de chiffrement d'un coffre client
    statement: Toute perte ou corruption de la clé de chiffrement associée au coffre d'un client rendrait ses documents définitivement inaccessibles, sans possibilité de récupération du contenu chiffré.
    likelihood: low
    impact: high
    mitigations:
      - Sauvegarde chiffrée des clés dans un HSM redondant géographiquement
      - Tests annuels de restauration des clés en environnement isolé
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-consentement-rgpd-non-propage
    title: Non-propagation des retraits de consentement RGPD aux systèmes consommateurs
    statement: Un retrait de consentement enregistré dans le gestionnaire centralisé peut ne pas être propagé à temps à tous les systèmes consommateurs (personnalisation, prospection), entraînant un traitement illicite de données personnelles.
    likelihood: medium
    impact: high
    mitigations:
      - Délai maximal de propagation de vingt-quatre heures avec monitoring
      - Alertes automatiques en cas d'échec de propagation vers un système
    domains: [banque-en-ligne, referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dbel-performances-portail-charge
    title: Dégradation des performances du portail web en pic de charge
    statement: Lors d'événements exceptionnels (panne prolongée, annonce fiscale) générant un afflux simultané de connexions, les temps de réponse du portail web peuvent dépasser les seuils SLA et entraîner des erreurs d'affichage ou des déconnexions forcées.
    likelihood: low
    impact: high
    mitigations:
      - Tests de charge trimestriels simulant trois fois le trafic habituel
      - Autoscaling horizontal configuré sur les composants critiques
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-sim-swap-otp-sms
    title: Contournement de la SCA par attaque SIM swap sur l'OTP SMS
    statement: Une attaque SIM swap réussie contre un client permet à l'attaquant d'intercepter les OTP SMS et de valider des opérations SCA sans le consentement du client. Ce risque est particulièrement élevé pour les clients n'utilisant pas l'OTP applicatif.
    likelihood: low
    impact: high
    mitigations:
      - Promotion active de l'OTP applicatif comme mécanisme préféré
      - Détection des changements d'IMSI et alerte proactive
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-retard-ifu-investisseurs
    title: Retard de mise à disposition des IFU investisseurs
    statement: Un incident sur le système de génération des IFU peut retarder leur publication dans l'espace documentaire du portail investisseur au-delà du quinze février, exposant la banque à des réclamations de clients en difficulté pour leur déclaration fiscale.
    likelihood: low
    impact: medium
    mitigations:
      - Tests de génération en environnement de pré-production dès janvier
      - Plan de communication client prévu en cas de retard avéré
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-obsolescence-articles-chatbot
    title: Obsolescence des articles de la base de connaissances du chatbot
    statement: L'évolution fréquente des produits et des procédures bancaires peut rendre obsolètes les articles de la base de connaissances utilisée par le chatbot, entraînant des réponses incorrectes ou dépassées aux questions clients.
    likelihood: high
    impact: medium
    mitigations:
      - Revue trimestrielle de l'ensemble des articles par les équipes métier
      - Détection automatique des articles non mis à jour depuis six mois
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-injection-contenu-non-conforme
    title: Publication accidentelle de contenu non conforme aux obligations légales
    statement: Une défaillance du moteur de conformité éditoriale ou une erreur de configuration du workflow de validation pourrait laisser passer en production un contenu ne respectant pas les mentions légales obligatoires, exposant la banque à une sanction de l'ACPR.
    likelihood: low
    impact: high
    mitigations:
      - Double validation pour les fiches produit (conformité + juridique)
      - Audit mensuel d'un échantillon de pages publiées
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-fragmentation-preferences-notifications
    title: Fragmentation et incohérence des préférences de notification multi-canaux
    statement: Si les préférences de notification ne sont pas synchronisées correctement entre le portail web et l'application mobile, un client peut recevoir des doublons de notifications ou ne pas recevoir certaines alertes auxquelles il a souscrit.
    likelihood: medium
    impact: low
    mitigations:
      - Référentiel centralisé des préférences avec propagation synchrone
      - Tests automatisés couvrant les scénarios de modification multi-appareils
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-donnees-personnalisation-biais
    title: Biais dans les recommandations produit de personnalisation
    statement: Le modèle de recommandation peut développer des biais systématiques favorisant certains produits à marges plus élevées indépendamment des besoins réels des clients, exposant la banque à des accusations de pratiques commerciales déloyales.
    likelihood: low
    impact: medium
    mitigations:
      - Audit semestriel du modèle par le comité de déontologie
      - Règle de diversité minimale dans les recommandations par client
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-quota-stockage-coffre-depasse
    title: Dépassement massif des quotas de stockage du coffre-fort
    statement: Une communication incitant les clients à utiliser le coffre-fort pour des documents volumineux (vidéos, archives) pourrait entraîner une saturation rapide de la capacité de stockage et une dégradation du service pour l'ensemble des utilisateurs.
    likelihood: low
    impact: medium
    mitigations:
      - Types de fichiers acceptés limités aux formats documentaires
      - Alerte client à quatre-vingts pourcent du quota consommé
    domains: [banque-en-ligne]
    created_from: synthetic

  - type: risk
    id: risk-dbel-score-nps-portail-pro
    title: NPS insuffisant sur le portail pro faute d'investissements dédiés
    statement: Le portail pro bénéficie de moins d'investissements de redesign que le portail particuliers, ce qui peut entraîner une stagnation ou une détérioration du NPS des clients professionnels et un risque d'attrition vers des concurrents néo-bancaires.
    likelihood: medium
    impact: medium
    mitigations:
      - Suivi NPS portail pro distinct dans le tableau de bord mensuel
      - Budget dédié au roadmap portail pro dans le programme NPS
    domains: [banque-en-ligne]
    created_from: synthetic

