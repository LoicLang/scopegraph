nodes:

  # ── SYSTÈME 1 : Plateforme de recouvrement amiable ──────────────────────────
  - type: system
    id: sys-dcre-plateforme-recouvrement
    name: Plateforme de recouvrement amiable RECOUV+
    description: >-
      Orchestre les campagnes de relance des créances en souffrance avant tout passage
      en contentieux. Gère les plans d'apurement, les promesses de paiement et les
      contacts multicanaux (courrier, e-mail, SMS, appel sortant).
    owner_team: Équipe Recouvrement
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-relance-multicanal
    name: Relance multicanal des créances
    description: >-
      Détermine automatiquement le canal de contact optimal selon le profil de débiteur
      et l'ancienneté de l'impayé, puis déclenche l'envoi via les prestataires d'édition
      ou de messagerie.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-plan-apurement
    name: Gestion des plans d'apurement
    description: >-
      Permet à un conseiller recouvrement de proposer, négocier et enregistrer un
      échelonnement de la dette impayée. Contrôle la cohérence des montants et génère
      l'accord écrit signable en ligne.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-suivi-promesse
    name: Suivi des promesses de paiement
    description: >-
      Enregistre les engagements verbaux ou écrits du débiteur et surveille leur
      respect aux échéances convenues. Déclenche une alerte conseiller en cas de
      non-réalisation dans les 48 heures suivant la date promise.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-scoring-recouvrement
    name: Scoring de récupérabilité
    description: >-
      Calcule un score de probabilité de recouvrement à 90 jours pour chaque créance
      en souffrance, permettant de prioriser l'effort humain sur les dossiers à
      meilleur potentiel de récupération.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-passage-contentieux
    name: Passage en contentieux
    description: >-
      Transmet automatiquement le dossier à la cellule juridique lorsque les seuils
      d'ancienneté ou de montant sont atteints et qu'aucun plan d'apurement n'est en
      cours. Génère le dossier contentieux réglementaire.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 2 : Moteur de rachat de crédit ──────────────────────────────────
  - type: system
    id: sys-dcre-moteur-rachat
    name: Moteur de rachat de crédit RACHATPRO
    description: >-
      Calcule les propositions de regroupement ou de rachat de crédits existants,
      en intégrant les offres concurrentes, le taux de sortie et les frais de remboursement
      anticipé. Produit une offre comparative personnalisée.
    owner_team: Équipe Crédit Restructuration
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-simulation-rachat
    name: Simulation de regroupement de crédits
    description: >-
      Agrège les encours de prêts multiples d'un client et projette un scénario de
      rachat unique avec mensualité réduite, durée allongée et coût total comparé.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-indemnite-remboursement
    name: Calcul d'indemnités de remboursement anticipé
    description: >-
      Applique le barème réglementaire des indemnités de remboursement anticipé (IRA)
      selon le type de crédit et la date de souscription, conformément à la directive
      européenne sur le crédit hypothécaire.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 3 : Gestionnaire d'assurance emprunteur ─────────────────────────
  - type: system
    id: sys-dcre-gestionnaire-assurance
    name: Gestionnaire d'assurance emprunteur ASSUREMP
    description: >-
      Gère le cycle de vie des contrats d'assurance adossés aux crédits immobiliers
      et à la consommation : souscription, délégation d'assurance, questionnaire médical,
      gestion des sinistres et résiliation.
    owner_team: Équipe Assurance Crédit
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-souscription-assurance
    name: Souscription assurance emprunteur
    description: >-
      Guide l'emprunteur dans la déclaration de son état de santé via un questionnaire
      médical simplifié ou étendu. Transmet le dossier à l'assureur partenaire pour
      décision d'acceptation ou de tarification majorée.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-delegation-assurance
    name: Traitement de la délégation d'assurance
    description: >-
      Instruit les demandes de substitution d'assurance par une compagnie externe,
      vérifie l'équivalence des garanties selon la grille de référence réglementaire
      et édite l'accord ou le refus motivé dans les délais légaux.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-gestion-sinistre
    name: Gestion des sinistres emprunteur
    description: >-
      Reçoit et instruit les déclarations de sinistre (décès, invalidité, perte d'emploi).
      Coordonne les pièces justificatives, informe le service comptable des prises en
      charge et suit l'état de règlement avec l'assureur.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 4 : Système de garanties crédit ─────────────────────────────────
  - type: system
    id: sys-dcre-garanties-credit
    name: Système de gestion des garanties GARANTCRED
    description: >-
      Centralise les sûretés attachées aux crédits : hypothèques, cautions, nantissements
      et garanties d'organismes de cautionnement mutuel. Gère l'inscription, la main-
      levée et la valorisation périodique des actifs en garantie.
    owner_team: Équipe Garanties et Sûretés
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-inscription-hypotheque
    name: Inscription et mainlevée d'hypothèque
    description: >-
      Prépare les actes d'inscription hypothécaire en lien avec le notaire, suit
      l'enregistrement auprès du Service de Publicité Foncière et déclenche la
      procédure de mainlevée à l'extinction du prêt.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-caution-organisme
    name: Gestion des cautions d'organisme mutuel
    description: >-
      Interface avec les organismes de cautionnement mutuel (OCM) pour la demande
      et l'acceptation de caution sur les prêts immobiliers. Enregistre la garantie
      dans le dossier et gère les appels en garantie en cas de défaut.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-valorisation-garantie
    name: Valorisation périodique des sûretés
    description: >-
      Recalcule annuellement le ratio loan-to-value en interrogeant un index de prix
      immobiliers ou en intégrant l'expertise transmise par le client. Signale les
      sous-collatéralisations au gestionnaire de risque.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 5 : Plateforme surendettement ───────────────────────────────────
  - type: system
    id: sys-dcre-plateforme-surendettement
    name: Plateforme de traitement du surendettement SURDETT
    description: >-
      Gère les dossiers de clients ayant déposé un dossier de surendettement auprès
      de la Banque de France. Coordonne la suspension des exigibilités, le traitement
      des créances dans le cadre des plans conventionnels et des rétablissements
      personnels.
    owner_team: Équipe Surendettement et Médiation
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-suspension-exigibilite
    name: Suspension des exigibilités
    description: >-
      À réception de la décision de recevabilité de la Banque de France, bloque
      automatiquement les prélèvements et relances sur les créances concernées,
      conformément à l'article L711-2 du Code de la consommation.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-plan-conventionnel
    name: Suivi des plans conventionnels de remboursement
    description: >-
      Enregistre les termes du plan validé par la commission et suit le respect des
      échéances de remboursement réaménagées. Déclenche une alerte en cas d'incident
      de paiement sur le plan en cours d'exécution.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-retablissement-personnel
    name: Traitement du rétablissement personnel
    description: >-
      Instruite la procédure de rétablissement personnel sans liquidation judiciaire
      ou avec liquidation judiciaire simplifiée. Génère les états de créances et
      coordonne les effacements comptables à la clôture de la procédure.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 6 : Portail crédit immobilier ───────────────────────────────────
  - type: system
    id: sys-dcre-portail-immo
    name: Portail de demande de crédit immobilier IMMOPORT
    description: >-
      Front-end dédié à l'instruction des dossiers de prêt immobilier : collecte des
      pièces, simulation du financement, validation de la capacité d'emprunt et
      transmission à l'équipe d'analystes crédit pour décision.
    owner_team: Équipe Crédit Immobilier
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-simulation-immo
    name: Simulation de financement immobilier
    description: >-
      Calcule la capacité d'emprunt, le taux d'endettement prévisionnel et le coût
      total du crédit en intégrant le taux d'intérêt du moment, les frais de notaire
      et l'assurance emprunteur obligatoire.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-collecte-pieces
    name: Collecte et vérification des pièces justificatives
    description: >-
      Pilote le dépôt numérique des justificatifs (bulletins de salaire, avis
      d'imposition, compromis de vente) et applique des contrôles de complétude
      avant toute instruction par l'analyste.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-analyse-capacite
    name: Analyse de la capacité d'emprunt
    description: >-
      Évalue le dossier selon les normes HCSF (taux d'effort maximal, durée maximale)
      et génère un avis préliminaire automatisé transmis à l'analyste pour validation
      finale.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-offre-pret-immobilier
    name: Édition de l'offre de prêt immobilier
    description: >-
      Génère l'offre de prêt réglementée (mention Secci, délai de réflexion de 10
      jours) et la transmet au client par voie dématérialisée. Archive l'exemplaire
      signé dans le dossier crédit.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 7 : Registre des incidents de paiement crédit ───────────────────
  - type: system
    id: sys-dcre-registre-incidents
    name: Registre interne des incidents de paiement INCITRACK
    description: >-
      Consigne tous les incidents de paiement sur crédits : impayés, passages en
      perte, provisions et reprises. Alimente les déclarations réglementaires à la
      Banque de France (FICP) et les reportings internes de risque.
    owner_team: Équipe Risque Crédit
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-declaration-ficp
    name: Déclaration FICP
    description: >-
      Transmet automatiquement les inscriptions et levées d'incidents caractérisés
      au Fichier national des Incidents de remboursement des Crédits aux Particuliers,
      dans le respect des délais réglementaires et du format CFONB.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-suivi-impaye
    name: Suivi des impayés et provisions
    description: >-
      Classe les créances selon la grille de dépréciation IFRS 9 (stages 1, 2, 3)
      et calcule les provisions comptables correspondantes à chaque arrêté trimestriel.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-passage-perte
    name: Constatation des passages en perte
    description: >-
      Initie le workflow de perte comptable sur décision du comité risque, génère
      l'écriture de dépréciation définitive et ferme le dossier recouvrement associé.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 8 : Référentiel des taux crédit ─────────────────────────────────
  - type: system
    id: sys-dcre-referentiel-taux
    name: Référentiel des taux et barèmes TAUXREF
    description: >-
      Centralise les grilles tarifaires de crédit (TAEG, taux nominal, frais de
      dossier) et les paramètres réglementaires (taux d'usure, taux de l'usure
      mensuel BCEAO). Distribue ces données aux systèmes d'origination et de simulation.
    owner_team: Équipe Tarification Crédit
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-publication-bareme
    name: Publication et versionning des barèmes
    description: >-
      Gère le cycle de vie des grilles tarifaires : saisie, validation, date d'effet
      et archivage des versions antérieures. Toute modification est tracée avec son
      auteur et le contexte de décision.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-controle-usure
    name: Contrôle du taux d'usure
    description: >-
      Vérifie en temps réel que tout TAEG proposé reste inférieur au taux d'usure
      publié par la Banque de France. Bloque l'édition de l'offre et alerte le
      service tarification si le seuil est dépassé.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-diffusion-taux
    name: Diffusion des taux aux systèmes consommateurs
    description: >-
      Expose une API REST versionnée permettant aux portails et moteurs de simulation
      d'interroger les barèmes en vigueur. Les données sont mises en cache avec
      invalidation sur événement de publication.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 9 : Moteur d'aide à la décision crédit ──────────────────────────
  - type: system
    id: sys-dcre-moteur-decision
    name: Moteur d'aide à la décision crédit DECIDCRED
    description: >-
      Agrège les signaux de risque (bureau de crédit externe, historique interne,
      scoring comportemental) et produit une recommandation d'octroi avec niveau
      de confiance. Opère en mode batch pour les campagnes et en temps réel pour
      les demandes en ligne.
    owner_team: Équipe Data Science Crédit
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-interrogation-bureau
    name: Interrogation du bureau de crédit
    description: >-
      Appelle l'API du bureau de crédit externe (CREDITCHECK) lors de toute nouvelle
      demande. Intègre le score FICO-équivalent et la liste des incidents déclarés
      dans le dossier de décision automatisé.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-scoring-comportemental
    name: Scoring comportemental interne
    description: >-
      Exploite l'historique de compte courant, les comportements d'épargne et la
      régularité des remboursements existants pour enrichir le score d'octroi avec
      une dimension relationnelle.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-recommandation-octroi
    name: Recommandation d'octroi automatisée
    description: >-
      Synthèse les signaux en une décision (accordé, refusé, renvoi vers analyste)
      assortie d'un niveau de confiance. Les dossiers à faible confiance sont
      systématiquement routés vers un analyste humain.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-motifs-refus
    name: Génération des motifs de refus
    description: >-
      Produit une explication lisible des principaux facteurs ayant conduit au refus,
      conformément à l'obligation de transparence algorithmique (RGPD art. 22 et
      directive crédit consommation).
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 10 : Plateforme de médiation crédit ─────────────────────────────
  - type: system
    id: sys-dcre-mediation
    name: Plateforme de médiation et réclamations MEDIASOL
    description: >-
      Reçoit et instruit les réclamations liées aux crédits (refus contesté, taux
      erroné, incident injustifié). Gère le workflow de traitement, les délais
      réglementaires de réponse et l'escalade vers le médiateur bancaire si nécessaire.
    owner_team: Équipe Relation Client Crédit
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-enregistrement-reclamation
    name: Enregistrement et qualification des réclamations
    description: >-
      Catégorise chaque réclamation entrante par nature (octroi, taux, assurance,
      recouvrement) et l'affecte à l'équipe spécialisée compétente avec le délai
      de traitement réglementaire correspondant.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-escalade-mediateur
    name: Escalade vers le médiateur bancaire
    description: >-
      Lorsqu'une réclamation n'est pas résolue à la satisfaction du client dans le
      délai légal, génère le dossier de saisine du médiateur et notifie le client
      des coordonnées et modalités de saisine.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 11 : Moteur de prêt personnel en ligne ──────────────────────────
  - type: system
    id: sys-dcre-pret-personnel-ligne
    name: Moteur de prêt personnel en ligne PRESTOFINANCE
    description: >-
      Orchestre le parcours 100 % digital de souscription d'un prêt personnel :
      simulation, identité numérique, signature électronique et virement du capital
      sous 24 heures. Cible les clients banque en ligne et les prospects entrants.
    owner_team: Équipe Digital Crédit
    domains: [credit, banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dcre-parcours-digital-pret
    name: Parcours digital de souscription prêt personnel
    description: >-
      Guide l'utilisateur en moins de dix étapes depuis la simulation jusqu'à la
      signature électronique de l'offre de crédit. Intègre les contrôles KYC et
      la vérification du revenu via agrégation bancaire optionnelle.
    domains: [credit, banque-en-ligne]
    created_from: synthetic

  - type: feature
    id: feat-dcre-agregation-revenus
    name: Agrégation bancaire des revenus déclarés
    description: >-
      Connecte le parcours de souscription à un agrégateur de données bancaires
      pour corroborer les revenus déclarés par le client sans demande de bulletins
      de salaire, avec consentement explicite du demandeur.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-deblocage-fonds-rapide
    name: Déblocage rapide des fonds
    description: >-
      Déclenche le virement du capital prêté vers le compte courant du client dès
      l'expiration du délai de rétractation légal de 14 jours ou en cas de renonciation
      expresse au délai.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 12 : Tableau de bord risque portefeuille ────────────────────────
  - type: system
    id: sys-dcre-tableau-bord-risque
    name: Tableau de bord risque portefeuille RISKBOARD
    description: >-
      Consolide les indicateurs de risque crédit du portefeuille (taux de défaut,
      LGD, EAD, NPL ratio) et les expose aux équipes risque et à la direction.
      Alimente les reportings Bâle III et les stress tests prudentiels.
    owner_team: Équipe Risque et Bâle
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-calcul-npl
    name: Calcul et suivi du taux NPL
    description: >-
      Calcule quotidiennement le ratio de prêts non performants (Non-Performing Loans)
      ventilé par segment de clientèle, type de produit et millésime d'octroi.
      Alerte la direction risque dès franchissement d'un seuil défini.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-stress-test
    name: Génération des scénarios de stress test
    description: >-
      Applique des chocs macroéconomiques paramétrables (hausse du chômage, remontée
      des taux) sur le portefeuille crédit pour estimer les pertes attendues en
      scénario adverse, conformément aux exigences EBA.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-reporting-bale
    name: Production du reporting Bâle III crédit
    description: >-
      Génère les formulaires COREP relatifs au risque de crédit (C 07.00 à C 09.02)
      et les transmet à l'autorité de supervision dans les délais réglementaires.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 13 : Moteur de crédit bail ──────────────────────────────────────
  - type: system
    id: sys-dcre-credit-bail
    name: Moteur de crédit-bail et LOA LEASEPRO
    description: >-
      Gère les contrats de crédit-bail mobilier et de location avec option d'achat,
      depuis l'origination jusqu'à la levée d'option ou la restitution du bien.
      Calcule les loyers, la valeur résiduelle et les amortissements comptables.
    owner_team: Équipe Crédit-Bail
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-origination-bail
    name: Origination des contrats de crédit-bail
    description: >-
      Instruit la demande de crédit-bail : vérification du bien financé, évaluation
      du preneur, constitution du contrat et signature. Gère les conditions suspensives
      liées à la livraison effective du bien.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-gestion-loyers
    name: Gestion et encaissement des loyers
    description: >-
      Calcule le tableau de loyers, déclenche les prélèvements à l'échéance et
      traite les incidents de paiement en appliquant les pénalités contractuelles.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-levee-option
    name: Gestion de la levée d'option d'achat
    description: >-
      Pilote la procédure de levée d'option en fin de contrat : calcul du prix
      résiduel, génération de la facture, transfert de propriété et clôture du
      contrat de bail dans le système comptable.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 14 : Plateforme de notation interne ─────────────────────────────
  - type: system
    id: sys-dcre-notation-interne
    name: Plateforme de notation interne RATINGLAB
    description: >-
      Attribue et maintient les notations internes (rating) des contreparties
      entreprises et professionnels ayant des engagements de crédit. Calibre les
      modèles de probabilité de défaut (PD) et alerte sur les dégradations.
    owner_team: Équipe Modèles Risque
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-calibrage-pd
    name: Calibrage des modèles de probabilité de défaut
    description: >-
      Entraîne et recalibre périodiquement les modèles PD à partir des données
      historiques de défaut observées. Documente les performances (Gini, KS) dans
      le registre modèle réglementaire.
    domains: [credit]
    created_from: synthetic

  - type: feature
    id: feat-dcre-attribution-rating
    name: Attribution et mise à jour des ratings
    description: >-
      Calcule le rating d'une contrepartie à l'entrée en relation et le révise
      annuellement ou sur événement déclencheur (alerte comptable, dégradation
      externe). Notifie les gestionnaires de compte concernés.
    domains: [credit]
    created_from: synthetic

  # ── SYSTÈME 15 : Plateforme de crédit professionnel ─────────────────────────
