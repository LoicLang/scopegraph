  # ── DÉCISIONS ────────────────────────────────────────────────────────────────
  - type: decision
    id: dec-dcre-modele-scoring-ml
    title: Adoption d'un scoring crédit par modèle ML
    statement: >-
      Le scoring d'octroi de crédit à la consommation sera désormais fondé sur
      un modèle de gradient boosting entraîné sur l'historique interne, en remplacement
      des règles expertes. Les modèles devront être soumis à validation indépendante
      avant tout déploiement en production.
    rationale: >-
      Les tests rétrospectifs ont démontré une amélioration de l'indice de Gini de
      18 points par rapport aux règles expertes, réduisant les refus injustifiés
      de bons dossiers et limitant les octrois à risque.
    date: "2023-09-15"
    decided_by: Comité Risque Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-delegation-assurance-parcours-unique
    title: Parcours unique de délégation d'assurance
    statement: >-
      Toute demande de délégation d'assurance emprunteur transitera exclusivement
      par le module ASSUREMP, sans possibilité de traitement manuel hors système.
      Les délais légaux de réponse sont gérés et tracés dans l'outil.
    rationale: >-
      La centralisation garantit le respect des délais légaux (10 jours ouvrés) et
      l'uniformité de la grille d'équivalence appliquée. Les incidents liés au
      traitement manuel représentaient 60 % des réclamations reçues en 2022.
    date: "2023-02-01"
    decided_by: Direction Conformité
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-hcsf-non-derogation
    title: Application stricte des critères HCSF sans dérogation individuelle
    statement: >-
      Les critères HCSF (taux d'effort 35 %, durée 25 ans) s'appliquent à 100 %
      de la production sans possibilité de dérogation au niveau du conseiller.
      Les cas éligibles à la flexibilité HCSF (20 % maximum) sont alloués
      trimestriellement par la Direction du Crédit.
    rationale: >-
      La gestion centralisée de l'enveloppe de flexibilité permet d'optimiser son
      usage sur les primo-accédants et d'éviter des dépassements pouvant exposer
      la banque à des sanctions de l'ACPR.
    date: "2022-06-01"
    decided_by: Direction du Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-ifrs9-stage2-criteres
    title: Critères de classification IFRS 9 stage 2
    statement: >-
      Un crédit est classé en stage 2 dès lors que son score de notation interne
      s'est dégradé de deux crans ou plus depuis l'origination, ou que l'encours
      présente un impayé de plus de 30 jours. Le passage est automatique et
      non réversible sans validation du comité risque.
    rationale: >-
      La définition explicite des critères réduit la subjectivité dans la classification
      et garantit la comparabilité des provisions d'un arrêté à l'autre, conformément
      aux attentes des auditeurs externes.
    date: "2021-12-01"
    decided_by: Comité IFRS 9
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-bureau-credit-unique
    title: Interrogation d'un bureau de crédit unique
    statement: >-
      L'établissement interroge un seul bureau de crédit externe (CREDITCHECK) pour
      toutes les demandes de crédit. Le recours à un second bureau est réservé aux
      dossiers dont le premier score est dans la zone grise (entre 450 et 550).
    rationale: >-
      La multiplication des interrogations augmente les coûts, génère des traces sur
      le profil crédit du client et peut être perçue négativement. La zone grise
      couvre 12 % des dossiers, justifiant le double appel ciblé.
    date: "2020-03-15"
    decided_by: Comité Risque Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-pas-de-credit-revolving-acquisition
    title: Arrêt du crédit revolving en acquisition
    statement: >-
      La banque cesse de commercialiser de nouveaux contrats de crédit revolving
      auprès de clients en acquisition. Le produit reste disponible uniquement pour
      les clients existants répondant à des critères de fidélité et de comportement
      de paiement stricts.
    rationale: >-
      Le taux de défaut sur les nouvelles souscriptions revolving en acquisition
      dépasse de 4 points le taux sur le stock fidèle. La décision préserve la
      qualité du portefeuille et répond aux attentes du superviseur.
    date: "2023-11-01"
    decided_by: Comité Exécutif
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-signature-electronique-pret
    title: Généralisation de la signature électronique pour les prêts
    statement: >-
      L'ensemble des offres de prêt (immobilier, personnel, professionnel) sont
      signées électroniquement via un prestataire de confiance qualifié eIDAS.
      La signature papier est maintenue uniquement sur demande explicite du client
      pour raison d'accessibilité.
    rationale: >-
      La signature électronique réduit le délai de retour des offres signées de
      12 à 2 jours en moyenne, accélérant le déblocage des fonds et la satisfaction
      client post-décision.
    date: "2022-04-01"
    decided_by: Direction Digitale
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-ficp-delai-48h
    title: Déclaration FICP dans les 48 heures ouvrées
    statement: >-
      Tout incident de paiement caractérisé doit être déclaré au FICP dans un délai
      maximum de 48 heures ouvrées suivant la constatation. Les levées d'incident
      doivent être transmises sous 24 heures.
    rationale: >-
      L'amélioration du délai de déclaration réduit le risque de sanction ACPR
      et limite la période pendant laquelle un client fiché peut contracter de
      nouveaux crédits sans que les établissements tiers en soient informés.
    date: "2021-06-01"
    decided_by: Direction Conformité
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-taux-variable-cap
    title: Obligation d'un cap sur les crédits à taux variable
    statement: >-
      Tout crédit immobilier à taux variable commercialisé par l'établissement doit
      être assorti d'un cap limitant la hausse maximale à +2 points par rapport au
      taux initial. La commercialisation de taux variables sans cap est interdite.
    rationale: >-
      La montée des taux de 2022-2024 a mis en difficulté des emprunteurs à taux
      variable sans plafond dans d'autres établissements. Le cap protège les clients
      et réduit le risque de contentieux et de surendettement.
    date: "2023-05-15"
    decided_by: Comité Produits Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-courtiers-habilitation-annuelle
    title: Revue annuelle de l'habilitation des courtiers partenaires
    statement: >-
      La liste des courtiers autorisés à utiliser le portail COURTNET est révisée
      chaque année. Les courtiers n'ayant pas soumis de dossier depuis 12 mois ou
      présentant un taux de refus supérieur à 60 % sont suspendus de l'habilitation.
    rationale: >-
      La maîtrise du réseau de distribution indirecte est un levier de qualité
      du portefeuille. Les courtiers à fort taux de refus génèrent une charge
      d'instruction disproportionnée sans production.
    date: "2024-01-15"
    decided_by: Direction Partenariats
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-notation-entreprises-annuelle
    title: Revue annuelle obligatoire des ratings entreprises
    statement: >-
      Chaque contrepartie entreprise disposant d'un encours de crédit supérieur à
      500 000 € doit faire l'objet d'une révision de notation dans les 12 mois
      suivant la dernière révision. Au-delà de ce délai, le rating est automatiquement
      mis en statut « expiré » et déclenche un gel des nouveaux engagements.
    rationale: >-
      L'utilisation de notations obsolètes dans le calcul des RWA expose l'établissement
      à une sous-capitalisation réglementaire et à un risque prudentiel lors des
      inspections ACPR.
    date: "2022-09-01"
    decided_by: Comité Risque Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-stress-test-trimestriel
    title: Fréquence trimestrielle des stress tests internes
    statement: >-
      Les stress tests internes sur le portefeuille de crédit sont réalisés
      trimestriellement, en complément des exercices annuels requis par l'EBA.
      Les résultats sont présentés au Conseil d'administration dans les 30 jours
      suivant l'arrêté trimestriel.
    rationale: >-
      La périodicité trimestrielle permet de détecter plus tôt les concentrations
      de risque émergentes et d'anticiper les besoins en fonds propres avant l'arrêté
      annuel de Pilier 2.
    date: "2023-03-01"
    decided_by: Comité des Risques Groupe
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-agregation-bancaire-consentement
    title: Consentement explicite pour l'agrégation bancaire des revenus
    statement: >-
      L'utilisation de l'agrégation bancaire pour vérifier les revenus est
      strictement optionnelle et ne peut conditionner l'instruction d'un dossier.
      Le refus du client de partager ses données bancaires ne peut être utilisé
      comme critère de décision défavorable.
    rationale: >-
      La neutralité du refus d'agrégation est une protection contre tout traitement
      discriminatoire indirect et garantit la conformité avec le RGPD et les
      principes DSP2 sur l'accès aux données de paiement.
    date: "2024-03-01"
    decided_by: Direction Juridique et Conformité
    still_active: true
    domains: [credit, dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-dcre-rachat-credit-seuil-rentabilite
    title: Seuil de rentabilité minimum pour le rachat de crédit
    statement: >-
      Une opération de rachat de crédit ne peut être proposée par un conseiller que
      si l'économie mensuelle nette pour le client est supérieure à 50 € et si le
      coût total de l'opération (IRA incluses) est amorti en moins de 24 mois.
    rationale: >-
      Ce garde-fou protège l'intérêt du client et réduit le risque de mis-selling.
      Les réclamations liées aux rachats non rentables représentaient 30 % des
      plaintes crédit en 2021.
    date: "2022-01-01"
    decided_by: Direction du Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-sinistre-assurance-delai-reponse
    title: Délai de réponse aux sinistres assurance emprunteur
    statement: >-
      La banque s'engage à transmettre tout dossier de sinistre complet à l'assureur
      dans un délai de 5 jours ouvrés. Pour les sinistres décès, une prise en charge
      provisoire des échéances est activée dès 15 jours si la décision de l'assureur
      n'est pas parvenue.
    rationale: >-
      La rapidité de traitement des sinistres est un engagement de service fort
      vis-à-vis des familles en situation de détresse. Les délais excessifs
      constituent le premier motif de saisine du médiateur bancaire.
    date: "2023-07-01"
    decided_by: Comité Relation Client
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-pret-relais-duree-max
    title: Durée maximale du prêt relais à 24 mois
    statement: >-
      La durée des prêts relais est plafonnée à 24 mois non prorogeables. Au-delà
      de cette durée, le dossier doit être transformé en prêt immobilier classique
      ou le client doit procéder à une vente forcée du bien mis en garantie.
    rationale: >-
      Les prêts relais de longue durée présentent un risque de dépréciation du bien
      et d'accumulation des intérêts intercalaires mettant en péril la solvabilité
      de l'emprunteur dans un marché immobilier baissier.
    date: "2020-09-01"
    decided_by: Comité Risque Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-catalogue-produits-gel-manuel
    title: Gel des modifications manuelles du catalogue produits
    statement: >-
      Toute modification des paramètres d'un produit crédit dans PRODCATALOG doit
      passer par un workflow de validation à deux niveaux (responsable produit +
      conformité). Les modifications directes en base de données sont interdites.
    rationale: >-
      Deux incidents en 2022 ont conduit à la commercialisation temporaire de produits
      avec des paramètres erronés (durée maximale incorrect). Le workflow double
      validation prévient ces erreurs opérationnelles.
    date: "2022-11-01"
    decided_by: Direction SI Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-prevention-surendettement-seuil
    title: Seuil d'alerte précoce surendettement à 33 %
    statement: >-
      Tout client dont le taux d'endettement calculé sur les données d'utilisation
      de la réserve revolving et des échéances de prêts dépasse 33 % pendant
      trois mois consécutifs fait l'objet d'une prise de contact proactive par
      un conseiller financier.
    rationale: >-
      Le seuil de 33 % est le premier signal avant le franchissement du seuil légal
      de 35 %. L'intervention précoce multiplie par trois les chances d'éviter
      un incident de paiement selon l'analyse rétrospective de 2023.
    date: "2024-02-01"
    decided_by: Direction Risque et Conformité
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-loyer-bail-prelev-auto
    title: Prélèvement automatique obligatoire pour les loyers de crédit-bail
    statement: >-
      Les loyers de crédit-bail sont exclusivement prélevés par prélèvement SEPA
      automatique. La mise en place du mandat SEPA est une condition suspensive
      de la signature du contrat. Aucun règlement par virement libre n'est accepté.
    rationale: >-
      La régularité des prélèvements automatiques réduit le taux d'impayé de premier
      rang à moins de 0,5 % sur le portefeuille bail, contre 3,2 % observés sur
      les contrats à règlement libre.
    date: "2021-04-01"
    decided_by: Direction Crédit-Bail
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-renegociation-criteres-economiques
    title: Critères économiques minimaux pour la renégociation de taux
    statement: >-
      Une renégociation de taux n'est instruite que si l'écart entre le taux actuel
      du contrat et le taux de marché est d'au moins 1 point et si la durée résiduelle
      est supérieure à 7 ans. En deçà de ces seuils, le client est orienté vers un
      rachat externe.
    rationale: >-
      En-dessous de ces seuils, le coût administratif de l'avenant de renégociation
      n'est pas compensé par la rétention client. La règle clarifie la position de
      l'établissement et évite les négociations sans lendemain.
    date: "2024-05-01"
    decided_by: Comité Produits Crédit
    still_active: true
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-reporting-corep-automatise
    title: Automatisation complète du reporting COREP crédit
    statement: >-
      D'ici fin 2025, tous les formulaires COREP relatifs au risque de crédit doivent
      être produits automatiquement sans intervention manuelle. Les retraitements
      Excel intermédiaires sont interdits en production réglementaire.
    rationale: >-
      Les retraitements manuels représentaient une source d'erreur récurrente
      (3 corrections sur 8 arrêtés en 2023) et une dépendance critique sur
      deux personnes clés. L'automatisation réduit le risque opérationnel et
      le délai de soumission.
    date: "2024-06-01"
    decided_by: Direction Finance et Risque
    still_active: true
    domains: [credit]
    created_from: synthetic

  # ── CONTRAINTES ──────────────────────────────────────────────────────────────
  - type: constraint
    id: con-dcre-taux-usure-blocage
    title: Blocage à l'émission si TAEG > taux d'usure
    statement: >-
      Aucun système d'origination ne peut générer ou transmettre une offre de crédit
      dont le TAEG dépasse le taux d'usure en vigueur publié par la Banque de France.
      Le blocage est implémenté au niveau du référentiel TAUXREF et ne peut être
      contourné localement.
    source: Loi n°66-1010 du 28 décembre 1966 (usure) codifiée aux art. L314-6 C.conso
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-hcsf-taux-effort
    title: Taux d'effort HCSF plafonné à 35 %
    statement: >-
      Le taux d'effort mensuel de l'emprunteur, calculé comme le rapport entre
      la totalité des charges de remboursement de crédit et le revenu net mensuel,
      ne peut dépasser 35 % pour toute nouvelle production de crédit immobilier
      (hors enveloppe de flexibilité trimestrielle).
    source: Recommandation HCSF R-HCSF-2021-1
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-hcsf-duree-max
    title: Durée maximale des crédits immobiliers à 25 ans
    statement: >-
      La maturité des prêts immobiliers à l'habitat principal ne peut excéder 25 ans
      (ou 27 ans en cas de différé de remboursement dans le cadre d'un VEFA). Cette
      contrainte s'applique à la durée totale du prêt, avenant de renégociation inclus.
    source: Recommandation HCSF R-HCSF-2021-1
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-ficp-consultation-obligatoire
    title: Consultation obligatoire du FICP avant octroi
    statement: >-
      Tout établissement doit consulter le Fichier des Incidents de remboursement des
      Crédits aux Particuliers avant l'octroi d'un crédit à la consommation ou
      immobilier à un particulier. L'absence de consultation est un manquement
      sanctionnable par l'ACPR.
    source: Art. L333-4 Code de la consommation
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-delai-retractation-14j
    title: Délai de rétractation légal de 14 jours
    statement: >-
      Pour tout crédit à la consommation, l'emprunteur dispose d'un délai de 14 jours
      calendaires à compter de l'acceptation de l'offre pour exercer son droit de
      rétractation sans justification ni pénalité. Aucun déblocage de fonds ne peut
      intervenir avant l'expiration de ce délai sauf renonciation expresse.
    source: Art. L312-19 Code de la consommation
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-delai-reflexion-10j-immo
    title: Délai de réflexion de 10 jours pour le crédit immobilier
    statement: >-
      L'emprunteur ne peut accepter l'offre de prêt immobilier avant l'expiration
      d'un délai de réflexion de 10 jours calendaires à compter de la réception de
      l'offre. Toute acceptation anticipée est nulle.
    source: Art. L313-34 Code de la consommation
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-rgpd-questionnaire-medical
    title: Protection des données médicales dans le questionnaire assurance
    statement: >-
      Les données de santé collectées dans le cadre du questionnaire médical
      d'assurance emprunteur constituent des données sensibles au sens du RGPD.
      Leur traitement requiert un consentement explicite distinct et leur stockage
      est limité à la durée de vie du contrat d'assurance.
    source: RGPD art. 9, loi Informatique et Libertés
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-conservation-dossier-10ans
    title: Conservation des dossiers de crédit pendant 10 ans
    statement: >-
      L'ensemble des pièces constitutives d'un dossier de crédit (offre signée,
      justificatifs, décision) doit être conservé pendant 10 ans à compter de la
      date de clôture du prêt, conformément aux prescriptions réglementaires et
      aux délais de prescription civile.
    source: Art. L110-4 Code de commerce, recommandations ACPR
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-ira-calcul-reglementaire
    title: Calcul des IRA selon le barème réglementaire
    statement: >-
      Les indemnités de remboursement anticipé ne peuvent excéder la valeur la plus
      faible entre 3 % du capital restant dû avant remboursement et 6 mois d'intérêts
      sur le capital remboursé au taux moyen du prêt. Tout dépassement est nul.
    source: Art. L313-47 Code de la consommation
    severity: medium
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-secci-obligatoire
    title: Remise obligatoire de la fiche SECCI
    statement: >-
      Pour tout crédit à la consommation, une fiche d'information standardisée
      européenne (SECCI) doit être remise au demandeur avant la signature de l'offre.
      Cette fiche doit préciser le TAEG, le coût total, la durée et les garanties
      requises dans un format normalisé.
    source: Directive 2008/48/CE, art. L312-12 C.conso
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-equivalence-garanties-assurance
    title: Vérification de l'équivalence des garanties lors de la délégation
    statement: >-
      Lors d'une demande de délégation d'assurance emprunteur, la banque est tenue
      d'appliquer la grille d'équivalence de garanties publiée et d'accepter ou
      refuser dans un délai de 10 jours ouvrés. Le refus doit être motivé sur la
      base de la grille.
    source: Loi Lemoine art. 10, art. L313-30 C.conso
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-surendettement-suspension-legale
    title: Suspension légale des créances à réception de la décision Banque de France
    statement: >-
      Dès réception de la décision de recevabilité de la Banque de France, toutes
      les mesures d'exécution et de recouvrement sur les créances déclarées doivent
      être immédiatement suspendues. Tout manquement est passible de poursuites pénales.
    source: Art. L711-2 Code de la consommation
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-cap-taux-variable
    title: Cap obligatoire sur les crédits à taux variable
    statement: >-
      Conformément à la politique interne décidée en 2023, tout crédit immobilier
      à taux variable doit intégrer un cap de taux limitant la hausse à 2 points
      au-dessus du taux initial. Cette contrainte est vérifiée systématiquement
      à l'édition de l'offre.
    source: Politique crédit interne, décision déc-dcre-taux-variable-cap
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-notation-interne-bale
    title: Notation interne obligatoire pour les engagements entreprises > 500 k€
    statement: >-
      Toute contrepartie entreprise présentant un encours crédit supérieur à 500 000 €
      doit disposer d'un rating interne en cours de validité. En l'absence de rating
      valide, les nouveaux engagements sont bloqués dans le système d'origination.
    source: CRR art. 143, guidelines EBA IRB approach
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-transparence-algo-refus
    title: Transparence algorithmique sur les refus de crédit automatisés
    statement: >-
      Tout refus de crédit résultant d'une décision automatisée doit être accompagné
      d'une explication compréhensible des principaux facteurs ayant conduit à cette
      décision, conformément au droit d'explication du RGPD. L'explication doit être
      disponible à la demande.
    source: RGPD art. 22, directive crédit consommation 2023/2225
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-ltv-max-pret-relais
    title: LTV maximale à 80 % pour les prêts relais
    statement: >-
      Le montant du prêt relais ne peut dépasser 80 % de la valeur estimée du bien
      mis en vente. Cette valeur doit être appuyée par une expertise immobilière de
      moins de 6 mois ou une estimation automatisée validée par un expert interne.
    source: Politique de risque crédit immobilier interne
    severity: medium
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-pmd-credit-revolving
    title: Mention obligatoire du remboursement minimum sur le revolving
    statement: >-
      Chaque relevé mensuel de crédit revolving doit mentionner de façon visible
      le montant de remboursement minimum, le délai pour un remboursement intégral
      si seul le minimum est payé, et le coût total des intérêts sur cette durée.
    source: Art. L312-92 Code de la consommation (loi Lagarde)
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-acces-dossier-audit
    title: Accès tracé aux dossiers de crédit archivés
    statement: >-
      Tout accès à un dossier de crédit archivé dans ARCHICRED doit être journalisé
      avec l'identifiant du consultant, la date, l'heure et le motif déclaré.
      Les journaux d'accès sont conservés 5 ans et consultables par la conformité.
    source: RGPD art. 32, politique de sécurité SI
    severity: medium
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-qualite-donnee-ecl
    title: Exhaustivité des paramètres de risque pour le calcul ECL
    statement: >-
      Tout contrat de crédit actif doit disposer de valeurs de PD, LGD et EAD
      validées avant chaque arrêté mensuel. L'absence de paramètre entraîne
      l'application d'une valeur prudentielle majorée automatiquement.
    source: IFRS 9, guidelines EBA ECL
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-habilitation-courtier-iobsp
    title: Vérification de l'habilitation IOBSP des courtiers partenaires
    statement: >-
      Seuls les courtiers disposant d'une immatriculation ORIAS en cours de validité
      au titre des IOBSP peuvent déposer des dossiers sur le portail COURTNET. La
      vérification est effectuée automatiquement à la connexion via l'API ORIAS.
    source: Art. L519-1 Code monétaire et financier
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-corep-delai-soumission
    title: Délai de soumission COREP dans les 12 jours ouvrables
    statement: >-
      Les formulaires COREP de risque de crédit doivent être soumis à l'autorité
      de supervision dans un délai de 12 jours ouvrables suivant la fin du trimestre
      de référence. Tout retard doit faire l'objet d'une notification préalable.
    source: Règlement d'exécution UE 680/2014
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-loi-lemoine-resiliation-annuelle
    title: Droit de résiliation annuelle de l'assurance emprunteur
    statement: >-
      Depuis le 1er septembre 2022, tout emprunteur peut résilier son assurance
      emprunteur à tout moment, sans frais ni pénalité, par simple notification.
      La banque dispose de 10 jours ouvrés pour accepter ou refuser le nouveau contrat
      proposé, sous peine de sanctions ACPR.
    source: Loi n°2022-270 du 28 février 2022 (loi Lemoine)
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-ifrs9-forward-looking
    title: Intégration d'informations forward-looking dans le calcul ECL
    statement: >-
      Le calcul des pertes de crédit attendues (ECL) doit intégrer des informations
      économiques prospectives raisonnables et justifiables (scénarios macro) et non
      se limiter aux données historiques. Cette exigence s'applique dès le stage 1.
    source: IFRS 9 paragraphes 5.5.17 et B5.5.15-B5.5.17
    severity: medium
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-consentement-biometrie
    title: Consentement explicite requis pour le contrôle biométrique
    statement: >-
      La reconnaissance faciale utilisée dans le parcours de souscription en ligne
      nécessite un consentement libre, éclairé, spécifique et non équivoque du
      demandeur. Le refus du contrôle biométrique ne peut entraîner un refus de
      traitement du dossier.
    source: RGPD art. 9, délibération CNIL sur la biométrie
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-encours-client-plafonnes
    title: Plafonnement des encours crédit par client
    statement: >-
      Le cumul des encours de crédit revolving, prêts personnels et crédits immobiliers
      d'un même client particulier est plafonné à 15 fois son revenu net annuel.
      Tout dépassement déclenche une analyse risque obligatoire avant tout nouvel octroi.
    source: Politique interne de gestion des risques crédit
    severity: medium
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-dossier-surendettement-confidentialite
    title: Confidentialité des dossiers de surendettement
    statement: >-
      Les informations transmises dans le cadre d'une procédure de surendettement
      ne peuvent être partagées avec d'autres services de la banque (commercial,
      commercial entreprises) ni utilisées à des fins de prospection ou de modification
      des conditions commerciales du client.
    source: Art. L733-1 Code de la consommation, RGPD
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-revue-modele-annuelle
    title: Revue annuelle des modèles de scoring crédit
    statement: >-
      Les modèles de scoring d'octroi et de notation interne doivent faire l'objet
      d'une revue annuelle de performance incluant le calcul des indicateurs de
      discrimination (Gini, KS) et de calibration. Un modèle défaillant doit être
      retiré de production dans les 90 jours.
    source: Guidelines EBA on internal governance (art. 74 CRD V)
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-iban-verification-deblocage
    title: Vérification IBAN avant tout déblocage de fonds
    statement: >-
      Avant tout virement de capital prêté, le système de déblocage doit vérifier
      que l'IBAN bénéficiaire appartient bien à un compte ouvert au nom de l'emprunteur
      dans un établissement éligible. Les virements vers des tiers sont prohibés.
    source: Politique anti-fraude crédit interne
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-plan-apurement-ecrit
    title: Formalisation écrite obligatoire des plans d'apurement
    statement: >-
      Tout plan d'apurement négocié avec un débiteur doit être formalisé par écrit
      et signé des deux parties avant toute suspension des procédures de relance.
      Les engagements verbaux seuls ne constituent pas un plan opposable.
    source: Art. L711-4 Code de la consommation, politique interne recouvrement
    severity: medium
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-reporting-npl-mensuel
    title: Reporting NPL mensuel à la Direction des Risques
    statement: >-
      Le taux NPL ventilé par segment et par millésime doit être communiqué à la
      Direction des Risques au plus tard le 15e jour ouvré suivant la fin du mois.
      Tout franchissement d'un seuil d'alerte défini dans la politique de risque
      déclenche un rapport spécifique dans les 48 heures.
    source: Politique de gestion du risque crédit
    severity: medium
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-catalogue-produits-validation
    title: Double validation obligatoire pour les modifications de catalogue produits
    statement: >-
      Chaque modification apportée aux paramètres d'un produit crédit (plafond,
      durée, taux, document contractuel) requiert la validation successive du
      responsable produit et du responsable conformité. L'absence d'une des deux
      validations bloque la publication.
    source: Décision déc-dcre-catalogue-produits-gel-manuel, politique SI crédit
    severity: medium
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-mandat-sepa-bail
    title: Prélèvement SEPA obligatoire pour les loyers de crédit-bail
    statement: >-
      La mise en place d'un mandat de prélèvement SEPA est une condition sine qua
      non de la signature d'un contrat de crédit-bail. Le preneur doit fournir son
      IBAN certifié avant la signature, et ce mandat ne peut être révoqué en cours
      de contrat sans accord préalable de la direction crédit-bail.
    source: Décision déc-dcre-loyer-bail-prelev-auto, règlement SEPA
    severity: high
    domains: [credit]
    created_from: synthetic

  # ── RISQUES ──────────────────────────────────────────────────────────────────
  - type: risk
    id: risk-dcre-derive-modele-scoring
    title: Dérive silencieuse du modèle de scoring crédit
    statement: >-
      Le modèle de gradient boosting utilisé pour le scoring d'octroi peut se
      dégrader progressivement si les caractéristiques de la population de demandeurs
      évoluent sans que cela soit détecté entre deux revues annuelles. Une dérive
      non détectée peut conduire à des octrois excessifs ou des refus injustifiés.
    likelihood: medium
    impact: high
    mitigations:
      - Monitoring mensuel des indicateurs de stabilité des entrées (PSI) et de discrimination
      - Alerte automatique si le Gini chute de plus de 5 points sur fenêtre glissante de 3 mois
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-concentration-sectorielle
    title: Concentration excessive sur un secteur d'activité
    statement: >-
      Une surreprésentation de contreparties d'un même secteur économique dans le
      portefeuille de crédit professionnel expose la banque à une corrélation des
      défauts en cas de choc sectoriel, amplifiée par la structure concentrée de
      certains marchés locaux.
    likelihood: low
    impact: high
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-fraude-documentaire-sophistiquee
    title: Fraude documentaire à l'origination
    statement: >-
      Des documents falsifiés de haute qualité (bulletins de salaire, avis
      d'imposition) peuvent tromper les contrôles automatiques et conduire à
      l'octroi de crédits à des demandeurs fictifs ou à des personnes usurpant
      une identité.
    likelihood: medium
    impact: high
    mitigations:
      - Déploiement du modèle de vision FRAUDCRED sur toutes les pièces justificatives
      - Rapprochement des revenus déclarés avec l'agrégateur bancaire sur les dossiers à enjeu
    domains: [credit, lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dcre-indisponibilite-bureau-credit
    title: Indisponibilité du bureau de crédit externe
    statement: >-
      Une panne de l'API du bureau de crédit CREDITCHECK bloquerait l'instruction
      automatisée de toutes les nouvelles demandes de crédit, créant un engorgement
      opérationnel et une perte de revenus pendant la durée de l'incident.
    likelihood: low
    impact: high
    mitigations:
      - Mode dégradé documenté permettant une instruction manuelle avec score interne seul
      - SLA contractuel avec le bureau de crédit incluant une pénalité et un délai de reprise de 4h
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-remontee-taux-revolving
    title: Hausse des défauts revolving en contexte de remontée des taux
    statement: >-
      Une remontée rapide des taux d'intérêt accroît la charge mensuelle des
      détenteurs de réserves revolving à taux variable et peut déclencher une
      vague de défauts sur ce segment, historiquement sensible aux chocs de
      taux et de pouvoir d'achat.
    likelihood: medium
    impact: high
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-retard-ifrs9-forward-looking
    title: Non-conformité IFRS 9 sur le volet forward-looking
    statement: >-
      Le projet d'implémentation du forward-looking dans le calcul ECL est encore
      en cours. Une clôture d'exercice avant la livraison du module exposerait
      la banque à une observation de l'auditeur externe et à un potentiel risque
      réglementaire sur la qualité des provisions déclarées.
    likelihood: medium
    impact: medium
    mitigations:
      - Suivi mensuel de l'avancement du projet IFRS9 étape 2 en COPIL risque
      - Plan de secours avec méthodologie simplifiée approuvée par les auditeurs en cas de retard
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-deperdition-expertise-recouvrement
    title: Déperdition d'expertise recouvrement lors du turnover
    statement: >-
      La plateforme de recouvrement repose sur des règles métier complexes maîtrisées
      par quelques experts. Un turnover élevé dans l'équipe pourrait dégrader la
      qualité des relances et réduire le taux de récupération des créances en souffrance.
    likelihood: medium
    impact: medium
    mitigations:
      - Documentation des règles métier dans le référentiel de paramétrage RECOUV+
      - Programme de formation systématique pour les nouveaux entrants
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-mis-selling-rachat
    title: Risque de mis-selling sur les opérations de rachat de crédit
    statement: >-
      Un conseiller peut être incité à proposer un rachat de crédit non avantageux
      pour le client afin d'atteindre ses objectifs commerciaux. Ce risque est
      amplifié lorsque les IRA et frais de dossier ne sont pas rendus visibles
      dans la simulation présentée.
    likelihood: medium
    impact: high
    mitigations:
      - Blocage technique des simulations non rentables selon le seuil défini en dec-dcre-rachat-credit-seuil-rentabilite
      - Revue aléatoire de 5 % des dossiers de rachat par le contrôle interne
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-perte-hypotheque-defaut-inscription
    title: Opposabilité des hypothèques compromise par un défaut d'inscription
    statement: >-
      Un délai ou une erreur dans la procédure d'inscription hypothécaire auprès
      du Service de Publicité Foncière peut rendre la sûreté inopposable aux tiers,
      notamment en cas de procédure collective du débiteur, privant la banque de
      sa garantie.
    likelihood: low
    impact: high
    mitigations:
      - Contrôle systématique de la confirmation d'inscription avant le déblocage des fonds
      - Alerte automatique en cas d'absence de confirmation dans les 30 jours suivant la demande
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-depassement-usure-systemique
    title: Dépassement du taux d'usure sur des produits non contrôlés
    statement: >-
      Une modification du barème de taux sans mise à jour simultanée dans le
      référentiel TAUXREF, ou une erreur de paramétrage du calcul TAEG, pourrait
      conduire à des offres illégales au-dessus du taux d'usure sans que le blocage
      technique soit déclenché.
    likelihood: low
    impact: high
    mitigations:
      - Rapprochement hebdomadaire automatique des TAEG émis avec le taux d'usure du mois
      - Alerte immédiate au responsable tarification en cas d'anomalie détectée a posteriori
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-instabilite-api-courtiers
    title: Instabilité du portail courtiers affectant la production indirecte
    statement: >-
      Les courtiers partenaires représentent 35 % de la production crédit immobilier.
      Une instabilité récurrente du portail COURTNET dégraderait la relation avec
      les courtiers clés et pourrait les inciter à basculer leur flux vers des
      concurrents.
    likelihood: medium
    impact: medium
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-non-respect-delais-mediation
    title: Non-respect des délais légaux de traitement des réclamations
    statement: >-
      Les délais réglementaires de réponse aux réclamations crédit (10 jours ouvrés
      pour l'accusé de réception, 2 mois pour la réponse de fond) peuvent être
      difficiles à tenir en période de forte activité ou lors d'absences dans
      l'équipe réclamations.
    likelihood: medium
    impact: medium
    mitigations:
      - Alertes automatiques à J+7 et J+25 dans MEDIASOL sur les dossiers approchant les délais
      - Capacité de réaffectation transverse en cas de pic de volume
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-rupture-stock-relais
    title: Accumulation de prêts relais non remboursés
    statement: >-
      Un retournement du marché immobilier réduisant les délais de vente peut
      conduire à l'accumulation de prêts relais atteignant leur échéance sans
      remboursement, forçant la transformation en prêts classiques ou déclenchant
      des contentieux sur des biens dévalués.
    likelihood: medium
    impact: high
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-perte-donnees-migration-archivage
    title: Perte ou corruption de données lors de la migration GED
    statement: >-
      La migration de 12 millions de documents vers ARCHICRED comporte un risque
      de corruption silencieuse, de documents manquants ou de mauvaise association
      entre document et dossier, remettant en cause l'intégrité de l'historique
      crédit archivé.
    likelihood: medium
    impact: high
    mitigations:
      - Migration par vagues avec contrôle d'intégrité cryptographique (hash SHA-256) sur chaque lot
      - Maintien de l'ancienne GED en lecture pendant 12 mois post-migration
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-dependance-prestataire-biometrie
    title: Dépendance critique au prestataire de contrôle biométrique
    statement: >-
      Le contrôle d'identité biométrique du parcours digital repose sur un prestataire
      unique. Son indisponibilité bloquerait les souscriptions en ligne à enjeu élevé
      et son exit strategy est insuffisamment documentée dans le contrat en vigueur.
    likelihood: low
    impact: medium
    mitigations:
      - Audit contractuel et mise à jour de la clause de réversibilité
      - Identification d'un prestataire alternatif et test d'intégration en environnement de recette
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-stagflation-portefeuille
    title: Détérioration simultanée du risque de crédit et du coût de la ressource
    statement: >-
      Un scénario stagflationniste (faible croissance + inflation persistante) pourrait
      à la fois dégrader la qualité du portefeuille crédit (hausse des défauts) et
      accroître le coût de refinancement de la banque, comprimant la marge nette
      d'intérêt sur les prêts à taux fixe de longue durée.
    likelihood: low
    impact: high
    domains: [credit]
    created_from: synthetic

  - type: risk
    id: risk-dcre-erreur-calcul-ecl
    title: Erreur systématique dans le calcul ECL impactant les provisions
    statement: >-
      Une anomalie dans le pipeline de calcul IFRSCONSOLID (paramètre erroné, bug
      de mapping) pourrait conduire à une sous-estimation ou sur-estimation des
      provisions IFRS 9 sur plusieurs arrêtés consécutifs avant détection, avec
      impact sur les résultats publiés.
    likelihood: low
    impact: high
    mitigations:
      - Contrôle de cohérence entre les provisions calculées et les estimations historiques (± 10 %)
      - Test de non-régression automatique à chaque release du pipeline ECL
    domains: [credit]
    created_from: synthetic

  - type: constraint
    id: con-dcre-pret-personnel-montant-max
    title: Plafond réglementaire du crédit à la consommation à 75 000 €
    statement: >-
      Les crédits à la consommation entrant dans le champ de la directive
      2008/48/CE (révisée par 2023/2225) sont plafonnés à 75 000 €. Tout
      crédit personnel dépassant ce seuil sort du régime protecteur et
      doit être traité selon les règles du crédit immobilier.
    source: Directive crédit consommation 2023/2225, art. L312-1 C.conso
    severity: high
    domains: [credit]
    created_from: synthetic

  - type: decision
    id: dec-dcre-ecl-scenario-macro-trimestriel
    title: Actualisation trimestrielle des scénarios macroéconomiques ECL
    statement: >-
      Les paramètres forward-looking intégrés dans le calcul ECL (croissance PIB,
      taux de chômage, prix immobiliers) sont mis à jour chaque trimestre sur la
      base des prévisions publiées par la Banque de France et les instituts de
      conjoncture. Entre deux mises à jour, les paramètres en vigueur sont figés.
    rationale: >-
      La trimestrialité constitue le meilleur compromis entre réactivité aux
      évolutions macroéconomiques et stabilité des provisions, qui ne doivent
      pas fluctuer excessivement d'un arrêté mensuel à l'autre.
    date: "2024-09-01"
    decided_by: Comité IFRS 9
    still_active: true
    domains: [credit]
    created_from: synthetic

