nodes:

  # ── SYSTEM 1 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-portail-tpp
    name: Portail d'accès TPP
    description: >-
      Plateforme d'enregistrement et d'habilitation des prestataires de services
      de paiement tiers (TPP). Gère le cycle de vie des certificats eIDAS et
      l'attribution des rôles AISP, PISP et CBPII conformément à la DSP2.
    owner_team: Équipe Conformité Paiements
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-enreg-tpp
    name: Enregistrement des TPP
    description: >-
      Permet à un prestataire tiers de soumettre sa demande d'accès en fournissant
      son certificat eIDAS qualifié et son numéro d'agrément ACPR. Le dossier est
      instruit automatiquement puis soumis à validation manuelle pour les cas
      complexes.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-revocation-tpp
    name: Révocation des accès TPP
    description: >-
      Suspend ou révoque immédiatement l'accès d'un TPP en cas d'expiration de
      certificat, de retrait d'agrément ou de signalement de comportement abusif.
      L'opération est journalisée et notifiée en temps réel au système de passerelle.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-tableau-bord-tpp
    name: Tableau de bord TPP
    description: >-
      Offre aux TPP enregistrés une vue consolidée de leurs statistiques d'appels,
      de leur quota restant et des incidents en cours. Les données sont rafraîchies
      toutes les cinq minutes depuis le bus d'événements interne.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 2 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-gateway-api
    name: Passerelle API DSP2
    description: >-
      Point d'entrée unique pour tous les appels entrants des TPP. Assure le
      routage, la limitation de débit, la vérification des signatures OAuth2 et
      la journalisation de chaque requête à des fins d'audit réglementaire.
    owner_team: Équipe Intégration Ouverte
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-throttling-tpp
    name: Limitation de débit par TPP
    description: >-
      Applique des quotas d'appels différenciés selon le type de TPP et son niveau
      de service contractuel. Le dépassement entraîne un rejet HTTP 429 avec un
      en-tête Retry-After calculé dynamiquement.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-signature-oauth
    name: Vérification signature OAuth2
    description: >-
      Valide le jeton d'accès JWT présenté par le TPP en vérifiant la signature,
      la portée et la durée de vie. Les jetons expirés ou mal formés sont rejetés
      avec un code d'erreur normalisé Berlin Group.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-audit-log-gateway
    name: Journalisation d'audit gateway
    description: >-
      Enregistre l'intégralité des requêtes entrantes et sortantes dans un entrepôt
      immuable. Chaque entrée contient l'identifiant TPP, le timestamp, le code de
      retour et la taille de la réponse, afin de reconstituer tout incident.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 3 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-orchestrateur-sca
    name: Orchestrateur SCA
    description: >-
      Composant central chargé de sélectionner et d'enchaîner les facteurs
      d'authentification forte pour les parcours initiés par des TPP ou par la
      banque elle-même. Gère les exemptions réglementaires et les escalades en
      cas d'échec.
    owner_team: Équipe Sécurité des Accès
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-choix-facteur-sca
    name: Sélection du facteur SCA
    description: >-
      Détermine dynamiquement la combinaison de facteurs à présenter à l'utilisateur
      en fonction du niveau de risque de la transaction, du canal et des préférences
      enregistrées. La décision est tracée pour permettre la preuve de conformité DSP2.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-exemption-sca
    name: Gestion des exemptions SCA
    description: >-
      Applique les exemptions prévues par les RTS DSP2 : transactions de faible
      montant, bénéficiaires de confiance, analyse de risque transactionnel. Le
      taux d'exemption est suivi en temps réel pour rester sous le seuil de fraude
      autorisé par la BCE.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-fallback-sca
    name: Mécanisme de secours SCA
    description: >-
      Active une procédure d'authentification alternative lorsque le facteur
      principal est indisponible. Le recours au SMS OTP comme facteur de secours
      est limité aux situations de panne avérée, avec alerte automatique au RSSI.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 4 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-consentement
    name: Moteur de consentement client
    description: >-
      Enregistre, gère et révoque les consentements accordés par les clients aux
      TPP pour accéder à leurs données ou initier des paiements. Conforme aux
      exigences de portabilité et de révocabilité de la DSP2 et du RGPD.
    owner_team: Équipe Données Client
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-creation-consentement
    name: Création de consentement
    description: >-
      Enregistre l'accord explicite du client après présentation d'un écran de
      confirmation normalisé listant les données partagées et la durée d'accès.
      Le consentement est horodaté et lié à l'identifiant de session SCA ayant
      permis de l'obtenir.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-revocation-consentement
    name: Révocation de consentement
    description: >-
      Permet au client de retirer à tout moment son consentement via l'application
      bancaire ou le portail web. La révocation est propagée en moins de trente
      secondes à la passerelle API afin d'empêcher tout appel ultérieur du TPP concerné.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-expiration-consentement
    name: Expiration automatique des consentements
    description: >-
      Contrôle quotidiennement les consentements actifs et révoque ceux dont la
      durée maximale de quatre-vingt-dix jours est atteinte. Un email de rappel
      est envoyé au client sept jours avant l'expiration pour lui proposer un
      renouvellement.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 5 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-aisp-agregateur
    name: Agrégateur de comptes AISP
    description: >-
      Service d'information sur les comptes exposant les soldes, les transactions
      et les métadonnées de comptes détenus dans d'autres établissements. Repose
      sur la passerelle API pour les appels sortants vers les banques tierces.
    owner_team: Équipe Agrégation Financière
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-agregation-soldes
    name: Agrégation des soldes multi-banques
    description: >-
      Collecte les soldes courants et disponibles sur l'ensemble des comptes liés
      par le client, toutes banques confondues. Les données sont consolidées et
      normalisées dans un modèle commun avant exposition au front.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-historique-transactions
    name: Historique des transactions agrégé
    description: >-
      Récupère jusqu'à quatre-vingt-dix jours de transactions pour chaque compte
      agrégé. Les catégories marchandes sont enrichies par un moteur de classification
      automatique pour faciliter le suivi budgétaire du client.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-synchronisation-comptes-tiers
    name: Synchronisation des comptes tiers
    description: >-
      Déclenche la mise à jour des soldes et transactions des comptes externes
      selon une fréquence configurable par le client. Le résultat de chaque
      synchronisation est publié sur le bus d'événements pour notifier les
      composants consommateurs.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 6 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-pisp-initiateur
    name: Initiateur de paiement PISP
    description: >-
      Permet aux TPP agréés PISP de déclencher des virements au nom du client
      après authentification forte. S'intègre au système de paiement interne pour
      la validation de provision et l'exécution.
    owner_team: Équipe Paiements Ouverts
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-init-virement-pisp
    name: Initiation de virement via PISP
    description: >-
      Prend en charge la requête de paiement soumise par un TPP PISP, vérifie la
      provision disponible et déclenche l'ordre après confirmation SCA du titulaire.
      La réponse inclut un identifiant de transaction unique opposable.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-statut-paiement-pisp
    name: Consultation du statut de paiement PISP
    description: >-
      Expose le statut d'avancement d'un ordre initié par un TPP selon les états
      normalisés Berlin Group : RCVD, PDNG, ACCP, ACSC, RJCT. Les transitions sont
      poussées en webhook dès qu'elles se produisent.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-annulation-virement-pisp
    name: Annulation de virement PISP
    description: >-
      Permet l'annulation d'un ordre PISP tant qu'il n'a pas atteint l'état ACSC.
      La demande d'annulation peut être soumise par le TPP initiateur ou par le
      client via le portail. L'annulation acceptée est notifiée en webhook.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 7 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-annuaire-eidas
    name: Annuaire eIDAS
    description: >-
      Composant de vérification et de mise en cache des certificats eIDAS qualifiés
      émis par les TSP européens. Consulté par la passerelle et le portail TPP pour
      authentifier les identités numériques des prestataires.
    owner_team: Équipe PKI et Identités
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-validation-cert-eidas
    name: Validation de certificat eIDAS
    description: >-
      Vérifie la chaîne de confiance, la non-révocation OCSP et la conformité du
      profil du certificat aux exigences eIDAS QWAC et QSealC. Les résultats sont
      mis en cache trente minutes pour limiter la charge sur les TSP externes.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-rotation-cert-eidas
    name: Rotation des certificats eIDAS
    description: >-
      Détecte les certificats approchant de leur date d'expiration et notifie
      automatiquement le TPP concerné quatre-vingt-dix et trente jours avant
      l'échéance. En cas de non-renouvellement, la révocation est déclenchée.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 8 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-reporting-rts
    name: Moteur de reporting RTS
    description: >-
      Produit les rapports trimestriels exigés par les autorités compétentes :
      taux de disponibilité de l'interface dédiée, délais de réponse médians,
      incidents et taux d'exemption SCA. Les données sont transmises via la
      plateforme de reporting de l'ACPR.
    owner_team: Équipe Conformité Réglementaire
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-collecte-metriques-api
    name: Collecte des métriques API
    description: >-
      Agrège en temps réel les métriques de performance de la passerelle : taux de
      disponibilité, latences p50/p95/p99, codes de retour HTTP et volumes par
      endpoint. Les données alimentent à la fois le tableau de bord interne et les
      rapports réglementaires.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-generation-rapport-acpr
    name: Génération du rapport ACPR
    description: >-
      Formate et soumet le rapport de disponibilité trimestriel à la plateforme
      ONEGATE de l'ACPR selon le schéma XSD officiel. Un contrôle de cohérence
      interne est exécuté avant chaque soumission pour détecter les anomalies.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 9 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-sandbox-tpp
    name: Sandbox TPP
    description: >-
      Environnement de test isolé mis à disposition des TPP souhaitant développer
      et valider leur intégration avant certification. Simule l'intégralité des
      endpoints de production avec des données synthétiques conformes Berlin Group.
    owner_team: Équipe Intégration Ouverte
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-simulation-erreurs-sandbox
    name: Simulation d'erreurs en sandbox
    description: >-
      Permet aux TPP de reproduire les cas d'erreur courants (SCA échouée, provision
      insuffisante, TPP révoqué) via un en-tête de contrôle spécifique. Facilite la
      couverture des scénarios négatifs dès la phase de développement.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-jeux-donnees-sandbox
    name: Jeux de données sandbox
    description: >-
      Fournit des comptes fictifs pré-paramétrés couvrant les principaux profils
      clients : compte vide, compte multi-devises, plafond atteint, bénéficiaire
      en attente de carence. Les jeux de données sont réinitialisés chaque nuit.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 10 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-detecteur-fraude-openbanking
    name: Détecteur de fraude Open Banking
    description: >-
      Analyse en ligne les patterns d'appels TPP pour identifier les comportements
      abusifs : scraping massif, réutilisation de consentements révoqués, initiation
      de paiements hors profil. Alimente le portail TPP pour suspension préventive.
    owner_team: Équipe Lutte contre la Fraude
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-scoring-comportemental-tpp
    name: Scoring comportemental TPP
    description: >-
      Calcule un score de risque continu pour chaque TPP actif à partir de la
      fréquence d'appels, du taux d'erreur et des écarts par rapport au profil
      historique. Un score dépassant le seuil critique déclenche une alerte vers
      l'équipe de surveillance.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-blocage-tpp-suspect
    name: Blocage automatique d'un TPP suspect
    description: >-
      Suspend automatiquement les accès d'un TPP dont le score dépasse le niveau
      critique, en attendant une revue humaine sous quatre heures. La suspension
      est réversible et traçable, avec notification immédiate au TPP concerné.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 11 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-referentiel-comptes-ouverts
    name: Référentiel des comptes ouverts
    description: >-
      Maintient la liste des comptes clients éligibles à l'open banking, avec leurs
      attributs de partageabilité (devise, type, restrictions). Synchronisé quotidiennement
      depuis le core banking et consulté par l'agrégateur et l'initiateur de paiement.
    owner_team: Équipe Données Client
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-eligibilite-compte
    name: Vérification d'éligibilité d'un compte
    description: >-
      Détermine si un compte donné peut être exposé aux TPP en croisant le type de
      compte, le statut du titulaire et les éventuelles restrictions judiciaires ou
      commerciales. La réponse est binaire et motivée pour faciliter le débogage.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-mise-a-jour-eligibilite
    name: Mise à jour des règles d'éligibilité
    description: >-
      Permet à l'équipe conformité de modifier les critères d'éligibilité sans
      déploiement applicatif via un référentiel de règles versionnées. Chaque
      modification fait l'objet d'une validation en environnement de recette avant
      activation en production.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 12 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-notificateur-evenements
    name: Notificateur d'événements DSP2
    description: >-
      Diffuse les événements métier significatifs (nouveau consentement, révocation,
      paiement exécuté) en push vers les TPP abonnés via webhooks sécurisés. Garantit
      la livraison au moins une fois avec mécanisme de reprise exponentielle.
    owner_team: Équipe Intégration Ouverte
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-abonnement-webhook
    name: Gestion des abonnements webhook
    description: >-
      Permet aux TPP de s'inscrire à des catégories d'événements et de renseigner
      leur URL de réception. Chaque abonnement est validé par un ping de confirmation
      avant activation et peut être suspendu par le TPP ou révoqué par la banque.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-reprise-webhook
    name: Reprise sur échec de webhook
    description: >-
      Rejoue automatiquement les notifications non acquittées selon une stratégie
      de back-off exponentiel jusqu'à vingt-quatre heures après l'événement initial.
      Les événements non livrés après ce délai sont archivés et signalés au TPP.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 13 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-gestionnaire-jetons
    name: Gestionnaire de jetons d'accès
    description: >-
      Émet, renouvelle et révoque les jetons OAuth2 pour les TPP et les sessions
      utilisateurs. Gère les flux authorization_code et client_credentials avec
      des durées de vie différenciées selon le type de grant.
    owner_team: Équipe Sécurité des Accès
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-emission-jeton-acces
    name: Émission de jeton d'accès
    description: >-
      Génère un jeton JWT signé après validation du code d'autorisation et du
      certificat eIDAS du demandeur. La durée de vie est paramétrée selon la
      portée demandée et ne peut excéder quatre-vingt-dix minutes.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-refresh-jeton
    name: Renouvellement de jeton via refresh token
    description: >-
      Permet à un TPP de renouveler un jeton expiré sans redemander le consentement
      client, dans la limite de la durée de validité du consentement associé.
      Le refresh token original est invalidé à chaque utilisation.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-revocation-jeton-actif
    name: Révocation d'un jeton actif
    description: >-
      Permet à un client ou à un opérateur de révoquer immédiatement un jeton
      d'accès ou refresh token actif, par exemple lors d'un signalement de
      compromission de compte. La révocation est propagée en temps réel à la
      passerelle via le cache partagé.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 14 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-portail-client-ob
    name: Portail client Open Banking
    description: >-
      Interface web dédiée permettant aux clients de gérer leurs consentements
      actifs, de visualiser les accès accordés aux TPP et de consulter l'historique
      des opérations initiées par des tiers. Accessible depuis l'espace client
      principal de la banque.
    owner_team: Équipe Banque Numérique
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-liste-consentements-actifs
    name: Visualisation des consentements actifs
    description: >-
      Affiche pour chaque consentement en cours le nom du TPP, les types de données
      partagées, la date d'octroi et la date d'expiration. La présentation est
      conçue pour être compréhensible par un client non expert.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-historique-acces-tpp
    name: Historique des accès TPP
    description: >-
      Retrace les trente derniers jours d'accès effectués par chaque TPP autorisé :
      date, heure, type d'opération et compte consulté ou débité. L'historique est
      exportable au format CSV pour les clients souhaitant le conserver.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-notification-expiration-consentement-client
    name: Notification client avant expiration de consentement
    description: >-
      Envoie un rappel au client sept jours avant l'expiration d'un consentement
      actif, lui proposant un lien direct vers le parcours de renouvellement.
      La notification est envoyée par email et par push si le client a activé
      les notifications de l'application bancaire.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 15 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-verificateur-provision
    name: Vérificateur de provision CBPII
    description: >-
      Répond aux requêtes de confirmation de disponibilité de fonds émises par les
      TPP agréés CBPII. La réponse est binaire (OUI/NON) et ne révèle pas le solde
      exact, conformément au cadre réglementaire.
    owner_team: Équipe Paiements Ouverts
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-confirmation-provision
    name: Confirmation de disponibilité des fonds
    description: >-
      Évalue en temps réel si le montant demandé par le CBPII est disponible sur
      le compte indiqué, en tenant compte du solde disponible et des opérations en
      attente. La réponse est fournie en moins de deux secondes.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-journalisation-cbpii
    name: Journalisation des requêtes CBPII
    description: >-
      Enregistre chaque demande de confirmation de provision avec l'identifiant
      du CBPII, le montant interrogé et le résultat renvoyé. Les entrées sont
      horodatées et conservées pour permettre la réconciliation en cas de litige.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 16 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-bus-evenements-ob
    name: Bus d'événements Open Banking
    description: >-
      Infrastructure de messagerie asynchrone reliant les composants DSP2 entre
      eux. Garantit la cohérence des états entre le moteur de consentement, la
      passerelle, le notificateur et le détecteur de fraude via des topics Kafka
      dédiés.
    owner_team: Équipe Socle Technique
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-publication-evenement-ob
    name: Publication d'événement métier
    description: >-
      Permet à tout composant producteur de publier un événement typé et versionné
      sur le topic approprié. La sérialisation utilise Avro avec registre de schémas
      central pour garantir la compatibilité ascendante.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-rejoue-evenements
    name: Rejeu d'événements sur demande
    description: >-
      Permet à un consommateur autorisé de rejouer une plage d'événements passés
      pour reconstruire un état ou investiguer un incident. La rétention est fixée
      à trente jours avec possibilité d'archivage longue durée pour les audits.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-supervision-lag-consommateurs
    name: Supervision du lag des consommateurs
    description: >-
      Surveille le retard de consommation de chaque abonné aux topics Kafka DSP2.
      Une alerte est émise si le lag dépasse le seuil configuré, indiquant un
      consommateur en difficulté pouvant entraîner des incohérences d'état.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 17 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-outil-conformite-rts
    name: Outil de suivi conformité RTS
    description: >-
      Application interne permettant à l'équipe conformité de piloter l'état des
      exigences RTS DSP2 : couverture des interfaces dédiées, statut des tests
      d'acceptation et suivi des dérogations accordées par l'ACPR.
    owner_team: Équipe Conformité Réglementaire
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-suivi-exigences-rts
    name: Suivi des exigences RTS
    description: >-
      Cartographie chaque exigence des RTS sur un ou plusieurs composants du
      système d'information et indique le statut de conformité (conforme, en cours,
      non conforme). Les écarts détectés génèrent des tickets de remédiation
      automatiques.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-gestion-derogations
    name: Gestion des dérogations réglementaires
    description: >-
      Permet de documenter, soumettre et suivre les demandes de dérogation auprès
      de l'ACPR lorsqu'une exigence ne peut être satisfaite dans les délais. Les
      dérogations accordées sont intégrées dans le tableau de bord de conformité.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-tableau-bord-conformite
    name: Tableau de bord de conformité RTS
    description: >-
      Présente une vue synthétique du niveau de conformité DSP2 par domaine :
      authentification forte, interfaces dédiées, reporting et gestion des
      consentements. Les indicateurs sont mis à jour quotidiennement depuis les
      données collectées par les différents composants.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 18 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-moteur-limites-taux
    name: Moteur de limites tarifaires
    description: >-
      Calcule et applique les limites financières associées aux opérations open
      banking : plafonds de paiements PISP, frais d'accès différenciés et
      notifications de dépassement en quasi-temps réel.
    owner_team: Équipe Paiements Ouverts
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-controle-plafond-pisp
    name: Contrôle de plafond PISP
    description: >-
      Vérifie avant chaque initiation de paiement que le montant n'excède pas le
      plafond journalier configuré pour le TPP et le client. Le refus est motivé
      par un code d'erreur normalisé indiquant le plafond résiduel.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-notification-depassement
    name: Notification de dépassement de plafond
    description: >-
      Envoie une alerte push et un email au client lorsque ses paiements initiés
      par TPP atteignent quatre-vingts pour cent du plafond journalier. La
      notification inclut le récapitulatif des opérations du jour.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-reset-plafond-journalier
    name: Réinitialisation du compteur journalier PISP
    description: >-
      Remet à zéro les compteurs d'utilisation des plafonds PISP à minuit pour
      chaque client. Le processus est déclenché par un job planifié et sa durée
      d'exécution est supervisée pour détecter les dérives de performance.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 19 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-socle-chiffrement-ob
    name: Socle de chiffrement Open Banking
    description: >-
      Fournit les primitives cryptographiques utilisées par les composants DSP2 :
      chiffrement des données sensibles au repos, signature des événements et
      gestion du cycle de vie des clés via un HSM mutualisé.
    owner_team: Équipe PKI et Identités
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-chiffrement-consentement
    name: Chiffrement des données de consentement
    description: >-
      Applique un chiffrement de niveau AES-256 aux enregistrements de consentement
      avant persistance. La clé de chiffrement est stockée dans le HSM et renouvelée
      annuellement selon la politique de rotation en vigueur.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-signature-evenements-ob
    name: Signature des événements Open Banking
    description: >-
      Appose une signature cryptographique sur chaque événement publié sur le bus
      avant transmission au notificateur. Le destinataire peut vérifier l'intégrité
      de l'événement en consultant la clé publique publiée dans le catalogue API.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 20 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-catalogue-api
    name: Catalogue des APIs Open Banking
    description: >-
      Référentiel des spécifications techniques des APIs DSP2 exposées : endpoints,
      modèles de données, codes d'erreur et versions supportées. Sert de source de
      vérité pour les TPP, les équipes internes et l'outil de conformité RTS.
    owner_team: Équipe Intégration Ouverte
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-publication-spec-openapi
    name: Publication des spécifications OpenAPI
    description: >-
      Génère et publie automatiquement les fichiers OpenAPI 3.0 à chaque release,
      en les versionnant selon semver. Les spécifications sont disponibles via le
      portail développeur interne et dans la sandbox TPP.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-depreciation-version-api
    name: Gestion de la dépréciation d'API
    description: >-
      Orchestre le cycle de fin de vie des versions d'API : annonce de dépréciation,
      période de transition de six mois et coupure planifiée. Les TPP utilisant une
      version dépréciée reçoivent un en-tête Warning dès la décision de dépréciation.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-recherche-spec-api
    name: Recherche dans le catalogue API
    description: >-
      Propose un moteur de recherche full-text sur les descriptions d'endpoints,
      les codes d'erreur et les champs de modèles. Permet aux équipes de développement
      et aux TPP de retrouver rapidement le endpoint répondant à leur besoin.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 21 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-supervision-disponibilite
    name: Supervision de disponibilité des interfaces
    description: >-
      Sonde en continu les interfaces dédiées et les interfaces de secours pour
      mesurer leur disponibilité selon les critères RTS. Alerte l'équipe de garde
      en cas de dégradation et alimente le tableau de bord de reporting réglementaire.
    owner_team: Équipe Exploitation DSP2
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-sonde-disponibilite
    name: Sondage de disponibilité toutes les minutes
    description: >-
      Exécute des requêtes synthétiques vers chaque endpoint critique toutes les
      soixante secondes depuis trois points de présence distincts. Une indisponibilité
      est déclarée si deux sondes sur trois échouent consécutivement.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-alerte-degradation
    name: Alerte en cas de dégradation de disponibilité
    description: >-
      Déclenche une alerte PagerDuty et crée un incident dans l'outil ITSM interne
      dès qu'un seuil de disponibilité réglementaire est franchi. Le ticket est
      escaladé automatiquement si la situation n'est pas résolue en trente minutes.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-historique-disponibilite
    name: Historique de disponibilité des interfaces
    description: >-
      Conserve l'historique des mesures de disponibilité sur douze mois glissants
      pour chaque endpoint DSP2. Les données sont utilisées pour calculer les
      indicateurs trimestriels du rapport ACPR et pour détecter les tendances
      de dégradation progressive.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 22 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-reclamations-ob
    name: Gestion des réclamations Open Banking
    description: >-
      Centralise les réclamations liées aux accès TPP : opérations non reconnues,
      consentements non sollicités, refus d'accès injustifiés. Chaque dossier est
      traité dans les délais imposés par la réglementation bancaire.
    owner_team: Équipe Relation Client
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-saisie-reclamation-ob
    name: Saisie de réclamation Open Banking
    description: >-
      Permet au conseiller ou au client d'ouvrir un dossier de réclamation lié à
      une opération open banking avec rattachement automatique aux traces d'accès
      TPP correspondantes. Le dossier est qualifié selon une taxonomie réglementaire.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-restitution-fonds-ob
    name: Restitution de fonds suite à fraude PISP
    description: >-
      Orchestre le processus de remboursement lorsqu'une opération PISP est
      reconnue comme frauduleuse après investigation. Le délai de restitution est
      suivi pour garantir le respect des obligations légales envers le client.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-reporting-reclamations-ob
    name: Reporting mensuel des réclamations Open Banking
    description: >-
      Produit chaque mois un tableau de bord des réclamations reçues classées par
      type d'opération TPP et par motif. Les indicateurs alimentent le comité
      qualité et sont utilisés pour identifier les causes récurrentes d'insatisfaction.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 23 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-connecteur-cbso
    name: Connecteur CBSO interbancaire
    description: >-
      Passerelle technique permettant d'envoyer des requêtes AISP/PISP vers des
      banques tierces conformes DSP2 via le protocole Berlin Group. Gère la
      négociation de version et les retries en cas d'indisponibilité partielle.
    owner_team: Équipe Intégration Ouverte
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-negociation-version-berlin
    name: Négociation de version Berlin Group
    description: >-
      Sélectionne automatiquement la version du protocole Berlin Group commune avec
      la banque cible lors de l'établissement de la session. Supporte les versions
      1.3 à 2.0 et journalise la version négociée pour chaque appel.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-retry-banque-tierce
    name: Reprise sur erreur vers banque tierce
    description: >-
      Applique une politique de retry configurable (délai, nombre de tentatives)
      pour les appels vers les banques tierces retournant des erreurs 5xx ou des
      timeouts réseau. Les tentatives sont journalisées et agrégées dans les
      tableaux de bord de disponibilité.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-mapping-codes-erreur
    name: Mapping des codes d'erreur Berlin Group
    description: >-
      Traduit les codes d'erreur propriétaires renvoyés par les banques tierces
      en codes normalisés Berlin Group avant de les exposer au TPP appelant. Le
      référentiel de correspondance est maintenu par l'équipe d'intégration et
      mis à jour lors de chaque onboarding d'un nouveau partenaire.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 24 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-administration-ob
    name: Console d'administration Open Banking
    description: >-
      Interface réservée aux opérateurs internes pour superviser et piloter le
      dispositif open banking : gestion des quotas, activation/désactivation de
      TPP, consultation des logs agrégés et paramétrage des plafonds.
    owner_team: Équipe Exploitation DSP2
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-gestion-quotas-admin
    name: Gestion des quotas d'appels
    description: >-
      Permet aux opérateurs de modifier en temps réel les quotas d'appels attribués
      à chaque TPP sans redémarrage de la passerelle. Les modifications sont
      auditées et nécessitent une double validation pour les baisses supérieures
      à cinquante pour cent.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-consultation-logs-admin
    name: Consultation des logs agrégés
    description: >-
      Expose une interface de recherche facettée sur les logs de la passerelle et
      du moteur SCA pour les besoins d'investigation. Les résultats sont paginés
      et exportables, avec contrôle des accès basé sur les rôles.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-parametrage-exemptions-admin
    name: Paramétrage des exemptions SCA
    description: >-
      Permet aux administrateurs d'activer ou désactiver les catégories d'exemption
      SCA applicables (TRA, faible montant, bénéficiaire de confiance) et d'en
      ajuster les seuils. Toute modification est enregistrée dans le journal d'audit
      avec l'identité de l'opérateur.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── SYSTEM 25 + features ──────────────────────────────────────────────────
  - type: system
    id: sys-ddsp-archiveur-legal-ob
    name: Archiveur légal Open Banking
    description: >-
      Conserve pendant dix ans les preuves d'authentification forte, les journaux
      de consentement et les traces d'opérations PISP à des fins de contentieux et
      d'audit réglementaire. Les archives sont chiffrées et stockées sur support
      immuable.
    owner_team: Équipe Conformité Réglementaire
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-archivage-preuve-sca
    name: Archivage des preuves SCA
    description: >-
      Capture et horodate les éléments de preuve de chaque authentification forte :
      type de facteur utilisé, résultat, hash de la transaction authentifiée et
      identifiant de session. Ces données sont scellées cryptographiquement avant
      archivage.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-restitution-archives
    name: Restitution des archives sur demande légale
    description: >-
      Permet la récupération ciblée des preuves archivées dans le cadre d'une
      procédure judiciaire ou d'un contrôle de l'ACPR. L'accès est restreint à
      des rôles habilités et chaque restitution est elle-même archivée.
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-ddsp-test-integrite-archives
    name: Test d'intégrité des archives
    description: >-
      Exécute mensuellement un contrôle par hachage sur un échantillon statistique
      des archives stockées pour détecter toute corruption silencieuse. Les
      anomalies détectées déclenchent une alerte immédiate vers l'équipe
      conformité et l'équipe d'exploitation.
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── BUSINESS OBJECTS ────────────────────────────────────────────────────
  - type: business_object
    id: obj-ddsp-consentement-tpp
    name: Consentement TPP
    description: >-
      Accord formel d'un client autorisant un TPP à accéder à ses données ou à
      initier des paiements en son nom. Porte la durée, la portée et l'identifiant
      de la session SCA ayant permis son obtention.
    steward_team: Équipe Données Client
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-certificat-eidas
    name: Certificat eIDAS
    description: >-
      Certificat qualifié émis par un prestataire de services de confiance européen,
      attestant de l'identité et du rôle réglementaire d'un TPP. Distingue les
      types QWAC (authentification) et QSealC (signature).
    steward_team: Équipe PKI et Identités
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-jeton-oauth
    name: Jeton OAuth2
    description: >-
      Credential temporaire permettant à un TPP d'accéder aux APIs DSP2 au nom
      d'un client ou en son propre nom. Encodé en JWT et signé par le gestionnaire
      de jetons interne.
    steward_team: Équipe Sécurité des Accès
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-ordre-paiement-pisp
    name: Ordre de paiement PISP
    description: >-
      Instruction de virement émise par un TPP PISP pour le compte d'un client.
      Contient le montant, l'IBAN bénéficiaire, la référence unique et l'identifiant
      du consentement ayant autorisé l'opération.
    steward_team: Équipe Paiements Ouverts
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-profil-tpp
    name: Profil TPP
    description: >-
      Fiche d'identité d'un prestataire tiers enregistré : numéro d'agrément,
      rôles DSP2, certificats actifs, quotas d'appels et statut de suspension.
      Sert de référence à l'ensemble des composants du dispositif open banking.
    steward_team: Équipe Conformité Paiements
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-compte-agregable
    name: Compte agrégable
    description: >-
      Compte bancaire d'un client déclaré éligible au partage via l'open banking.
      L'objet porte les attributs de partageabilité et l'historique des accès
      AISP reçus au cours des quatre-vingt-dix derniers jours.
    steward_team: Équipe Données Client
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-session-sca
    name: Session SCA
    description: >-
      Représentation d'une procédure d'authentification forte en cours ou terminée.
      Enregistre les facteurs présentés, les résultats intermédiaires et le verdict
      final, et constitue la preuve attachée au consentement ou à l'ordre de paiement.
    steward_team: Équipe Sécurité des Accès
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-rapport-disponibilite
    name: Rapport de disponibilité RTS
    description: >-
      Document trimestriel transmis à l'ACPR récapitulant les taux de disponibilité,
      les incidents et les délais de réponse de chaque interface DSP2. Produit
      par le moteur de reporting et archivé pendant cinq ans.
    steward_team: Équipe Conformité Réglementaire
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-evenement-ob
    name: Événement Open Banking
    description: >-
      Message asynchrone décrivant un fait métier survenu dans le dispositif DSP2 :
      création de consentement, paiement exécuté, TPP suspendu. Chaque événement
      est typé, versionné et signé avant publication sur le bus.
    steward_team: Équipe Socle Technique
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-reclamation-ob
    name: Dossier de réclamation Open Banking
    description: >-
      Dossier ouvert suite à un litige lié à une opération initiée par un TPP ou
      à un accès non reconnu. Contient la qualification réglementaire, les pièces
      justificatives et le statut de traitement.
    steward_team: Équipe Relation Client
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-plafond-pisp
    name: Plafond de paiement PISP
    description: >-
      Limite financière journalière configurable par couple client-TPP pour les
      paiements initiés via PISP. Le dépassement entraîne un rejet immédiat de
      l'ordre et une notification au client.
    steward_team: Équipe Paiements Ouverts
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-webhook-tpp
    name: Webhook TPP
    description: >-
      Abonnement d'un TPP à une catégorie d'événements Open Banking avec l'URL
      de réception configurée. L'objet porte l'état de l'abonnement, les statistiques
      de livraison et la clé de signature utilisée pour sécuriser les appels.
    steward_team: Équipe Intégration Ouverte
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-score-risque-tpp
    name: Score de risque TPP
    description: >-
      Indicateur calculé en continu par le détecteur de fraude représentant le
      niveau de risque comportemental d'un TPP actif. Sert de déclencheur pour
      la suspension automatique et alimente les rapports de surveillance.
    steward_team: Équipe Lutte contre la Fraude
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: business_object
    id: obj-ddsp-cle-hsm
    name: Clé cryptographique HSM
    description: >-
      Clé symétrique ou asymétrique stockée dans le module de sécurité matériel
      mutualisé. Chaque clé est associée à un usage précis (chiffrement, signature),
      à une date d'expiration et à une liste de composants autorisés à l'utiliser.
    steward_team: Équipe PKI et Identités
