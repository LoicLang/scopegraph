  # ── DECISIONS ────────────────────────────────────────────────────────────
  - type: decision
    id: dec-ddsp-standard-berlin-group
    title: Adoption du standard Berlin Group
    statement: >-
      L'ensemble des interfaces DSP2 exposées aux TPP sera conforme au standard
      Berlin Group NextGenPSD2. Aucune API propriétaire ne peut être substituée
      à ce standard sans dérogation formelle du comité d'architecture.
    rationale: >-
      Le choix du standard Berlin Group garantit l'interopérabilité avec les TPP
      européens et simplifie les tests de certification réglementaire. Il évite la
      fragmentation qui résulterait d'implémentations propriétaires divergentes.
    date: "2022-03-10"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-oauth2-pkce
    title: OAuth2 avec PKCE obligatoire
    statement: >-
      Le flux d'autorisation OAuth2 utilisé pour les TPP doit systématiquement
      intégrer l'extension PKCE. Les flux implicites et password sont interdits
      sur toutes les interfaces DSP2.
    rationale: >-
      PKCE protège contre les attaques d'interception de code d'autorisation,
      particulièrement critiques dans les environnements mobiles où les deep-links
      peuvent être détournés. L'interdiction des flux implicites suit les
      recommandations BCP OAuth2 de l'IETF.
    date: "2022-09-01"
    decided_by: Comité de sécurité
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-consentement-90j
    title: Durée maximale de consentement à 90 jours
    statement: >-
      La durée de validité maximale d'un consentement AISP est fixée à quatre-vingt-dix
      jours calendaires, conformément aux exigences RTS. Le renouvellement requiert
      une nouvelle authentification forte du client.
    rationale: >-
      Aligner la durée maximale sur le minimum réglementaire réduit la surface
      d'exposition en cas de compromission d'un consentement et clarifie les
      obligations de notification aux clients.
    date: "2022-11-15"
    decided_by: Comité conformité DSP2
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-sandbox-obligatoire
    title: Sandbox obligatoire avant certification
    statement: >-
      Tout TPP souhaitant accéder à la production doit au préalable valider une
      batterie de tests de conformité dans la sandbox. L'attestation de réussite
      est archivée et rattachée au profil TPP.
    rationale: >-
      L'obligation de sandbox réduit le nombre d'incidents en production liés à
      des intégrations mal testées et diminue la charge de support de premier niveau.
    date: "2023-02-01"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-eidas-qwac-seulement
    title: Certificats eIDAS QWAC obligatoires pour TLS
    statement: >-
      Seuls les certificats eIDAS QWAC sont acceptés pour l'établissement des
      sessions mTLS avec la passerelle API. Les certificats non qualifiés ou les
      certificats d'infrastructure standard ne sont pas autorisés.
    rationale: >-
      L'exigence de QWAC pour TLS garantit l'identité légalement opposable du
      TPP à chaque appel et simplifie la procédure de révocation en cas d'incident
      de sécurité.
    date: "2022-03-10"
    decided_by: Comité de sécurité
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-webhook-hmac-sha256
    title: Sécurisation des webhooks par HMAC-SHA256
    statement: >-
      Toutes les notifications push envoyées aux TPP via webhook doivent être
      signées avec HMAC-SHA256 en utilisant une clé secrète partagée propre à
      chaque abonnement. Les TPP doivent vérifier cette signature avant de traiter
      l'événement.
    rationale: >-
      La signature HMAC garantit l'authenticité et l'intégrité des notifications,
      empêchant les attaques par injection d'événements forgés vers les TPP.
    date: "2023-06-15"
    decided_by: Comité de sécurité
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-archivage-10-ans
    title: Rétention des preuves SCA pendant 10 ans
    statement: >-
      Les preuves d'authentification forte et les journaux de consentement sont
      conservés pendant dix ans sur support immuable, durée alignée sur le délai
      de prescription en matière de contestation de paiement.
    rationale: >-
      Les délais de prescription bancaire et les contraintes de contentieux exigent
      une rétention longue des preuves d'authentification. Un archivage insuffisant
      exposerait l'établissement à des risques juridiques majeurs.
    date: "2023-01-20"
    decided_by: Direction juridique
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-rate-limit-par-tpp
    title: Quotas d'appels différenciés par TPP
    statement: >-
      Les quotas d'appels à la passerelle API sont définis par couple TPP/endpoint
      selon le niveau de service contractuel, et non par un plafond global unique.
      Les modifications de quota nécessitent une double validation.
    rationale: >-
      Une approche globale avantagerait les gros TPP au détriment des TPP plus
      petits et rendrait difficile la maîtrise de la charge. Les quotas différenciés
      permettent une gestion équitable et garantissent la disponibilité pour tous.
    date: "2022-07-05"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-pas-de-bypass-sca
    title: Interdiction des bypass SCA non documentés
    statement: >-
      Aucun parcours d'authentification forte ne peut comporter de mécanisme de
      contournement non documenté. Toute exemption doit s'appuyer sur les cas
      prévus par les RTS DSP2 et être tracée dans l'orchestrateur SCA.
    rationale: >-
      Les bypass non documentés sont une source majeure de non-conformité lors des
      audits et créent des risques de sécurité difficiles à circonscrire. La traçabilité
      systématique est la seule approche défendable devant les régulateurs.
    date: "2023-03-08"
    decided_by: Comité conformité DSP2
    domains: [dsp2-open-banking]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-ddsp-chaos-testing-trimestriel
    title: Tests de chaos trimestriels sur la passerelle
    statement: >-
      Des tests de chaos engineering sont menés chaque trimestre sur la passerelle
      API DSP2 et ses dépendances. Les résultats sont documentés et les régressions
      de résilience bloquantes pour les prochaines mises en production.
    rationale: >-
      Les tests de résilience en conditions réelles permettent de valider les
      mécanismes de bascule et d'identifier les points de défaillance unique avant
      qu'ils n'impactent des TPP en production.
    date: "2024-01-15"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-jeton-acces-90min
    title: Durée de vie des jetons d'accès limitée à 90 minutes
    statement: >-
      Les jetons d'accès OAuth2 émis pour les TPP ont une durée de vie maximale de
      quatre-vingt-dix minutes. Les refresh tokens sont valides pour la durée du
      consentement associé sans pouvoir excéder quatre-vingt-dix jours.
    rationale: >-
      Limiter la durée de vie des jetons réduit la fenêtre d'exploitation en cas
      de fuite et aligne la politique sur les meilleures pratiques OAuth2 pour les
      APIs financières.
    date: "2022-09-01"
    decided_by: Comité de sécurité
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-double-validation-suspension
    title: Double validation pour suspensions de quotas importantes
    statement: >-
      Toute baisse de quota d'appels supérieure à cinquante pour cent ou toute
      suspension de TPP doit être validée par deux opérateurs distincts avant prise
      d'effet. Les modifications urgentes peuvent être réalisées par un seul
      opérateur sous astreinte mais doivent être contresignées sous quatre heures.
    rationale: >-
      La double validation prévient les erreurs opérationnelles ayant un impact
      majeur sur les TPP et introduit un contrôle de ségrégation des tâches exigé
      par les audits internes.
    date: "2023-04-12"
    decided_by: Comité des risques opérationnels
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-schema-avro-obligatoire
    title: Sérialisation Avro avec registre de schémas obligatoire
    statement: >-
      Les événements publiés sur le bus d'événements Open Banking doivent être
      sérialisés en Avro avec référence au registre de schémas central. La
      publication en JSON libre est interdite sur les topics de production.
    rationale: >-
      Avro avec registre de schémas garantit la compatibilité ascendante et
      descendante entre producteurs et consommateurs, réduisant le risque de
      rupture silencieuse lors des évolutions de modèle.
    date: "2023-08-20"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-interface-de-secours
    title: Interface de secours obligatoire pour toutes les banques
    statement: >-
      En complément de l'interface dédiée DSP2, une interface de secours basée
      sur l'interface client avec overlay doit être maintenue opérationnelle en
      permanence. Elle est activable en moins de quinze minutes en cas d'indisponibilité
      de l'interface dédiée.
    rationale: >-
      Les RTS DSP2 exigent une interface de secours pour les établissements ayant
      obtenu une exemption. Son absence ou son indisponibilité peut entraîner une
      injonction de l'ACPR et une remise en cause de l'exemption.
    date: "2022-04-18"
    decided_by: Comité conformité DSP2
    still_active: true
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-pisp-confirmation-solde
    title: Vérification de provision avant initiation PISP
    statement: >-
      Le service d'initiation de paiement PISP doit vérifier la disponibilité
      effective de la provision sur le compte source avant de transmettre l'ordre
      au système de paiement. Un ordre dont la provision est insuffisante ne peut
      pas être soumis.
    rationale: >-
      La vérification préalable réduit le taux de rejet en aval, améliore
      l'expérience du TPP et du client final, et évite la génération de frais
      de rejet imputés au compte.
    date: "2023-01-10"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-purge-consentements-expires
    title: Purge des consentements expirés après 12 mois
    statement: >-
      Les consentements expirés ou révoqués sont conservés douze mois après leur
      fin de validité à des fins de traçabilité, puis purgés automatiquement.
      Les archives légales associées suivent le cycle de rétention de dix ans.
    rationale: >-
      La purge des consentements obsolètes réduit la taille de la base de données
      et limite le risque d'accès non autorisé à des données historiques de consentement,
      conformément aux principes de minimisation du RGPD.
    date: "2023-07-01"
    decided_by: Délégué à la Protection des Données
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-identifiant-transaction-pisp
    title: Identifiant unique de transaction PISP
    statement: >-
      Chaque ordre initié via PISP reçoit un identifiant unique généré par le système
      bancaire, distinct de l'identifiant attribué par le TPP. Cet identifiant est
      renvoyé dans la réponse et utilisé pour toutes les opérations de suivi ultérieures.
    rationale: >-
      L'utilisation exclusive d'un identifiant bancaire évite les collisions entre
      identifiants issus de TPP différents et constitue la référence unique opposable
      en cas de litige.
    date: "2022-11-30"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-notification-revocation-tpp
    title: Notification immédiate en cas de révocation TPP
    statement: >-
      La révocation d'un accès TPP doit être notifiée au TPP concerné par webhook
      et email dans un délai de cinq minutes. Le portail TPP doit également refléter
      le nouveau statut en temps réel.
    rationale: >-
      Une notification rapide permet au TPP de gérer l'impact côté client et d'éviter
      de soumettre des requêtes vouées à l'échec, réduisant la charge inutile sur
      la passerelle.
    date: "2023-05-22"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-sla-disponibilite-9999
    title: SLA de disponibilité de l'interface dédiée à 99,99 %
    statement: >-
      L'interface dédiée DSP2 doit atteindre un taux de disponibilité mensuel d'au
      moins quatre-vingt-dix-neuf virgule quatre-vingt-dix-neuf pour cent, mesuré
      depuis les sondes de supervision. Tout écart déclenche une analyse des causes
      racines sous quarante-huit heures.
    rationale: >-
      Un taux de disponibilité insuffisant expose l'établissement à des sanctions
      réglementaires et dégrade la relation avec les TPP partenaires. L'objectif
      de 99,99 % est aligné sur les engagements pris lors de l'obtention de
      l'exemption d'interface de secours.
    date: "2022-06-01"
    decided_by: Comité des risques opérationnels
    still_active: true
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-mfa-admin-console
    title: MFA obligatoire pour la console d'administration
    statement: >-
      L'accès à la console d'administration Open Banking requiert une authentification
      multi-facteurs quel que soit le réseau d'accès. Les sessions administrateur
      expirent après trente minutes d'inactivité.
    rationale: >-
      La console d'administration permet de modifier des paramètres critiques comme
      les quotas et les suspensions de TPP. Une authentification renforcée est
      indispensable pour limiter le risque d'accès non autorisé.
    date: "2023-02-28"
    decided_by: Comité de sécurité
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-cbpii-reponse-binaire
    title: Réponse binaire pour la confirmation de provision CBPII
    statement: >-
      L'endpoint de confirmation de disponibilité des fonds ne retourne qu'une
      réponse OUI ou NON sans aucune information sur le solde réel ou la marge
      disponible. Toute exposition de montant précis est interdite.
    rationale: >-
      Le cadre réglementaire CBPII interdit explicitement la divulgation du solde
      exact. Une réponse binaire protège la confidentialité des données financières
      du client tout en répondant au besoin légitime du TPP.
    date: "2022-03-10"
    decided_by: Comité conformité DSP2
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── CONSTRAINTS ──────────────────────────────────────────────────────────
  - type: constraint
    id: con-ddsp-rts-dsp2
    title: Conformité aux RTS DSP2
    statement: >-
      L'ensemble des interfaces DSP2 doit satisfaire les exigences du Règlement
      délégué (UE) 2018/389 sur l'authentification forte et la communication sécurisée.
      Tout écart identifié doit faire l'objet d'un plan de remédiation approuvé
      dans les trente jours.
    source: Règlement délégué (UE) 2018/389
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-disponibilite-interface-dediee
    title: Disponibilité de l'interface dédiée DSP2
    statement: >-
      L'interface dédiée aux TPP doit présenter un taux de disponibilité mensuel
      supérieur ou égal à quatre-vingt-dix-neuf virgule quatre-vingt-dix-neuf pour
      cent. En deçà de ce seuil, la banque doit activer l'interface de secours et
      notifier l'ACPR.
    source: RTS DSP2 Article 33
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-sca-obligatoire-paiement
    title: SCA obligatoire pour tout paiement PISP
    statement: >-
      Tout ordre de paiement initié via un TPP PISP doit être précédé d'une
      authentification forte du client titulaire du compte. Aucune exemption
      basée sur la confiance accordée au TPP ne peut être appliquée.
    source: RTS DSP2 Article 4
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-eidas-mtls
    title: mTLS avec certificat eIDAS pour toute connexion TPP
    statement: >-
      Chaque connexion établie par un TPP vers la passerelle DSP2 doit utiliser le
      protocole TLS mutuel avec présentation d'un certificat eIDAS QWAC valide côté
      client. Les connexions sans certificat ou avec un certificat non qualifié sont
      rejetées sans négociation.
    source: RTS DSP2 Article 34
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-latence-reponse-api
    title: Latence de réponse API inférieure à 2 secondes
    statement: >-
      Chaque endpoint de l'interface dédiée DSP2 doit répondre en moins de deux
      secondes au percentile 95 sous charge nominale. Le dépassement de ce seuil
      sur une période de dix minutes déclenche une alerte opérationnelle.
    source: RTS DSP2 Article 33 — exigences de performance
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-retention-journaux-5ans
    title: Rétention des journaux d'accès pendant 5 ans
    statement: >-
      Les journaux d'accès aux APIs DSP2 doivent être conservés pendant au moins
      cinq ans. Ils doivent être intègres, horodatés et accessible sur demande
      dans le cadre d'un audit réglementaire ou d'une investigation judiciaire.
    source: DSP2 Article 69 — obligations de conservation
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-rgpd-minimisation-aisp
    title: Minimisation des données RGPD pour l'AISP
    statement: >-
      Les données de transaction transmises aux TPP AISP ne peuvent pas excéder
      ce qui est nécessaire au service fourni. L'enrichissement des données
      (catégorisation, scoring) ne peut être effectué qu'avec consentement explicite
      distinct pour ce traitement.
    source: RGPD Article 5(1)(c)
    severity: high
    domains: [dsp2-open-banking, referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-revocation-immediate-cert
    title: Révocation de certificat en moins de 30 minutes
    statement: >-
      Lors de la détection d'un certificat eIDAS compromis ou d'un TPP dont
      l'agrément est retiré, la révocation de l'accès dans la passerelle doit
      intervenir dans les trente minutes suivant la décision. Le délai est mesuré
      et tracé.
    source: Politique de sécurité interne — gestion des incidents PKI
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-pas-scraping-client
    title: Interdiction du screen-scraping client
    statement: >-
      L'accès aux données de compte par les TPP doit exclusivement passer par les
      interfaces dédiées DSP2. Le recours au screen-scraping des interfaces client
      est interdit, même en cas d'indisponibilité de l'interface dédiée déclarée
      par la banque.
    source: DSP2 Article 98(3)
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-exemption-taux-fraude-0-01
    title: Taux de fraude PISP sous 0,01 % pour conserver l'exemption TRA
    statement: >-
      Pour bénéficier de l'exemption d'analyse de risque transactionnel (TRA),
      le taux de fraude sur les paiements PISP doit rester inférieur à zéro virgule
      zéro un pour cent sur une fenêtre glissante de quatre-vingt-dix jours.
    source: RTS DSP2 Article 18
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-fips-140-3-hsm
    title: HSM certifié FIPS 140-3 pour les clés cryptographiques
    statement: >-
      Toutes les clés cryptographiques utilisées dans le cadre DSP2 (signature
      d'événements, chiffrement de consentements) doivent être générées et stockées
      dans un module HSM certifié au niveau FIPS 140-3 ou équivalent Common Criteria.
    source: Politique de sécurité cryptographique interne
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-berlin-group-seul
    title: Exclusivité du standard Berlin Group pour les APIs TPP
    statement: >-
      Aucune interface propriétaire ne peut être exposée aux TPP externes pour
      les cas d'usage couverts par le standard Berlin Group. Les extensions
      propriétaires éventuelles ne peuvent qu'enrichir, sans remplacer, les
      endpoints normalisés.
    source: Décision d'architecture DA-DSP2-001
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-audit-annuel-penetration
    title: Test de pénétration annuel des interfaces DSP2
    statement: >-
      Les interfaces DSP2 exposées aux TPP doivent faire l'objet d'un test de
      pénétration annuel réalisé par un prestataire externe indépendant. Les
      findings critiques doivent être corrigés avant la mise en production suivante.
    source: Politique de sécurité des APIs — chapitre 6
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-consentement-lie-sca
    title: Tout consentement doit être lié à une session SCA
    statement: >-
      Aucun consentement ne peut être enregistré dans le moteur de consentement
      sans référence valide à une session SCA réussie. L'orphanité de consentement
      est détectée lors des contrôles d'intégrité quotidiens.
    source: RTS DSP2 Article 10
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-notification-incident-4h
    title: Notification des incidents majeurs DSP2 à l'ACPR sous 4 heures
    statement: >-
      Tout incident affectant la disponibilité ou la sécurité des interfaces DSP2
      pendant plus de trente minutes consécutives doit être notifié à l'ACPR dans
      les quatre heures. La notification doit inclure l'impact estimé et les
      mesures de remédiation engagées.
    source: DSP2 Article 96 — notification des incidents
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-tls-1-3-minimum
    title: TLS 1.3 minimum pour toutes les connexions DSP2
    statement: >-
      Les négociations TLS vers les interfaces DSP2 doivent utiliser la version 1.3
      ou supérieure. Les connexions TLS 1.2 sont acceptées uniquement pour
      compatibilité legacy jusqu'au 31 décembre 2025, date à laquelle elles seront
      coupées.
    source: Politique de chiffrement interne v3.1
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-non-discrimination-tpp
    title: Non-discrimination des TPP dans les performances API
    statement: >-
      La passerelle API ne peut pas traiter différemment les requêtes d'un TPP
      concurrent sur la base de son identité commerciale. Les politiques de quota
      doivent être basées sur des critères techniques objectifs uniquement.
    source: DSP2 Article 31 — accès aux systèmes de paiement
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-rapport-trimestriel-obligatoire
    title: Rapport de disponibilité trimestriel obligatoire
    statement: >-
      Un rapport de disponibilité des interfaces DSP2 doit être transmis à l'ACPR
      dans les quinze jours calendaires suivant la fin de chaque trimestre. L'absence
      de soumission ou la soumission tardive constitue un manquement réglementaire.
    source: RTS DSP2 Article 33(6)
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-sandbox-toujours-disponible
    title: Sandbox disponible en permanence pour les TPP
    statement: >-
      La sandbox TPP doit être accessible vingt-quatre heures sur vingt-quatre,
      sept jours sur sept, avec un taux de disponibilité minimum de quatre-vingt-dix-neuf
      pour cent. Les maintenances planifiées sont notifiées avec sept jours d'avance.
    source: Accord-cadre TPP — annexe technique
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-journalisation-immuable
    title: Journalisation immuable des événements DSP2
    statement: >-
      Les journaux de la passerelle API, du moteur de consentement et de l'orchestrateur
      SCA doivent être écrits dans un entrepôt immuable dès leur production. Aucune
      modification ou suppression n'est autorisée pendant la période de rétention.
    source: Politique d'audit interne — exigences DSP2
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-consentement-affiche-client
    title: Affichage du consentement en langage clair avant signature
    statement: >-
      L'écran de confirmation de consentement présenté au client doit décrire en
      langage non technique les données partagées, l'identité du TPP et la durée
      d'accès. Un client ne peut pas consentir sans avoir vu cet écran.
    source: RTS DSP2 Article 9 — interface client
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-rotation-cles-annuelle
    title: Rotation annuelle des clés cryptographiques
    statement: >-
      L'ensemble des clés cryptographiques utilisées dans le dispositif DSP2 doivent
      être renouvelées au moins une fois par an. Le calendrier de rotation est géré
      par l'équipe PKI et ne peut être différé sans autorisation de la RSSI.
    source: Politique de gestion des clés — section 4.2
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-test-interface-secours-mensuel
    title: Test mensuel de l'interface de secours DSP2
    statement: >-
      L'interface de secours DSP2 doit faire l'objet d'un test de fonctionnement
      mensuel simulant son activation complète. Les résultats sont consignés et
      une défaillance déclenche une remédiation sous quarante-huit heures.
    source: RTS DSP2 Article 33(5) — interface de secours
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-zero-stockage-cvv
    title: Interdiction de stocker les données sensibles de carte via PISP
    statement: >-
      Les flux PISP ne peuvent en aucun cas transiter par des composants stockant
      des données de carte (PAN, CVV, date d'expiration). Toute conception impliquant
      un tel stockage doit être rejetée lors de la revue d'architecture.
    source: PCI DSS v4.0 — Requirement 3 (appliqué au périmètre PISP)
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-documentation-api-a-jour
    title: Documentation API à jour avant chaque release
    statement: >-
      La mise en production d'une nouvelle version d'API DSP2 ne peut pas précéder
      la publication de sa documentation dans le catalogue. Les spécifications
      OpenAPI correspondantes doivent être disponibles dans la sandbox au moins
      sept jours avant la mise en production.
    source: Politique de gestion des APIs internes
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-acces-admin-reseau-interne
    title: Console d'administration accessible uniquement depuis le réseau interne
    statement: >-
      L'accès à la console d'administration Open Banking est restreint aux adresses
      IP du réseau d'administration interne. Aucune exposition sur Internet ou sur
      le réseau de production partagé n'est autorisée.
    source: Politique de sécurité réseau — règle 12
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-suivi-taux-exemption
    title: Suivi mensuel du taux d'exemption SCA
    statement: >-
      L'équipe conformité doit produire chaque mois un tableau de bord du taux
      d'exemption SCA par type d'opération. Un taux approchant les seuils réglementaires
      déclenche un plan de vigilance renforcée.
    source: RTS DSP2 Article 18 — seuils d'exemption TRA
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-webhook-retry-max-24h
    title: Délai maximum de retry webhook limité à 24 heures
    statement: >-
      Les tentatives de livraison d'un webhook échoué ne peuvent pas s'étendre
      au-delà de vingt-quatre heures après l'émission de l'événement. Les événements
      non livrés dans ce délai sont archivés et signalés au TPP destinataire.
    source: Accord-cadre TPP — SLA de notification
    severity: low
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-identite-tpp-non-falsifiable
    title: Identité TPP non falsifiable dans les journaux
    statement: >-
      L'identifiant de TPP enregistré dans les journaux d'audit doit être extrait
      directement du certificat eIDAS présenté lors de la connexion, sans possibilité
      pour le TPP de le modifier via un paramètre de requête.
    source: Politique d'audit interne — exigences DSP2
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-annulation-pisp-avant-acsc
    title: Annulation PISP uniquement avant l'état ACSC
    statement: >-
      Une demande d'annulation d'un ordre PISP ne peut être acceptée que si l'ordre
      est dans un état antérieur à ACSC. Toute tentative d'annulation d'un ordre
      déjà exécuté doit être rejetée avec un code d'erreur explicite.
    source: Standard Berlin Group NextGenPSD2 — section gestion des ordres
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-chiffrement-transit-interne
    title: Chiffrement des données DSP2 en transit sur le réseau interne
    statement: >-
      Les communications entre les composants DSP2 sur le réseau interne doivent
      également être chiffrées via TLS mutuel. L'usage de canaux non chiffrés pour
      des données de consentement, de session SCA ou de jeton est interdit.
    source: Politique de sécurité réseau — section communications internes sensibles
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-test-unitaire-couverture
    title: Couverture de tests automatisés des composants DSP2
    statement: >-
      Chaque composant DSP2 critique (passerelle, orchestrateur SCA, moteur de
      consentement) doit maintenir une couverture de tests automatisés d'au moins
      quatre-vingts pour cent avant toute mise en production. Les dérogations
      nécessitent l'accord du responsable qualité.
    source: Politique qualité logicielle interne — section APIs réglementées
    severity: medium
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-ddsp-alertes-fraude-temps-reel
    title: Alertes de fraude DSP2 traitées en moins de 5 minutes
    statement: >-
      Les alertes générées par le détecteur de fraude Open Banking doivent être
      traitées par l'équipe de surveillance dans un délai maximum de cinq minutes.
      Le non-traitement automatique dans ce délai déclenche une escalade vers
      l'astreinte de niveau 2.
    source: Procédure de gestion des fraudes — section TPP
    severity: high
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-ddsp-annulation-pisp-initiateur
    title: Annulation PISP ouverte au TPP initiateur uniquement
    statement: >-
      Le droit d'annulation d'un ordre PISP est réservé au TPP qui a initié
      l'ordre et au client titulaire du compte, à l'exclusion de tout autre
      prestataire. Un TPP ne peut pas annuler les ordres d'un autre TPP même
      s'ils portent sur le même compte.
    rationale: >-
      Restreindre l'annulation à l'initiateur garantit l'intégrité des flux
      de paiement et évite les annulations concurrentes qui pourraient survenir
      si plusieurs TPP avaient accès aux ordres d'un même compte.
    date: "2023-09-05"
    decided_by: Comité d'architecture
    domains: [dsp2-open-banking]
    created_from: synthetic

  # ── RISKS ─────────────────────────────────────────────────────────────────
  - type: risk
    id: risk-ddsp-indispo-interface-dediee
    title: Indisponibilité prolongée de l'interface dédiée
    statement: >-
      Une panne de la passerelle API supérieure à trente minutes entraînerait
      l'obligation d'activer l'interface de secours et de notifier l'ACPR. Un incident
      non maîtrisé pourrait menacer l'exemption d'interface de secours obtenue
      par l'établissement.
    likelihood: low
    impact: high
    mitigations:
      - Architecture active-active en déploiement sur deux zones géographiques
      - Tests de chaos trimestriels validant les mécanismes de bascule automatique
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-fuite-jetons-oauth
    title: Fuite de jetons OAuth2 TPP
    statement: >-
      Une fuite de jetons d'accès OAuth2 permettrait à un acteur malveillant
      d'accéder aux données de compte des clients concernés pendant la durée de
      vie des jetons. L'impact est amplifié si la fuite touche des refresh tokens
      longue durée.
    likelihood: low
    impact: high
    mitigations:
      - Durée de vie limitée à quatre-vingt-dix minutes pour les access tokens
      - Révocation immédiate sur signalement via l'API de révocation OAuth2
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-tpp-abusif
    title: TPP adoptant un comportement abusif
    statement: >-
      Un TPP mal configuré ou malveillant pourrait soumettre un volume d'appels
      anormalement élevé, dégradant la disponibilité de l'interface pour les autres
      TPP. Le risque est aggravé si le comportement n'est pas détecté rapidement.
    likelihood: medium
    impact: medium
    mitigations:
      - Scoring comportemental en temps réel avec suspension automatique
      - Quotas différenciés empêchant un TPP de monopoliser les ressources
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-expiration-cert-non-detectee
    title: Expiration de certificat eIDAS non détectée à temps
    statement: >-
      Si le processus de surveillance des dates d'expiration des certificats eIDAS
      échoue, un TPP actif pourrait voir ses connexions rejetées sans préavis,
      entraînant une rupture de service non planifiée pour ses clients.
    likelihood: low
    impact: medium
    mitigations:
      - Alertes automatiques à quatre-vingt-dix et trente jours avant expiration
      - Vérification hebdomadaire par l'équipe PKI de la liste des certificats actifs
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-fraude-pisp-remboursement
    title: Fraude via initiation de paiement PISP
    statement: >-
      Un TPP compromis ou un vecteur d'hameçonnage permettant de déclencher une
      authentification SCA frauduleuse pourrait conduire à des virements non autorisés
      initiés via PISP. La responsabilité de l'établissement et les coûts de
      remboursement constituent un risque financier significatif.
    likelihood: medium
    impact: high
    mitigations:
      - Scoring comportemental des TPP pour détecter les initiations anormales
      - Processus de remboursement rapide encadré réglementairement
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-non-conformite-rapport-acpr
    title: Non-soumission dans les délais du rapport ACPR
    statement: >-
      Un dysfonctionnement du moteur de reporting ou une indisponibilité des données
      sources pourrait empêcher la soumission du rapport de disponibilité dans les
      quinze jours réglementaires. Un retard répété expose l'établissement à une
      mise en demeure.
    likelihood: low
    impact: high
    mitigations:
      - Contrôles de disponibilité des données sources déclenchés dix jours avant
        la date limite
      - Procédure de soumission manuelle de secours documentée et testée annuellement
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-consentement-orphelin
    title: Consentement actif sans session SCA valide associée
    statement: >-
      Un consentement orphelin, créé sans référence SCA valide en raison d'une
      anomalie applicative, permettrait des accès TPP non traçables vers leur
      autorisation d'origine. Ce type de donnée est difficile à détecter
      a posteriori.
    likelihood: low
    impact: medium
    mitigations:
      - Contrôle d'intégrité quotidien détectant et neutralisant les consentements orphelins
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-rupture-standard-berlin
    title: Rupture de compatibilité avec une mise à jour Berlin Group
    statement: >-
      Une nouvelle version du standard Berlin Group imposant des changements non
      rétrocompatibles pourrait nécessiter des adaptations urgentes des interfaces
      DSP2 pour éviter de bloquer les TPP ayant migré vers la nouvelle version.
    likelihood: medium
    impact: medium
    mitigations:
      - Veille active sur les groupes de travail Berlin Group avec participation
        aux consultations publiques
      - Environnement de test dédié aux nouvelles versions du standard
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-cle-hsm-compromise
    title: Compromission d'une clé cryptographique HSM
    statement: >-
      La compromission d'une clé HSM utilisée pour la signature des événements ou
      le chiffrement des consentements nécessiterait une rotation d'urgence et
      une investigation sur l'étendue de l'exposition. Sans procédure rodée, le
      délai de réaction peut être trop long.
    likelihood: low
    impact: high
    mitigations:
      - Procédure de rotation d'urgence testée semestriellement
      - Surveillance des accès HSM avec alerte immédiate sur toute anomalie
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-surcharge-agregation
    title: Surcharge du service d'agrégation AISP
    statement: >-
      Une montée en charge imprévue du nombre de TPP AISP actifs ou une campagne
      de synchronisation massive pourrait saturer le service d'agrégation, dégradant
      les temps de réponse pour l'ensemble des clients utilisant l'open banking.
    likelihood: medium
    impact: medium
    mitigations:
      - Architecture de mise à l'échelle automatique avec seuils de déclenchement
        définis et testés
      - Quotas par TPP empêchant un acteur individuel de saturer les ressources partagées
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-webhook-non-livre
    title: Événements webhook non livrés sur plusieurs heures
    statement: >-
      Une panne du notificateur ou une indisponibilité prolongée de l'URL du TPP
      pourrait entraîner l'accumulation d'événements non livrés et leur archivage
      après vingt-quatre heures, privant le TPP de notifications critiques comme
      les révocations de consentement.
    likelihood: medium
    impact: low
    mitigations:
      - API de consultation des événements manqués disponible pour les TPP
      - Alerte déclenchée lorsque la file d'attente d'un TPP dépasse mille événements
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-rgpd-transfert-donnees
    title: Transfert de données hors UE via un TPP
    statement: >-
      Un TPP établi dans un pays tiers à l'UE pourrait transférer des données
      de compte obtenues via l'API AISP vers des serveurs hors de l'Espace
      économique européen, en violation potentielle du RGPD si les garanties
      appropriées n'ont pas été vérifiées.
    likelihood: medium
    impact: high
    mitigations:
      - Vérification du siège social et des conditions générales lors de l'enregistrement
        du TPP
      - Clause contractuelle obligatoire dans les accords TPP sur la localisation
        des données
    domains: [dsp2-open-banking, referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-taux-exemption-depasse
    title: Dépassement du seuil de fraude pour l'exemption TRA
    statement: >-
      Si le taux de fraude sur les paiements PISP dépasse le seuil réglementaire
      de zéro virgule zéro un pour cent sur la fenêtre de quatre-vingt-dix jours,
      l'exemption TRA doit être suspendue et la SCA rendue obligatoire pour toutes
      les transactions concernées, dégradant l'expérience client.
    likelihood: low
    impact: high
    mitigations:
      - Tableau de bord de suivi du taux en temps réel avec alertes à 80 % du seuil
      - Protocole de bascule vers SCA systématique activable en moins de deux heures
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-sandbox-derive-production
    title: Dérive de la sandbox par rapport à la production
    statement: >-
      Si la sandbox n'est pas synchronisée avec les dernières évolutions de
      l'interface de production, les TPP valident leur intégration dans un
      environnement qui ne reflète plus le comportement réel, entraînant des
      incidents lors de la mise en production.
    likelihood: medium
    impact: medium
    mitigations:
      - Déploiement simultané des spécifications en sandbox et en production
        lors de chaque release
      - Rapport de dérive hebdomadaire comparant les schémas OpenAPI des deux
        environnements
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-violation-non-discrimination
    title: Violation du principe de non-discrimination des TPP
    statement: >-
      Un paramétrage incorrect du système de quotas ou un traitement prioritaire
      involontaire de certains TPP pourrait être qualifié de pratique discriminatoire
      par l'ACPR, exposant l'établissement à une sanction administrative.
    likelihood: low
    impact: high
    mitigations:
      - Revue trimestrielle des statistiques de performance par TPP pour détecter
        des asymétries injustifiées
      - Audit annuel des règles de quota par l'équipe conformité
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-perte-donnees-archivage
    title: Perte de données dans l'archiveur légal
    statement: >-
      Une corruption ou une perte partielle des archives de preuves SCA ou de
      consentement rendrait impossible la production de preuves en cas de contentieux
      et exposerait l'établissement à une présomption de responsabilité.
    likelihood: low
    impact: high
    mitigations:
      - Tests d'intégrité mensuels par hachage sur un échantillon statistique des
        archives
      - Réplication géographique sur deux datacenters distincts
    domains: [dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-ddsp-incident-sca-fallback-abuse
    title: Utilisation abusive du mécanisme de secours SCA
    statement: >-
      Si le mécanisme de secours SCA basé sur SMS OTP est trop facilement accessible,
      des acteurs malveillants pourraient l'exploiter comme vecteur de contournement
      de l'authentification forte principale, exposant les clients à des prises de
      contrôle de compte.
    likelihood: medium
    impact: high
    mitigations:
      - Activation du secours SMS uniquement sur détection d'une panne avérée du
        facteur principal, vérifiée automatiquement
      - Alerte RSSI immédiate lors de chaque activation du mécanisme de secours
    domains: [dsp2-open-banking]
    created_from: synthetic

