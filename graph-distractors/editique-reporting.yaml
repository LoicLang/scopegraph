  # ── Décisions ────────────────────────────────────────────────────────────────
  - type: decision
    id: dec-dedi-pdf-a-standard
    title: Adoption du format PDF/A comme standard d'archivage
    statement: >-
      Tous les documents produits par la chaîne éditique seront générés
      au format PDF/A-2b pour garantir leur lisibilité sur le long terme
      sans dépendance à des polices ou ressources externes.
    rationale: >-
      Le format PDF/A est reconnu par les normes ISO et les autorités
      judiciaires françaises comme format d'archivage légal fiable, ce
      qui simplifie la recevabilité des pièces en cas de litige.
    date: "2021-03-15"
    decided_by: Comité Architecture Éditique
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-demat-priorite-canal
    title: Priorité au canal numérique pour les nouveaux clients
    statement: >-
      Tout nouveau client ouvrant un compte à partir du 1er janvier 2022
      sera inscrit par défaut en mode dématérialisé, avec possibilité de
      demander le papier sur démarche explicite.
    rationale: >-
      Cette approche inverse le mode de bascule par défaut et accélère
      la réduction des coûts d'impression tout en étant conforme aux
      obligations légales d'information du client.
    date: "2021-11-08"
    decided_by: Direction Retail
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-xbrl-seul-format-regulatoire
    title: XBRL comme unique format de remise réglementaire
    statement: >-
      À compter de l'exercice 2023, les états FINREP et COREP seront
      exclusivement soumis en XBRL ; les remises CSV parallèles sont
      supprimées.
    rationale: >-
      La convergence sur un seul format simplifie la chaîne de production,
      réduit les risques d'incohérence entre les deux formats et s'aligne
      sur l'exigence de l'ABE qui n'accepte plus que le XBRL.
    date: "2022-09-20"
    decided_by: Comité Reporting Prudentiel
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-archivage-internalise
    title: Internalisation de l'archivage documentaire légal
    statement: >-
      La conservation des documents à valeur probatoire sera assurée par
      une solution maison plutôt que par le prestataire tiers utilisé
      jusqu'en 2022.
    rationale: >-
      L'audit de 2021 a révélé des lacunes dans les SLA du prestataire et
      un coût élevé de sortie des données ; l'internalisation permet de
      mieux maîtriser les durées de conservation et les certifications.
    date: "2022-04-12"
    decided_by: Comité Transformation Numérique
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-bus-evenements-standard
    title: Adoption d'un bus d'événements standardisé pour l'éditique
    statement: >-
      Les échanges entre composants de la chaîne éditique passeront par
      un bus d'événements centralisé au format CloudEvents, supprimant
      les intégrations point-à-point historiques.
    rationale: >-
      La multiplication des connecteurs bilatéraux rendait la maintenance
      coûteuse et les pannes difficiles à diagnostiquer ; un bus unique
      apporte visibilité et reprise sur incident standardisée.
    date: "2023-01-30"
    decided_by: Comité Architecture SI
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-duree-conservation-10-ans
    title: Conservation des relevés sur dix ans
    statement: >-
      Les relevés de compte archivés seront conservés pendant dix ans
      à compter de la date d'émission, dépassant le minimum légal de
      cinq ans pour couvrir les risques de litiges tardifs.
    rationale: >-
      L'analyse des contentieux historiques montre que des réclamations
      clients interviennent jusqu'à huit ans après les opérations ; la
      conservation sur dix ans réduit le risque de ne pas pouvoir
      produire les pièces justificatives.
    date: "2020-06-03"
    decided_by: Direction Juridique
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-signature-eidas-avancee
    title: Recours à la signature électronique avancée pour les avenants
    statement: >-
      Les avenants à la convention de compte seront signés via un
      dispositif de signature électronique avancée eIDAS, appuyé sur
      l'authentification forte du client déjà en place.
    rationale: >-
      Le niveau avancé offre une valeur probatoire suffisante pour les
      avenants contractuels sans alourdir le parcours client comme le
      ferait une signature qualifiée.
    date: "2023-07-18"
    decided_by: Direction Juridique et Conformité
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-suppression-fax-notif
    title: Suppression du canal fax pour les notifications réglementaires
    statement: >-
      Les notifications de mise à disposition de documents aux clients
      professionnels ne sont plus envoyées par fax ; seuls le courriel
      et le push mobile sont maintenus.
    rationale: >-
      Le fax ne permettait pas de générer une preuve de diffusion
      fiable et représentait un coût d'infrastructure disproportionné
      pour un volume résiduel d'utilisateurs.
    date: "2022-02-28"
    decided_by: Direction des Opérations
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-gabarit-central
    title: Centralisation de la gestion des gabarits dans un référentiel unique
    statement: >-
      Tous les gabarits documentaires, quel que soit leur type ou leur
      canal, seront gérés dans un référentiel central unique avec
      circuit de validation commun.
    rationale: >-
      La coexistence de plusieurs référentiels de gabarits entraînait des
      divergences de mise en page et des surcoûts de maintenance ;
      la centralisation garantit la cohérence de la charte graphique.
    date: "2021-05-10"
    decided_by: Comité Architecture Éditique
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-controle-coherence-inter-etats
    title: Contrôle croisé obligatoire entre états réglementaires avant soumission
    statement: >-
      Aucun état réglementaire ne peut être soumis à l'autorité de
      supervision sans que les contrôles de cohérence inter-états aient
      été exécutés et validés par le responsable reporting.
    rationale: >-
      Suite à un incident de 2020 où des incohérences entre COREP et
      FINREP ont entraîné une demande de re-soumission par l'ACPR, un
      verrou applicatif a été décidé pour prévenir tout renouvellement.
    date: "2020-11-24"
    decided_by: Direction de la Conformité
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-frais-transparence
    title: Affichage du détail des frais sur le relevé mensuel
    statement: >-
      Le relevé mensuel de tout client présentant des frais sur la période
      inclura obligatoirement un tableau récapitulatif détaillé de
      chaque ligne de frais facturée.
    rationale: >-
      La réglementation sur la transparence tarifaire et les remontées du
      médiateur bancaire ont conduit à rendre obligatoire cet affichage
      pour améliorer la compréhension client et réduire les litiges.
    date: "2019-12-01"
    decided_by: Direction Retail et Juridique
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-batch-fenetre-nocturne
    title: Fenêtre de traitement batch limitée à quatre heures
    statement: >-
      Les traitements de production documentaire nocturne doivent se
      terminer avant 5h00 du matin pour libérer les ressources serveur
      avant les opérations de début de journée.
    rationale: >-
      Les dépassements de fenêtre batch causaient des retards en cascade
      sur l'ensemble des applications de front-office en début de matinée;
      la contrainte de 5h impose une discipline d'optimisation continue.
    date: "2022-10-05"
    decided_by: Comité Exploitation et Architecture
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-donnees-test-anonymisees
    title: Obligation d'anonymisation pour les données de test éditiques
    statement: >-
      Aucune donnée réelle de client ne peut être utilisée dans les
      environnements de test ou de recette ; seules les données produites
      par le moteur d'anonymisation sont autorisées.
    rationale: >-
      Un audit RGPD de 2021 a identifié des copies de données réelles
      dans les environnements de recette ; cette décision formalise
      l'interdiction et impose le recours à l'outil d'anonymisation.
    date: "2021-09-14"
    decided_by: DPO et Direction de la Sécurité SI
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-sla-releve-j1
    title: SLA de remise des relevés à J+1 ouvré
    statement: >-
      Les relevés mensuels doivent être disponibles dans l'espace client
      numérique ou remis en boîte aux lettres au plus tard le lendemain
      ouvré de la date d'arrêté du compte.
    rationale: >-
      L'engagement J+1 est un engagement commercial inscrit dans les
      conventions de compte et constitue un différenciateur concurrentiel
      sur le marché des particuliers.
    date: "2020-03-02"
    decided_by: Direction Retail
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-multilinguisme-frontaliers
    title: Support du multilinguisme pour les clients frontaliers
    statement: >-
      Les documents destinés aux clients résidant dans les zones
      frontalières seront proposés en français et dans la langue du
      pays voisin (allemand, luxembourgeois, catalan) selon la région.
    rationale: >-
      La proportion significative de clients frontaliers dans certaines
      agences justifie l'investissement en traduction pour améliorer
      la satisfaction et réduire les appels au service client.
    date: "2023-04-17"
    decided_by: Direction Régionale et Communication
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-echeancier-officiel-rh
    title: Mise à jour de l'échéancier réglementaire dans les 48h suivant publication
    statement: >-
      Toute modification du calendrier officiel de remise publiée par une
      autorité de supervision doit être répercutée dans le référentiel
      des échéances dans un délai maximum de quarante-huit heures.
    rationale: >-
      Un retard de mise à jour de l'échéancier avait conduit à un manqué
      de date de remise en 2019 ; le délai de 48h formalise la
      responsabilité de l'équipe reporting.
    date: "2020-01-20"
    decided_by: Responsable Reporting Réglementaire
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-api-rest-datamart
    title: Accès au datamart éditique exclusivement via API REST
    statement: >-
      Les composants de la chaîne éditique ne peuvent accéder aux données
      du datamart que par l'API REST exposée à cet effet ; les accès
      directs à la base de données sont interdits.
    rationale: >-
      L'interdiction des accès directs permet de maîtriser les évolutions
      de schéma sans impacter les consommateurs et de garantir les
      contrôles d'accès centralisés au niveau de l'API.
    date: "2023-06-22"
    decided_by: Comité Architecture Éditique
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-destruction-certification
    title: Certification de destruction pour les archives expirées
    statement: >-
      Tout effacement d'archives documentaires en fin de durée légale doit
      faire l'objet d'un procès-verbal de destruction certifié et conservé
      pendant cinq ans supplémentaires.
    rationale: >-
      L'absence de trace de destruction exposait la banque à des risques
      de contestation sur la suppression de données personnelles ; le
      PV certifié constitue une preuve d'exécution conforme au RGPD.
    date: "2022-07-11"
    decided_by: DPO et Direction Juridique
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-derogation-plafond-conseiller
    title: Plafond mensuel de dérogations par conseiller
    statement: >-
      Chaque conseiller est limité à dix dérogations tarifaires par mois
      sur les frais documentaires ; tout dépassement déclenche une
      validation obligatoire par le directeur d'agence.
    rationale: >-
      L'absence de plafond avait entraîné des usages non maîtrisés de
      dérogations dans certaines agences, avec un impact mesurable sur
      les revenus de frais ; le plafond instaure une discipline commerciale.
    date: "2023-02-08"
    decided_by: Direction Commerciale Retail
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-format-releve-csv-interne
    title: Format CSV interne pour les échanges datamart-composition
    statement: >-
      Les extractions de données du datamart vers le moteur de composition
      utilisent un format CSV délimité par pipes défini dans le standard
      interne v2, sans exception.
    rationale: >-
      La prolifération de formats d'échange internes avait causé des
      erreurs de parsing intermittentes ; la standardisation sur un seul
      format réduit les incidents de production.
    date: "2021-07-29"
    decided_by: Comité Architecture Éditique
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-chiffrement-transit
    title: Chiffrement obligatoire des flux documentaires en transit
    statement: >-
      Tous les flux transportant des données personnelles dans la chaîne
      éditique (vers les prestataires d'impression, vers le coffre-fort)
      doivent être chiffrés en transit via TLS 1.2 minimum.
    rationale: >-
      L'audit sécurité de 2020 avait relevé des flux non chiffrés entre
      la plateforme éditique et le prestataire d'impression ; la décision
      généralise le chiffrement sur l'ensemble des canaux sortants.
    date: "2020-09-07"
    decided_by: Direction de la Sécurité SI
    domains: [editique-reporting]
    created_from: synthetic

  - type: decision
    id: dec-dedi-test-regression-obligatoire
    title: Tests de régression éditique obligatoires avant tout déploiement
    statement: >-
      Aucun composant de la chaîne éditique ne peut être déployé en
      production sans que la plateforme de test de régression ait validé
      l'absence d'écart de rendu par rapport à la version précédente.
    rationale: >-
      Un déploiement non contrôlé en 2022 avait modifié le rendu du
      relevé client sans validation préalable, entraînant des réclamations
      massives ; la porte de qualité obligatoire prévient tout renouvellement.
    date: "2022-12-05"
    decided_by: Comité Qualité Éditique
    domains: [editique-reporting]
    created_from: synthetic

  # ── Contraintes ──────────────────────────────────────────────────────────────
  - type: constraint
    id: con-dedi-conservation-10-ans
    title: Conservation des relevés pendant dix ans
    statement: >-
      Les relevés de compte et documents contractuels doivent être conservés
      dans l'archiveur légal pendant une durée minimale de dix ans à compter
      de la date d'émission, conformément à la politique interne.
    source: Politique interne de conservation documentaire
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-remise-j1
    title: Délai de remise des relevés à J+1
    statement: >-
      Le relevé mensuel doit être mis à disposition du client (voie
      numérique ou postale) au plus tard le lendemain ouvré de la date
      d'arrêté du compte, sans exception pour les arrêtés de fin de mois.
    source: Convention de compte type
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-pdf-a-archivage
    title: Format PDF/A obligatoire pour l'archivage
    statement: >-
      Tout document archivé à valeur probatoire doit être au format
      PDF/A-2b pour garantir son intégrité et sa lisibilité à long terme
      sans dépendance à des ressources externes.
    source: Standard d'archivage électronique interne
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-tls-flux-externes
    title: Chiffrement TLS 1.2 minimum sur les flux documentaires externes
    statement: >-
      Tout flux transportant des documents ou données personnelles vers
      un prestataire externe ou un coffre-fort tiers doit utiliser TLS
      1.2 ou supérieur.
    source: Politique de sécurité des flux SI
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-anonymisation-recette
    title: Données de test obligatoirement anonymisées
    statement: >-
      Les environnements de test et de recette de la chaîne éditique ne
      peuvent contenir de données réelles de clients ; seules les données
      produites par le moteur d'anonymisation homologué sont autorisées.
    source: Injonction DPO 2021
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-xbrl-taxonomie-abe
    title: Conformité obligatoire à la taxonomie ABE en vigueur
    statement: >-
      Chaque instance XBRL soumise à la Banque de France doit être
      conforme à la version de taxonomie ABE officiellement en vigueur
      à la date de remise, sans exception.
    source: Règlement ABE sur le reporting prudentiel
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-fenetre-batch-5h
    title: Clôture des batchs avant 5h00
    statement: >-
      Les traitements de production documentaire nocturne doivent
      impérativement se terminer avant 5h00 du matin pour ne pas
      empiéter sur les fenêtres de traitement des applications front-office.
    source: Plan d'exploitation SI
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-integrite-archive
    title: Intégrité cryptographique des archives
    statement: >-
      Chaque document archivé doit porter un cachet électronique qualifié
      ou une empreinte SHA-256 vérifiable ; toute altération doit être
      détectable et signalée immédiatement.
    source: Standard d'archivage électronique interne
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-consentement-preuve
    title: Preuve du consentement à la dématérialisation conservée
    statement: >-
      L'accord explicite du client pour la réception électronique doit
      être enregistré avec horodatage et conservé pendant toute la durée
      de la relation client plus deux ans.
    source: Code de la consommation, art. L221-5
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-tracabilite-consultations
    title: Journalisation de toute consultation d'archive
    statement: >-
      Chaque accès à un document archivé doit être enregistré dans un
      journal d'audit immuable avec l'identité du consultant, la date
      et l'heure, conformément au RGPD.
    source: RGPD Art. 32
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-validation-iban-avant-emission
    title: Validation IBAN obligatoire avant émission
    statement: >-
      Aucun document contenant un IBAN ne peut être émis sans que la
      validité de cet IBAN (clé de contrôle, format) ait été vérifiée
      par le moteur de contrôle des données de référence.
    source: Politique qualité documentaire
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-regression-obligatoire
    title: Validation de non-régression avant déploiement
    statement: >-
      Aucun composant éditique ne peut passer en production sans résultat
      de non-régression documentaire validé par l'équipe qualité.
    source: Processus de déploiement éditique
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-detail-frais-releve
    title: Affichage obligatoire du détail des frais
    statement: >-
      Tout relevé comportant au moins une ligne de frais doit inclure
      un tableau récapitulatif détaillant chaque frais facturé sur la
      période, conformément aux obligations de transparence tarifaire.
    source: Loi Macron - transparence tarifaire bancaire
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-purge-rgpd
    title: Effacement certifié à l'expiration de la durée légale
    statement: >-
      Les documents archivés dont la durée de conservation légale est
      expirée doivent être effacés de manière certifiée avec production
      d'un procès-verbal de destruction.
    source: RGPD Art. 17 - Droit à l'effacement
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-langue-client
    title: Document dans la langue du client
    statement: >-
      Tout document destiné à un client ayant déclaré une langue préférée
      doit être produit dans cette langue dès lors qu'une traduction
      homologuée est disponible dans le référentiel.
    source: Politique de service client multilingue
    severity: low
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-echeances-maj-48h
    title: Mise à jour de l'échéancier réglementaire sous 48h
    statement: >-
      Toute modification d'un calendrier de remise publiée par une
      autorité de supervision doit être répercutée dans le référentiel
      des échéances dans les quarante-huit heures suivant la publication.
    source: Procédure de veille réglementaire
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-api-seul-acces-datamart
    title: Accès au datamart éditique exclusivement via API
    statement: >-
      Les accès directs à la base de données du datamart éditique sont
      interdits ; seule l'API REST officielle peut être utilisée par les
      composants de la chaîne.
    source: Standard d'architecture SI interne
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-plafond-derogations
    title: Plafond de dix dérogations tarifaires par conseiller et par mois
    statement: >-
      Chaque conseiller ne peut accorder plus de dix dérogations sur les
      frais documentaires par mois calendaire ; au-delà, une validation
      hiérarchique est requise.
    source: Directive commerciale DRC-2023-04
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-signature-eidas
    title: Signature électronique conforme eIDAS avancée
    statement: >-
      Les avenants contractuels signés électroniquement doivent utiliser
      un dispositif de signature avancée au sens du règlement eIDAS,
      appuyé sur l'authentification forte du client.
    source: Règlement eIDAS (UE) 910/2014
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-surfi-delai-remise
    title: Délai de remise SURFI respecté au jour près
    statement: >-
      Les états SURFI doivent être soumis à la Banque de France dans
      le délai exact prescrit par la circulaire applicable, sans
      dérogation possible sauf force majeure signalée à l'autorité.
    source: Circulaire Banque de France sur le reporting statistique
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-coherence-inter-etats
    title: Contrôle de cohérence inter-états obligatoire
    statement: >-
      Aucun état réglementaire ne peut être soumis sans avoir passé
      avec succès les contrôles de cohérence entre les liasses FINREP,
      COREP et SURFI.
    source: Procédure de validation reporting prudentiel
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-format-csv-interne
    title: Format CSV interne pipes v2 pour les échanges datamart-composition
    statement: >-
      Les fichiers d'extraction du datamart vers le moteur de composition
      respectent strictement le format CSV délimité par pipes défini dans
      le standard interne v2 ; tout autre format est rejeté à la réception.
    source: Standard d'échange éditique interne v2
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-supervision-temps-reel
    title: Supervision en temps réel de la chaîne éditique
    statement: >-
      L'ensemble des composants de la chaîne éditique doit exposer ses
      métriques de santé au superviseur de flux en temps réel, avec
      détection de blocage sous cinq minutes.
    source: Exigences SLA exploitation éditique
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-log-evenements-5-ans
    title: Conservation des logs d'événements documentaires pendant cinq ans
    statement: >-
      Le bus d'événements documentaires doit conserver l'historique de
      tous les événements publiés pendant cinq ans pour permettre la
      reconstitution de toute séquence de traitement à des fins d'audit.
    source: Charte d'audit interne SI
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-pilotage-sla-mensuel
    title: Rapport de performance SLA documentaire mensuel obligatoire
    statement: >-
      Un rapport de performance des SLA documentaires doit être produit
      automatiquement en fin de mois et distribué aux responsables
      métier et exploitation.
    source: Contrat de service interne DSI-Métier
    severity: low
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-npai-traitement-48h
    title: Traitement des NPAI sous quarante-huit heures ouvrées
    statement: >-
      Les retours NPAI signalés par le prestataire postal doivent être
      traités (mise en suspens du document, notification du gestionnaire)
      dans un délai maximum de quarante-huit heures ouvrées.
    source: Procédure qualité courrier client
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-circuit-validation-modele
    title: Circuit de validation métier-juridique pour tout nouveau modèle
    statement: >-
      La mise en production d'un nouveau modèle documentaire ou d'une
      modification significative requiert l'approbation formelle des
      équipes juridique et conformité dans le circuit de validation.
    source: Procédure de gouvernance documentaire
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-disponibilite-archiveur
    title: Disponibilité de l'archiveur légal à 99,9 %
    statement: >-
      L'archiveur légal de documents doit respecter un taux de
      disponibilité mensuel de 99,9 % pour garantir la continuité du
      dépôt et de la consultation des documents à valeur probatoire.
    source: Plan de continuité d'activité
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-habilitations-principe-moindre-privilege
    title: Principe du moindre privilège pour l'accès aux archives
    statement: >-
      Les droits d'accès aux fonds documentaires archivés sont accordés
      selon le principe du moindre privilège : chaque utilisateur ne
      dispose que des droits strictement nécessaires à ses fonctions.
    source: Politique de sécurité du SI
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-donnees-comptables-j1-disponibles
    title: Données comptables disponibles pour l'éditique à J+1 6h00
    statement: >-
      Le connecteur core banking doit avoir alimenté le datamart éditique
      avec les données de la veille au plus tard à 6h00 du matin pour
      permettre le démarrage des jobs de production documentaire.
    source: Plan d'exploitation SI
    severity: high
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-multilinguisme-frontaliers
    title: Support des langues frontalières documenté et validé
    statement: >-
      Les traductions utilisées dans les documents multilingues doivent
      être approuvées par un traducteur professionnel et validées par
      l'équipe juridique locale avant intégration dans le référentiel.
    source: Politique multilingue clientèle frontalière
    severity: low
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-relance-signature-48h
    title: Relance automatique de signature sous quarante-huit heures
    statement: >-
      Si un client n'a pas signé électroniquement son avenant dans les
      quarante-huit heures suivant l'envoi du lien, une relance
      automatique est déclenchée avant escalade au conseiller.
    source: Procédure de signature électronique
    severity: low
    domains: [editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dedi-accessibilite-pdf-balise
    title: Documents PDF accessibles pour les clients déficients visuels
    statement: >-
      Tout relevé ou document contractuel diffusé en version numérique
      doit être produit en PDF balisé conforme au niveau AA des critères
      WCAG 2.1 pour répondre aux obligations d'accessibilité numérique.
    source: RGAA 4.1 et loi du 11 février 2005 sur le handicap
    severity: medium
    domains: [editique-reporting]
    created_from: synthetic

  # ── Risques ──────────────────────────────────────────────────────────────────
  - type: risk
    id: risk-dedi-depassement-fenetre-batch
    title: Dépassement de la fenêtre de traitement nocturne
    statement: >-
      Une croissance non anticipée des volumes documentaires ou une
      dégradation des performances du datamart pourrait entraîner un
      dépassement de la fenêtre batch de 5h00, retardant la disponibilité
      des relevés et des applications front-office.
    likelihood: medium
    impact: high
    mitigations:
      - Alertes de dépassement de durée à J-15 % de la fenêtre
      - Plan de délestage prioritaire des lots non critiques
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-indisponibilite-coffre-fort
    title: Indisponibilité du coffre-fort numérique client
    statement: >-
      Une panne de la plateforme de dématérialisation empêcherait le
      dépôt des relevés numériques, obligeant un basculement en urgence
      vers le canal papier avec impact sur les délais et les coûts.
    likelihood: low
    impact: high
    mitigations:
      - Bascule automatique sur impression papier en cas d'indisponibilité
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-retard-remise-reglementaire
    title: Retard de remise d'un état réglementaire
    statement: >-
      Un incident sur le moteur de reporting ou un retard de livraison
      des données sources pourrait empêcher la soumission d'un état
      réglementaire dans le délai imposé, exposant la banque à une
      sanction de l'autorité de supervision.
    likelihood: low
    impact: high
    mitigations:
      - Alertes J-5 et J-2 sur les échéances critiques
      - Procédure de remise manuelle d'urgence documentée
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-regression-rendu
    title: Régression de rendu documentaire non détectée
    statement: >-
      Un déploiement mal contrôlé pourrait modifier involontairement le
      rendu visuel des relevés ou des documents contractuels, entraînant
      des réclamations client et un risque de non-conformité légale.
    likelihood: medium
    impact: medium
    mitigations:
      - Tests de régression automatisés obligatoires avant déploiement
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-donnees-personnelles-test
    title: Exposition de données personnelles en environnement de test
    statement: >-
      L'utilisation accidentelle de données réelles dans un environnement
      de recette constituerait une violation RGPD avec obligation de
      notification à la CNIL.
    likelihood: low
    impact: high
    mitigations:
      - Contrôle automatique de détection de données réelles en recette
      - Formation obligatoire des équipes sur la politique de test
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-perte-archive-integrite
    title: Compromission de l'intégrité des archives légales
    statement: >-
      Une altération non détectée d'un document archivé remettrait en
      cause sa valeur probatoire et pourrait invalider son utilisation
      dans le cadre d'une procédure judiciaire.
    likelihood: low
    impact: high
    mitigations:
      - Vérification périodique des empreintes cryptographiques sur échantillon
      - Sauvegarde redondante géographiquement distribuée
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-taux-npai-eleve
    title: Taux élevé de plis non distribuables
    statement: >-
      Un référentiel d'adresses mal maintenu peut entraîner un taux de
      NPAI significatif, avec des coûts de réexpédition et un risque que
      certains clients ne reçoivent pas leurs relevés dans les délais.
    likelihood: medium
    impact: medium
    mitigations:
      - Normalisation automatique des adresses avant impression
      - Alertes sur dépassement du seuil de NPAI par lot
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-gabarit-non-conforme
    title: Gabarit documentaire non conforme déployé en production
    statement: >-
      Un gabarit modifié sans passer par le circuit de validation
      complet pourrait contenir des erreurs juridiques ou de mise en
      page, avec un risque de réclamation client ou de sanction
      réglementaire.
    likelihood: low
    impact: high
    mitigations:
      - Blocage technique du déploiement sans approbation du circuit
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-dette-technique-gabarits
    title: Dette technique sur les anciens gabarits non migrés
    statement: >-
      Une partie des gabarits historiques n'a pas encore été migrée vers
      XSL-FO 2.0, maintenant une dépendance à des outils obsolètes
      susceptibles de ne plus être maintenus.
    likelihood: medium
    impact: medium
    mitigations:
      - Plan de migration priorisé avec inventaire des gabarits legacy
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-incoherence-inter-etats
    title: Incohérence non détectée entre états réglementaires
    statement: >-
      Un défaut dans les règles de contrôle croisé pourrait permettre
      la soumission d'états présentant des incohérences passées inaperçues,
      exposant la banque à une demande de re-soumission ou à une remarque
      de l'autorité de supervision.
    likelihood: low
    impact: high
    mitigations:
      - Revue annuelle des règles de contrôle par l'équipe reporting
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-dependance-prestataire-impression
    title: Dépendance à un prestataire d'impression unique
    statement: >-
      La concentration du volume d'impression sur un seul prestataire
      industriel expose la chaîne éditique à un risque de rupture de
      service en cas de panne ou de faillite du prestataire.
    likelihood: low
    impact: high
    mitigations:
      - Contrat de prestataire de secours activable sous quarante-huit heures
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-evolution-taxonomie-non-anticipee
    title: Évolution de taxonomie ABE non intégrée à temps
    statement: >-
      Une mise à jour tardive de la taxonomie ABE dans le moteur XBRL
      entraînerait la soumission d'instances non conformes, avec rejet
      par le portail de la Banque de France.
    likelihood: medium
    impact: high
    mitigations:
      - Veille réglementaire sur les publications ABE avec alerte automatique
      - Recette anticipée sur environnement miroir
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-surcharge-datamart
    title: Surcharge du datamart en période de clôture
    statement: >-
      Les clôtures de fin de trimestre concentrent les volumes de
      traitement et peuvent saturer le datamart éditique, retardant
      l'alimentation du moteur de composition et mettant en danger
      les SLA de remise.
    likelihood: medium
    impact: medium
    mitigations:
      - Partitionnement des requêtes critiques sur des plages horaires dédiées
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-consentement-perdu
    title: Perte du consentement à la dématérialisation en cas de migration
    statement: >-
      Une migration de système mal exécutée pourrait entraîner la perte
      des enregistrements de consentement, obligeant à ré-expédier en
      papier et à reconstituer les preuves.
    likelihood: low
    impact: medium
    mitigations:
      - Double archivage des consentements dans le référentiel client et l'archiveur légal
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-fuite-donnees-impression
    title: Fuite de données personnelles chez le prestataire d'impression
    statement: >-
      Le transfert de flux de données personnelles vers le prestataire
      d'impression industrielle représente un risque de violation de
      données si le prestataire est lui-même victime d'une intrusion.
    likelihood: low
    impact: high
    mitigations:
      - Chiffrement des flux transmis au prestataire
      - Audit de sécurité annuel du prestataire
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-signature-lien-expire
    title: Lien de signature électronique expiré avant action du client
    statement: >-
      Un client qui n'ouvre pas son lien de signature dans le délai de
      validité configuré se retrouve dans l'impossibilité de signer sans
      qu'un nouveau lien lui soit envoyé, bloquant l'opération.
    likelihood: medium
    impact: low
    mitigations:
      - Relance automatique à 48h avant expiration du lien
    domains: [editique-reporting]
    created_from: synthetic

  - type: risk
    id: risk-dedi-volumetrie-croissance-demat
    title: Croissance non anticipée des volumes de dématérialisation
    statement: >-
      Le succès de la campagne de bascule numérique pourrait entraîner
      une augmentation rapide des volumes stockés dans le coffre-fort,
      dépassant les capacités prévues et nécessitant une extension non
      budgétée.
    likelihood: medium
    impact: medium
    mitigations:
      - Révision trimestrielle des prévisions de capacité coffre-fort
    domains: [editique-reporting]
    created_from: synthetic

