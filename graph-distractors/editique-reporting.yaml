nodes:

  # ── Système 1 : Moteur de composition documentaire ──────────────────────────
  - type: system
    id: sys-dedi-moteur-composition
    name: Moteur de Composition Documentaire
    description: >-
      Assemble les relevés de compte, avis d'opérations et documents
      contractuels à partir de gabarits paramétrables. Orchestre la
      fusion données-modèle et délègue le rendu final aux chaînes
      d'impression ou de dématérialisation.
    owner_team: Équipe Éditique Cœur
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-fusion-gabarit
    name: Fusion données-gabarit
    description: >-
      Injecte les variables métier issues du datamart dans les gabarits
      XSL-FO pour produire un flux PDF/A prêt à l'impression ou
      à l'archivage numérique.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-gestion-gabarits
    name: Gestion du référentiel de gabarits
    description: >-
      Permet aux équipes métier de versionner, tester et déployer les
      gabarits sans intervention de la DSI, grâce à un studio de
      paramétrage intégré avec prévisualisation instantanée.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-ordonnancement-lots
    name: Ordonnancement des lots documentaires
    description: >-
      Planifie et séquence les jobs de production documentaire selon les
      priorités réglementaires et les fenêtres de traitement batch,
      avec reprise sur incident automatique.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-suivi-production
    name: Suivi de production éditique
    description: >-
      Expose un tableau de bord temps réel indiquant l'avancement des lots,
      le nombre de documents générés et les éventuels rejets avec leur
      code d'erreur.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-rejets-retraitement
    name: Retraitement des rejets documentaires
    description: >-
      Isole les enregistrements en erreur, notifie l'équipe fonctionnelle
      et propose un circuit de correction manuelle avant relance partielle
      du lot concerné.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 2 : Plateforme de dématérialisation client ──────────────────────
  - type: system
    id: sys-dedi-demat-client
    name: Plateforme de Dématérialisation Client
    description: >-
      Met à disposition des clients les documents contractuels et relevés
      dans leur espace numérique personnel. Gère le consentement au
      sans-papier, l'horodatage et la notification multicanale.
    owner_team: Équipe Canaux Numériques
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-depot-coffre-fort
    name: Dépôt en coffre-fort numérique
    description: >-
      Transfère chaque document produit vers le coffre-fort numérique du
      client via une API sécurisée, en s'assurant de l'intégrité par
      empreinte cryptographique avant confirmation de dépôt.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-notification-disponibilite
    name: Notification de disponibilité documentaire
    description: >-
      Envoie une alerte par courriel ou push mobile au client dès qu'un
      nouveau document est disponible dans son espace, avec lien de
      téléchargement sécurisé à durée limitée.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-gestion-consentement
    name: Gestion du consentement sans-papier
    description: >-
      Enregistre et horodate l'accord du client pour la réception
      électronique exclusive, et gère les rétractations dans les délais
      légaux applicables.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-telechargement-client
    name: Téléchargement client en libre-service
    description: >-
      Offre une interface de consultation et de téléchargement des
      documents archivés sur dix ans, avec filtres par type de document
      et période.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 3 : Moteur de reporting réglementaire ───────────────────────────
  - type: system
    id: sys-dedi-reporting-reglementaire
    name: Moteur de Reporting Réglementaire
    description: >-
      Produit et soumet les déclarations prudentielles et statistiques
      obligatoires (SURFI, FINREP, COREP) à partir du référentiel
      comptable et des données de risque. Assure la traçabilité complète
      de chaque envoi.
    owner_team: Équipe Reporting Prudentiel
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-collecte-donnees-surfi
    name: Collecte des données SURFI
    description: >-
      Interroge les systèmes comptables et les référentiels d'encours pour
      alimenter les tableaux SURFI, en appliquant les règles de retraitement
      définies par la réglementation Banque de France.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-controles-coherence
    name: Contrôles de cohérence des états réglementaires
    description: >-
      Exécute une batterie de contrôles croisés entre les différentes
      liasses (FINREP, COREP, SURFI) avant validation définitive pour
      détecter les écarts inter-états supérieurs aux seuils tolérés.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-soumission-autorite
    name: Soumission aux autorités de supervision
    description: >-
      Transmet les états validés au portail de la Banque de France et à
      l'ACPR via les protocoles d'échange officiels, et conserve les
      accusés de réception pour chaque dépôt.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-suivi-echeances
    name: Suivi du calendrier des échéances réglementaires
    description: >-
      Maintient un calendrier partagé des dates de remise avec alertes
      automatiques aux responsables dès que l'horizon d'échéance approche
      à moins de cinq jours ouvrés.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-historique-remises
    name: Historique des remises réglementaires
    description: >-
      Conserve l'intégralité des états soumis, versions intermédiaires
      incluses, pour permettre la reconstitution de toute liasse dans le
      cadre d'un contrôle sur pièces.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 4 : Datamart éditique ───────────────────────────────────────────
  - type: system
    id: sys-dedi-datamart-editique
    name: Datamart Éditique
    description: >-
      Consolide les données de gestion nécessaires à la production
      documentaire (soldes, mouvements, informations client) dans un
      schéma en étoile optimisé pour les requêtes batch nocturnes de
      l'éditique.
    owner_team: Équipe Data Éditique
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-alimentation-datamart
    name: Alimentation nocturne du datamart
    description: >-
      Orchestre les flux ETL depuis le core banking et les référentiels
      satellites chaque nuit, avec contrôle de volumétrie et alerte en
      cas de dérive de plus de 2 % par rapport au jour précédent.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-qualite-donnees
    name: Contrôle qualité des données sources
    description: >-
      Applique des règles de validation (complétude, format, plage de
      valeurs) sur chaque flux entrant et produit un rapport quotidien
      des anomalies à destination des équipes data.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-exposition-api-data
    name: Exposition API des données éditiques
    description: >-
      Fournit une API REST interne permettant au moteur de composition
      de consulter les données consolidées sans accès direct aux systèmes
      sources, garantissant l'isolation et la performance.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-purge-donnees
    name: Purge et archivage des données historiques
    description: >-
      Déplace automatiquement les partitions de plus de sept ans vers un
      stockage froid selon la politique de conservation réglementaire,
      avec journalisation des opérations de purge.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 5 : Plateforme d'impression industrielle ────────────────────────
  - type: system
    id: sys-dedi-impression-industrielle
    name: Plateforme d'Impression Industrielle
    description: >-
      Reçoit les flux PDF/A du moteur de composition, les achemine vers
      les imprimantes industrielles partenaires et assure le suivi des
      accusations de remise jusqu'à la mise sous pli.
    owner_team: Équipe Production Papier
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-routage-impression
    name: Routage vers les centres d'impression
    description: >-
      Sélectionne le centre d'impression le plus adapté selon les volumes,
      la géographie de livraison et les contraintes de délai contractuel
      avec les prestataires.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-suivi-mise-sous-pli
    name: Suivi de mise sous pli et expédition
    description: >-
      Collecte les confirmations de mise sous pli et les numéros de
      recommandé auprès des prestataires postaux pour chaque lot, et
      les restitue dans le tableau de bord production.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-retours-npai
    name: Traitement des retours NPAI
    description: >-
      Identifie les plis retournés pour cause d'adresse incorrecte,
      déclenche une mise en suspens du document et notifie le
      gestionnaire de compte pour mise à jour de la fiche client.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 6 : Référentiel des modèles de documents ────────────────────────
  - type: system
    id: sys-dedi-referentiel-modeles
    name: Référentiel des Modèles de Documents
    description: >-
      Centralise et versionne l'ensemble des modèles documentaires
      réglementaires et commerciaux. Assure la gouvernance des mises à
      jour avec circuit de validation métier-juridique avant mise en
      production.
    owner_team: Équipe Gouvernance Documentaire
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-versionnage-modeles
    name: Versionnage des modèles documentaires
    description: >-
      Gère l'historique complet des versions de chaque modèle, avec
      comparaison visuelle entre deux révisions et possibilité de
      restauration en un clic.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-circuit-validation-modeles
    name: Circuit de validation des modèles
    description: >-
      Soumet tout nouveau modèle ou modification à une chaîne d'approbation
      impliquant les équipes juridique, conformité et communication avant
      publication effective.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-catalogue-modeles
    name: Catalogue des modèles actifs
    description: >-
      Expose un catalogue consultable listant tous les modèles en
      production avec leurs métadonnées (famille de document, langue,
      canal de diffusion, date de dernière révision).
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 7 : Portail de reporting interne ────────────────────────────────
  - type: system
    id: sys-dedi-portail-reporting-interne
    name: Portail de Reporting Interne
    description: >-
      Agrège les indicateurs de production éditique et de qualité de
      données pour les équipes de pilotage. Génère les tableaux de bord
      hebdomadaires et les rapports d'activité mensuels à destination
      du COMEX.
    owner_team: Équipe Pilotage SI
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-tableau-bord-kpi
    name: Tableau de bord KPI éditique
    description: >-
      Restitue en temps différé les volumes de documents produits, les
      taux de rejet et les délais de remise pour chaque famille
      documentaire, avec drill-down jusqu'au lot.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-rapport-mensuel-comex
    name: Rapport mensuel COMEX
    description: >-
      Consolide automatiquement les métriques du mois écoulé dans un
      modèle de rapport standardisé, prêt à être intégré au pack de
      gestion du comité exécutif.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-alertes-anomalies-kpi
    name: Alertes sur anomalies de KPI
    description: >-
      Détecte les dépassements de seuil sur les indicateurs clés et
      notifie par courriel les responsables concernés avec un lien direct
      vers l'écran de diagnostic.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 8 : Archiveur légal de documents ────────────────────────────────
  - type: system
    id: sys-dedi-archiveur-legal
    name: Archiveur Légal de Documents
    description: >-
      Assure la conservation pérenne des documents à valeur probatoire
      (relevés, conventions de compte, arrêtés de crédit) selon les
      durées légales applicables et les exigences d'intégrité numérique.
    owner_team: Équipe Archivage Légal
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-scellement-documents
    name: Scellement cryptographique des documents
    description: >-
      Appose un cachet électronique qualifié sur chaque document archivé
      afin de garantir son intégrité et son authenticité sur toute la
      durée de conservation légale.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-recherche-documents-archives
    name: Recherche dans les archives légales
    description: >-
      Permet aux équipes internes et aux auditeurs d'interroger le fonds
      documentaire par critères multiples (client, type de document,
      période) avec restitution sous vingt secondes.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-destruction-controlee
    name: Destruction contrôlée en fin de durée légale
    description: >-
      Déclenche le processus d'effacement certifié des documents dont la
      durée de conservation est expirée, en produisant un procès-verbal
      de destruction opposable.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 9 : Bus d'événements documentaires ──────────────────────────────
  - type: system
    id: sys-dedi-bus-evenements-doc
    name: Bus d'Événements Documentaires
    description: >-
      Centralise la publication et la souscription des événements liés au
      cycle de vie des documents (produit, déposé, consulté, téléchargé).
      Permet le découplage entre producteurs et consommateurs de documents.
    owner_team: Équipe Intégration Éditique
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-publication-evenements
    name: Publication d'événements documentaires
    description: >-
      Expose une API de publication permettant aux systèmes producteurs
      d'émettre des événements structurés dès qu'un document change
      d'état dans son cycle de vie.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-souscription-evenements
    name: Souscription et filtrage d'événements
    description: >-
      Permet aux systèmes consommateurs de s'abonner à des flux
      d'événements filtrés par type de document ou par client, avec
      garantie de livraison et rejeu en cas de panne.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-audit-trail-evenements
    name: Piste d'audit des événements documentaires
    description: >-
      Conserve l'historique immuable de tous les événements publiés
      pendant cinq ans, consultable par les auditeurs internes et
      externes pour reconstituer toute séquence de traitement.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 10 : Moteur de traduction réglementaire ─────────────────────────
  - type: system
    id: sys-dedi-traduction-reglementaire
    name: Moteur de Traduction Réglementaire
    description: >-
      Traduit les états comptables bruts en liasses réglementaires
      normées (XBRL, CSV réglementaire) à partir d'un référentiel de
      règles de mapping maintenu par l'équipe conformité.
    owner_team: Équipe Conformité Prudentielle
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-mapping-comptable
    name: Mapping comptable vers liasses réglementaires
    description: >-
      Applique les tables de correspondance plan comptable / axes
      réglementaires pour convertir les soldes comptables en cellules
      des états FINREP et COREP.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-generation-xbrl
    name: Génération des instances XBRL
    description: >-
      Produit les fichiers XBRL conformes aux taxonomies publiées par
      l'ABE à partir des données mappées, en validant syntaxiquement
      chaque instance avant transmission.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-validation-taxonomie
    name: Validation par rapport à la taxonomie
    description: >-
      Contrôle la conformité de chaque instance XBRL générée face à la
      version de taxonomie en vigueur et journalise tout écart pour
      correction avant soumission.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 11 : Gestionnaire de canaux de diffusion ────────────────────────
  - type: system
    id: sys-dedi-gestionnaire-canaux
    name: Gestionnaire de Canaux de Diffusion
    description: >-
      Orchestre la diffusion multicanale des documents (impression,
      coffre-fort, courriel sécurisé) en appliquant les préférences
      client et les règles métier de priorisation de canal.
    owner_team: Équipe Canaux Numériques
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-selection-canal
    name: Sélection du canal de diffusion
    description: >-
      Détermine pour chaque document et chaque client le canal cible
      (numérique ou papier) en consultant le référentiel de préférences
      et les règles de bascule par type de document.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-bascule-papier-numerique
    name: Bascule papier-numérique
    description: >-
      Gère la transition d'un client du mode papier vers le mode
      numérique en synchronisant son consentement entre le référentiel
      client et les systèmes de diffusion.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-preuve-diffusion
    name: Preuve de diffusion
    description: >-
      Enregistre pour chaque document diffusé la date, le canal utilisé
      et le résultat de la diffusion (succès, échec, accusé de lecture)
      pour constituer une trace opposable.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 12 : Plateforme de simulation éditique ──────────────────────────
  - type: system
    id: sys-dedi-simulation-editique
    name: Plateforme de Simulation Éditique
    description: >-
      Permet aux équipes métier de prévisualiser le rendu d'un modèle
      avec des données de jeu d'essai avant mise en production, en
      reproduisant fidèlement les conditions de production réelle.
    owner_team: Équipe Éditique Cœur
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-jeux-essai
    name: Gestion des jeux d'essai
    description: >-
      Fournit un catalogue de jeux de données anonymisées couvrant les
      cas nominaux et les cas limites pour tester les gabarits avant
      validation.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-previsualisation-rendu
    name: Prévisualisation du rendu documentaire
    description: >-
      Génère en quelques secondes un aperçu PDF fidèle du document final
      à partir des gabarits candidats et du jeu d'essai sélectionné.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 13 : Référentiel des échéances réglementaires ───────────────────
  - type: system
    id: sys-dedi-echeancier-reglementaire
    name: Référentiel des Échéances Réglementaires
    description: >-
      Maintient le calendrier officiel des obligations déclaratives
      envers la Banque de France, l'ACPR et les autres autorités, et
      alimente le moteur de suivi des échéances.
    owner_team: Équipe Reporting Prudentiel
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-saisie-echeances
    name: Saisie et mise à jour des échéances
    description: >-
      Permet aux responsables conformité de saisir et de mettre à jour
      les dates officielles de remise dès publication des circulaires
      réglementaires.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-alertes-echeances
    name: Alertes proactives sur les échéances
    description: >-
      Envoie des notifications graduées (J-10, J-5, J-2) aux équipes
      chargées de la production des états pour éviter tout dépassement
      de délai.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 14 : Moteur de contrôle des données de référence ────────────────
  - type: system
    id: sys-dedi-controle-donnees-ref
    name: Moteur de Contrôle des Données de Référence
    description: >-
      Valide en amont de la production documentaire la cohérence des
      données de référence (coordonnées client, libellés de produits,
      codes IBAN) pour prévenir les erreurs dans les documents émis.
    owner_team: Équipe Data Éditique
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-validation-iban
    name: Validation des IBAN dans les documents
    description: >-
      Vérifie la conformité de chaque IBAN présent dans un document
      (clé de contrôle, format pays) avant injection dans le gabarit,
      et bloque la production si un IBAN est invalide.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-normalisation-adresses
    name: Normalisation des adresses postales
    description: >-
      Applique les règles de formatage La Poste sur les adresses
      destinataires avant impression pour optimiser le taux de
      distribution et réduire les NPAI.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-reconciliation-client
    name: Réconciliation avec le référentiel client
    description: >-
      Croise les données éditiques avec le référentiel client central
      pour détecter les divergences de nom, d'adresse ou de statut
      avant émission du document.
    domains: [editique-reporting]
    created_from: synthetic

  # ── Système 15 : Plateforme de signature électronique documentaire ───────────
  - type: system
    id: sys-dedi-signature-electronique
    name: Plateforme de Signature Électronique Documentaire
    description: >-
      Gère la signature électronique des documents contractuels émis par
      la banque (conventions, avenants) selon le cadre eIDAS, en
      intégrant l'authentification forte du signataire.
    owner_team: Équipe Canaux Numériques
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-preparation-signature
    name: Préparation du dossier à signer
    description: >-
      Assemble le document final, lui appose les zones de signature
      visuelles et génère un lien de signature sécurisé transmis au
      client via son canal préféré.
    domains: [editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dedi-suivi-signature
