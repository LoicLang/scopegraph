nodes:

  # ── Système 1 : Plateforme de déclarations de soupçon ──────────────────────
  - type: system
    id: sys-dlcb-plateforme-ds
    name: Plateforme de Déclarations de Soupçon
    description: >-
      Gère le cycle de vie complet des déclarations de soupçon (DS) transmises
      à TRACFIN. Centralise la saisie, la validation interne et l'envoi
      électronique via le portail réglementaire, avec traçabilité intégrale.
    owner_team: Équipe Conformité LCB-FT
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-saisie-ds
    name: Saisie et rédaction de déclaration de soupçon
    description: >-
      Permet aux analystes de rédiger une DS à partir d'un dossier d'alerte,
      en guidant la structuration des faits suspects selon le format attendu
      par l'autorité compétente.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-validation-ds
    name: Circuit de validation interne des DS
    description: >-
      Soumet chaque déclaration rédigée à une chaîne de validation hiérarchique
      (analyste senior puis RCCI) avant transmission. Tout rejet est motivé et
      archivé pour audit.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-transmission-tracfin
    name: Transmission électronique vers TRACFIN
    description: >-
      Assure l'envoi sécurisé des DS validées au portail ERMES de TRACFIN et
      conserve l'accusé de réception horodaté comme preuve de dépôt.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-archivage-ds
    name: Archivage réglementaire des DS
    description: >-
      Conserve l'intégralité des DS et de leur historique de validation pendant
      cinq ans dans un espace de stockage scellé et auditable.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 2 : Moteur de cartographie des risques LCB-FT ──────────────────
  - type: system
    id: sys-dlcb-carto-risques
    name: Moteur de Cartographie des Risques LCB-FT
    description: >-
      Produit la cartographie annuelle des risques de blanchiment et de
      financement du terrorisme. Agrège les données opérationnelles, les
      incidents et les évolutions réglementaires pour alimenter le rapport
      ACPR.
    owner_team: Équipe Risques Conformité
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-collecte-indicateurs
    name: Collecte des indicateurs de risque
    description: >-
      Interroge les systèmes sources (portefeuille client, transactions,
      alertes) pour consolider les indicateurs quantitatifs entrant dans la
      cartographie semestrielle.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-scoring-risque-pays
    name: Scoring de risque pays
    description: >-
      Attribue un niveau de risque aux pays de contrepartie d'après une
      taxonomie interne alignée sur les listes GAFI et UE. Le score influence
      le niveau de vigilance appliqué aux opérations transfrontières.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-rapport-carto
    name: Génération du rapport de cartographie
    description: >-
      Produit automatiquement le document de cartographie annuel au format
      requis par l'ACPR, en agrégeant les scores de risque par segment client
      et par canal d'entrée en relation.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-mise-a-jour-taxonomie
    name: Mise à jour de la taxonomie de risque
    description: >-
      Permet aux équipes conformité de réviser les pondérations et les critères
      de la taxonomie sans déploiement technique, via une interface d'édition
      paramétrée et versionnée.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 3 : Surveillance des Personnes Politiquement Exposées ───────────
  - type: system
    id: sys-dlcb-surveillance-ppe
    name: Système de Surveillance des PPE
    description: >-
      Identifie et surveille en continu les clients qualifiés de Personnes
      Politiquement Exposées. Consolide les données issues de sources tierces
      et internes pour déclencher des revues renforcées à fréquence imposée.
    owner_team: Équipe Connaissance Client
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-identification-ppe
    name: Identification des PPE à l'entrée en relation
    description: >-
      Croise les données déclaratives du client avec les référentiels de PPE
      lors de l'ouverture de compte. Un match positif déclenche le statut de
      vigilance renforcée et bloque l'onboarding automatique.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-revue-periodique-ppe
    name: Revue périodique des dossiers PPE
    description: >-
      Programme et suit les revues annuelles (ou ad hoc) des dossiers PPE.
      Chaque revue documente l'origine du patrimoine, la nature des mandats
      et la conformité des opérations observées.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-alerte-changement-statut
    name: Alertes sur changement de statut PPE
    description: >-
      Génère une notification interne dès qu'un flux tiers signale un
      changement de fonction ou de statut d'exposition pour un client
      existant, afin de réévaluer le niveau de vigilance applicable.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 4 : Plateforme de gel des avoirs ────────────────────────────────
  - type: system
    id: sys-dlcb-gel-avoirs
    name: Plateforme de Gel des Avoirs
    description: >-
      Exécute et documente les mesures de gel d'avoirs ordonnées par arrêté
      ministériel ou règlement européen. Bloque les flux financiers concernés
      et notifie les autorités dans le délai réglementaire.
    owner_team: Équipe Sanctions et Gel
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-chargement-listes-gel
    name: Chargement et réconciliation des listes de gel
    description: >-
      Importe quotidiennement les listes officielles de gel (OFAC, UE, DGTRESOR)
      et les réconcilie avec le référentiel client pour détecter toute nouvelle
      correspondance dans un délai contrôlé.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-blocage-flux
    name: Blocage automatique des flux vers personnes gelées
    description: >-
      Intercepte en temps réel les ordres de paiement dont le bénéficiaire ou
      le donneur d'ordre figure sur une liste de gel active, et les suspend
      pour traitement manuel par l'équipe dédiée.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-notification-autorites
    name: Notification réglementaire des mesures de gel
    description: >-
      Génère et transmet la notification formelle à la DGTRESOR dans les
      quarante-huit heures suivant l'exécution d'une mesure de gel, avec
      accusé de réception archivé.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-degel-procedure
    name: Procédure de dégel et levée de restriction
    description: >-
      Orchestre la levée d'une mesure de gel lorsque l'arrêté correspondant est
      abrogé ou que la personne est retirée de la liste, en rétablissant les
      accès aux comptes et en archivant la décision.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 5 : Moteur de détection des opérations atypiques ───────────────
  - type: system
    id: sys-dlcb-detection-atypiques
    name: Moteur de Détection des Opérations Atypiques
    description: >-
      Analyse les flux transactionnels pour repérer des schémas inhabituels
      (smurfing, structuration, virements en boucle) à l'aide de règles
      métier et de modèles comportementaux. Alimente la file de travail des
      analystes LCB-FT.
    owner_team: Équipe Détection LCB-FT
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-regles-comportementales
    name: Moteur de règles comportementales
    description: >-
      Évalue chaque transaction contre un catalogue de règles paramétrées
      (seuils, fréquences, géographies) et produit un score d'atypicité
      utilisé pour prioriser les alertes.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-detection-smurfing
    name: Détection du smurfing et de la structuration
    description: >-
      Repère les séquences de versements fractionnés en dessous des seuils de
      déclaration, en agrégeant les opérations sur glissement de période pour
      identifier les schémas de fractionnement intentionnel.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-analyse-reseau
    name: Analyse réseau des flux de fonds
    description: >-
      Construit un graphe de relations entre entités (comptes, contreparties,
      bénéficiaires) et détecte les clusters suspects de transferts circulaires
      ou concentrés sur un nœud intermédiaire.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-priorisation-alertes
    name: Priorisation et routage des alertes
    description: >-
      Classe les alertes générées selon leur score de gravité et les affecte
      automatiquement à la file de travail de l'analyste compétent selon les
      règles de routage configurées.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 6 : Portail de formation conformité ─────────────────────────────
  - type: system
    id: sys-dlcb-formation-conformite
    name: Portail de Formation Conformité LCB-FT
    description: >-
      Plateforme e-learning interne dédiée aux formations obligatoires LCB-FT.
      Trace les complétions de parcours, gère les attestations et produit les
      rapports d'avancement requis par la réglementation.
    owner_team: Équipe Formation Réglementaire
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-parcours-lcb-ft
    name: Parcours de formation LCB-FT obligatoire
    description: >-
      Propose un curriculum structuré couvrant la réglementation LCB-FT,
      les typologies de blanchiment et les procédures internes, avec évaluation
      certificative en fin de module.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-suivi-completions
    name: Suivi des complétions et relances automatiques
    description: >-
      Enregistre l'avancement de chaque collaborateur et déclenche des
      rappels automatisés auprès des salariés dont la formation est échue
      ou incomplète, avec escalade au manager.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-attestations
    name: Génération des attestations de formation
    description: >-
      Émet une attestation PDF horodatée pour chaque module réussi, permettant
      de justifier la conformité de la politique de formation lors d'un contrôle
      ACPR.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 7 : Référentiel des bénéficiaires effectifs ────────────────────
  - type: system
    id: sys-dlcb-ref-benef-effectifs
    name: Référentiel des Bénéficiaires Effectifs
    description: >-
      Stocke et maintient la chaîne de détention des structures juridiques
      clientes afin d'identifier les bénéficiaires effectifs au sens de la
      directive anti-blanchiment. Supporte les mises à jour déclenchées par
      des événements capitalistiques.
    owner_team: Équipe KYC Entreprises
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-saisie-actionnariat
    name: Saisie de la structure d'actionnariat
    description: >-
      Permet de décrire la chaîne de détention en renseignant chaque niveau
      d'entité intermédiaire, jusqu'à atteindre les personnes physiques
      détenant plus de vingt-cinq pour cent du capital ou des droits de vote.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-calcul-detention
    name: Calcul automatisé du seuil de détention
    description: >-
      Agrège les participations directes et indirectes pour calculer le
      pourcentage de détention effectif de chaque personne physique et
      détermine si le seuil réglementaire d'identification est atteint.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-mise-a-jour-evenements
    name: Mise à jour sur événements capitalistiques
    description: >-
      Déclenche automatiquement une demande de mise à jour du dossier de
      bénéficiaire effectif lors d'une cession de parts, d'une fusion ou d'une
      modification des statuts signalée par une source externe.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 8 : Moteur de due diligence renforcée ──────────────────────────
  - type: system
    id: sys-dlcb-due-diligence
    name: Moteur de Due Diligence Renforcée
    description: >-
      Orchestre les processus de vigilance renforcée pour les clients à risque
      élevé (PPE, pays tiers, secteurs sensibles). Collecte les pièces
      justificatives, pilote les validations et archive les conclusions.
    owner_team: Équipe Connaissance Client
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-collecte-justificatifs
    name: Collecte numérique des justificatifs EDD
    description: >-
      Permet au client ou à la banque d'alimenter un dossier de due diligence
      avec les documents requis (justificatifs de revenus, origine de patrimoine,
      actes notariés) dans un espace sécurisé et horodaté.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-validation-edd
    name: Workflow de validation EDD
    description: >-
      Fait circuler le dossier EDD entre analyste junior, analyste senior et
      RCCI pour validation séquentielle ; chaque étape est contrainte par un
      délai maximum et génère un enregistrement d'audit.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-scoring-edd
    name: Calcul du score de risque EDD
    description: >-
      Agrège les éléments du dossier (pays, secteur, structure juridique,
      antécédents d'alertes) pour produire un score de risque résiduel guidant
      la décision d'acceptation ou de refus d'entrée en relation.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 9 : Tableau de bord réglementaire LCB-FT ───────────────────────
  - type: system
    id: sys-dlcb-tableau-bord-reglementaire
    name: Tableau de Bord Réglementaire LCB-FT
    description: >-
      Consolide les indicateurs clés de la conformité LCB-FT (taux de
      clôture des alertes, délais de déclaration, couverture de formation)
      à destination du RCCI et du Conseil d'Administration.
    owner_team: Équipe Pilotage Conformité
    domains: [lcb-ft, editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-kpi-alertes
    name: Tableau de KPI des alertes LCB-FT
    description: >-
      Affiche en temps quasi réel le volume d'alertes ouvertes, les délais
      moyens de traitement et le taux de conversion en déclaration de soupçon,
      par équipe et par canal transactionnel.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-rapport-acpr
    name: Rapport de reporting ACPR
    description: >-
      Génère les données statistiques exigées dans le rapport annuel de contrôle
      interne transmis à l'ACPR, en agrégeant les indicateurs LCB-FT sur la
      période de référence.
    domains: [lcb-ft, editique-reporting]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-suivi-plans-action
    name: Suivi des plans d'action conformité
    description: >-
      Recense et pilote les actions correctives issues des contrôles internes
      et des recommandations ACPR, avec des jalons, des responsables et un
      état d'avancement actualisé.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 10 : Moteur de profilage comportemental ────────────────────────
  - type: system
    id: sys-dlcb-profilage-comportemental
    name: Moteur de Profilage Comportemental Client
    description: >-
      Construit et met à jour en continu le profil transactionnel de chaque
      client pour détecter les déviances par rapport au comportement habituel.
      Alimente le moteur de détection des opérations atypiques en scores de
      déviance normalisés.
    owner_team: Équipe Modélisation LCB-FT
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-construction-profil
    name: Construction du profil transactionnel
    description: >-
      Agrège l'historique des transactions sur une fenêtre glissante pour
      établir les habitudes de dépenses, les montants typiques et les
      contreparties récurrentes propres à chaque client.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-retraining-modeles
    name: Réentraînement périodique des modèles de profilage
    description: >-
      Planifie et exécute le réentraînement mensuel des modèles de profilage
      à partir des nouvelles données transactionnelles validées, avec rapport
      de dérive et validation par l'équipe modèles.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 11 : Gestionnaire de cas d'investigation ───────────────────────
  - type: system
    id: sys-dlcb-gestion-cas
    name: Gestionnaire de Cas d'Investigation LCB-FT
    description: >-
      Centralise les cas d'investigation ouverts à partir des alertes LCB-FT.
      Permet aux analystes de documenter leurs diligences, de joindre des
      pièces et de conclure chaque cas avec une décision motivée et traçable.
    owner_team: Équipe Investigation LCB-FT
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-ouverture-cas
    name: Ouverture automatique de cas depuis une alerte
    description: >-
      Crée un dossier d'investigation pré-rempli à partir des données de
      l'alerte (client, opérations, scores) en un clic depuis la file de
      travail, sans ressaisie manuelle.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-timeline-cas
    name: Timeline d'investigation du cas
    description: >-
      Affiche une chronologie interactive des opérations et événements
      associés au client sous investigation, permettant de repérer visuellement
      les ruptures de comportement.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-cloture-cas
    name: Clôture et motif de décision
    description: >-
      Impose la saisie d'un motif structuré lors de la clôture de chaque cas
      (faux positif, renvoi en DS, transmission interne) et archive la décision
      pour exploitation statistique.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 12 : Référentiel des listes de surveillance ─────────────────────
  - type: system
    id: sys-dlcb-listes-surveillance
    name: Référentiel des Listes de Surveillance
    description: >-
      Agrège et normalise les listes de surveillance externes (sanctions
      internationales, PPE, médias défavorables) et les listes internes de
      clients sous surveillance renforcée. Sert de source unique pour les
      criblages de l'ensemble des applications LCB-FT.
    owner_team: Équipe Données Conformité
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-import-listes-externes
    name: Import et normalisation des listes externes
    description: >-
      Récupère automatiquement les flux de listes tiers (formats XML, CSV, API)
      et les normalise selon le schéma interne avant indexation, avec rapport
      de delta quotidien.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-gestion-listes-internes
    name: Gestion des listes de surveillance internes
    description: >-
      Permet aux équipes de conformité d'ajouter, modifier ou retirer des
      entrées dans les listes de surveillance maison, avec journalisation de
      chaque modification et approbation à deux niveaux.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-api-criblage
    name: API de criblage temps réel
    description: >-
      Expose un endpoint synchrone permettant à n'importe quel système LCB-FT
      de cribler une entité (personne, société, IBAN) contre l'ensemble des
      listes actives et d'obtenir un résultat structuré en sous-cent-milliseconde.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 13 : Moteur de surveillance des virements internationaux ─────────
  - type: system
    id: sys-dlcb-surveillance-vir-intl
    name: Moteur de Surveillance des Virements Internationaux
    description: >-
      Applique des contrôles LCB-FT spécifiques aux virements transfrontières :
      vérification des mentions obligatoires, contrôle du pays de destination,
      et blocage des opérations vers des juridictions sous embargo.
    owner_team: Équipe Contrôles Internationaux
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-controle-mentions-swift
    name: Contrôle des mentions obligatoires SWIFT
    description: >-
      Vérifie la présence et la complétude des champs réglementaires imposés
      par le règlement sur les transferts de fonds (RTF) dans chaque message
      SWIFT sortant.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-blocage-pays-embargo
    name: Blocage des opérations vers pays sous embargo
    description: >-
      Intercepte les virements destinés à des pays figurant sur la liste
      d'embargo en vigueur et les suspend pour décision manuelle, en journalisant
      le motif réglementaire du blocage.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-reporting-rtf
    name: Reporting réglementaire RTF
    description: >-
      Produit les rapports périodiques relatifs au règlement sur les transferts
      de fonds, en agrégeant les volumes d'opérations contrôlées, les rejets
      et les blocages sur la période de référence.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 14 : Plateforme de gestion des tiers à risque ───────────────────
  - type: system
    id: sys-dlcb-tiers-a-risque
    name: Plateforme de Gestion des Tiers à Risque
    description: >-
      Recense et évalue les prestataires, agents et distributeurs exposant
      la banque à des risques LCB-FT tiers. Centralise les évaluations
      initiales et les réévaluations périodiques de chaque tiers.
    owner_team: Équipe Risques Tiers
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-onboarding-tiers
    name: Onboarding et évaluation initiale des tiers
    description: >-
      Collecte les informations KYB du tiers, réalise le criblage initial
      et produit une évaluation de risque documentée avant toute entrée en
      relation commerciale.
    domains: [lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dlcb-reevaluation-tiers
    name: Réévaluation périodique des tiers
    description: >-
      Programme les réévaluations selon la fréquence définie par le niveau
      de risque du tiers (annuelle pour les risques élevés, biennale pour
      les risques faibles) et alerte en cas d'échéance dépassée.
    domains: [lcb-ft]
    created_from: synthetic

  # ── Système 15 : Moteur d'analyse sémantique des alertes ────────────────────
  - type: system
    id: sys-dlcb-analyse-semantique
    name: Moteur d'Analyse Sémantique des Alertes
    description: >-
      Enrichit chaque alerte avec une analyse NLP du libellé transactionnel
      et des notes d'investigation antérieures pour proposer une classification
