  # ── Décisions ───────────────────────────────────────────────────────────────
  - type: decision
    id: dec-dlcb-api-criblage-unique
    title: API de criblage centralisée comme source unique
    statement: >-
      Tout système LCB-FT doit utiliser l'API exposée par le référentiel des
      listes de surveillance pour ses criblages. L'interrogation directe de
      listes locales est interdite.
    rationale: >-
      Éviter la divergence entre les versions de listes utilisées par les
      différents moteurs et garantir une mise à jour cohérente et synchrone.
    date: "2023-03-15"
    decided_by: Comité Architecture SI
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-ds-sous-48h
    title: Délai maximal de dépôt des DS fixé à 48 heures
    statement: >-
      Toute déclaration de soupçon validée par le RCCI doit être transmise
      à TRACFIN dans un délai maximal de quarante-huit heures ouvrées suivant
      la signature de validation.
    rationale: >-
      Répondre aux exigences de célérité formulées lors du dernier contrôle
      ACPR et réduire le risque de dépassement de délai réglementaire.
    date: "2023-06-01"
    decided_by: RCCI
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-edd-obligatoire-ppe
    title: EDD obligatoire pour tous les clients PPE dès l'entrée en relation
    statement: >-
      Tout client identifié comme PPE lors du processus d'onboarding est
      automatiquement soumis à une procédure de due diligence renforcée avant
      l'activation de son accès aux produits bancaires.
    rationale: >-
      Conformité avec la cinquième directive anti-blanchiment et alignement
      avec les recommandations GAFI relatives aux PPE.
    date: "2022-09-10"
    decided_by: Comité Conformité
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-gel-blocage-temps-reel
    title: Blocage en temps réel des flux vers personnes gelées
    statement: >-
      Les ordres de paiement impliquant une entité figurant sur une liste de
      gel active doivent être interceptés et suspendus avant exécution, sans
      exception ni mode dégradé.
    rationale: >-
      Éviter tout risque de sanction administrative liée à l'exécution
      d'une opération en faveur d'une personne désignée.
    date: "2021-11-22"
    decided_by: Comité Risques
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-profilage-fenetre-90j
    title: Fenêtre de profilage comportemental fixée à 90 jours glissants
    statement: >-
      Le profil transactionnel servant au calcul du score de déviance est
      construit sur une fenêtre glissante de quatre-vingt-dix jours. Cette
      durée est paramétrable uniquement par le modèle validé par le comité.
    rationale: >-
      Équilibre entre la réactivité aux changements récents de comportement
      et la robustesse statistique du profil sur une durée suffisante.
    date: "2023-10-05"
    decided_by: Comité Modèles LCB-FT
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-seuil-similarite-85
    title: Seuil de similarité d'identité fixé à 85 %
    statement: >-
      Le moteur de rapprochement des identités doit déclencher une alerte
      pour tout score de similarité composite supérieur ou égal à quatre-vingt-
      cinq pour cent entre une entité et une entrée de liste de surveillance.
    rationale: >-
      Calibration issue des tests A/B menés sur données historiques, visant
      à maximiser le rappel tout en maintenant le taux de faux positifs sous
      le seuil d'acceptabilité opérationnelle.
    date: "2023-07-18"
    decided_by: Comité Modèles LCB-FT
    domains: [lcb-ft]
    created_from: synthetic

  - type: decision
    id: dec-dlcb-cartographie-annuelle
    title: Mise à jour de la cartographie des risques sur cycle annuel
    statement: >-
      La cartographie des risques LCB-FT est mise à jour au minimum une fois
      par an, avant le 31 mars, pour intégrer les données de l'exercice
      précédent et les évolutions de l'environnement réglementaire.
    rationale: >-
      Respecter le calendrier de reporting exigé par l'ACPR et disposer d'une
      base de risques actualisée pour calibrer les contrôles de l'année.
    date: "2022-01-14"
    decided_by: Comité Conformité
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-formation-annuelle-obligatoire
    title: Formation LCB-FT annuelle obligatoire pour tous les collaborateurs
    statement: >-
      Chaque collaborateur de l'établissement doit compléter le module de
      formation LCB-FT de base chaque année civile. L'absence de complétion
      dans les délais est remontée au responsable hiérarchique.
    rationale: >-
      Satisfaire l'obligation réglementaire de sensibilisation et réduire
      le risque de non-détection par méconnaissance des procédures.
    date: "2021-02-08"
    decided_by: Direction des Ressources Humaines
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-score-risque-4-niveaux
    title: Échelle à quatre niveaux pour le score de risque client
    statement: >-
      Le score de risque LCB-FT des clients est exprimé sur une échelle à
      quatre niveaux (faible, modéré, élevé, très élevé). Chaque niveau
      est associé à un niveau de vigilance et à une fréquence de revue définis.
    rationale: >-
      Simplifier la prise de décision des analystes et aligner la segmentation
      interne avec les pratiques de la profession recommandées par l'ABE.
    date: "2022-05-30"
    decided_by: Comité Conformité
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-notification-gel-48h
    title: Notification des mesures de gel sous 48 heures à la DGTRESOR
    statement: >-
      Toute mesure de gel exécutée doit faire l'objet d'une notification
      formelle à la Direction générale du Trésor dans un délai de quarante-
      huit heures. Ce délai est suivi par la plateforme et son dépassement
      génère une alerte au directeur conformité.
    rationale: >-
      Conformité avec l'article R. 562-4 du code monétaire et financier
      imposant ce délai de notification.
    date: "2020-12-01"
    decided_by: Comité Juridique
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-backtesting-avant-prod
    title: Backtesting obligatoire avant mise en production d'un scénario
    statement: >-
      Aucun scénario de détection ne peut être déployé en production sans
      qu'un backtesting sur au minimum six mois de données historiques ait
      été réalisé et validé par le comité modèles.
    rationale: >-
      Prévenir la dégradation du ratio signal-bruit en production et garantir
      la maîtrise du volume d'alertes générées.
    date: "2023-04-20"
    decided_by: Comité Modèles LCB-FT
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-beeff-seuil-25pct
    title: Seuil de 25 % pour l'identification des bénéficiaires effectifs
    statement: >-
      Toute personne physique détenant directement ou indirectement vingt-
      cinq pour cent ou plus du capital ou des droits de vote d'un client
      personne morale est identifiée et documentée comme bénéficiaire effectif.
    rationale: >-
      Alignement avec les exigences de la directive anti-blanchiment et
      des recommandations GAFI sur la transparence des bénéficiaires effectifs.
    date: "2019-07-10"
    decided_by: Comité Conformité
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-revue-ppe-annuelle
    title: Revue annuelle obligatoire de tous les dossiers PPE actifs
    statement: >-
      Chaque dossier PPE actif doit faire l'objet d'une revue complète au
      minimum une fois par an. Tout dossier non révisé dans l'année génère
      une alerte d'escalade au RCCI.
    rationale: >-
      Garantir l'actualisation des données de vigilance renforcée et détecter
      au plus tôt toute évolution du profil de risque des clients PPE.
    date: "2022-03-14"
    decided_by: Comité Conformité
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-cas-investigation-72h
    title: Délai de premier traitement des cas d'investigation fixé à 72 heures
    statement: >-
      Chaque cas d'investigation ouvert doit faire l'objet d'une première
      action documentée dans les soixante-douze heures suivant son ouverture.
      L'absence d'action déclenche une escalade automatique.
    rationale: >-
      Réduire les délais de traitement des alertes et prévenir l'accumulation
      d'un backlog non traité pouvant constituer un manquement réglementaire.
    date: "2023-09-05"
    decided_by: Responsable Investigation LCB-FT
    domains: [lcb-ft]
    created_from: synthetic

  - type: decision
    id: dec-dlcb-rtf-controle-synchrone
    title: Contrôle RTF en mode synchrone sur le chemin des virements
    statement: >-
      Les vérifications imposées par le règlement sur les transferts de fonds
      sont exécutées de manière synchrone avant validation de chaque virement
      international, sans mode asynchrone ou de rattrapage.
    rationale: >-
      Garantir qu'aucun virement non conforme au RTF ne puisse être exécuté
      même en cas de délai de traitement du contrôle.
    date: "2022-11-08"
    decided_by: Comité Architecture SI
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-listes-gel-mise-a-jour-j
    title: Mise à jour des listes de gel en moins de 4 heures après publication
    statement: >-
      Lorsqu'une nouvelle liste de gel est publiée par une autorité compétente
      (DGTRESOR, UE, OFAC), le référentiel des listes doit être mis à jour
      et le criblage relancé dans un délai maximal de quatre heures.
    rationale: >-
      Minimiser la fenêtre de risque entre la désignation publique d'une
      entité et le blocage effectif des opérations la concernant.
    date: "2021-05-17"
    decided_by: Comité Risques
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-veille-reglementaire-mensuelle
    title: Revue mensuelle de veille réglementaire LCB-FT
    statement: >-
      Un point de veille réglementaire formalisé est organisé chaque mois
      par l'équipe juridique pour partager les évolutions réglementaires
      récentes et évaluer leur impact sur le dispositif en place.
    rationale: >-
      Structurer la diffusion de l'information réglementaire et réduire
      le risque de non-conformité par méconnaissance.
    date: "2023-01-10"
    decided_by: Direction Conformité
    domains: [lcb-ft]
    created_from: synthetic

  - type: decision
    id: dec-dlcb-consolidation-alertes-actif
    title: Consolidation des alertes avant ouverture de cas obligatoire
    statement: >-
      Avant l'ouverture d'un cas d'investigation, le moteur de consolidation
      doit être consulté pour vérifier l'existence d'alertes pendantes sur
      le même client et les intégrer au cas si pertinent.
    rationale: >-
      Éviter la redondance des cas ouverts pour un même risque et améliorer
      la cohérence du traitement des alertes multi-sources.
    date: "2024-02-22"
    decided_by: Responsable Investigation LCB-FT
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-tiers-risque-eleve-annuel
    title: Réévaluation annuelle obligatoire des tiers à risque élevé
    statement: >-
      Les tiers classés à risque élevé dans la plateforme de gestion des
      tiers à risque font l'objet d'une réévaluation complète chaque année.
      Un tiers non réévalué dans le délai est automatiquement suspendu.
    rationale: >-
      Garantir la mise à jour continue de l'évaluation des risques tiers
      dans un contexte réglementaire et opérationnel évolutif.
    date: "2023-11-30"
    decided_by: Comité Risques Tiers
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-profilage-retraining-mensuel
    title: Réentraînement mensuel imposé aux modèles de profilage
    statement: >-
      Les modèles de profilage comportemental sont réentraînés mensuellement
      sur données fraîches. Tout écart de performance de plus de cinq points
      par rapport au mois précédent déclenche une revue obligatoire par
      le comité modèles.
    rationale: >-
      Prévenir la dérive silencieuse des modèles qui dégraderait la qualité
      de détection sans signal d'alerte visible.
    date: "2024-01-15"
    decided_by: Comité Modèles LCB-FT
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-edd-score-seuil-70
    title: Seuil EDD de score de risque fixé à 70 sur 100
    statement: >-
      Tout client dont le score de risque EDD est supérieur ou égal à
      soixante-dix est systématiquement soumis à une procédure de due
      diligence renforcée, quelle que soit son ancienneté ou son statut.
    rationale: >-
      Calibration issue des retours du dernier contrôle ACPR demandant
      un abaissement du seuil pour élargir la couverture de la population
      à risque.
    date: "2024-04-01"
    decided_by: Comité Conformité
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  - type: decision
    id: dec-dlcb-simulation-gel-avant-exec
    title: Simulation d'impact obligatoire avant tout gel de masse
    statement: >-
      Toute mesure de gel concernant plus de cinq entités simultanément
      doit faire l'objet d'une simulation d'impact préalable validée par
      le directeur des risques avant exécution.
    rationale: >-
      Anticiper les effets opérationnels d'un gel de masse sur les systèmes
      et prévenir les situations d'indisponibilité non planifiée.
    date: "2024-06-10"
    decided_by: Direction des Risques
    domains: [lcb-ft]
    still_active: true
    created_from: synthetic

  # ── Contraintes ─────────────────────────────────────────────────────────────
  - type: constraint
    id: con-dlcb-conservation-ds-5ans
    title: Conservation des DS pendant cinq ans
    statement: >-
      Les déclarations de soupçon et l'ensemble de leur historique de validation
      doivent être conservés pendant une durée minimale de cinq ans à compter
      de la date de transmission à TRACFIN.
    source: Article L. 561-12 CMF
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-tracabilite-actions-vigilance
    title: Traçabilité intégrale des actions de vigilance
    statement: >-
      Toute action de vigilance (collecte, criblage, revue, décision) doit
      être journalisée avec horodatage, identifiant de l'opérateur et référence
      au dossier client. L'effacement de ces journaux est techniquement
      impossible.
    source: Directive UE 2015/849
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-criblage-avant-paiement
    title: Criblage obligatoire avant tout paiement vers tiers inconnu
    statement: >-
      Tout virement vers un bénéficiaire ne figurant pas encore dans le
      référentiel client doit être criblé contre les listes de sanctions actives
      avant d'être accepté. Aucune exception n'est autorisée.
    source: Règlement UE 2580/2001 et décrets nationaux gel
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-notification-gel-delai
    title: Délai de notification gel d'avoirs de 48 heures
    statement: >-
      La notification d'une mesure de gel à la DGTRESOR doit intervenir
      dans un délai de quarante-huit heures. Ce délai est imposé par la
      réglementation et son non-respect est constitutif d'une infraction.
    source: Article R. 562-4 CMF
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-ppe-vigilance-renforcee
    title: Vigilance renforcée obligatoire pour les PPE
    statement: >-
      Les clients identifiés comme PPE sont soumis sans délai à une procédure
      de vigilance renforcée incluant l'identification de l'origine des fonds.
      L'application de la vigilance standard est interdite pour ce segment.
    source: Directive UE 2015/849 art. 20
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-mise-a-jour-kyb-3ans
    title: Mise à jour KYB des personnes morales tous les trois ans
    statement: >-
      Les dossiers KYB des clients personnes morales doivent être actualisés
      au moins tous les trois ans. Pour les clients à risque élevé, la
      fréquence minimale est d'un an.
    source: Lignes directrices conjointes ACPR-AMF LCB-FT
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-mentions-rtf-obligatoires
    title: Mentions obligatoires RTF dans les virements internationaux
    statement: >-
      Tout virement international doit comporter le nom, l'adresse et le
      numéro de compte du donneur d'ordre conformément au règlement sur les
      transferts de fonds. Les messages incomplets sont rejetés automatiquement.
    source: Règlement UE 2015/847 (RTF)
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-formation-annuelle-reglementaire
    title: Formation LCB-FT annuelle imposée à tous les agents
    statement: >-
      L'article L. 561-34 du CMF impose à chaque établissement de former
      l'ensemble de son personnel aux obligations LCB-FT au moins une fois
      par an. L'absence de formation est sanctionnée par l'ACPR.
    source: Article L. 561-34 CMF
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-identification-beneficiaires-effectifs
    title: Identification des bénéficiaires effectifs obligatoire à l'entrée
    statement: >-
      Pour tout client personne morale, les bénéficiaires effectifs au-delà
      du seuil de vingt-cinq pour cent doivent être identifiés et leur identité
      vérifiée avant l'ouverture d'un compte ou la fourniture d'un service.
    source: Directive UE 2015/849 art. 13
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-rapport-acpr-annuel
    title: Rapport de contrôle interne annuel transmis à l'ACPR
    statement: >-
      L'établissement est tenu de transmettre chaque année à l'ACPR un rapport
      de contrôle interne incluant une section LCB-FT avec indicateurs
      d'activité, incidents notables et plans d'action en cours.
    source: Arrêté du 3 novembre 2014 art. 258
    severity: high
    domains: [lcb-ft, editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-gel-blocage-immediat
    title: Blocage immédiat sans délai de grâce à la désignation
    statement: >-
      Dès réception d'une liste de gel mise à jour, le blocage des avoirs
      des entités nouvellement désignées doit être opéré sans délai. Aucune
      opération de la personne désignée ne peut être exécutée après la
      publication de l'acte de désignation.
    source: Règlement UE 2016/1686 et arrêtés nationaux
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-audit-ds-opposable
    title: Audit trail des DS opposable en procédure judiciaire
    statement: >-
      L'ensemble des données relatives à une déclaration de soupçon (version,
      modifications, validations, date de transmission) doit être conservé
      de manière immuable et produire un journal opposable devant une juridiction.
    source: Recommandation GAFI n° 20
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-sla-criblage-100ms
    title: SLA du service de criblage temps réel inférieur à 100 ms
    statement: >-
      L'API de criblage doit répondre en moins de cent millisecondes au
      95e percentile pour les requêtes synchrones. Tout dépassement persistant
      déclenche une alerte de disponibilité.
    source: SLA interne Architecture Conformité
    severity: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-beeff-registre-national
    title: Cohérence avec le Registre national des bénéficiaires effectifs
    statement: >-
      Les données de bénéficiaires effectifs stockées dans le référentiel interne
      doivent être rapprochées avec le Registre national des bénéficiaires
      effectifs (RNBE) lors de chaque mise à jour dossier.
    source: Article L. 561-46 CMF
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-donnees-perso-minimisation
    title: Minimisation des données personnelles dans les systèmes LCB-FT
    statement: >-
      Les données à caractère personnel collectées dans le cadre des procédures
      LCB-FT doivent être limitées aux informations strictement nécessaires,
      conformément au principe de minimisation du RGPD.
    source: RGPD art. 5(1)(c) / CNIL délibération 2021-027
    severity: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-restriction-acces-ds
    title: Accès aux déclarations de soupçon restreint aux habilités
    statement: >-
      La consultation et la modification des déclarations de soupçon sont
      réservées aux collaborateurs expressément habilités. L'accès est journalisé
      et les tentatives non autorisées génèrent une alerte de sécurité.
    source: Article L. 561-19 CMF (confidentialité des DS)
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-rpp-revue-annuelle
    title: Revue annuelle de la politique de gestion du risque LCB-FT
    statement: >-
      La politique interne de gestion du risque LCB-FT est révisée au moins
      une fois par an et approuvée par l'organe de direction avant le 31 mars
      de chaque année.
    source: Lignes directrices conjointes ACPR-AMF LCB-FT 2019
    severity: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-gel-avoirs-perimetre-complet
    title: Périmètre de gel incluant tous les comptes et dépôts de l'entité
    statement: >-
      Une mesure de gel doit couvrir l'intégralité des avoirs de l'entité
      désignée détenus dans l'établissement, sans exception de produit ou
      de canal. Aucun compte ne peut être exclu du gel.
    source: Règlement UE 2016/1686 art. 2
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-incidents-signalement-24h
    title: Signalement interne des incidents LCB-FT majeurs sous 24 heures
    statement: >-
      Tout incident de conformité LCB-FT qualifié de sévérité haute doit être
      signalé au RCCI et enregistré dans le registre des incidents dans les
      vingt-quatre heures suivant sa détection.
    source: Charte de gestion des risques opérationnels
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-cloisonnement-donnees-cas
    title: Cloisonnement des données entre cas d'investigation distincts
    statement: >-
      Les données et documents d'un cas d'investigation ne peuvent être
      consultés que par les analystes affectés à ce cas. L'accès croisé
      entre cas sans habilitation est techniquement bloqué.
    source: Politique de sécurité des données conformité
    severity: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-virement-intl-controle-pays
    title: Contrôle systématique du pays de destination avant virement
    statement: >-
      Tout virement international déclenche une vérification automatique du
      pays de destination contre la liste des pays sous embargo et des pays
      à risque élevé. L'opération est bloquée si le pays figure sur ces listes.
    source: Décrets nationaux et règlements UE gel et embargo
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-edd-validee-rcci
    title: Toute procédure EDD validée par le RCCI avant entrée en relation
    statement: >-
      Pour les clients soumis à une EDD, l'entrée en relation ou l'activation
      d'un produit ne peut avoir lieu avant que le RCCI ou son délégué ait
      formellement validé le dossier EDD complet.
    source: Procédure interne conformité n° PROC-LCB-007
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-ppe-source-doc-trois-ans
    title: Justificatif d'origine des fonds PPE renouvelé tous les trois ans
    statement: >-
      Pour les clients PPE, le justificatif d'origine des fonds doit être
      actualisé à chaque revue annuelle et remplacé par un document daté de
      moins de trois ans pour les montants significatifs.
    source: Lignes directrices ABE sur la vigilance renforcée 2021
    severity: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-modeles-validation-comite
    title: Validation comité obligatoire avant déploiement d'un nouveau modèle
    statement: >-
      Tout nouveau modèle de profilage, de scoring ou de détection doit être
      approuvé par le comité modèles LCB-FT avant son déploiement en production.
      Les modifications de paramètres existants au-delà de seuils définis
      sont soumises à la même exigence.
    source: Charte de gouvernance des modèles LCB-FT
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-surete-modele-nlp
    title: Validation humaine obligatoire des suggestions NLP avant clôture de cas
    statement: >-
      Les suggestions de typologies produites par le moteur d'analyse sémantique
      ne peuvent pas être utilisées comme seul fondement de la décision de clôture
      d'un cas. Une validation humaine explicite est requise dans tous les cas.
    source: Politique de gouvernance des modèles IA conformité
    severity: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-interop-ermes-certifiee
    title: Interface ERMES certifiée par TRACFIN
    statement: >-
      Le connecteur d'envoi des déclarations de soupçon vers ERMES doit être
      conforme aux spécifications techniques publiées par TRACFIN et sa
      certification doit être maintenue à jour lors de chaque mise à jour
      du protocole.
    source: Spécifications techniques TRACFIN ERMES v4
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-disponibilite-criblage-99-9
    title: Disponibilité du service de criblage à 99,9 %
    statement: >-
      L'API de criblage temps réel doit afficher une disponibilité mensuelle
      d'au moins 99,9 %. Toute interruption de service doit être compensée
      par le déclenchement automatique d'un mode dégradé documenté.
    source: SLA contractuel fournisseur listes sanctions
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-historique-modifications-kyb
    title: Historique complet des modifications KYB conservé
    statement: >-
      Toute modification apportée à un dossier KYB (personne morale) est
      journalisée avec l'identité de l'opérateur et l'horodatage. L'historique
      complet des versions du dossier est conservé pendant la durée légale
      de cinq ans après la fin de la relation.
    source: Article L. 561-12 CMF
    severity: high
    domains: [lcb-ft, referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-rapport-carto-acpr-format
    title: Format ACPR respecté pour la cartographie annuelle
    statement: >-
      Le rapport de cartographie des risques LCB-FT transmis à l'ACPR doit
      respecter le format et la nomenclature définis dans le questionnaire
      annuel de l'autorité. Tout écart de format entraîne le renvoi du rapport.
    source: Questionnaire ACPR cartographie des risques LCB-FT
    severity: medium
    domains: [lcb-ft, editique-reporting]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-partage-info-interdit
    title: Interdiction de divulguer l'existence d'une DS à la personne visée
    statement: >-
      Il est interdit de divulguer à la personne faisant l'objet d'une
      déclaration de soupçon, ou à des tiers non autorisés, l'existence de
      cette déclaration ou les informations qu'elle contient (tipping-off).
    source: Article L. 561-19 CMF
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-scenario-detection-documente
    title: Documentation obligatoire de chaque scénario de détection
    statement: >-
      Chaque scénario de détection déployé en production doit disposer d'une
      fiche de documentation précisant la logique de détection, les paramètres,
      les performances mesurées et la date de dernière validation.
    source: Charte de gouvernance des modèles LCB-FT
    severity: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-drp-lcb-ft-teste
    title: Plan de reprise d'activité LCB-FT testé annuellement
    statement: >-
      Le plan de reprise d'activité couvrant les systèmes LCB-FT critiques
      (criblage, gel, déclarations) doit être testé au moins une fois par
      an et les résultats documentés transmis au RCCI.
    source: Politique de continuité d'activité
    severity: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dlcb-externalisation-encadree
    title: Toute externalisation de traitement LCB-FT encadrée par convention
    statement: >-
      Lorsqu'un traitement LCB-FT est externalisé à un prestataire, une
      convention de service incluant des clauses d'audit, de confidentialité
      et de continuité doit être signée avant toute mise en production.
    source: Lignes directrices ABE sur l'externalisation 2019
    severity: high
    domains: [lcb-ft]
    created_from: synthetic

  # ── Risques ─────────────────────────────────────────────────────────────────
  - type: risk
    id: risk-dlcb-retard-ds
    title: Retard de transmission des déclarations de soupçon à TRACFIN
    statement: >-
      Les délais de validation interne des DS, notamment lors d'absence du
      RCCI, peuvent dépasser le délai réglementaire de quarante-huit heures
      et exposer l'établissement à une sanction ACPR.
    likelihood: medium
    impact: high
    mitigations:
      - Mise en place d'un délégué RCCI avec délégation de signature permanente
      - Relances automatiques dès dépassement de vingt-quatre heures dans le circuit
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-faux-negatifs-criblage
    title: Faux négatifs de criblage par translittération insuffisante
    statement: >-
      Des variantes orthographiques de noms figurant sur des listes de
      sanctions peuvent passer à travers le moteur de rapprochement si
      le score de similarité est inférieur au seuil configuré, générant
      un faux négatif aux conséquences potentiellement graves.
    likelihood: medium
    impact: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-surcharge-alertes
    title: Surcharge des analystes par volume excessif d'alertes
    statement: >-
      Une dégradation des scénarios de détection ou un changement brutal de
      comportements peut générer un pic de volume d'alertes dépassant la
      capacité de traitement des équipes et créant un backlog réglementairement
      inacceptable.
    likelihood: medium
    impact: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-derive-modele-profilage
    title: Dérive silencieuse des modèles de profilage comportemental
    statement: >-
      Les modèles de profilage peuvent perdre en pertinence progressivement
      sans signal d'alerte visible si le monitoring de dérive n'est pas actif
      ou si les réentraînements sont retardés.
    likelihood: low
    impact: high
    mitigations:
      - Monitoring mensuel des métriques de performance avec rapport automatique
      - Réentraînement mensuel obligatoire sur données fraîches validées
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-indisponibilite-gel
    title: Indisponibilité de la plateforme de gel lors d'une désignation urgente
    statement: >-
      Une panne de la plateforme de gel au moment d'une désignation urgente
      pourrait empêcher le blocage immédiat des avoirs requis et exposer
      l'établissement à une infraction réglementaire.
    likelihood: low
    impact: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-ppe-non-detecte
    title: Client PPE non identifié à l'entrée en relation
    statement: >-
      Une lacune dans les référentiels PPE utilisés ou une erreur de saisie
      peut conduire à l'onboarding d'un PPE sans déclenchement de la procédure
      de vigilance renforcée, exposant l'établissement à un risque réglementaire.
    likelihood: medium
    impact: high
    mitigations:
      - Multiplication des sources de référentiels PPE tiers
      - Re-criblage périodique du stock client contre les référentiels mis à jour
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-tipping-off-accidentel
    title: Divulgation accidentelle de l'existence d'une DS au client
    statement: >-
      Un conseiller mal informé ou un message automatique mal configuré
      pourrait révéler au client qu'il fait l'objet d'une déclaration de
      soupçon, constituant une infraction grave au secret des DS.
    likelihood: low
    impact: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-donnees-kyb-obsoletes
    title: Dossiers KYB de personnes morales non actualisés
    statement: >-
      Des dossiers KYB non renouvelés dans les délais exposent l'établissement
      à traiter des clients dont la structure de détention a évolué sans
      que la banque en ait connaissance, avec risque de méconnaissance des
      bénéficiaires effectifs réels.
    likelihood: high
    impact: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-cas-non-traite-72h
    title: Cas d'investigation non traité dans le délai de 72 heures
    statement: >-
      Un afflux de cas ou une absence non anticipée dans l'équipe peut
      entraîner le dépassement du délai de premier traitement sur un nombre
      significatif de cas, constituant un risque de non-conformité interne.
    likelihood: medium
    impact: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-virement-intl-non-controle
    title: Virement international traité sans contrôle RTF complet
    statement: >-
      Un dysfonctionnement du module de contrôle RTF pourrait laisser passer
      des virements avec des mentions obligatoires incomplètes, exposant
      l'établissement à une infraction au règlement sur les transferts de fonds.
    likelihood: low
    impact: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-formation-incomplete
    title: Taux de complétion de la formation LCB-FT insuffisant
    statement: >-
      Un taux de complétion de la formation LCB-FT inférieur au seuil requis
      par la politique interne constituerait un manquement à l'obligation de
      formation et serait relevé lors d'un contrôle ACPR.
    likelihood: medium
    impact: medium
    mitigations:
      - Relances automatiques et escalade hiérarchique avant l'échéance annuelle
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-cartographie-non-a-jour
    title: Cartographie des risques non mise à jour dans les délais
    statement: >-
      Un retard dans la production de la cartographie annuelle ou une qualité
      insuffisante des données sources peut conduire à la transmission d'un
      rapport ACPR incomplet ou hors délai.
    likelihood: low
    impact: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-tiers-risque-non-revalue
    title: Tiers à risque élevé non réévalué dans le délai annuel
    statement: >-
      Un partenaire classé à risque élevé dont la réévaluation est omise ou
      retardée peut voir son profil de risque évoluer négativement sans que
      l'établissement en prenne connaissance, exposant à des risques LCB-FT
      non couverts.
    likelihood: medium
    impact: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-fragmentation-listes
    title: Fragmentation des listes de surveillance entre systèmes
    statement: >-
      Avant l'unification des listes, différents systèmes pouvaient utiliser
      des versions désynchronisées des listes de sanctions. La persistance
      de sources locales non migrées représente un risque de cohérence résiduel.
    likelihood: low
    impact: high
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-backtesting-biais
    title: Biais de backtesting sur données historiques non représentatives
    statement: >-
      Si les données historiques utilisées pour le backtesting des scénarios
      de détection sont biaisées ou non représentatives des comportements
      récents, les performances réelles en production peuvent diverger
      significativement des projections.
    likelihood: medium
    impact: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-ermes-indisponible
    title: Indisponibilité du portail ERMES de TRACFIN
    statement: >-
      Une indisponibilité prolongée du portail ERMES peut empêcher la
      transmission de DS dans les délais réglementaires, sans possibilité
      de substitution immédiate, constituant un risque de non-conformité
      indépendant des processus internes.
    likelihood: low
    impact: medium
    domains: [lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dlcb-acces-non-habilite-ds
    title: Accès non habilité aux déclarations de soupçon
    statement: >-
      Une erreur de configuration des droits d'accès pourrait permettre
      à un collaborateur non habilité de consulter des DS, exposant
      l'établissement à une infraction au secret des DS et à un risque RGPD.
    likelihood: low
    impact: high
    domains: [lcb-ft]
    created_from: synthetic

