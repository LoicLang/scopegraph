  # ── Décisions (22) ────────────────────────────────────────────────────────

  - type: decision
    id: dec-dmon-token-emv-standard
    title: Adoption du standard EMV Payment Tokenisation
    statement: La tokenisation des cartes dans les portefeuilles mobiles s'appuie exclusivement sur le standard EMV Payment Tokenisation et non sur des implémentations propriétaires.
    rationale: Ce standard garantit l'interopérabilité avec les principaux réseaux de paiement et simplifie les audits PCI DSS en réduisant le périmètre des données de carte sensibles.
    date: "2023-03-14"
    decided_by: Comité d'architecture monétique
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-scoring-fraude-centralise
    title: Scoring de fraude centralisé dans Fraudar
    statement: La décision de scoring de fraude est prise exclusivement par Fraudar ; aucun système monétique ne peut implémenter sa propre logique de scoring en parallèle.
    rationale: Éviter la prolifération de règles de fraude non coordonnées qui conduirait à des décisions contradictoires et à une maintenance éclatée des modèles.
    date: "2022-09-01"
    decided_by: Comité risques & fraude
    domains: [monetique, lcb-ft]
    created_from: synthetic

  - type: decision
    id: dec-dmon-3ds2-obligatoire-ecommerce
    title: 3DS v2 obligatoire pour tous les paiements e-commerce
    statement: Tout paiement carte initié via PayGateway doit être soumis au flux 3-D Secure v2 ; l'exemption d'authentification forte n'est autorisée que pour les transactions à faible risque qualifiées par le module TRA.
    rationale: Conformité avec les exigences d'authentification forte de la DSP2 et réduction de la responsabilité de l'émetteur en cas de fraude sur les transactions authentifiées.
    date: "2021-12-01"
    decided_by: Comité conformité DSP2
    domains: [monetique, dsp2-open-banking]
    created_from: synthetic

  - type: decision
    id: dec-dmon-clearflow-batch-nuit
    title: Traitement de compensation en batch nocturne
    statement: La compensation des transactions est réalisée en un seul batch nocturne à 23h00, sans traitement intermédiaire dans la journée, sauf exception réglementaire.
    rationale: Architecture plus simple à maintenir et moins coûteuse que le temps réel ; compatible avec les cycles opérationnels des chambres de compensation partenaires actuelles.
    date: "2020-06-15"
    decided_by: Direction technique monétique
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-pinvault-hsm-on-premise
    title: Maintien des HSM PINVault en infrastructure propre
    statement: Les HSM qui hébergent les codes PIN restent sur l'infrastructure physique de la banque et ne migrent pas vers un service HSM cloud, même certifié.
    rationale: La localisation physique des équipements HSM est exigée par la politique de sécurité interne et facilite le contrôle exclusif des clés maîtresses par les équipes sécurité.
    date: "2021-04-20"
    decided_by: RSSI
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-api-paramcard-versioning
    title: Versionnement sémantique de l'API ParamCard
    statement: Toute modification de rupture de l'API ParamCard entraîne l'incrémentation du numéro de version majeure ; la version précédente est maintenue en parallèle pendant six mois minimum.
    rationale: Éviter les régressions silencieuses sur les systèmes consommateurs tels que CARDAUTH et CardLife lors des mises à jour du référentiel produit.
    date: "2023-07-10"
    decided_by: Comité d'architecture monétique
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-chargeback-delai-60j
    title: Délai d'initiation du chargeback à 60 jours
    statement: La banque accepte d'initier une procédure de chargeback dans un délai maximal de 60 jours à compter de la date de transaction contestée, indépendamment du délai réseau applicable.
    rationale: Ce délai interne plus court que certains délais réseau réduit le risque d'irrecevabilité et améliore la satisfaction client en accélérant le traitement des contestations.
    date: "2022-02-28"
    decided_by: Comité opérations litiges
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-netlink-circuit-secours
    title: Double circuit réseau avec bascule automatique
    statement: Chaque connexion vers un réseau de paiement international dispose d'un circuit de secours activé automatiquement si la latence du circuit principal dépasse 200 ms ou en cas d'indisponibilité.
    rationale: Garantir la continuité des autorisations internationales sans intervention manuelle lors des incidents réseau, en conformité avec le SLA d'autorisation de 99,99 %.
    date: "2021-11-05"
    decided_by: Direction production informatique
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-archivage-immuable
    title: Stockage immuable pour l'archivage des transactions
    statement: Les données archivées dans ArchCard sont stockées sur un support à écriture unique (WORM) ou son équivalent logiciel, rendant impossible toute modification après ingestion.
    rationale: Garantir l'intégrité des preuves de transaction pour les audits réglementaires et les contentieux, en conformité avec les exigences d'archivage légal.
    date: "2023-01-09"
    decided_by: Comité gouvernance des données
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-loyalty-calcul-temps-reel
    title: Calcul du cashback en temps quasi réel
    statement: Le calcul du cashback passe d'un traitement mensuel à un calcul incrémental déclenché à chaque transaction éligible, avec créditage dans les 24 heures.
    rationale: Amélioration mesurée de l'engagement des porteurs sur les programmes à cashback immédi when les points ou crédits sont visibles rapidement après chaque achat.
    date: "2024-03-20"
    decided_by: Comité produit fidélisation
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-fraude-seuil-blocage-auto
    title: Seuil de blocage automatique à 850 sur 1000
    statement: Toute transaction dont le score Fraudar dépasse 850 est automatiquement refusée sans intervention humaine ; les transactions dans la plage 700-850 sont soumises à validation porteur via NotifCard.
    rationale: Calibrage issu de l'analyse ROC du modèle v2 ; ce seuil minimise les faux négatifs coûteux tout en limitant les faux positifs à un taux acceptable pour la satisfaction client.
    date: "2024-01-15"
    decided_by: Comité risques & fraude
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-cardportal-biometrie
    title: Biométrie obligatoire pour les opérations sensibles
    statement: Les opérations sensibles réalisées depuis le portail mobile (opposition, changement de PIN, modification de plafond) requièrent une authentification biométrique ou un second facteur fort.
    rationale: Renforcer la sécurité des opérations irréversibles tout en maintenant une expérience fluide grâce à la biométrie embarquée dans les smartphones modernes.
    date: "2023-09-12"
    decided_by: Comité sécurité produits digitaux
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-prepaid-plafond-reglementaire
    title: Plafond réglementaire des cartes prépayées à 10 000 €
    statement: Le solde cumulé d'une carte prépayée ne peut pas dépasser 10 000 euros, conformément au seuil réglementaire applicable aux instruments de monnaie électronique.
    rationale: Respect de la directive monnaie électronique et limitation du risque LCB-FT associé aux instruments de paiement anonymes ou à identification allégée.
    date: "2020-11-30"
    decided_by: Direction conformité
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-feeengine-rapprochement-mensuel
    title: Rapprochement tarifaire mensuel avec les réseaux
    statement: FeeEngine produit un rapport de rapprochement mensuel des frais d'interchange facturés versus les barèmes contractuels, soumis à validation par l'équipe facturation avant clôture comptable.
    rationale: Identifier rapidement les écarts de facturation réseau, qui peuvent représenter plusieurs centaines de milliers d'euros annuels en cas d'application de taux incorrects.
    date: "2022-05-18"
    decided_by: Direction financière monétique
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-cardtest-env-isole
    title: Environnement CardTest strictement isolé de la production
    statement: La plateforme CardTest ne partage aucun composant réseau, aucune base de données ni aucun compte de service avec l'environnement de production monétique.
    rationale: Prévenir tout risque de contamination des données de production par des données de test et garantir que les tests réseaux fictifs n'atteignent pas les chambres de compensation réelles.
    date: "2021-08-03"
    decided_by: Comité d'architecture monétique
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-audittrail-retention-7ans
    title: Rétention du journal d'audit à 7 ans
    statement: Les événements enregistrés dans AuditTrail sont conservés pendant sept ans à compter de leur date d'enregistrement, durée alignée sur les obligations légales de conservation des journaux.
    rationale: Couvrir la durée maximale de prescription applicable aux litiges financiers et garantir la disponibilité des preuves pour les contrôles réglementaires a posteriori.
    date: "2022-12-01"
    decided_by: Comité gouvernance des données
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-notifcard-fallback-sms
    title: SMS comme canal de secours pour les alertes critiques
    statement: En cas d'indisponibilité du canal push, NotifCard bascule automatiquement vers l'envoi d'un SMS pour les alertes de niveau critique (fraude détectée, opposition réussie).
    rationale: Garantir la réception des alertes les plus importantes indépendamment de l'état du canal push, au prix d'un coût d'envoi supérieur assumé pour ces seuls événements critiques.
    date: "2023-06-07"
    decided_by: Comité produit expérience porteur
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-carbilan-format-pdf-signe
    title: Relevés carte en PDF signé électroniquement
    statement: Tous les relevés de compte carte produits par CarBilan sont signés numériquement avec un certificat qualifié pour garantir leur valeur probante en cas de contestation.
    rationale: Un relevé signé électroniquement a la même valeur légale qu'un document papier et supprime la nécessité de conserver des exemplaires physiques en archive.
    date: "2022-10-17"
    decided_by: Direction juridique & conformité
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-emvconfig-deploiement-ota
    title: Mise à jour EMV par télé-paramétrage (OTA)
    statement: Les mises à jour de configuration EMV sont déployées sur les terminaux de paiement partenaires par télé-paramétrage OTA via EMVConfig, sans déplacement physique de technicien.
    rationale: Réduire le délai de déploiement des nouvelles clés publiques et des paramètres NFC de plusieurs semaines à moins de 48 heures sur l'ensemble de la flotte terminale partenaire.
    date: "2023-04-25"
    decided_by: Comité d'architecture monétique
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-riskmonitor-seuil-latence
    title: Seuil d'alerte latence CARDAUTH à 800 ms (P95)
    statement: RiskMonitor déclenche une alerte de niveau critique si le percentile 95 du temps de réponse de CARDAUTH dépasse 800 ms sur une fenêtre glissante de cinq minutes.
    rationale: Ce seuil est calibré pour permettre à l'astreinte d'intervenir avant que le SLA d'autorisation de 99,99 % ne soit compromis, tout en évitant les fausses alertes sur pics transitoires.
    date: "2024-02-08"
    decided_by: Direction production informatique
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-pgw-tokenisation-paiments-recurrents
    title: Tokenisation obligatoire pour les paiements récurrents e-commerce
    statement: PayGateway ne stocke aucun numéro PAN pour les paiements récurrents ; seul un token EMV issu de Tokenizer peut être conservé par le marchand pour initier des transactions ultérieures.
    rationale: Réduire le périmètre PCI DSS des marchands partenaires et éliminer le risque de compromission massive de numéros de carte stockés côté marchand.
    date: "2023-11-14"
    decided_by: Comité sécurité produits digitaux
    domains: [monetique]
    created_from: synthetic

  - type: decision
    id: dec-dmon-cardprovision-enrolement-consentement
    title: Consentement explicite obligatoire à l'enrôlement mobile
    statement: CardProvision exige un consentement explicite du porteur, distinct du consentement général aux conditions générales, avant tout enrôlement d'une carte dans un portefeuille numérique.
    rationale: Conformité avec les exigences de traitement des données personnelles et de consentement spécifique applicables à la création de tokens de paiement mobiles.
    date: "2022-07-04"
    decided_by: Délégué à la protection des données
    domains: [monetique]
    created_from: synthetic

  # ── Contraintes (33) ─────────────────────────────────────────────────────

  - type: constraint
    id: con-dmon-pci-dss-cardauth
    title: CARDAUTH dans le périmètre PCI DSS
    statement: CARDAUTH manipule des données PAN en clair pendant le traitement de l'autorisation et est soumis à l'intégralité des exigences PCI DSS avec audit annuel obligatoire par un QSA agréé.
    source: PCI Security Standards Council
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-pci-dss-pinvault
    title: PINVault soumis aux exigences PCI PIN
    statement: PINVault est soumis aux exigences PCI PIN Security Requirements qui imposent des contrôles stricts sur la génération, la distribution, le stockage et la vérification des codes PIN.
    source: PCI Security Standards Council
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-sla-autorisation
    title: Disponibilité CARDAUTH à 99,99 %
    statement: Le moteur d'autorisation doit maintenir un taux de disponibilité d'au moins 99,99 % mesuré mensuellement, ce qui correspond à moins de 4,4 minutes d'indisponibilité par mois.
    source: Contrat de niveau de service réseau
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-latence-max-autorisation
    title: Latence maximale d'autorisation à 500 ms
    statement: CARDAUTH doit répondre à 99 % des demandes d'autorisation en moins de 500 millisecondes depuis la réception du message ISO 8583 jusqu'à l'envoi de la réponse au réseau.
    source: Accord bilatéral réseau de paiement
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-rgpd-donnees-porteur
    title: Conservation RGPD des données porteur
    statement: Les données à caractère personnel des porteurs collectées dans le cadre de la relation carte ne peuvent être conservées au-delà de cinq ans après la résiliation de la carte, sauf obligation légale contraire.
    source: Règlement RGPD (UE) 2016/679
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-dsp2-sca-ecommerce
    title: Authentification forte obligatoire au-delà de 30 €
    statement: Tout paiement par carte en ligne dont le montant dépasse 30 euros doit faire l'objet d'une authentification forte du porteur via 3DS Gateway, sauf exemption TRA dûment documentée.
    source: DSP2 — RTS sur l'authentification forte
    severity: high
    domains: [monetique, dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-dmon-pci-chiffrement-pan
    title: Chiffrement des PAN au repos et en transit
    statement: Les numéros PAN doivent être chiffrés en AES-256 au repos dans toutes les bases de données et transmis exclusivement via des canaux TLS 1.2 minimum entre les composants du système monétique.
    source: PCI DSS v4.0 — Exigence 3 et 4
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-archivage-10ans
    title: Conservation des journaux de transaction pendant 10 ans
    statement: Les journaux de transactions carte traités par CARDAUTH et Clearflow doivent être conservés pendant dix ans dans ArchCard pour satisfaire aux obligations légales en matière de preuve.
    source: Code monétaire et financier — art. L521-3
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-compensation-j1
    title: Transmission des flux de compensation avant J+1 6h00
    statement: Clearflow doit transmettre les fichiers de compensation de la journée à la chambre de compensation au plus tard à 6h00 le lendemain, faute de quoi des pénalités de retard sont applicables.
    source: Règlement de la chambre de compensation partenaire
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-nfc-plafond-50euros
    title: Plafond sans contact à 50 € sans PIN
    statement: Le paiement sans contact sans saisie du PIN est autorisé jusqu'à 50 euros par transaction conformément aux règles réseau applicables en zone SEPA depuis le 15 mai 2021.
    source: Décision SEPA Cards Standardisation
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-nfc-cumul-sans-pin
    title: Plafond cumulé sans contact sans PIN à 150 €
    statement: Le terminal doit exiger la saisie du PIN lorsque le cumul de transactions sans contact sans PIN depuis la dernière présentation du code dépasse 150 euros, conformément aux règles réseau.
    source: EMV Contactless Specifications v2.9
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-rapportage-fraude-trimestriel
    title: Rapport de fraude trimestriel au superviseur
    statement: CardReport doit transmettre un rapport de fraude au format réglementaire au superviseur bancaire dans les 30 jours suivant la fin de chaque trimestre civil.
    source: Recommandation BCE sur la sécurité des paiements
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-hsm-fips-140-2
    title: HSM certifiés FIPS 140-2 niveau 3
    statement: Les modules de sécurité matérielle utilisés par PINVault doivent être certifiés FIPS 140-2 au niveau 3 minimum pour la protection cryptographique des clés PIN.
    source: Politique de sécurité des systèmes d'information bancaire
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-iso-8583-version
    title: Conformité ISO 8583:1993 avec extensions réseau
    statement: Netlink doit implémenter la version 1993 de la norme ISO 8583 augmentée des extensions propriétaires documentées dans les spécifications techniques de chaque réseau partenaire.
    source: Spécifications techniques réseaux partenaires
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-prepaid-lcb-ft
    title: Vérification LCB-FT pour les chargements prépayés
    statement: Tout chargement d'une carte prépayée au-delà de 1 000 euros en une seule opération ou 2 500 euros sur un mois glissant doit déclencher une vérification LCB-FT renforcée.
    source: Lignes directrices ACPR — monnaie électronique
    severity: high
    domains: [monetique, lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dmon-tokenizer-pci-scope
    title: Tokenizer dans le périmètre PCI DSS
    statement: Le service Tokenizer maintient la correspondance entre tokens et PANs dans une base dédiée qui entre dans le périmètre PCI DSS et nécessite un accès strictement restreint aux systèmes habilités.
    source: PCI DSS v4.0 — Exigence 3.5
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-chargeback-delai-reseau
    title: Délais réseau non négociables pour le chargeback
    statement: Les délais d'initiation et de réponse au chargeback imposés par les réseaux de paiement sont contractuellement contraignants ; tout dépassement entraîne l'irrecevabilité automatique du dossier.
    source: Règlements opérationnels des réseaux de paiement
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-loyalty-plafond-cashback
    title: Plafond annuel de cashback par porteur à 500 €
    statement: Le montant de cashback versé à un porteur ne peut excéder 500 euros par année civile pour tout produit carte, afin de respecter les contraintes fiscales liées aux avantages en nature.
    source: Politique produit fidélisation
    severity: low
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-carbilan-delai-envoi
    title: Relevé carte envoyé au plus tard le 5 du mois suivant
    statement: CarBilan doit produire et envoyer le relevé mensuel de chaque porteur au plus tard le 5e jour du mois suivant la clôture du cycle de facturation.
    source: Conditions générales de la convention de compte
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-backcard-habilitation-operateur
    title: Double habilitation pour les blocages manuels
    statement: Toute opposition manuelle positionnée via BackCard doit être initiée par un opérateur de niveau N1 et validée par un superviseur N2, sauf en cas d'urgence documentée.
    source: Procédure opérationnelle back-office carte
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-3ds-timeout
    title: Timeout 3DS Gateway à 10 secondes
    statement: Si 3DS Gateway ne reçoit pas de réponse du serveur ACS dans les 10 secondes, la transaction doit être basculée en mode dégradé selon les règles du réseau, sans abandon systématique.
    source: Spécifications EMV 3DS v2.3
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-emvconfig-cles-expiration
    title: Renouvellement des clés publiques EMV avant expiration
    statement: EMVConfig doit initier la procédure de renouvellement des clés publiques au moins 90 jours avant leur date d'expiration pour garantir leur disponibilité sur l'ensemble de la flotte terminale.
    source: EMV Issuer and Application Security Guidelines
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-audittrail-integrite
    title: Intégrité cryptographique du journal d'audit
    statement: Chaque entrée du journal AuditTrail doit être signée cryptographiquement et chaînée à l'entrée précédente pour rendre détectable toute altération ou suppression a posteriori.
    source: Politique de sécurité des journaux d'audit
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-netlink-tls-13
    title: TLS 1.3 minimum pour les connexions réseaux
    statement: Toutes les connexions entre Netlink et les réseaux de paiement partenaires doivent utiliser TLS 1.3 au minimum ; les négociations vers des versions antérieures doivent être refusées.
    source: Politique sécurité des échanges financiers
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-fraudar-faux-positifs
    title: Taux de faux positifs Fraudar inférieur à 0,5 %
    statement: Le modèle de scoring Fraudar ne doit pas générer un taux de refus abusif supérieur à 0,5 % des transactions légitimes sur une fenêtre glissante de 30 jours, sous peine de révision du seuil.
    source: Objectif qualité de service porteur
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-pgw-pci-scope
    title: PayGateway hors périmètre PAN grâce à la tokenisation
    statement: PayGateway doit être architecturé de façon à ne jamais stocker ni journaliser les numéros PAN en clair, en s'appuyant exclusivement sur Tokenizer pour la persistance des références de carte.
    source: PCI DSS v4.0 — Exigence 3.3
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-cardlife-personnalisation-delai
    title: Délai de personnalisation carte à 5 jours ouvrés
    statement: Le prestataire de personnalisation physique s'engage à produire et expédier une carte dans les 5 jours ouvrés suivant la réception d'un fichier de commande valide depuis CardLife.
    source: Contrat de prestation de personnalisation carte
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-riskmonitor-astreinte
    title: Couverture d'astreinte 24/7 pour les alertes critiques
    statement: Les alertes de niveau critique émises par RiskMonitor doivent être prises en charge par l'astreinte dans un délai maximal de 15 minutes, y compris la nuit, les week-ends et les jours fériés.
    source: Convention de service production monétique
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-clearflow-format-iso-20022
    title: Migration du format de compensation vers ISO 20022
    statement: Clearflow devra adopter le format ISO 20022 pour les échanges avec les chambres de compensation d'ici la date de transition obligatoire fixée par les réseaux SEPA.
    source: Calendrier de migration SEPA ISO 20022
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-cardportal-accessibilite
    title: Accessibilité RGAA niveau AA pour CardPortal
    statement: L'interface web de CardPortal doit satisfaire aux critères du référentiel RGAA niveau AA, rendant les fonctions selfcare accessibles aux porteurs en situation de handicap.
    source: Loi n° 2005-102 — obligations d'accessibilité numérique
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-prepaid-identification-allegee
    title: Identification allégée pour les cartes prépayées jusqu'à 250 €
    statement: Les cartes prépayées avec une valeur maximale chargeable de 250 euros peuvent être délivrées sous régime d'identification allégée sans vérification documentaire complète de l'identité.
    source: Directive monnaie électronique II — art. 12
    severity: medium
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-pinmailer-impression-securisee
    title: Impression PIN par prestataire agréé PCI PIN
    statement: La production des courriers PIN est exclusivement confiée à un prestataire certifié PCI PIN, soumis à audit annuel par l'équipe sécurité et lié par un accord de confidentialité renforcé.
    source: PCI PIN Security Requirements v3
    severity: high
    domains: [monetique]
    created_from: synthetic

  - type: constraint
    id: con-dmon-cardauth-isolation-reseau
    title: Isolement réseau de CARDAUTH du SI général
    statement: Les composants de CARDAUTH sont déployés dans un segment réseau dédié, accessible uniquement via des flux filtrés et journalisés, sans accès Internet direct ni connexion aux postes de travail bureautiques.
    source: Politique de segmentation réseau PCI DSS
    severity: high
    domains: [monetique]
    created_from: synthetic

  # ── Risques (17) ─────────────────────────────────────────────────────────

  - type: risk
    id: risk-dmon-indisponibilite-cardauth
    title: Indisponibilité du moteur d'autorisation
    statement: Une panne de CARDAUTH entraîne le blocage de toutes les transactions carte, avec impact direct sur la satisfaction client et risque de pénalités contractuelles liées au SLA réseau.
    likelihood: low
    impact: high
    mitigations: [Architecture haute disponibilité avec bascule automatique sur site secondaire en moins de 60 secondes.]
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-compromission-hsm
    title: Compromission des clés HSM PINVault
    statement: Une compromission des clés maîtresses stockées dans les HSM de PINVault exposerait les codes PIN de l'ensemble du parc de cartes actives, avec obligation de renouvellement massif.
    likelihood: low
    impact: high
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-fraude-ml-derive
    title: Dérive silencieuse du modèle de fraude
    statement: Le modèle de scoring Fraudar peut se dégrader progressivement entre deux cycles de réentraînement, augmentant les faux négatifs et laissant passer des transactions frauduleuses.
    likelihood: medium
    impact: medium
    mitigations: [Surveillance mensuelle du taux de fraude post-autorisation avec alerte automatique si dérive supérieure à 0,1 point.]
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-retard-compensation
    title: Retard de transmission des flux de compensation
    statement: Un incident sur Clearflow ou sur la connectivité vers la chambre de compensation peut entraîner un retard de transmission, exposant la banque à des pénalités de retard et à des problèmes de trésorerie.
    likelihood: low
    impact: high
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-attaque-autorisation
    title: Attaque par rejeu sur le canal d'autorisation
    statement: Des attaquants sophistiqués pourraient tenter de rejouer des messages d'autorisation capturés afin de valider des transactions sans présentation de la carte, exploitant des failles dans la vérification des numéros de séquence.
    likelihood: low
    impact: high
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-saturation-fraudar
    title: Saturation de Fraudar en pic de transaction
    statement: Lors des périodes de pic de transactions (soldes, fêtes), le volume peut dépasser la capacité de calcul du modèle ML, entraînant des dégradations de latence et des décisions par défaut moins précises.
    likelihood: medium
    impact: medium
    mitigations: [Plan de capacité annuel avec test de charge avant chaque période de pic identifiée.]
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-non-conformite-pci
    title: Non-conformité PCI DSS lors de l'audit annuel
    statement: Des évolutions non maîtrisées de l'architecture ou des écarts dans les pratiques opérationnelles peuvent entraîner des observations critiques lors de l'audit QSA annuel avec risque de perte de certification.
    likelihood: medium
    impact: high
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-rupture-prestataire-personnalisation
    title: Rupture de service du prestataire de personnalisation
    statement: Une défaillance du prestataire chargé de la personnalisation physique des cartes entraînerait des retards d'émission et pourrait bloquer les ouvertures de compte carte pendant plusieurs semaines.
    likelihood: low
    impact: medium
    mitigations: ["Contrat de continuité avec un prestataire de secours qualifié et maintien d'un stock de cartes personnalisées génériques pour les cas d'urgence."]
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-vol-token
    title: Compromission de tokens de paiement actifs
    statement: La compromission de la base de correspondance token/PAN dans Tokenizer permettrait à un attaquant de détokeniser massivement des numéros de carte et d'initier des transactions frauduleuses.
    likelihood: low
    impact: high
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-obsolescence-iso8583
    title: Obsolescence du format ISO 8583 sur Netlink
    statement: Les réseaux partenaires migrent progressivement vers ISO 20022 ; l'absence d'adaptation de Netlink dans les délais impartis entraînerait une interruption des échanges transfrontaliers.
    likelihood: medium
    impact: high
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-fraude-prepayee
    title: Utilisation frauduleuse des cartes prépayées
    statement: Le régime d'identification allégée applicable aux cartes prépayées de faible valeur peut être exploité pour fragmenter des flux illicites ou contourner les contrôles LCB-FT.
    likelihood: medium
    impact: medium
    domains: [monetique, lcb-ft]
    created_from: synthetic

  - type: risk
    id: risk-dmon-indisponibilite-3ds
    title: Indisponibilité de 3DS Gateway en paiement e-commerce
    statement: Une panne de 3DS Gateway empêche toute authentification forte des paiements en ligne, obligeant à basculer en mode dégradé avec acceptation de responsabilité élargie pour la banque émettrice.
    likelihood: low
    impact: medium
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-erreur-paramcard
    title: Erreur de paramétrage dans ParamCard
    statement: Une configuration erronée d'un produit carte dans ParamCard (plafond à zéro, réseau désactivé) peut bloquer les porteurs concernés sans alerte immédiate jusqu'à la première transaction refusée.
    likelihood: medium
    impact: medium
    mitigations: [Contrôles de cohérence automatiques avant publication de chaque configuration et procédure de rollback en moins de 30 minutes.]
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-perte-message-reseau
    title: Perte de messages d'autorisation sur Netlink
    statement: Des incidents réseau transitoires peuvent entraîner la perte de messages d'autorisation sans que l'émetteur ni l'acquéreur ne soient avertis, créant des transactions en suspens non réconciliées.
    likelihood: medium
    impact: medium
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-delai-chargeback
    title: Dépassement des délais de chargeback réseau
    statement: Un sous-effectif ou un afflux inhabituel de contestations peut conduire à dépasser les délais réseau de chargeback, rendant irrecevables des dossiers légitimes et générant une perte financière définitive.
    likelihood: medium
    impact: medium
    mitigations: [Tableau de bord quotidien des délais résiduels avec escalade automatique vers le responsable litiges si le délai tombe sous 5 jours ouvrés.]
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-saturation-archcard
    title: Saturation de la capacité d'archivage ArchCard
    statement: La croissance des volumes de transactions sur dix ans peut conduire à saturer la capacité de stockage d'ArchCard, avec risque d'interruption de l'ingestion et de perte de données archivables.
    likelihood: low
    impact: medium
    domains: [monetique]
    created_from: synthetic

  - type: risk
    id: risk-dmon-fuite-donnees-porteur
    title: Fuite de données personnelles de porteurs
    statement: Une vulnérabilité dans CardPortal ou BackCard pourrait permettre à un attaquant d'accéder aux données personnelles de porteurs, entraînant une notification obligatoire à la CNIL et un préjudice réputationnel.
    likelihood: low
    impact: high
    domains: [monetique]
    created_from: synthetic

