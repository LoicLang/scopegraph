nodes:

  # ── Systèmes (25) ────────────────────────────────────────────────────────

  - type: system
    id: sys-dmon-cardauth
    name: Moteur d'autorisation CARDAUTH
    description: Traite en temps réel les demandes d'autorisation carte émises par le réseau d'acceptation. Applique les règles de plafonds, de blocage et de routage réseau avant transmission de la réponse à l'acquéreur.
    owner_team: Équipe Monétique Cœur
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardauth-autorisation-temps-reel
    name: Autorisation carte temps réel
    description: Valide chaque transaction en moins de 500 ms en interrogeant le solde disponible et les règles produit associées à la carte présentée.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardauth-controle-plafonds
    name: Vérification des plafonds de dépense
    description: Cumule les montants journaliers et mensuels pour chaque porteur et refuse l'autorisation si le plafond paramétré pour le produit est atteint.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardauth-gestion-oppositions
    name: Prise en compte des oppositions
    description: Consulte le référentiel des cartes opposées avant tout accord d'autorisation afin de bloquer les transactions sur cartes perdues, volées ou résiliées.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-clearflow
    name: Clearflow — Moteur de compensation
    description: Consolide et transmet les flux de compensation journaliers vers les chambres de compensation partenaires. Gère le rapprochement des positions et la génération des fichiers d'échange.
    owner_team: Équipe Compensation & Règlement
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-clearflow-collecte-flux
    name: Collecte des flux de transaction
    description: Agrège en fin de journée l'ensemble des transactions autorisées et les prépare pour l'envoi vers la chambre de compensation selon le format d'échange réglementaire.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-clearflow-rapprochement
    name: Rapprochement des positions
    description: Compare les soldes calculés localement avec les confirmations reçues de la chambre de compensation et déclenche une alerte en cas d'écart non justifié.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-clearflow-rejet-traitement
    name: Traitement des rejets de compensation
    description: Identifie les transactions rejetées par la chambre de compensation, génère les avis de rejet à destination du back-office et déclenche le processus de réclamation.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-cardlife
    name: CardLife — Gestion du cycle de vie carte
    description: Pilote l'intégralité du cycle de vie des cartes de paiement, de la commande à la résiliation, en passant par la personnalisation et le renouvellement. Interface avec le prestataire de personnalisation physique.
    owner_team: Équipe Produit Carte
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardlife-emission-carte
    name: Émission et commande de carte
    description: Orchestre la création du dossier carte, la génération du numéro PAN, la demande de personnalisation et l'envoi postal au titulaire.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardlife-renouvellement
    name: Renouvellement automatique
    description: Détecte à 90 jours les cartes arrivant à expiration et lance automatiquement le processus de commande d'une carte de renouvellement avec transfert du profil porteur.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardlife-resiliation
    name: Résiliation et clôture carte
    description: Traite les demandes de résiliation en positionnant l'opposition, en archivant les données porteur et en notifiant les systèmes aval de la fin de validité.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-pinvault
    name: PINVault — Coffre-fort des codes PIN
    description: Stocke et gère les codes PIN des porteurs dans une enclave chiffrée conforme PCI HSM. Répond aux requêtes de vérification PIN émises par les TPE en mode offline.
    owner_team: Équipe Sécurité Monétique
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-pinvault-verification-pin
    name: Vérification du code PIN
    description: Déchiffre le PIN encrypté transmis par le terminal et le compare au PIN de référence stocké dans le HSM, sans jamais exposer la valeur en clair hors de l'enclave.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-pinvault-changement-pin
    name: Changement de PIN à distance
    description: Permet au porteur de modifier son PIN via l'application mobile ou le serveur vocal, sous réserve d'une authentification forte préalable validée par le module SCA.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-pinvault-generation-pin
    name: Génération du PIN initial
    description: Produit aléatoirement le PIN initial lors de la commande d'une nouvelle carte et le transmet de façon sécurisée au prestataire d'impression via un canal chiffré dédié.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-fraudar
    name: Fraudar — Détection de fraude carte
    description: Analyse en temps réel chaque demande d'autorisation à l'aide d'un modèle de scoring comportemental et géographique. Produit un score de risque transmis à CARDAUTH pour décision d'autorisation ou de blocage.
    owner_team: Équipe Fraude & Sécurité
    domains: [monetique, lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dmon-fraudar-scoring-temps-reel
    name: Scoring de fraude en temps réel
    description: Calcule un indice de suspicion pour chaque transaction en moins de 80 ms en croisant le comportement historique du porteur avec les patterns de fraude connus.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-fraudar-mise-a-jour-modele
    name: Mise à jour du modèle comportemental
    description: Réentraîne hebdomadairement le modèle de scoring à partir des transactions confirmées frauduleuses et des faux positifs signalés par les conseillers.
    domains: [monetique, lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dmon-fraudar-alertes-porteur
    name: Alertes fraude porteur
    description: Envoie une notification push ou SMS au porteur lorsqu'une transaction présente un score de risque élevé, avec option de validation ou de blocage immédiat.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-tokenizer
    name: Tokenizer — Service de tokenisation
    description: Génère et gère des tokens de paiement conformes EMV pour les portefeuilles mobiles et les paiements récurrents. Assure la correspondance sécurisée entre token et PAN dans une base dédiée.
    owner_team: Équipe Monétique Digitale
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-tokenizer-generation-token
    name: Génération de token EMV
    description: Produit un token conforme à la spécification EMV Payment Tokenisation lors de l'enrôlement d'une carte dans un portefeuille numérique, avec une durée de vie et un périmètre d'usage configurables.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-tokenizer-revocation
    name: Révocation de token
    description: Invalide immédiatement un token compromis ou expiré et empêche toute tentative d'autorisation ultérieure sur ce token, sans impact sur le PAN sous-jacent.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-tokenizer-detokenisation
    name: Détokenisation sécurisée
    description: Restitue le PAN original à partir d'un token, uniquement pour les systèmes internes habilités tels que le back-office règlement ou le module de réclamation.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-netlink
    name: Netlink — Passerelle réseaux internationaux
    description: Assure la connectivité avec les réseaux de paiement internationaux partenaires pour la transmission des autorisations et des flux de compensation transfrontaliers.
    owner_team: Équipe Connectivité Réseaux
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-netlink-transmission-iso
    name: Transmission ISO 8583
    description: Encode et décode les messages financiers au format ISO 8583 pour l'échange des autorisations avec les réseaux partenaires dans le respect des variantes propres à chaque réseau.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-netlink-gestion-sessions
    name: Gestion des sessions réseau
    description: Maintient les connexions persistantes avec chaque réseau partenaire, surveille leur disponibilité et déclenche le basculement vers un circuit de secours en cas d'indisponibilité détectée.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-netlink-reconciliation
    name: Réconciliation des échanges transfrontaliers
    description: Compare quotidiennement les journaux de transactions transmises aux réseaux avec les accusés de réception reçus pour détecter les pertes de messages et les doublons.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-backcard
    name: BackCard — Back-office carte
    description: Portail de gestion opérationnelle des cartes, utilisé par les conseillers et le back-office pour traiter les réclamations, les blocages manuels et les demandes de duplicata de relevé.
    owner_team: Équipe Opérations Carte
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-backcard-gestion-reclamations
    name: Gestion des réclamations carte
    description: Permet aux opérateurs d'ouvrir, d'instruire et de clôturer des dossiers de réclamation liés à des transactions contestées, avec traçabilité complète des actions réalisées.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-backcard-blocage-manuel
    name: Blocage manuel de carte
    description: Autorise un conseiller habilité à positionner une opposition immédiate sur une carte depuis le portail, avec journalisation de la raison et de l'identifiant de l'opérateur.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-backcard-duplicata-releve
    name: Édition de duplicata de relevé
    description: Génère à la demande un relevé de compte carte pour une période donnée et l'envoie au format PDF chiffré à l'adresse électronique enregistrée pour le porteur.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-paramcard
    name: ParamCard — Référentiel produits carte
    description: Centralise la configuration des produits carte (plafonds par défaut, options, frais, réseaux acceptés) et distribue ce référentiel aux systèmes consommateurs via une API REST versionnée.
    owner_team: Équipe Produit Carte
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-paramcard-configuration-produit
    name: Configuration du produit carte
    description: Permet aux équipes produit de définir ou de modifier les paramètres d'un produit carte (plafonds, réseaux, options incluses) sans intervention technique, via une interface de paramétrage dédiée.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-paramcard-diffusion-referentiel
    name: Diffusion du référentiel produit
    description: Expose les configurations produit actives via une API interrogée par CARDAUTH, CardLife et BackCard pour garantir la cohérence des règles appliquées à chaque porteur.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-notifcard
    name: NotifCard — Moteur de notifications carte
    description: Orchestre l'envoi des notifications temps réel aux porteurs (alertes de débit, confirmation d'autorisation, alertes fraude) via push mobile, SMS et email selon les préférences du client.
    owner_team: Équipe Expérience Porteur
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-notifcard-alerte-debit
    name: Alerte de débit immédiate
    description: Envoie une notification au porteur dans les deux secondes suivant l'accord d'une autorisation, avec le montant, le commerçant et le solde résiduel disponible.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-feeengine
    name: FeeEngine — Moteur de tarification carte
    description: Calcule et comptabilise les frais liés aux transactions carte (commission d'interchange, frais de retrait, frais de change) selon les grilles tarifaires contractuelles en vigueur.
    owner_team: Équipe Facturation Monétique
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-feeengine-calcul-interchange
    name: Calcul des frais d'interchange
    description: Détermine pour chaque transaction le montant de la commission d'interchange due au réseau, selon la catégorie du commerçant, le type de carte et la zone géographique.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-feeengine-frais-change
    name: Application des frais de change
    description: Majore les transactions en devise étrangère du taux de change du jour et des frais de conversion paramétrés pour le produit carte, avec affichage du détail dans le relevé.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-feeengine-reconciliation-tarifs
    name: Réconciliation des tarifs
    description: Rapproche mensuellement les frais facturés avec les contrats d'interchange signés avec les réseaux et identifie les écarts nécessitant une régularisation.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-chargeback
    name: ChargeBack — Gestion des impayés et litiges
    description: Traite le cycle de vie complet des opérations de chargeback initiées par les porteurs ou imposées par les réseaux, depuis la réception de la contestation jusqu'à la décision finale de remboursement ou de rejet.
    owner_team: Équipe Litiges Monétiques
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-chargeback-reception-contestation
    name: Réception et qualification des contestations
    description: Réceptionne les demandes de chargeback, les qualifie selon le code de raison réseau applicable et les route vers le traitement automatique ou vers l'instruction manuelle.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-chargeback-arbitrage-reseau
    name: Arbitrage réseau
    description: Soumet les dossiers non résolus en première instance à la procédure d'arbitrage du réseau et suit les délais de réponse imposés pour éviter les décisions par défaut défavorables.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-chargeback-remboursement-porteur
    name: Remboursement porteur
    description: Déclenche le crédit sur le compte du porteur à l'issue d'un chargeback accepté et transmet la confirmation au système de gestion de compte pour comptabilisation.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-emvconfig
    name: EMVConfig — Paramétrage EMV et NFC
    description: Centralise les profils de configuration EMV (AIDs, clés publiques, paramètres contact et sans contact) distribués aux terminaux de paiement lors de leur déploiement et de leurs mises à jour.
    owner_team: Équipe Standards Monétiques
    domains: [monetique, tpe-acceptation]
    created_from: synthetic

  - type: feature
    id: feat-dmon-emvconfig-gestion-aids
    name: Gestion des identifiants d'application (AID)
    description: Maintient le catalogue des AIDs acceptés par les produits carte émis et synchronise ce catalogue avec les profils terminal lors de chaque mise à jour de configuration.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-emvconfig-cles-publiques
    name: Distribution des clés publiques EMV
    description: Gère le cycle de vie des clés publiques utilisées pour l'authentification dynamique des cartes (DDA/CDA) et les distribue aux terminaux avant expiration des clés courantes.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-emvconfig-parametres-nfc
    name: Paramétrage sans contact NFC
    description: Configure les seuils de paiement sans contact, les limites de cumul sans PIN et les paramètres CDCVM pour chaque gamme de carte et chaque marché géographique.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-cardreport
    name: CardReport — Reporting réglementaire carte
    description: Produit les rapports statistiques et réglementaires liés à l'activité carte (volumes de transactions, taux de fraude, taux de disponibilité) à destination des autorités de supervision et de la direction.
    owner_team: Équipe Conformité Monétique
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardreport-rapport-fraude
    name: Rapport de fraude réglementaire
    description: Consolide trimestriellement les indicateurs de fraude (taux, montants, typologies) au format requis par le superviseur bancaire et les transmet dans le délai réglementaire.
    domains: [monetique, lcb-ft]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardreport-tableau-de-bord
    name: Tableau de bord activité carte
    description: Alimente quotidiennement un tableau de bord décisionnel avec les volumes de transactions, les taux d'autorisation et les principales métriques de qualité de service.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardreport-rapport-disponibilite
    name: Rapport de disponibilité des services
    description: Mesure et rapporte le taux de disponibilité de chaque composant critique de la chaîne monétique pour alimenter les engagements de niveau de service contractuels.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-3dsgateway
    name: 3DS Gateway — Authentification 3-D Secure
    description: Orchestre le protocole 3-D Secure v2 pour l'authentification des porteurs lors des paiements en ligne. Gère les challenges biométriques, les flux frictionless et la communication avec les serveurs ACS des réseaux.
    owner_team: Équipe Sécurité Monétique
    domains: [monetique, dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-dmon-3dsgateway-flux-frictionless
    name: Authentification frictionless 3DS2
    description: Évalue les signaux de risque transmis par le marchand pour accorder une authentification sans challenge supplémentaire lorsque le niveau de confiance est suffisant.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-3dsgateway-challenge-biometrique
    name: Challenge biométrique porteur
    description: Déclenche un challenge d'authentification forte (empreinte digitale, reconnaissance faciale) via l'application mobile du porteur pour les transactions à risque élevé.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-3dsgateway-rapport-tentatives
    name: Journalisation des tentatives d'authentification
    description: Conserve un journal horodaté de chaque tentative d'authentification 3DS avec le résultat, le type de challenge et les données de risque transmises par le marchand.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-loyalty
    name: LoyaltyCard — Programme de fidélité carte
    description: Gère l'attribution, le suivi et l'utilisation des points de fidélité liés aux transactions carte. Calcule le cashback et les avantages associés aux produits premium selon les règles du programme en vigueur.
    owner_team: Équipe Fidélisation
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-loyalty-attribution-points
    name: Attribution des points de fidélité
    description: Calcule le nombre de points attribués pour chaque transaction éligible selon le barème du produit carte et les éventuels multipliants liés aux promotions en cours.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-loyalty-cashback
    name: Calcul et versement du cashback
    description: Détermine mensuellement le montant de cashback acquis par le porteur et déclenche le crédit automatique sur le compte bancaire associé à la carte.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-loyalty-expiration-points
    name: Gestion de l'expiration des points
    description: Surveille la date de péremption des points dormants et notifie le porteur 30 jours avant l'expiration pour l'inciter à les utiliser avant leur annulation automatique.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-cardportal
    name: CardPortal — Portail selfcare porteur
    description: Interface web et mobile permettant aux porteurs de consulter leurs transactions, de gérer leurs paramètres de carte (plafonds, options, PIN) et de déclarer une opposition en autonomie.
    owner_team: Équipe Expérience Porteur
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardportal-consultation-transactions
    name: Consultation de l'historique de transactions
    description: Affiche les transactions carte des douze derniers mois avec filtrage par date, montant et type d'opération, avec export possible au format CSV.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardportal-opposition-selfcare
    name: Opposition carte en selfcare
    description: Permet au porteur de bloquer sa carte en ligne à tout moment sans contact avec un conseiller, avec confirmation immédiate et numéro de dossier pour suivi.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-cardportal-gestion-options
    name: Activation et désactivation d'options
    description: Donne au porteur la maîtrise de l'activation ou de la désactivation de chaque option souscrite (paiement sans contact, paiement en ligne, retrait à l'étranger) depuis son espace personnel.
    domains: [monetique]
    created_from: synthetic

  - type: system
    id: sys-dmon-archcard
    name: ArchCard — Archivage transactions carte
    description: Conserve pendant dix ans l'intégralité des transactions carte autorisées et refusées dans un espace de stockage sécurisé et immuable, avec interface de requêtage pour les audits et les contentieux.
    owner_team: Équipe Données & Conformité
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-archcard-archivage-transactions
    name: Archivage des journaux de transaction
    description: Ingère quotidiennement le flux de transactions de CARDAUTH et de Clearflow et les conserve dans un stockage à écriture unique pour garantir l'intégrité des données archivées.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-archcard-requetage-audit
    name: Requêtage à des fins d'audit
    description: Fournit une interface de recherche aux équipes d'audit et de conformité pour retrouver les transactions sur des critères multiples (PAN, date, montant, commerçant) dans le respect des habilitations.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-archcard-purge-reglementaire
    name: Purge réglementaire
    description: Déclenche automatiquement la suppression définitive des données porteur arrivées au terme de leur durée légale de conservation, avec production d'un certificat de destruction.
    domains: [monetique]
    created_from: synthetic

  # ── Systèmes restants ────────────────────────────────────────────────────

  - type: system
    id: sys-dmon-prepaidmgr
    name: PrepaidMgr — Gestion des cartes prépayées
    description: Assure la création, le chargement et le suivi des soldes des cartes prépayées émises pour les offres cadeaux, les cartes voyage et les comptes de dépenses professionnelles.
    owner_team: Équipe Produit Carte
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-prepaidmgr-chargement-solde
    name: Chargement du solde prépayé
    description: Crédite le solde d'une carte prépayée sur ordre du titulaire ou d'un tiers habilité, après vérification de l'identité et des plafonds de chargement réglementaires.
    domains: [monetique]
    created_from: synthetic

  - type: feature
    id: feat-dmon-prepaidmgr-consultation-solde
    name: Consultation du solde disponible
    description: Permet au porteur de consulter son solde résiduel via le portail selfcare, une borne dédiée ou le serveur vocal, sans frais supplémentaire.
    domains: [monetique]
    created_from: synthetic

  - type: feature
