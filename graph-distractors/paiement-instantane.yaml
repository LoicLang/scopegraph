  # ── DÉCISIONS ──────────────────────────────────────────────────────────────
  - type: decision
    id: dec-dpin-architecture-bus-evenements
    title: Adoption du bus d'événements pour le cycle de vie des paiements
    statement: >-
      L'ensemble des événements du cycle de vie des virements instantanés sera
      diffusé via un bus d'événements centralisé plutôt que par des appels
      synchrones point à point entre systèmes.
    rationale: >-
      Cette architecture réduit le couplage entre composants et facilite l'ajout
      de nouveaux consommateurs sans modifier les émetteurs existants. Elle améliore
      également la résilience en découplant les temps de traitement.
    date: "2023-09-15"
    decided_by: Architecture technique paiements
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-iso20022-obligatoire
    title: ISO 20022 comme format unique d'échange interbancaire
    statement: >-
      Tous les messages échangés avec les chambres de compensation SEPA Inst
      utiliseront exclusivement le format ISO 20022, sans format propriétaire
      en parallèle.
    rationale: >-
      L'harmonisation sur un format standard simplifie la maintenance du
      concentrateur et garantit la compatibilité avec les évolutions du Conseil
      des paiements européens sans transformation supplémentaire.
    date: "2023-03-01"
    decided_by: Direction Technique Paiements
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-plafond-entreprise-100k
    title: Plafond SEPA Inst 100 000 € pour les entreprises
    statement: >-
      Les clients du segment entreprises bénéficient d'un plafond unitaire de
      100 000 € par virement instantané, contre 15 000 € pour le retail, sous
      réserve d'une vérification d'identité renforcée.
    rationale: >-
      Les besoins de trésorerie des entreprises justifient un plafond plus élevé.
      La vérification renforcée compense le risque accru lié aux montants unitaires
      importants sur un rail irrévocable.
    date: "2024-06-01"
    decided_by: Comité Risques Paiements
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-archivage-10-ans
    title: Conservation des messages de paiement pendant 10 ans
    statement: >-
      L'ensemble des messages ISO 20022 échangés dans le cadre des virements
      instantanés sera conservé pendant dix ans dans un coffre-fort numérique
      immuable, quelle que soit l'issue du paiement.
    rationale: >-
      La durée de dix ans dépasse la prescription bancaire de cinq ans et couvre
      les délais de contentieux les plus longs observés en matière de fraude
      sur les paiements, offrant une marge de sécurité juridique.
    date: "2024-01-15"
    decided_by: Direction Juridique et Conformité
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-double-validation-tresorerie
    title: Double validation pour les transferts de provision
    statement: >-
      Tout transfert de provision entre comptes de règlement via le portail
      trésorerie requiert la validation de deux opérateurs distincts, dont
      au moins un superviseur habilité.
    rationale: >-
      Le risque opérationnel lié à un transfert erroné entre comptes de règlement
      est élevé compte tenu des montants en jeu. La double validation réduit
      le risque d'erreur humaine et renforce la piste d'audit.
    date: "2024-02-20"
    decided_by: Direction des Opérations
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-mode-degrade-ct
    title: Bascule automatique en mode dégradé SEPA CT
    statement: >-
      En cas d'indisponibilité du rail SEPA Inst supérieure à 30 secondes,
      le routeur multicanal bascule automatiquement les nouveaux ordres vers
      SEPA Credit Transfer standard, avec information du client.
    rationale: >-
      Préserver la continuité de service sur les paiements est prioritaire sur
      la garantie de l'instantanéité. Le client est informé du délai supplémentaire
      et peut annuler son ordre si le délai n'est pas compatible avec son besoin.
    date: "2023-11-05"
    decided_by: Architecture technique paiements
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-cache-eligibilite-4h
    title: Rafraîchissement du cache d'éligibilité toutes les 4 heures
    statement: >-
      Le cache des statuts d'éligibilité SEPA Inst des établissements tiers est
      rafraîchi toutes les quatre heures. Un événement de changement de statut
      forcé invalide l'entrée immédiatement.
    rationale: >-
      Le compromis de quatre heures équilibre la fraîcheur des données avec la
      charge sur le répertoire interbancaire. Les changements de statut urgents
      (adhésion, suspension) sont propagés en temps réel via une API d'invalidation
      forcée.
    date: "2023-07-10"
    decided_by: Équipe Flux Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-notification-obligatoire
    title: Notification client obligatoire pour tout virement instantané
    statement: >-
      Chaque virement instantané émis ou reçu donne obligatoirement lieu à une
      notification au client concerné, quel que soit le canal d'initiation.
    rationale: >-
      La traçabilité pour le client est un prérequis réglementaire et un élément
      de confiance. L'absence de notification pour un ordre irrévocable pourrait
      retarder la détection de fraude par le client.
    date: "2024-04-01"
    decided_by: Direction Expérience Client
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-moteur-regles-versionnement
    title: Versionnement obligatoire des règles IP
    statement: >-
      Toute modification d'une règle dans le moteur de règles IP donne lieu à
      la création d'une nouvelle version horodatée, l'ancienne version étant
      conservée et consultable mais inactive.
    rationale: >-
      Le versionnement permet de retracer l'état des règles applicables à un
      ordre passé, condition nécessaire pour les analyses post-incident et les
      audits réglementaires.
    date: "2024-03-12"
    decided_by: Équipe Règles Paiements
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-workflow-compensation
    title: Compensation automatique en cas d'échec partiel du workflow
    statement: >-
      Lorsqu'une étape du workflow de paiement échoue après que des étapes
      irréversibles ont été complétées, le moteur de workflow déclenche
      automatiquement les actions compensatoires sans intervention humaine.
    rationale: >-
      Sur un rail irrévocable, un état partiel incohérent (mouvement de fonds
      sans notification, par exemple) génère des litiges clients. L'automatisation
      de la compensation réduit la fenêtre d'incohérence à quelques secondes.
    date: "2025-01-08"
    decided_by: Architecture technique paiements
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-frais-instantane-opt-in
    title: Frais sur virement instantané en opt-in
    statement: >-
      Les frais applicables aux virements instantanés ne sont facturés que pour
      les clients ayant explicitement activé la fonctionnalité. Pour les clients
      sur l'offre groupée, le virement instantané est inclus sans surcoût.
    rationale: >-
      La facturation à l'opt-in aligne les revenus sur l'usage réel et évite
      les réclamations de clients qui n'ont pas demandé la fonctionnalité.
      L'inclusion dans les offres groupées répond à la pression concurrentielle.
    date: "2024-09-01"
    decided_by: Direction Commerciale
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-seuil-alerte-dlq
    title: Seuil d'alerte DLQ fixé à 500 messages
    statement: >-
      Une alerte opérateur est déclenchée dès que la dead-letter queue dépasse
      500 messages en attente de retraitement, requérant une intervention sous
      30 minutes.
    rationale: >-
      Un seuil à 500 messages laisse le temps d'un diagnostic tout en limitant
      le risque d'accumulation incontrôlée. En deçà, les messages échoués en
      DLQ sont considérés comme un résidu normal des traitements asynchrones.
    date: "2023-10-20"
    decided_by: Équipe Production Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-rapport-sla-hebdo
    title: Rapport SLA hebdomadaire pour le paiement instantané
    statement: >-
      Un rapport de conformité SLA est produit chaque lundi pour la semaine
      écoulée, distribué automatiquement à la direction des opérations et archivé.
    rationale: >-
      La fréquence hebdomadaire est suffisante pour détecter les dégradations
      tendancielles sans générer un volume excessif de rapports. Les alertes
      temps réel couvrent les incidents ponctuels.
    date: "2024-05-06"
    decided_by: Équipe Production Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-segregation-equipes-audit
    title: Ségrégation des accès audit / exploitation
    statement: >-
      Les équipes exploitation n'ont pas accès en écriture aux journaux d'audit.
      Seul l'outil d'audit paiements peut y écrire, via un compte de service dédié.
    rationale: >-
      La ségrégation garantit l'intégrité des traces d'audit même en cas de
      compromission d'un compte exploitation. C'est une exigence des auditeurs
      internes et des référentiels de contrôle de second niveau.
    date: "2024-02-01"
    decided_by: RSSI et Direction Conformité
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-rejet-iban-invalide
    title: Rejet immédiat des IBAN invalides avant soumission réseau
    statement: >-
      Tout ordre portant un IBAN dont la structure ou la clé de contrôle est
      invalide est rejeté par le validateur de coordonnées bancaires avant toute
      soumission au réseau interbancaire.
    rationale: >-
      Soumettre un ordre avec un IBAN invalide génère un rejet réseau et
      consomme inutilement de la bande passante interbancaire. Le contrôle
      local à la source est sans coût marginal significatif.
    date: "2023-05-15"
    decided_by: Équipe Flux Paiements
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-heartbeat-session
    title: Heartbeat toutes les 10 secondes sur les sessions interbancaires
    statement: >-
      Les sessions TCP maintenues avec l'infrastructure de règlement envoient
      un message de heartbeat toutes les 10 secondes pour détecter rapidement
      toute interruption silencieuse de la connexion.
    rationale: >-
      Les coupures réseau silencieuses (sans RST TCP) peuvent bloquer le trafic
      pendant plusieurs minutes avant détection. Un heartbeat à 10 secondes
      limite cette fenêtre d'inactivité non détectée.
    date: "2023-08-22"
    decided_by: Équipe Infrastructure Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-simulation-sandbox
    title: Environnement sandbox obligatoire pour les nouvelles règles IP
    statement: >-
      Toute nouvelle règle IP doit obligatoirement être simulée sur le trafic
      des 30 derniers jours en sandbox avant d'être activée en production.
    rationale: >-
      Les règles IP mal calibrées peuvent générer des rejets massifs d'ordres
      légitimes. La simulation sandbox permet d'estimer le taux de faux positifs
      avant tout impact sur les clients.
    date: "2024-07-01"
    decided_by: Comité Risques Paiements
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-deduplication-fenetre
    title: Fenêtre de déduplication fixée à 60 minutes
    statement: >-
      Le concentrateur de flux conserve les empreintes des messages pour
      détecter les doublons sur une fenêtre glissante de 60 minutes. Au-delà,
      un ordre identique est considéré comme un nouvel ordre légitime.
    rationale: >-
      Une fenêtre de 60 minutes couvre les délais de retry maximum observés en
      pratique tout en limitant la taille du cache de déduplication en mémoire.
    date: "2023-09-01"
    decided_by: Équipe Flux Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-priorite-clients-premium
    title: Priorité de traitement pour les clients premium
    statement: >-
      Les ordres émis par des clients du segment premium sont placés en tête de
      file de traitement du routeur multicanal, devant les ordres standard de
      même heure d'initiation.
    rationale: >-
      La promesse commerciale faite aux clients premium inclut une meilleure
      réactivité en cas de saturation. La priorisation est plafonnée à un
      avantage de 5 minutes maximum pour éviter l'affamage des ordres standard.
    date: "2024-11-15"
    decided_by: Direction Commerciale et Technique
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-scellement-horaire
    title: Scellement horaire du journal d'audit
    statement: >-
      Le journal d'audit des paiements est scellé par une empreinte cryptographique
      enchaînée à fréquence horaire, stockée dans un registre séparé non modifiable.
    rationale: >-
      Un scellement horaire est suffisamment fréquent pour limiter la fenêtre
      d'altération non détectable tout en restant techniquement simple à implémenter
      et à vérifier lors d'un audit.
    date: "2024-08-10"
    decided_by: RSSI et Direction Conformité
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-rechargement-preventif
    title: Rechargement préventif du compte de règlement à 20 % du solde cible
    statement: >-
      Un rechargement du compte de règlement SEPA Inst est initié automatiquement
      lorsque le simulateur de liquidité prédit un passage sous 20 % du solde
      cible dans les deux heures suivantes.
    rationale: >-
      Le rechargement à 20 % du solde cible laisse une marge suffisante pour
      absorber un pic de trafic imprévu pendant le délai de traitement du virement
      de réapprovisionnement.
    date: "2025-02-14"
    decided_by: Direction Trésorerie
    still_active: true
    domains: [paiement-instantane]
    created_from: synthetic

  - type: decision
    id: dec-dpin-api-mandats-rest
    title: API mandats exposée en REST/JSON
    statement: >-
      Le gestionnaire de mandats expose ses fonctions de création, consultation
      et révocation via une API REST/JSON versionnée, conformément au standard
      d'API interne de l'établissement.
    rationale: >-
      L'alignement sur le standard REST/JSON facilite l'intégration par les
      partenaires open banking et les équipes internes, réduisant les coûts
      d'intégration et homogénéisant les pratiques API de l'établissement.
    date: "2024-05-20"
    decided_by: Architecture technique paiements
    still_active: true
    domains: [paiement-instantane, dsp2-open-banking]
    created_from: synthetic

  # ── CONTRAINTES ────────────────────────────────────────────────────────────
  - type: constraint
    id: con-dpin-delai-reglement-10s
    title: Délai de règlement SEPA Inst inférieur à 10 secondes
    statement: >-
      Le règlement interbancaire d'un virement SEPA Inst doit être confirmé
      en moins de 10 secondes à compter de la réception de l'ordre par la
      chambre de compensation, conformément au règlement européen sur les
      virements instantanés.
    source: Règlement (UE) 2024/886 sur les virements instantanés
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-disponibilite-24-7
    title: Disponibilité 24h/24 7j/7 des rails instantanés
    statement: >-
      Les systèmes participant au traitement des virements instantanés doivent
      être disponibles en continu, sans fenêtre de maintenance planifiée
      interrompant la capacité d'émission ou de réception.
    source: Règlement (UE) 2024/886 sur les virements instantanés
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-irrevocabilite-ordre
    title: Irrévocabilité des ordres après soumission réseau
    statement: >-
      Un virement instantané soumis au réseau interbancaire est irrévocable.
      Aucun système interne ne peut annuler un ordre déjà accepté par la chambre
      de compensation.
    source: Schéma SEPA Instant Credit Transfer du Conseil des paiements européens
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-plafond-max-100k
    title: Plafond unitaire maximum de 100 000 € par virement
    statement: >-
      Aucun virement instantané ne peut dépasser 100 000 € par ordre, conformément
      au plafond défini par le schéma SEPA Inst. Les ordres supérieurs doivent
      être fragmentés ou orientés vers un autre rail.
    source: Schéma SEPA Instant Credit Transfer v1.2
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-format-iban-sepa
    title: IBAN SEPA obligatoire pour les ordres instantanés
    statement: >-
      Seuls les comptes identifiés par un IBAN conforme aux standards SEPA
      peuvent être destinataires d'un virement instantané. Les coordonnées
      non IBAN sont rejetées à la validation.
    source: Schéma SEPA Instant Credit Transfer
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-conformite-dsp2-initiation
    title: Consentement explicite requis pour l'initiation par tiers
    statement: >-
      Tout virement instantané initié par un prestataire de services de paiement
      tiers au nom d'un client doit s'appuyer sur un consentement explicite,
      traçable et révocable conformément à la DSP2.
    source: Directive (UE) 2015/2366 (DSP2) — Article 64
    severity: high
    domains: [paiement-instantane, dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-dpin-conservation-5-ans
    title: Conservation des données de paiement pendant 5 ans minimum
    statement: >-
      Les données relatives aux virements instantanés doivent être conservées
      pendant au moins 5 ans à compter de la date d'exécution, conformément
      aux obligations de lutte contre le blanchiment.
    source: Directive (UE) 2015/849 (4e directive LCB-FT) — Article 40
    severity: high
    domains: [paiement-instantane, lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dpin-screening-sanctions
    title: Criblage sanctions obligatoire avant émission
    statement: >-
      Chaque bénéficiaire d'un virement instantané doit faire l'objet d'un
      criblage contre les listes de sanctions en vigueur avant toute soumission
      au réseau interbancaire.
    source: Règlement (CE) n° 2580/2001 et listes OFAC/UE actualisées
    severity: high
    domains: [paiement-instantane, lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dpin-chiffrement-transit
    title: Chiffrement TLS 1.2 minimum des communications interbancaires
    statement: >-
      Toutes les communications entre la passerelle interbancaire et les
      infrastructures de règlement doivent utiliser TLS version 1.2 au minimum,
      avec rotation des certificats tous les 12 mois.
    source: Politique de sécurité des systèmes d'information de l'établissement
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-tracabilite-mandats
    title: Traçabilité complète des utilisations de mandats
    statement: >-
      Chaque utilisation d'un mandat d'initiation doit être enregistrée avec
      l'identifiant du mandat, l'heure, le montant et le référence de l'ordre
      généré, accessible au client sur demande.
    source: Directive (UE) 2015/2366 (DSP2) — Article 58
    severity: medium
    domains: [paiement-instantane, dsp2-open-banking]
    created_from: synthetic

  - type: constraint
    id: con-dpin-sla-contractuel-partenaires
    title: SLA contractuel de 99,9 % de disponibilité vis-à-vis des partenaires
    statement: >-
      Les API exposées aux partenaires d'initiation de paiements instantanés
      doivent respecter un taux de disponibilité de 99,9 % mesuré sur chaque
      mois calendaire, sous peine de pénalités contractuelles.
    source: Contrats cadres partenaires open banking
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-audit-interne-annuel
    title: Audit interne annuel du dispositif de paiement instantané
    statement: >-
      Le dispositif de contrôle des paiements instantanés fait l'objet d'une
      revue annuelle par l'audit interne, couvrant la conformité réglementaire,
      la sécurité et la performance opérationnelle.
    source: Charte d'audit interne de l'établissement
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-notification-rejet-motif
    title: Motif de rejet obligatoire dans les notifications client
    statement: >-
      Toute notification de rejet d'un virement instantané doit inclure le code
      motif réglementaire ainsi qu'une explication compréhensible en langage
      naturel pour le client.
    source: Règlement (UE) 2024/886 — Article 7
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-rgpd-donnees-paiement
    title: Minimisation RGPD des données de paiement
    statement: >-
      Les données à caractère personnel contenues dans les messages de paiement
      (nom du donneur d'ordre, libellé) ne peuvent être utilisées qu'à des fins
      de traitement de l'ordre et de conformité réglementaire.
    source: Règlement (UE) 2016/679 (RGPD) — Article 5
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-resilience-rto-30min
    title: RTO de 30 minutes pour la passerelle interbancaire
    statement: >-
      En cas de panne totale, la passerelle interbancaire doit être rétablie
      en moins de 30 minutes pour limiter l'impact sur la continuité du service
      de paiement instantané.
    source: Plan de continuité d'activité — Exigences paiements critiques
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-habilitation-relance
    title: Double habilitation pour la relance manuelle d'ordre
    statement: >-
      La relance manuelle d'un ordre de paiement via la console d'exploitation
      requiert la validation de deux opérateurs distincts, dont l'un disposant
      du rôle de superviseur.
    source: Politique de contrôle interne — Ségrégation des tâches
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-plafond-mandat
    title: Plafond unitaire obligatoire sur chaque mandat d'initiation
    statement: >-
      Tout mandat d'initiation de paiement doit comporter un plafond unitaire
      et un plafond mensuel cumulé définis explicitement par le client lors
      de sa souscription.
    source: Directive (UE) 2015/2366 (DSP2)
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-unicite-reference-e2e
    title: Unicité de la référence bout en bout sur 24 heures
    statement: >-
      La référence unique de bout en bout (EndToEndId) d'un virement instantané
      doit être unique sur une fenêtre glissante de 24 heures par émetteur,
      le concentrateur rejetant tout doublon.
    source: Schéma SEPA Instant Credit Transfer — Règles de validation
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-supervision-continue
    title: Supervision continue des composants critiques paiement
    statement: >-
      Les composants classifiés critiques (concentrateur, passerelle interbancaire,
      moteur de règles) doivent faire l'objet d'une supervision active 24h/24
      avec alerte sous 2 minutes en cas d'anomalie.
    source: Politique d'exploitation des systèmes critiques
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-test-reprise-trimestriel
    title: Test de reprise après sinistre trimestriel
    statement: >-
      Un exercice de reprise après sinistre simulant la panne totale du datacenter
      principal est organisé trimestriellement pour les systèmes de paiement
      instantané, avec mesure effective du RTO atteint.
    source: Plan de continuité d'activité — Programme de tests
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-acces-minimum-privilege
    title: Accès aux systèmes de paiement selon le principe du moindre privilège
    statement: >-
      Les droits d'accès aux systèmes de traitement des virements instantanés
      sont attribués selon le principe du moindre privilège et révisés
      semestriellement par les responsables d'équipe.
    source: Politique de sécurité des systèmes d'information
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-latence-api-partenaires
    title: Latence API partenaires inférieure à 500 ms au P99
    statement: >-
      Les appels API exposés aux partenaires d'initiation de paiements doivent
      répondre en moins de 500 millisecondes au 99e percentile, mesurés côté
      serveur hors latence réseau partenaire.
    source: Contrats cadres partenaires open banking
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-journalisation-erreurs
    title: Journalisation structurée de toutes les erreurs de traitement
    statement: >-
      Toute erreur survenant dans le traitement d'un ordre de virement instantané
      doit être journalisée en format structuré avec le contexte complet de l'ordre,
      le code d'erreur et la pile d'appels, accessible pendant 90 jours.
    source: Standard de journalisation applicative de l'établissement
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-separation-env
    title: Séparation stricte production / recette pour les paiements instantanés
    statement: >-
      Les environnements de production et de recette du système de paiement
      instantané utilisent des comptes de règlement, des certificats et des
      endpoints réseau entièrement séparés, sans partage de ressource.
    source: Politique de gouvernance des environnements
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-revue-regles-semestrielle
    title: Revue semestrielle du catalogue de règles IP
    statement: >-
      L'ensemble du catalogue de règles du moteur IP fait l'objet d'une revue
      semestrielle par l'équipe risques paiements pour s'assurer de la pertinence
      des seuils et détecter les règles obsolètes.
    source: Politique de gouvernance des règles métier
    severity: low
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-protection-donnees-transit
    title: Données de paiement non persistées en clair dans les files de messages
    statement: >-
      Les montants et coordonnées bancaires des ordres de paiement transitant
      par le bus d'événements sont chiffrés au niveau applicatif avant publication,
      la clé de déchiffrement n'étant accessible qu'aux consommateurs habilités.
    source: Politique de sécurité des systèmes d'information — Encryption at rest
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-monitoring-frais-facturation
    title: Réconciliation quotidienne des frais calculés et facturés
    statement: >-
      Les montants de frais calculés par le catalogue de frais doivent être
      réconciliés quotidiennement avec les montants effectivement facturés
      dans le système de facturation, avec alerte sur tout écart supérieur à 0,1 %.
    source: Politique de contrôle de la facturation
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-capacite-pic-3x
    title: Dimensionnement pour absorber 3 fois le volume moyen en pic
    statement: >-
      Les composants de traitement des virements instantanés doivent être
      dimensionnés pour traiter trois fois le volume moyen journalier sans
      dégradation du SLA, afin d'absorber les pics saisonniers ou événementiels.
    source: Politique de dimensionnement des systèmes critiques
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-format-notification-structure
    title: Format structuré obligatoire pour les notifications de paiement
    statement: >-
      Les notifications envoyées aux clients sur leurs virements instantanés
      doivent suivre un template structuré incluant référence, montant, parties
      et statut, défini par l'équipe expérience client.
    source: Charte de communication client paiements
    severity: low
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-versionnage-api
    title: Versionnage sémantique des API paiement instantané
    statement: >-
      Toutes les API exposées dans le cadre du service de paiement instantané
      suivent un versionnage sémantique avec maintien de la rétrocompatibilité
      pendant au moins 12 mois après la publication d'une nouvelle version majeure.
    source: Standard d'API interne de l'établissement
    severity: medium
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-rotation-certificats
    title: Rotation des certificats TLS tous les 12 mois
    statement: >-
      Les certificats TLS utilisés pour les sessions interbancaires doivent être
      renouvelés au moins une fois par an, avec test de la nouvelle configuration
      en environnement de recette avant bascule en production.
    source: Politique de gestion des certificats de l'établissement
    severity: high
    domains: [paiement-instantane]
    created_from: synthetic

  - type: constraint
    id: con-dpin-test-filtrage-sanctions
    title: Mise à jour quotidienne des listes de sanctions
    statement: >-
      Les listes de sanctions utilisées pour le filtrage des bénéficiaires
      doivent être mises à jour au minimum une fois par jour ouvré, avec
      notification automatique en cas d'échec de la synchronisation.
    source: Directive (UE) 2015/849 — Article 18 et listes OFAC/UE
    severity: high
    domains: [paiement-instantane, lcb-ft]
    created_from: synthetic

  - type: constraint
    id: con-dpin-documentation-api-publique
    title: Documentation OpenAPI obligatoire pour les API partenaires
    statement: >-
      Toute API exposée à des partenaires d'initiation de paiement doit disposer
      d'une spécification OpenAPI 3.0 à jour, publiée sur le portail développeur
      de l'établissement au plus tard lors de la mise en production.
    source: Standard d'API interne de l'établissement
    severity: low
    domains: [paiement-instantane]
    created_from: synthetic

  # ── RISQUES ────────────────────────────────────────────────────────────────
  - type: risk
    id: risk-dpin-indispo-reseau-interbancaire
    title: Indisponibilité prolongée du réseau interbancaire SEPA Inst
    statement: >-
      Une panne du réseau interbancaire de plusieurs heures interromprait
      totalement la capacité d'émission et de réception de virements instantanés,
      sans alternative instantanée disponible pour les clients engagés sur ce rail.
    likelihood: low
    impact: high
    mitigations:
      - Activation automatique du mode dégradé SEPA CT dès 30 secondes d'indisponibilité
      - Communication proactive aux clients impactés via le hub de notification
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-tension-liquidite-intraday
    title: Tension de liquidité intraday sur le compte de règlement
    statement: >-
      Un pic de trafic imprévu ou un retard de rechargement peut amener le solde
      du compte de règlement sous le minimum requis, forçant un rejet des ordres
      en file d'attente faute de provision suffisante.
    likelihood: medium
    impact: high
    mitigations:
      - Alerte préventive du portail trésorerie à 20 % du solde cible
      - Simulateur de liquidité projetant le solde sur 8 heures
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-usurpation-mandat
    title: Usurpation de mandat d'initiation par un acteur malveillant
    statement: >-
      Un partenaire compromis ou un acteur frauduleux interceptant un jeton de
      mandat pourrait initier des virements instantanés irrévocables sans
      l'accord réel du titulaire du compte.
    likelihood: low
    impact: high
    mitigations:
      - Révocation immédiate des mandats sur signalement client
      - Détecteur d'anomalies surveillant les patterns d'utilisation des mandats
    domains: [paiement-instantane, dsp2-open-banking]
    created_from: synthetic

  - type: risk
    id: risk-dpin-derive-sla-latence
    title: Dérive progressive du SLA de latence
    statement: >-
      L'accumulation de dette technique et la croissance des volumes peut
      progressivement dégrader les temps de traitement sans qu'une alerte
      ponctuelle ne soit déclenchée, aboutissant à un non-respect du SLA
      réglementaire de 10 secondes.
    likelihood: medium
    impact: medium
    mitigations:
      - Suivi hebdomadaire des percentiles P95 et P99 de latence
      - Révision du dimensionnement lors de chaque dépassement de 80 % de capacité
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-corruption-journal-audit
    title: Corruption ou altération du journal d'audit
    statement: >-
      Une erreur logicielle ou une action malveillante pourrait altérer les
      entrées du journal d'audit, compromettant sa valeur probante lors d'un
      contrôle réglementaire ou d'un litige.
    likelihood: low
    impact: high
    mitigations:
      - Scellement horaire par empreinte cryptographique enchaînée
      - Ségrégation des droits d'écriture entre exploitation et audit
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-accumulation-dlq
    title: Accumulation incontrôlée de messages en dead-letter queue
    statement: >-
      Un bug récurrent dans un consommateur de file peut générer une accumulation
      rapide de messages en DLQ, bloquant le traitement de lots d'ordres et
      retardant les réconciliations comptables.
    likelihood: medium
    impact: medium
    mitigations:
      - Alerte opérateur dès 500 messages en DLQ
      - Astreinte 24h/24 pour intervention sous 30 minutes
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-erreur-calcul-frais
    title: Erreur de calcul des frais de virement instantané
    statement: >-
      Un bug dans le catalogue de frais ou une mauvaise configuration d'une
      grille tarifaire peut entraîner la surfacturation ou la sous-facturation
      systématique d'une population de clients, avec impact réputationnel et
      financier.
    likelihood: medium
    impact: medium
    mitigations:
      - Réconciliation quotidienne des frais calculés vs facturés
      - Simulation d'impact obligatoire avant activation d'une nouvelle grille
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-expiration-certificat
    title: Expiration non détectée d'un certificat interbancaire
    statement: >-
      L'expiration silencieuse d'un certificat TLS utilisé pour les sessions
      interbancaires provoquerait l'interruption totale de la passerelle sans
      alerte préalable si le monitoring des expirantes n'est pas en place.
    likelihood: low
    impact: high
    mitigations:
      - Monitoring automatique des dates d'expiration avec alerte à J-30 et J-7
      - Procédure de rotation documentée et testée annuellement
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-faux-positifs-detecteur
    title: Taux élevé de faux positifs du détecteur d'anomalies
    statement: >-
      Un détecteur d'anomalies mal calibré peut générer un volume excessif
      d'alertes sur des comportements légitimes, provoquant une fatigue
      d'alerte des équipes et masquant les vraies menaces.
    likelihood: medium
    impact: medium
    mitigations:
      - Revue mensuelle des taux de faux positifs et ajustement des seuils
      - Journalisation des alertes traitées pour constituer un historique de calibration
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-fragmentation-referentiel-comptes
    title: Incohérence entre le référentiel des comptes et le moteur de règles
    statement: >-
      Un délai de propagation des modifications du référentiel des comptes vers
      le moteur de règles peut amener ce dernier à appliquer des plafonds périmés,
      autorisant des ordres qui auraient dû être bloqués ou l'inverse.
    likelihood: low
    impact: medium
    mitigations:
      - Invalidation synchrone du moteur de règles à chaque modification de plafond
      - Test de cohérence automatique à chaque déploiement
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-perte-evenements-bus
    title: Perte d'événements lors d'un incident du bus de messages
    statement: >-
      Un incident affectant le bus d'événements pendant une fenêtre de maintenance
      ou un pic de charge extrême peut entraîner la perte d'événements de cycle
      de vie, compromettant la cohérence des statuts exposés aux clients.
    likelihood: low
    impact: high
    mitigations:
      - Garantie de livraison exacte configurée sur les partitions critiques
      - Mécanisme de rejoue des événements sur 72 heures
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-non-conformite-reporting
    title: Non-conformité des déclarations réglementaires paiement
    statement: >-
      Une erreur dans le processus de génération des rapports réglementaires
      pourrait conduire à la transmission de données erronées à la banque centrale,
      exposant l'établissement à des sanctions et à une obligation de correction.
    likelihood: low
    impact: high
    mitigations:
      - Double contrôle automatique de cohérence avant envoi des déclarations
      - Procédure de validation par l'équipe conformité avant transmission
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-indisponibilite-validateur-rib
    title: Indisponibilité du répertoire d'éligibilité SEPA Inst
    statement: >-
      Si le répertoire interbancaire permettant de vérifier l'éligibilité SEPA Inst
      d'un IBAN devient indisponible, le validateur ne peut plus confirmer les
      nouvelles coordonnées, bloquant l'enregistrement de bénéficiaires inédits.
    likelihood: low
    impact: medium
    mitigations:
      - Cache local mis à jour toutes les 4 heures pour les établissements connus
      - Procédure de repli documentée pour les cas de doute sur les nouveaux établissements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-interoperabilite-iso20022
    title: Incompatibilité de version ISO 20022 avec une chambre de compensation
    statement: >-
      Une mise à jour non coordonnée du schéma ISO 20022 par une chambre de
      compensation peut rendre les messages du concentrateur non conformes
      et provoquer des rejets en masse sur ce circuit.
    likelihood: medium
    impact: high
    mitigations:
      - Veille active sur les publications du Conseil des paiements européens
      - Tests de conformité automatisés avant chaque montée de version du concentrateur
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-vol-donnees-paiement
    title: Vol de données personnelles contenues dans les messages de paiement
    statement: >-
      Les messages ISO 20022 contiennent des données personnelles (noms, IBAN)
      qui, si exfiltrées, constitueraient une violation RGPD majeure avec obligation
      de notification à l'autorité de contrôle dans les 72 heures.
    likelihood: low
    impact: high
    mitigations:
      - Chiffrement applicatif des données dans le bus d'événements
      - Accès aux messages archivés restreint aux utilisateurs habilités via journalisation
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-mauvaise-priorisation-ordres
    title: Mauvaise priorisation causant l'affamage des ordres standard
    statement: >-
      Une implémentation défectueuse de la priorisation des ordres pourrait
      amener les ordres des clients standard à rester bloqués indéfiniment
      en file d'attente derrière les ordres premium en période de forte charge.
    likelihood: low
    impact: medium
    mitigations:
      - Plafond de 5 minutes sur l'avantage accordé aux ordres premium
      - Monitoring du temps d'attente moyen par segment client
    domains: [paiement-instantane]
    created_from: synthetic

  - type: risk
    id: risk-dpin-echec-simulation-liquidite
    title: Précision insuffisante du simulateur de liquidité
    statement: >-
      Des modèles prédictifs peu précis dans le simulateur de liquidité peuvent
      sous-estimer les besoins de rechargement, laissant le compte de règlement
      descendre sous le seuil minimal malgré les alertes.
    likelihood: medium
    impact: medium
    mitigations:
      - Backtesting mensuel du simulateur sur données historiques
      - Marge de sécurité de 20 % appliquée sur toutes les projections
    domains: [paiement-instantane]
    created_from: synthetic

