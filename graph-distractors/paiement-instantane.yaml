nodes:

  # ── SYSTÈME 1 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-concentrateur-flux
    name: Concentrateur de flux instantanés
    description: >-
      Centralise l'ensemble des ordres de virement instantané entrants et sortants
      avant leur routage vers les rails interbancaires. Assure la déduplication
      des messages et la transformation des formats propriétaires vers ISO 20022.
    owner_team: Équipe Flux Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-reception-ordre-inst
    name: Réception d'ordre instantané
    description: >-
      Ingère les ordres de virement instantané depuis les canaux clients et les
      soumet au concentrateur pour validation syntaxique et enrichissement.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-transformation-iso20022
    name: Transformation ISO 20022
    description: >-
      Convertit les messages internes au format pacs.008 requis par les chambres
      de compensation. Gère les variantes de schéma selon le réseau cible.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-deduplication-messages
    name: Déduplication des messages
    description: >-
      Détecte et rejette les doublons d'ordre de paiement sur la base d'une
      empreinte combinant IBAN, montant et horodatage à la milliseconde.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 2 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-moteur-rapprochement
    name: Moteur de rapprochement instantané
    description: >-
      Réconcilie en continu les ordres émis avec les accusés de règlement reçus
      des chambres de compensation. Détecte les ordres en suspens et déclenche
      les procédures de recouvrement automatique.
    owner_team: Équipe Comptabilité Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-reconciliation-temps-reel
    name: Réconciliation temps réel
    description: >-
      Apparie chaque accusé de règlement à l'ordre correspondant dès réception,
      sans attendre la fin de journée. Les écarts sont signalés immédiatement
      à l'équipe d'exploitation.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-gestion-suspens
    name: Gestion des suspens de règlement
    description: >-
      Identifie les ordres sans accusé de règlement passé le délai réglementaire
      et ouvre automatiquement un dossier de réclamation auprès du réseau.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-export-comptable
    name: Export comptable journalier
    description: >-
      Produit en fin de journée les écritures comptables consolidées à destination
      du système de comptabilité générale, en distinguant flux débit et crédit.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 3 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-hub-notification
    name: Hub de notification paiement
    description: >-
      Orchestre l'envoi de notifications aux clients sur l'état de leurs virements
      instantanés via push mobile, SMS et e-mail. Garantit la délivrabilité et
      conserve un journal d'envoi pour audit.
    owner_team: Équipe Expérience Client
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-notification-emission
    name: Notification d'émission confirmée
    description: >-
      Envoie un acquittement au client expéditeur dès confirmation du règlement
      par la chambre de compensation, en moins de 15 secondes après l'émission.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-notification-reception
    name: Notification de réception de fonds
    description: >-
      Alerte le bénéficiaire en temps réel lors du crédit de son compte, avec
      indication du donneur d'ordre et du libellé de l'opération.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-notification-rejet
    name: Notification de rejet instantané
    description: >-
      Informe l'émetteur du rejet de son ordre en précisant le code motif
      réglementaire et les actions correctrices disponibles.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 4 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-portail-tresorerie
    name: Portail trésorerie instantanée
    description: >-
      Interface opérateur permettant aux équipes de trésorerie de suivre en
      temps réel la position de liquidité sur les comptes de règlement SEPA Inst.
      Offre des vues agrégées par devise et par contrepartie.
    owner_team: Équipe Trésorerie
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-vue-position-liquidite
    name: Vue position de liquidité
    description: >-
      Affiche en continu le solde disponible sur les comptes de règlement avec
      une granularité à la minute, permettant d'anticiper les tensions de liquidité.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-alerte-seuil-liquidite
    name: Alerte seuil de liquidité
    description: >-
      Déclenche une alerte opérateur lorsque le solde de règlement descend sous
      un seuil paramétrable, afin d'initier un rechargement préventif.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-transfert-provision
    name: Transfert de provision inter-comptes
    description: >-
      Permet à un trésorier habilité de déplacer de la liquidité entre comptes
      de règlement SEPA Inst et nostro en quelques clics, avec double validation.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 5 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-bus-evenements
    name: Bus d'événements paiement
    description: >-
      Infrastructure de messagerie asynchrone diffusant les événements du cycle
      de vie des virements instantanés à l'ensemble des systèmes abonnés. Basé
      sur un paradigme publish-subscribe avec garantie de livraison exacte.
    owner_team: Équipe Socle Technique
    domains: [paiement-instantane, socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dpin-publication-evenement
    name: Publication d'événement de paiement
    description: >-
      Publie sur le bus un événement structuré à chaque transition d'état d'un
      virement, depuis la création jusqu'au règlement définitif ou au rejet.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-abonnement-evenement
    name: Gestion des abonnements aux événements
    description: >-
      Permet aux systèmes consommateurs de s'abonner à des catégories d'événements
      avec filtrage par type d'opération, montant ou code établissement.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-replay-evenement
    name: Rejeu d'événements
    description: >-
      Offre la capacité de rejouer un flux d'événements historiques sur une
      fenêtre glissante de 72 heures pour les traitements en retard ou les
      reconstructions d'état après incident.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 6 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-gestionnaire-mandats
    name: Gestionnaire de mandats de paiement
    description: >-
      Gère les mandats d'autorisation permanents permettant à des partenaires
      d'initier des virements instantanés au nom du client. Assure la révocation
      en temps réel et la traçabilité des accès délégués.
    owner_team: Équipe Open Banking
    domains: [paiement-instantane, dsp2-open-banking]
    created_from: synthetic

  - type: feature
    id: feat-dpin-creation-mandat
    name: Création de mandat d'initiation
    description: >-
      Enregistre un nouveau mandat signé électroniquement par le client, avec
      les paramètres de plafond, de durée et de catégorie de bénéficiaires autorisés.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-revocation-mandat
    name: Révocation de mandat
    description: >-
      Invalide immédiatement un mandat actif à la demande du client ou en cas
      de détection d'usage suspect, bloquant tout nouvel ordre émis sous ce mandat.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-consultation-mandats
    name: Consultation des mandats actifs
    description: >-
      Expose via API la liste des mandats en cours associés à un compte, avec
      leur historique d'utilisation et les ordres récents qu'ils ont générés.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 7 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-validateur-rib
    name: Validateur de coordonnées bancaires
    description: >-
      Vérifie la validité structurelle et l'accessibilité SEPA Inst d'un IBAN
      avant tout enregistrement de bénéficiaire ou émission d'ordre. Interroge
      le répertoire interbancaire en temps réel pour confirmer l'éligibilité.
    owner_team: Équipe Flux Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-validation-iban
    name: Validation structurelle IBAN
    description: >-
      Contrôle le format, la clé de contrôle et le code BIC associé à un IBAN
      avant toute soumission au réseau, rejetant les coordonnées invalides à la source.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-verification-eligibilite-inst
    name: Vérification d'éligibilité SEPA Inst
    description: >-
      Interroge le répertoire centralisé pour confirmer que la banque destinataire
      est bien participante aux rails instantanés avant d'accepter l'ordre.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-cache-eligibilite
    name: Cache d'éligibilité des établissements
    description: >-
      Maintient un cache local des statuts d'éligibilité SEPA Inst mis à jour
      toutes les quatre heures, réduisant la latence des contrôles de validation.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 8 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-simulateur-liquidite
    name: Simulateur de liquidité intraday
    description: >-
      Projette l'évolution probable du solde de règlement sur la journée en cours
      à partir des ordres planifiés et des tendances historiques. Alimente les
      décisions de rechargement préventif des comptes de règlement.
    owner_team: Équipe Trésorerie
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-projection-solde
    name: Projection de solde intraday
    description: >-
      Calcule une courbe de solde prévisionnelle sur un horizon de 8 heures en
      intégrant les ordres en file d'attente et les tombées contractuelles connues.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-scenario-stress
    name: Scénario de stress liquidité
    description: >-
      Simule un pic de trafic instantané à trois fois le volume moyen pour évaluer
      la résistance du solde de règlement et dimensionner le tampon de sécurité.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 9 ──────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-archiveur-ordres
    name: Archiveur d'ordres de paiement
    description: >-
      Conserve l'intégralité des messages ISO 20022 échangés avec les chambres
      de compensation pendant dix ans dans un coffre-fort numérique immuable.
      Répond aux demandes de production réglementaire sous 24 heures.
    owner_team: Équipe Conformité Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-archivage-message
    name: Archivage de message de paiement
    description: >-
      Stocke chaque message pacs.008 et pacs.002 dans un référentiel immuable
      horodaté, avec empreinte cryptographique garantissant l'intégrité.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-recherche-archives
    name: Recherche dans les archives
    description: >-
      Permet aux équipes conformité de retrouver un ordre archivé par référence,
      date, montant ou IBAN en moins de cinq secondes sur dix ans d'historique.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 10 ─────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-routeur-multicanal
    name: Routeur multicanal paiement
    description: >-
      Sélectionne le canal d'émission optimal (SEPA Inst, SEPA CT, virement
      express interne) selon la disponibilité des rails, le montant et les
      préférences client. Bascule automatiquement en mode dégradé en cas
      d'indisponibilité du rail instantané.
    owner_team: Équipe Flux Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-selection-canal
    name: Sélection de canal de paiement
    description: >-
      Applique un arbre de décision configurable pour choisir le rail de paiement
      le plus adapté à chaque ordre, en tenant compte du montant, de l'heure et
      de l'éligibilité du destinataire.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-bascule-mode-degrade
    name: Bascule mode dégradé
    description: >-
      Reroute automatiquement les ordres vers SEPA CT standard lorsque le rail
      instantané est indisponible, en notifiant le client du délai supplémentaire.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-prioritisation-ordres
    name: Priorisation des ordres en file
    description: >-
      Ordonnance la file d'attente des virements selon des règles de priorité
      métier : ordres urgents clients premium traités en premier, puis ordres
      standards par ordre chronologique.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 11 ─────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-moniteur-sla
    name: Moniteur de SLA instantané
    description: >-
      Mesure en continu les délais de traitement de chaque ordre de virement
      instantané et émet des alertes dès qu'un seuil de SLA est approché ou
      dépassé. Produit des rapports hebdomadaires de conformité opérationnelle.
    owner_team: Équipe Production Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-mesure-latence
    name: Mesure de latence de traitement
    description: >-
      Enregistre les horodatages à chaque étape du cycle de vie d'un ordre et
      calcule la latence bout en bout pour chaque virement traité.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-tableau-bord-sla
    name: Tableau de bord SLA temps réel
    description: >-
      Restitue sur un écran opérateur les percentiles P50, P95 et P99 de latence
      actualisés à la minute, avec un code couleur par rapport aux seuils cibles.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-rapport-conformite-sla
    name: Rapport de conformité SLA
    description: >-
      Génère chaque semaine un rapport synthétique indiquant le taux de virements
      traités sous dix secondes et les incidents ayant dégradé la performance.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 12 ─────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-moteur-regles-ip
    name: Moteur de règles IP
    description: >-
      Évalue à chaque ordre de paiement un ensemble de règles métier configurables
      portant sur les plafonds, les horaires d'autorisation et les contrôles de
      cohérence. Les règles sont versionnées et auditables.
    owner_team: Équipe Règles Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-evaluation-regles
    name: Évaluation des règles métier
    description: >-
      Exécute de façon synchrone l'ensemble du catalogue de règles applicable à
      un ordre, en retournant une décision d'autorisation ou de rejet avec motif.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-gestion-regles
    name: Gestion du catalogue de règles
    description: >-
      Fournit une interface de configuration permettant aux équipes métier de
      créer, modifier ou désactiver une règle sans redéploiement applicatif.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-simulation-regle
    name: Simulation d'impact de règle
    description: >-
      Permet d'évaluer en sandbox l'effet qu'une nouvelle règle aurait eu sur
      le trafic des 30 derniers jours avant toute mise en production.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 13 ─────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-console-exploitation
    name: Console d'exploitation paiement
    description: >-
      Outil opérateur centralisé pour le suivi, le diagnostic et l'intervention
      manuelle sur les ordres de virement instantané. Permet la relance d'un ordre
      bloqué et la consultation de l'historique complet d'un paiement.
    owner_team: Équipe Production Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-recherche-ordre
    name: Recherche d'ordre de paiement
    description: >-
      Localise un ordre de virement par référence unique, IBAN émetteur ou
      destinataire, montant ou plage de dates en moins de deux secondes.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-relance-ordre
    name: Relance manuelle d'ordre
    description: >-
      Autorise un opérateur habilité à rejouer un ordre bloqué après correction
      de la cause racine, avec traçabilité complète de l'intervention.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-annulation-ordre
    name: Annulation d'ordre en cours
    description: >-
      Permet l'annulation d'un ordre non encore soumis au réseau interbancaire,
      sous réserve d'une double habilitation opérateur et superviseur.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 14 ─────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-catalogue-frais
    name: Catalogue de frais paiement instantané
    description: >-
      Référentiel des grilles tarifaires applicables aux virements instantanés
      selon le segment client, le montant et le canal d'initiation. Alimente
      la facturation en temps réel et les rapports de revenus.
    owner_team: Équipe Tarification
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-calcul-frais
    name: Calcul des frais en temps réel
    description: >-
      Détermine le montant des frais applicables à chaque ordre instantané
      au moment de son initiation, avant confirmation client.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-gestion-grille-tarifaire
    name: Gestion de la grille tarifaire
    description: >-
      Offre une interface d'administration pour créer et modifier les grilles
      tarifaires avec entrée en vigueur à date, sans interruption de service.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 15 ─────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-referentiel-comptes
    name: Référentiel des comptes de paiement
    description: >-
      Maintient la liste des comptes internes éligibles au virement instantané
      avec leurs caractéristiques (plafonds personnalisés, restrictions, statut
      d'activation). Sert de source de vérité pour les contrôles pré-émission.
    owner_team: Équipe Référentiel
    domains: [paiement-instantane, referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dpin-activation-compte-inst
    name: Activation compte au virement instantané
    description: >-
      Enregistre l'éligibilité d'un compte à émettre et recevoir des virements
      instantanés après validation des conditions d'éligibilité réglementaires.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-mise-a-jour-plafonds
    name: Mise à jour des plafonds personnalisés
    description: >-
      Applique les modifications de plafonds demandées par le client ou décidées
      par le risque, avec prise d'effet immédiate sur le moteur de règles.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 16 ─────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-ecran-reconciliation
    name: Écran de réconciliation opérateur
    description: >-
      Interface graphique destinée aux équipes comptables pour visualiser et
      valider les rapprochements de fin de journée entre les flux instantanés
      et les entrées du grand livre. Permet l'approbation lot par lot.
    owner_team: Équipe Comptabilité Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-validation-lot-reconciliation
    name: Validation en lot des rapprochements
    description: >-
      Permet à un comptable d'approuver en une action un ensemble de
      rapprochements automatiques jugés conformes, après revue de l'échantillon.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-traitement-ecarts
    name: Traitement des écarts de réconciliation
    description: >-
      Isole les entrées non rapprochées et guide l'opérateur dans leur résolution
      en proposant les contreparties candidates les plus probables.
    domains: [paiement-instantane]
    created_from: synthetic

  # ── SYSTÈME 17 ─────────────────────────────────────────────────────────────
  - type: system
    id: sys-dpin-passerelle-interbancaire
    name: Passerelle interbancaire SEPA Inst
    description: >-
      Gère la connexion technique aux infrastructures de règlement interbancaire
      SEPA Inst, incluant la gestion des sessions, la signature des messages et
      le traitement des accusés de règlement entrants.
    owner_team: Équipe Infrastructure Paiements
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-gestion-session-reseau
    name: Gestion de session réseau interbancaire
    description: >-
      Maintient les sessions TCP persistantes avec l'infrastructure de règlement,
      gère les reconnexions automatiques et les cycles de heartbeat.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-signature-message-reseau
    name: Signature cryptographique des messages
    description: >-
      Applique une signature numérique sur chaque message sortant à l'aide du
      certificat de l'établissement, garantissant la non-répudiation des ordres.
    domains: [paiement-instantane]
    created_from: synthetic

  - type: feature
    id: feat-dpin-traitement-accuse-reglement
    name: Traitement des accusés de règlement
    description: >-
      Réceptionne et décode les messages pacs.002 de retour, en extrayant le
