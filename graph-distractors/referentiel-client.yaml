  - type: decision
    id: dec-dref-referentiel-maitre-unique
    title: Référentiel client maître unique
    statement: >-
      Un seul système est désigné système de référence pour les données d'identité
      client. Toute modification de ces données doit transiter par ce système maître ;
      les systèmes consommateurs ne peuvent pas mettre à jour les données d'identité
      directement.
    rationale: >-
      La multiplicité des points d'écriture historiques avait engendré des divergences
      fréquentes entre les différentes copies du référentiel, causant des anomalies
      dans les envois de courrier et les contrôles LCB-FT.
    date: "2023-03-15"
    decided_by: Comité Architecture SI
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-api-gateway-obligatoire
    title: Passage obligatoire par l'API Gateway
    statement: >-
      Tout accès au référentiel client depuis un système tiers doit passer par
      l'API Gateway dédiée. Les connexions directes aux bases de données du
      référentiel sont interdites, quelle que soit l'équipe demandeuse.
    rationale: >-
      La centralisation des accès permet d'appliquer uniformément les politiques
      d'authentification, de rate-limiting et d'audit. Elle simplifie également
      les opérations de maintenance et de montée de version.
    date: "2023-09-01"
    decided_by: Comité Sécurité SI
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-evenementiel-asynchrone
    title: Adoption du modèle événementiel pour la diffusion
    statement: >-
      Les mises à jour du référentiel client sont propagées vers les systèmes
      consommateurs exclusivement par événements asynchrones. Les appels
      synchrones en lecture directe sont tolérés mais les écritures synchrones
      inter-systèmes sont prohibées.
    rationale: >-
      Le couplage synchrone entre le référentiel et les systèmes aval avait
      provoqué des cascades de panne lors des pics de charge. Le modèle
      événementiel améliore la résilience globale et facilite l'ajout de
      nouveaux consommateurs.
    date: "2023-06-20"
    decided_by: Comité Architecture SI
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-consentement-granulaire
    title: Granularité fine des consentements RGPD
    statement: >-
      Les consentements sont collectés à un niveau de granularité par finalité
      de traitement. Un consentement global couvrant plusieurs finalités n'est
      pas admis ; chaque case à cocher correspond à une et une seule finalité.
    rationale: >-
      L'autorité de contrôle fictive CPDONNEES a précisé que le consentement
      global ne satisfait pas l'exigence de spécificité du règlement. La
      granularité fine réduit le risque de sanction et renforce la confiance
      des clients.
    date: "2022-11-10"
    decided_by: DPO
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-seuil-fusion-auto
    title: Seuil de fusion automatique à 0,92
    statement: >-
      Les doublons présentant un score de similarité supérieur ou égal à 0,92
      sont fusionnés automatiquement sans intervention humaine. Les paires
      entre 0,75 et 0,92 sont soumises à un opérateur pour décision manuelle.
    rationale: >-
      Les tests sur données réelles ont montré un taux de faux positifs
      inférieur à 0,3 % au seuil de 0,92, jugé acceptable par l'équipe qualité.
      En deçà, le volume de révisions manuelles redevenait prohibitif.
    date: "2024-01-22"
    decided_by: Comité Qualité Données
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-retention-evenements-30j
    title: Rétention des événements référentiel à 30 jours
    statement: >-
      La fenêtre de rétention des événements sur le broker de messages est fixée
      à 30 jours calendaires. Les consommateurs qui n'auraient pas traité les
      événements dans ce délai doivent solliciter une reconstruction complète
      de leur état via un export initial.
    rationale: >-
      Un délai inférieur avait conduit à des pertes de données lors de maintenances
      prolongées. Trente jours couvrent les cas de déploiement difficile observés
      en production sans engendrer un coût de stockage prohibitif.
    date: "2023-09-15"
    decided_by: Comité Architecture SI
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-kyc-numerique-prioritaire
    title: KYC numérique prioritaire sur le papier
    statement: >-
      Les documents KYC sont collectés et conservés exclusivement sous forme
      numérique. La réception de documents papier en agence implique une
      numérisation immédiate suivie de la destruction physique dans les 24 heures.
    rationale: >-
      La conservation de documents papier dispersés en agences créait des
      risques de perte et rendait les contrôles à distance impossibles pour
      les équipes conformité.
    date: "2022-05-03"
    decided_by: Direction Conformité
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-profil-risque-version-archive
    title: Archivage de l'historique des profils de risque
    statement: >-
      Chaque recalcul du profil de risque LCB-FT donne lieu à l'archivage de
      la version précédente avec son horodatage. La liste des versions est
      conservée pendant dix ans pour permettre les contrôles rétrospectifs.
    rationale: >-
      Les superviseurs ont demandé à pouvoir reconstituer le profil de risque
      d'un client à une date passée lors des contrôles sur pièces. Cette
      traçabilité est désormais une exigence documentée dans la charte de conformité.
    date: "2024-03-07"
    decided_by: Direction Risques
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-double-validation-radiation
    title: Double validation obligatoire pour la radiation de surveillance
    statement: >-
      Toute radiation d'un client de la liste de surveillance renforcée requiert
      la validation concordante de deux responsables LCB-FT distincts. Une seule
      validation ne suffit pas, quel que soit le grade du valideur.
    rationale: >-
      Un incident passé avait conduit à la radiation prématurée d'un client
      ultérieurement impliqué dans un signalement TRACFIN fictif. La double
      validation réduit le risque d'erreur individuelle.
    date: "2024-07-14"
    decided_by: Comité des risques
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-oauth2-scopes-par-application
    title: Scopes OAuth2 déclarés par application consommatrice
    statement: >-
      Chaque application consommatrice du référentiel client doit déclarer
      explicitement les scopes OAuth2 nécessaires à son fonctionnement. Les
      accès en lecture et en écriture font l'objet de scopes distincts ;
      l'attribution de scopes d'écriture est soumise à validation du RSSI.
    rationale: >-
      Le modèle de permission précédent était trop permissif et ne permettait
      pas d'identifier l'application à l'origine d'une écriture anormale dans
      les journaux d'audit.
    date: "2023-11-20"
    decided_by: Comité Sécurité SI
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-foyer-un-seul-actif
    title: Unicité du foyer actif par client
    statement: >-
      Un client ne peut être membre que d'un seul foyer bancaire actif
      simultanément. Toute tentative d'ajout à un second foyer est bloquée
      par le système jusqu'à dissolution du foyer en cours.
    rationale: >-
      La présence d'un même client dans plusieurs foyers actifs engendrait des
      incohérences dans le calcul du taux d'endettement global, causant des
      risques de sur-endettement non détecté.
    date: "2023-02-28"
    decided_by: Comité Produits Crédit
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-normalisation-adresse-systematique
    title: Normalisation systématique des adresses à la saisie
    statement: >-
      Toute adresse postale saisie dans le référentiel client est soumise
      automatiquement au processus de normalisation ADRNORM avant enregistrement.
      La saisie d'une adresse non normalisée est bloquée sauf dérogation
      explicite d'un superviseur qualité.
    rationale: >-
      Les envois postaux sur adresses non normalisées représentaient 4,7 % de
      retours NPAI, entraînant des coûts d'affranchissement et des risques de
      non-notification réglementaire.
    date: "2022-08-31"
    decided_by: Comité Qualité Données
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-expiration-token-api-1h
    title: Durée de vie des jetons API limitée à une heure
    statement: >-
      Les jetons OAuth2 émis par l'API Gateway du référentiel ont une durée de
      validité maximale de 60 minutes. Les applications doivent implémenter un
      mécanisme de renouvellement automatique avant expiration.
    rationale: >-
      Une durée de vie longue des jetons augmente la fenêtre d'exposition en
      cas de compromission. Soixante minutes est le compromis retenu entre
      fréquence de renouvellement et risque de sécurité.
    date: "2023-09-01"
    decided_by: Comité Sécurité SI
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-score-qualite-seuil-relance
    title: Seuil de score de complétude déclenchant la relance client
    statement: >-
      Les fiches présentant un score de complétude inférieur à 65 % font l'objet
      d'une relance automatique adressée au client. Les fiches entre 65 % et 80 %
      alimentent uniquement la file de travail du conseiller.
    rationale: >-
      Des tests A/B internes ont montré que les relances automatiques en dessous
      du seuil de 65 % obtiennent un taux de complétion de 38 %, justifiant
      le coût d'envoi. Au-delà, le taux chute à 9 %.
    date: "2024-05-12"
    decided_by: Comité Qualité Données
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-beneficiaires-effectifs-25pct
    title: Seuil de déclaration des bénéficiaires effectifs à 25 %
    statement: >-
      Toute personne physique détenant directement ou indirectement 25 % ou plus
      du capital ou des droits de vote d'une entreprise cliente doit être déclarée
      comme bénéficiaire effectif dans le référentiel. Ce seuil s'aligne sur
      les directives anti-blanchiment applicables.
    rationale: >-
      Le seuil de 25 % est celui retenu par la réglementation fictive DAMLCBFT
      transposée dans la politique interne. Il correspond à la pratique des
      établissements comparables du secteur.
    date: "2022-01-10"
    decided_by: Direction Conformité
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-anonymisation-5ans
    title: Anonymisation après 5 ans post-résiliation
    statement: >-
      Les données personnelles des clients résiliés sont anonymisées à l'issue
      d'un délai de cinq ans suivant la date de fin de la dernière relation
      commerciale, sous réserve de l'absence de procédure contentieuse en cours.
    rationale: >-
      Le délai de cinq ans couvre les prescriptions civiles et commerciales les
      plus fréquentes tout en respectant les recommandations de la CPDONNEES
      fictive sur la durée de conservation.
    date: "2022-04-01"
    decided_by: DPO
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-otp-changement-telephone
    title: OTP obligatoire pour tout changement de numéro de téléphone
    statement: >-
      Toute modification du numéro de téléphone principal d'un client en ligne
      nécessite la validation d'un code OTP envoyé à l'ancien numéro. Si l'ancien
      numéro est inaccessible, la modification doit être effectuée en agence
      avec présentation d'un justificatif d'identité.
    rationale: >-
      Le numéro de téléphone est utilisé comme facteur d'authentification fort.
      Sa modification non sécurisée est un vecteur fréquent d'attaque SIM-swap
      ciblant les comptes à forts encours.
    date: "2023-07-05"
    decided_by: Comité Sécurité SI
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-revue-annuelle-tiers-confiance
    title: Revue annuelle du statut des tiers de confiance
    statement: >-
      Le statut de tiers de confiance est réexaminé chaque année par le comité
      habilitations. À défaut de renouvellement explicite, le statut expire
      automatiquement et les conditions ordinaires de délai de carence
      s'appliquent à nouveau.
    rationale: >-
      Des organismes bénéficiant du statut de tiers de confiance avaient connu
      des changements de gouvernance sans que la banque en soit informée. La
      revue annuelle systématique réduit ce risque.
    date: "2023-04-17"
    decided_by: Comité Habilitations
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-portabilite-json-structure
    title: Format JSON structuré pour l'export de portabilité
    statement: >-
      Les exports de portabilité des données personnelles sont produits au format
      JSON avec un schéma versionné et documenté publiquement. Le format CSV est
      abandonné car il ne permet pas d'exprimer les relations entre entités.
    rationale: >-
      Le format JSON permet aux clients techniques d'exploiter leur export plus
      facilement et facilite les transferts vers d'autres établissements.
      La documentation du schéma répond à une recommandation de la CPDONNEES.
    date: "2023-10-08"
    decided_by: DPO
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-segment-calcule-automatiquement
    title: Calcul automatique du segment sans intervention par défaut
    statement: >-
      Le segment commercial d'un client est calculé automatiquement chaque mois
      et ne nécessite pas d'action du conseiller. Les surclassements manuels
      sont strictement encadrés et soumis à validation hiérarchique.
    rationale: >-
      Les surclassements manuels discrétion accordés par le passé avaient créé
      des distorsions dans les statistiques de portefeuille et conduit à des
      offres inadaptées. L'automatisation garantit la cohérence des critères.
    date: "2024-02-19"
    decided_by: Comité Marketing Client
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-signature-qualifiee-onboarding
    title: Signature électronique qualifiée pour l'onboarding
    statement: >-
      Les conventions d'ouverture de compte signées lors du parcours d'onboarding
      digital doivent recourir à la signature électronique qualifiée au sens de
      la réglementation eIDAS fictive. La signature avancée n'est acceptée que
      pour les documents internes non contractuels.
    rationale: >-
      La signature qualifiée offre la valeur légale équivalente au manuscrit et
      réduit le risque de contestation de la convention lors d'un litige ultérieur.
    date: "2023-12-01"
    decided_by: Direction Juridique
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: decision
    id: dec-dref-log-api-immutable
    title: Journaux d'accès API en écriture seule
    statement: >-
      Les journaux d'accès produits par l'API Gateway du référentiel sont stockés
      sur un support en écriture seule pendant toute leur durée de rétention.
      Aucune modification ni suppression n'est possible, même par un administrateur.
    rationale: >-
      L'intégrité des journaux est une exigence de traçabilité imposée par le
      cadre réglementaire fictif SYSTRAIL. La protection contre la suppression
      garantit la valeur probatoire des journaux en cas d'audit.
    date: "2024-01-09"
    decided_by: Comité Sécurité SI
    still_active: true
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-rgpd-collecte-minimale
    title: Minimisation des données collectées à l'onboarding
    statement: >-
      Seules les données strictement nécessaires à la finalité déclarée sont
      collectées lors de l'ouverture de compte. Tout champ supplémentaire doit
      faire l'objet d'une analyse d'impact préalable validée par le DPO.
    source: Règlement RGPD fictif article 5
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-rgpd-droit-effacement
    title: Traitement des demandes de droit à l'effacement sous 30 jours
    statement: >-
      Toute demande de droit à l'effacement reçue d'un client doit être traitée
      dans un délai maximum de 30 jours calendaires. Un accusé de réception
      automatique doit être envoyé dans les 72 heures suivant la réception.
    source: Règlement RGPD fictif article 17
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-lcbft-conservation-kyc
    title: Conservation des dossiers KYC pendant 5 ans
    statement: >-
      Les documents et informations collectés dans le cadre du KYC sont conservés
      pendant au moins cinq ans après la fin de la relation d'affaires. Cette
      obligation s'applique même si le client a exercé son droit à l'effacement.
    source: Directive anti-blanchiment fictive DAMLCBFT
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-lcbft-revue-kyc-pep
    title: Revue KYC annuelle obligatoire pour les PPE
    statement: >-
      Les clients identifiés comme personnes politiquement exposées (PPE) doivent
      faire l'objet d'une revue KYC complète au minimum une fois par an. Les
      dossiers en retard de revue bloquent les nouvelles souscriptions de produits.
    source: Directive DAMLCBFT et politique interne LCB-FT
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-rgpd-portabilite-format
    title: Export de portabilité dans un format lisible par machine
    statement: >-
      Les données fournies en réponse à une demande de portabilité doivent être
      remises dans un format structuré, couramment utilisé et lisible par machine.
      Le délai de mise à disposition ne doit pas excéder 30 jours.
    source: Règlement RGPD fictif article 20
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-acpref-profilage-risque-documente
    title: Documentation obligatoire de la méthode de profilage risque
    statement: >-
      La méthodologie de calcul du profil de risque LCB-FT doit être documentée,
      tenue à jour et communiquée à l'autorité de contrôle fictive ACPREF sur
      simple demande. Toute modification substantielle du modèle fait l'objet
      d'une notification préalable.
    source: Instructions ACPREF sur le pilotage LCB-FT
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-api-tls-13
    title: TLS 1.3 minimum pour les flux API du référentiel
    statement: >-
      L'ensemble des communications entre l'API Gateway du référentiel et ses
      clients doivent utiliser TLS 1.3 au minimum. Les versions antérieures
      sont explicitement interdites et rejetées par la gateway.
    source: Politique de sécurité des systèmes d'information
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-rate-limit-default-1000rpm
    title: Rate-limit par défaut de 1 000 requêtes par minute
    statement: >-
      En l'absence de configuration spécifique, chaque application consommatrice
      est soumise à un quota de 1 000 requêtes par minute. Ce quota ne peut être
      augmenté que sur demande validée par l'équipe sécurité SI.
    source: Politique d'exploitation de l'API Gateway
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-documents-chiffres-au-repos
    title: Chiffrement des documents KYC au repos
    statement: >-
      Tous les documents KYC stockés par le système d'archivage doivent être
      chiffrés au repos avec un algorithme approuvé par la politique de
      cryptographie interne. Les clés de chiffrement sont gérées par le HSM
      centralisé fictif CRYPTOVAULT.
    source: Politique de sécurité des systèmes d'information
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-acces-documents-habilites
    title: Accès aux documents KYC restreint aux profils habilités
    statement: >-
      La consultation des documents KYC archivés est limitée aux agents disposant
      d'une habilitation KYC active dans le référentiel des droits. Tout accès
      est journalisé et consultable dans le journal d'audit centralisé.
    source: Politique de contrôle des accès logiques
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-siren-valide-obligatoire
    title: Numéro SIREN validé obligatoire pour les personnes morales
    statement: >-
      Toute fiche entreprise doit comporter un numéro SIREN vérifié auprès
      du flux INSEE fictif. La création d'une fiche entreprise avec un SIREN
      non validé est bloquée sauf dérogation du responsable conformité.
    source: Politique interne onboarding entreprise
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-delai-traitement-alerte-critique
    title: "Délai de traitement des alertes critiques : 24 heures"
    statement: >-
      Les alertes conformité de niveau critique doivent être prises en charge
      par un gestionnaire dans un délai de 24 heures ouvrées suivant leur
      création. Le non-respect de ce délai déclenche une escalade automatique.
    source: Charte de conformité interne
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-delai-traitement-alerte-medium
    title: "Délai de traitement des alertes moyennes : 5 jours ouvrés"
    statement: >-
      Les alertes conformité de niveau intermédiaire doivent être traitées dans
      les cinq jours ouvrés suivant leur création. Les alertes non traitées
      à l'échéance sont escaladées au responsable d'équipe.
    source: Charte de conformité interne
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-otp-validite-5min
    title: Validité de l'OTP de vérification de 5 minutes
    statement: >-
      Les codes OTP générés pour la vérification d'une modification de coordonnées
      (email, téléphone) ont une durée de validité de cinq minutes. Un code
      utilisé ou expiré est définitivement invalidé et ne peut pas être réutilisé.
    source: Politique de sécurité des systèmes d'information
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-disponibilite-referentiel-99-5
    title: Disponibilité du référentiel client de 99,5 % en heures ouvrées
    statement: >-
      Le référentiel client doit maintenir une disponibilité d'au moins 99,5 %
      pendant les heures ouvrées (8h-20h, jours ouvrés). Les fenêtres de
      maintenance doivent être planifiées hors de cette plage et notifiées
      48 heures à l'avance.
    source: SLA de la direction informatique
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-latence-api-lecture-200ms
    title: Latence des API de lecture inférieure à 200 ms au P95
    statement: >-
      Les endpoints de lecture du référentiel client (consultation de fiche,
      vérification de consentement) doivent répondre en moins de 200 millisecondes
      au 95e percentile en charge nominale. Les dépassements répétés déclenchent
      une analyse de performance.
    source: SLA de la direction informatique
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-portabilite-disponible-48h
    title: Fichier d'export de portabilité disponible 48 heures
    statement: >-
      Le fichier généré en réponse à une demande de portabilité doit rester
      accessible via le lien de téléchargement pendant 48 heures. Passé ce
      délai, le lien est invalidé et une nouvelle demande doit être déposée.
    source: Décision interne DPO
    severity: low
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-score-completude-minimum-ouverture
    title: Score de complétude minimal de 80 % pour toute ouverture de compte
    statement: >-
      La fiche client doit atteindre un score de complétude d'au moins 80 %
      avant qu'une ouverture de compte puisse être finalisée. Les champs
      manquants bloquants sont listés dans le message d'erreur retourné
      au conseiller.
    source: Politique interne qualité données
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-backup-quotidien-referentiel
    title: Sauvegarde quotidienne du référentiel client
    statement: >-
      Les données du référentiel client font l'objet d'une sauvegarde complète
      chaque nuit et d'une sauvegarde différentielle toutes les heures. Le plan
      de reprise d'activité impose un RPO de quatre heures et un RTO de deux heures.
    source: Plan de continuité d'activité
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-journaux-audit-3ans
    title: Rétention des journaux d'audit 3 ans
    statement: >-
      Les journaux d'accès et de modification du référentiel client sont conservés
      pendant trois ans. Cette durée couvre les prescriptions des contrôles
      internes et les éventuelles enquêtes régulateurs.
    source: Politique d'archivage des journaux SI
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-acpref-formation-lcbft-annuelle
    title: Formation LCB-FT annuelle obligatoire pour les gestionnaires KYC
    statement: >-
      Tous les agents impliqués dans le traitement des dossiers KYC et des alertes
      conformité doivent suivre une formation LCB-FT certifiée au moins une fois
      par an. L'accès aux outils de traitement est subordonné à la mise à jour
      de cette certification.
    source: Instructions ACPREF
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-adresse-email-unique-par-client
    title: Unicité de l'adresse e-mail principale par client
    statement: >-
      Chaque client ne peut avoir qu'une seule adresse e-mail principale active.
      Si une adresse e-mail est déjà utilisée par un autre client, une alerte de
      doublon est levée pour analyse avant toute mise à jour.
    source: Politique interne qualité données
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-destruction-papier-24h
    title: Destruction des documents papier dans les 24 heures après numérisation
    statement: >-
      Les documents papier reçus en agence et numérisés pour archivage KYC
      doivent être physiquement détruits dans les 24 heures suivant la
      validation de la numérisation. Un registre de destruction est tenu par
      chaque agence.
    source: Politique de protection des données
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-consentement-version-texte
    title: Versionnage obligatoire du texte légal des consentements
    statement: >-
      Chaque version du texte légal présenté lors de la collecte d'un consentement
      doit être archivée et liée aux consentements recueillis sous cette version.
      La suppression d'une version de texte est interdite si des consentements
      actifs y font référence.
    source: Règlement RGPD fictif et recommandations CPDONNEES
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-matching-seuil-minimal-75pct
    title: Seuil minimal de 0,75 pour la présentation à l'opérateur
    statement: >-
      Seules les paires de fiches présentant un score de similarité supérieur ou
      égal à 0,75 sont soumises à l'opérateur pour décision de fusion. Les paires
      en dessous de ce seuil sont automatiquement rejetées sans intervention humaine.
    source: Politique interne qualité données
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-rgpd-notification-violation
    title: Notification des violations de données sous 72 heures
    statement: >-
      En cas de violation de données à caractère personnel portant sur le
      référentiel client, la CPDONNEES fictive doit être notifiée dans un délai
      maximum de 72 heures après la prise de connaissance de l'incident.
    source: Règlement RGPD fictif article 33
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-tiers-confiance-siren-verifie
    title: SIREN vérifié obligatoire pour les tiers de confiance
    statement: >-
      L'enregistrement d'un organisme comme tiers de confiance nécessite un numéro
      SIREN ou équivalent validé par le flux INSEE fictif. Les associations étrangères
      doivent fournir un identifiant équivalent reconnu par le flux de sources
      externes.
    source: Politique interne des habilitations
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-schema-json-versionne
    title: Schéma JSON des événements référentiel versionné et rétrocompatible
    statement: >-
      Chaque évolution du schéma des événements diffusés par le hub doit être
      rétrocompatible pendant au moins deux versions majeures. Un breaking change
      requiert une migration coordonnée avec l'ensemble des consommateurs abonnés.
    source: Politique d'intégration SI
    severity: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-acces-liste-surveillance-need-to-know
    title: Accès à la liste de surveillance sur principe du besoin d'en savoir
    statement: >-
      La liste des clients sous surveillance renforcée est strictement confidentielle.
      L'accès est réservé aux membres de l'équipe LCB-FT nommément habilités.
      Toute consultation hors de cette liste d'habilités est une violation de
      procédure interne.
    source: Politique de contrôle des accès logiques
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-rgpd-base-legale-documentee
    title: Base légale documentée pour chaque traitement de données
    statement: >-
      Chaque traitement de données personnelles opéré par le référentiel ou les
      systèmes connexes doit disposer d'une base légale explicitement documentée
      dans le registre des traitements. Les traitements sans base légale identifiée
      sont suspendus jusqu'à régularisation.
    source: Règlement RGPD fictif article 6
    severity: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-surclassement-segment-motive
    title: Surclassement de segment commercial obligatoirement motivé
    statement: >-
      Toute modification manuelle du segment commercial d'un client par un
      conseiller doit être accompagnée d'une justification textuelle d'au moins
      30 caractères. Les surclassements non motivés sont automatiquement rejetés
      par le moteur de segmentation.
    source: Politique commerciale interne
    severity: low
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-notification-changement-conseiller
    title: Notification client obligatoire lors d'un changement de conseiller
    statement: >-
      Tout transfert de client vers un nouveau conseiller référent déclenche
      l'envoi d'un courrier ou d'un email d'information au client dans les
      cinq jours ouvrés suivant le transfert. L'absence de canal de contact
      valide doit être signalée avant le transfert.
    source: Charte de la relation client
    severity: low
    domains: [referentiel-client]
    created_from: synthetic

  - type: constraint
    id: con-dref-replay-evenements-30j-max
    title: Fenêtre de rejeu des événements limitée à 30 jours
    statement: >-
      Les consommateurs ne peuvent rejouer les événements référentiel que sur
      une fenêtre maximale de 30 jours glissants. Pour une reconstruction
      complète de l'état, un export initial doit être demandé via la procédure
      dédiée.
    source: Politique d'exploitation du hub événementiel
    severity: low
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-derive-modele-scoring
    title: Dérive du modèle de scoring risque LCB-FT
    statement: >-
      Le modèle de profilage risque peut perdre en précision au fil du temps
      si les comportements client évoluent sans recalibrage. Des clients à
      risque réel pourraient être classés faible risque, échappant à la
      surveillance transactionnelle renforcée.
    likelihood: medium
    impact: high
    domains: [referentiel-client]
    mitigations: [revue semestrielle des performances du modèle, comparaison avec les cas de signalement TRACFIN fictif]
    created_from: synthetic

  - type: risk
    id: risk-dref-fuite-documents-kyc
    title: Fuite de documents KYC archivés
    statement: >-
      Une intrusion dans le système d'archivage ou une mauvaise configuration
      des droits d'accès pourrait exposer des documents d'identité sensibles.
      L'impact est majeur en termes de réputation et de conformité RGPD.
    likelihood: low
    impact: high
    domains: [referentiel-client]
    mitigations: [chiffrement au repos, audit trimestriel des habilitations]
    created_from: synthetic

  - type: risk
    id: risk-dref-perte-evenements-broker
    title: Perte d'événements en cas de défaillance du broker
    statement: >-
      Une défaillance prolongée du broker de messages pourrait entraîner la
      perte d'événements non encore consommés si la fenêtre de rétention est
      dépassée. Les systèmes aval pourraient se retrouver dans un état incohérent
      avec le référentiel maître.
    likelihood: low
    impact: high
    domains: [referentiel-client]
    mitigations: [réplication multi-nœuds du broker, procédure de reconstruction par export initial]
    created_from: synthetic

  - type: risk
    id: risk-dref-doublons-non-detectes
    title: Doublons clients non détectés par le moteur de matching
    statement: >-
      Des variations orthographiques inhabituelles ou des données d'entrée
      de mauvaise qualité peuvent conduire le moteur de correspondance à
      manquer des doublons réels. Ces doublons non détectés faussent les calculs
      d'endettement global et les revues KYC.
    likelihood: medium
    impact: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-indisponibilite-source-externe
    title: Indisponibilité d'une source d'identité externe
    statement: >-
      L'interruption du flux RECIVIL ou du flux INSEE fictif bloquerait les
      processus d'onboarding et de vérification dépendants de ces sources.
      Des dossiers en attente pourraient accumuler des délais dépassant les
      engagements de SLA.
    likelihood: medium
    impact: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-faux-positifs-fusion
    title: Fusions automatiques de fiches incorrectes
    statement: >-
      Un seuil de fusion automatique mal calibré pourrait conduire à la
      fusion de fiches appartenant à des personnes distinctes, en particulier
      pour des noms courants. La récupération manuelle d'une fusion incorrecte
      est coûteuse en temps et risquée pour la relation client.
    likelihood: low
    impact: high
    domains: [referentiel-client]
    mitigations: [audit mensuel des fusions automatiques sur un échantillon aléatoire]
    created_from: synthetic

  - type: risk
    id: risk-dref-consentement-revoque-non-propage
    title: Révocation de consentement non propagée aux systèmes abonnés
    statement: >-
      Un abonné au hub de diffusion affichant un lag important pourrait continuer
      un traitement après révocation du consentement. La fenêtre de non-conformité,
      même brève, constitue une violation RGPD exposant la banque à sanction.
    likelihood: medium
    impact: high
    domains: [referentiel-client]
    mitigations: [alertes de lag en temps réel, SLA de propagation contractualisé avec les équipes consommatrices]
    created_from: synthetic

  - type: risk
    id: risk-dref-fraude-modification-contacts
    title: Fraude par modification frauduleuse des coordonnées
    statement: >-
      Un attaquant ayant compromis un accès client pourrait modifier les
      coordonnées (email, téléphone) pour rediriger les notifications d'alerte
      et réaliser des opérations frauduleuses sans que le client légitime
      en soit informé.
    likelihood: medium
    impact: high
    domains: [referentiel-client]
    mitigations: [OTP obligatoire sur l'ancien canal, délai de prise d'effet de 24 heures]
    created_from: synthetic

  - type: risk
    id: risk-dref-protection-juridique-retard
    title: Retard dans l'enregistrement d'une mesure de protection
    statement: >-
      Un délai entre le prononcé d'une mesure de protection et son enregistrement
      dans le référentiel exposerait la banque à la responsabilité d'avoir
      autorisé des opérations que le client protégé n'était pas en mesure
      d'effectuer seul.
    likelihood: medium
    impact: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-ppm-non-declare
    title: Bénéficiaires effectifs non déclarés sur des personnes morales
    statement: >-
      Certaines entreprises clientes pourraient omettre de déclarer des
      bénéficiaires effectifs franchissant le seuil réglementaire, notamment
      lors de restructurations capitalistiques. L'absence de détection expose
      la banque à un risque LCB-FT non géré.
    likelihood: medium
    impact: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-expiration-token-api-non-geree
    title: Gestion défaillante de l'expiration des jetons OAuth2
    statement: >-
      Une application consommatrice ne gérant pas correctement le renouvellement
      des jetons OAuth2 pourrait générer des interruptions de service inopinées
      lors de l'expiration. Les erreurs 401 en production peuvent impacter
      les parcours client en cours.
    likelihood: medium
    impact: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-surcharge-matchin-masse
    title: Surcharge du moteur de correspondance lors de traitements en masse
    statement: >-
      Les campagnes de déduplication portant sur des millions de fiches peuvent
      saturer les ressources du moteur de matching et dégrader les performances
      de la recherche en temps réel. Un plan de capacité dédié aux campagnes
      de masse est nécessaire.
    likelihood: medium
    impact: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-perte-acces-selfcare
    title: Inaccessibilité de l'espace self-care pour l'exercice des droits
    statement: >-
      Une panne prolongée de l'espace client self-care oblige les clients à
      exercer leurs droits RGPD par d'autres canaux (courrier, agence) plus
      lents et plus coûteux. Le délai de traitement réglementaire reste
      opposable même si l'outil numérique est indisponible.
    likelihood: low
    impact: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-degradation-score-qualite
    title: Dégradation silencieuse du score de qualité des données
    statement: >-
      L'ajout de nouveaux champs obligatoires sans recalcul rétroactif peut
      faire chuter le score de complétude de l'ensemble du référentiel sans
      alerte visible. Les seuils de blocage basés sur ce score deviendraient
      alors trop restrictifs et bloqueraient des dossiers légitimes.
    likelihood: medium
    impact: medium
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-non-conformite-portabilite
    title: Non-conformité du format d'export de portabilité
    statement: >-
      Une évolution du schéma de données du référentiel non répercutée dans
      le générateur d'export de portabilité pourrait produire des fichiers
      incomplets ou invalides. Le client recevrait un export ne reflétant
      pas l'intégralité de ses données, exposant la banque à un manquement RGPD.
    likelihood: low
    impact: high
    domains: [referentiel-client]
    created_from: synthetic

  - type: risk
    id: risk-dref-fraude-onboarding-document
    title: Fraude documentaire lors de l'onboarding digital
    statement: >-
      Des documents d'identité falsifiés sophistiqués pourraient tromper le
      système de vérification documentaire automatisée et permettre l'ouverture
      de comptes frauduleux. Le taux de détection du service OCR doit être
      régulièrement évalué sur des vecteurs d'attaque récents.
    likelihood: medium
    impact: high
    domains: [referentiel-client]
    mitigations: [mise à jour semestrielle du modèle de détection, revue manuelle des cas ambigus]
    created_from: synthetic

  - type: risk
    id: risk-dref-obsolescence-modele-segmentation
    title: Obsolescence du modèle de segmentation commerciale
    statement: >-
      Des changements macroéconomiques ou démographiques non répercutés dans
      les critères de segmentation peuvent rendre les segments commerciaux
      inadaptés à la réalité du portefeuille. Cela se traduit par des offres
      mal ciblées et une érosion de la satisfaction client.
    likelihood: medium
    impact: medium
    domains: [referentiel-client]
    mitigations: [revue annuelle des critères de segmentation par le comité marketing]
    created_from: synthetic

