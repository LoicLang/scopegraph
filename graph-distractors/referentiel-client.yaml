nodes:

  - type: system
    id: sys-dref-portail-consentements
    name: Portail de gestion des consentements client
    description: >-
      Centralise la collecte, le stockage et la révocation des consentements RGPD
      exprimés par les clients particuliers et professionnels. Expose une API REST
      permettant aux canaux front-end d'interroger la validité d'un consentement
      avant tout traitement de données à caractère personnel.
    owner_team: Équipe Conformité Données
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-collecte-consentement
    name: Collecte du consentement en ligne
    description: >-
      Présente les formulaires de recueil du consentement lors de l'ouverture
      de compte et lors de chaque nouveau traitement nécessitant une base légale
      explicite. Les choix sont horodatés et liés à la version du texte légal
      affiché au moment de la signature.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-revocation-consentement
    name: Révocation du consentement
    description: >-
      Permet au client de retirer un consentement à tout moment via l'espace
      personnel en ligne ou en agence. La révocation déclenche une notification
      asynchrone vers les systèmes abonnés afin qu'ils cessent les traitements
      concernés.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-audit-consentements
    name: Journal d'audit des consentements
    description: >-
      Conserve l'historique complet des consentements accordés et révoqués,
      avec la version du texte légal, le canal de collecte et l'identité de
      l'opérateur si la saisie est effectuée en agence.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-moteur-qualite-donnees
    name: Moteur de qualité des données client
    description: >-
      Applique des règles de validation, de normalisation et de complétude sur
      les données du référentiel client. Produit un score de qualité par fiche
      client et génère des alertes à destination des équipes data.
    owner_team: Équipe Qualité Data
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-normalisation-adresse
    name: Normalisation des adresses postales
    description: >-
      Standardise les adresses saisies selon le référentiel postal national fictif
      ADRNORM, corrige les abréviations courantes et détecte les incohérences
      entre code postal et commune. Les corrections sont soumises à validation
      avant application.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-score-completude
    name: Score de complétude de la fiche client
    description: >-
      Calcule un indicateur de complétude de 0 à 100 pour chaque fiche client
      en pondérant les champs obligatoires, recommandés et facultatifs. Ce score
      alimente les tableaux de bord de l'équipe qualité et déclenche des relances
      automatiques pour les fiches incomplètes.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-detection-doublons
    name: Détection des doublons clients
    description: >-
      Compare les nouveaux enregistrements aux fiches existantes via un algorithme
      de similarité phonétique et textuelle. Les paires candidates sont soumises
      à un opérateur pour décision de fusion ou de rejet.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-regles-validation
    name: Moteur de règles de validation métier
    description: >-
      Exécute un catalogue de règles métier paramétrables (format de SIREN,
      cohérence date de naissance / pièce d'identité, présence de l'email
      professionnel pour les personnes morales) lors de toute création ou
      modification de fiche.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-gestion-foyers
    name: Gestionnaire de foyers et ménages
    description: >-
      Modélise les relations entre clients physiques pour constituer des unités
      fiscales et économiques cohérentes (foyers, ménages). Utilisé par les
      produits d'épargne et de crédit pour le calcul de l'endettement global
      et des plafonds mutualisés.
    owner_team: Équipe Relation Client
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-creation-foyer
    name: Création d'un foyer
    description: >-
      Permet de regrouper deux clients ou plus sous un foyer commun en renseignant
      le lien juridique (marié, pacsé, concubin) et la date de prise d'effet.
      Un client ne peut appartenir qu'à un seul foyer actif à la fois.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-dissolution-foyer
    name: Dissolution d'un foyer
    description: >-
      Enregistre la séparation d'un foyer à la date indiquée et bascule les
      membres vers des fiches individuelles autonomes. Les produits partagés
      sont signalés pour traitement manuel par le conseiller référent.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-calcul-endettement-foyer
    name: Calcul de l'endettement global du foyer
    description: >-
      Agrège les encours de crédit de tous les membres d'un foyer pour fournir
      un taux d'endettement global. Ce calcul est exposé en API synchrone pour
      les parcours de souscription crédit.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-referentiel-tiers
    name: Référentiel des tiers et mandataires
    description: >-
      Gère les personnes physiques ou morales qui interagissent avec la banque
      sans être titulaires d'un compte : mandataires, tuteurs, représentants
      légaux et co-signataires. Maintient les liens entre tiers et comptes
      clients.
    owner_team: Équipe Juridique et Comptes
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-ajout-mandataire
    name: Ajout d'un mandataire
    description: >-
      Enregistre un mandataire sur un compte client en saisissant les coordonnées
      du tiers, la pièce d'identité et les pouvoirs délégués. La procuration
      scannée est archivée dans le GED interne.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-revocation-mandataire
    name: Révocation d'un mandataire
    description: >-
      Met fin à un mandat à la date souhaitée et empêche immédiatement tout
      accès aux comptes par le tiers révoqué. Un accusé de réception est généré
      et envoyé par courrier au titulaire du compte.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-consultation-tiers
    name: Consultation des tiers actifs sur un compte
    description: >-
      Expose la liste des mandataires et représentants légaux actifs pour un
      compte donné, avec leurs droits respectifs et la date d'expiration du
      mandat si elle est connue.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-registre-personnes-morales
    name: Registre des personnes morales
    description: >-
      Stocke et met à jour les données d'identité des entreprises et associations
      clientes : SIREN, forme juridique, capital social, représentants légaux
      inscrits au RCS fictif REGISTCO. Alerte sur les changements de dirigeants
      détectés lors des mises à jour périodiques.
    owner_team: Équipe Entreprises
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-onboarding-pm
    name: Onboarding personne morale
    description: >-
      Orchestre la création d'une fiche entreprise en collectant les documents
      requis (Kbis, statuts, liste des bénéficiaires effectifs) et en déclenchant
      les contrôles LCB-FT appropriés avant toute ouverture de compte.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-mise-a-jour-dirigeants
    name: Mise à jour des dirigeants
    description: >-
      Intègre les changements de dirigeants notifiés par les flux REGISTCO et
      les soumet à un workflow de validation interne avant mise à jour de la fiche
      entreprise. Un email d'alerte est envoyé au conseiller référent.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-verification-beneficiaires-effectifs
    name: Vérification des bénéficiaires effectifs
    description: >-
      Contrôle que la liste des bénéficiaires effectifs déclarée par l'entreprise
      correspond aux seuils réglementaires de détention du capital. Tout écart
      déclenche une demande de justificatifs complémentaires.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-hub-diffusion-referentiel
    name: Hub de diffusion du référentiel client
    description: >-
      Distribue les mises à jour du référentiel client vers les systèmes abonnés
      via des flux événementiels (broker de messages interne). Garantit la
      cohérence éventuelle entre le référentiel maître et les répliques locales
      des domaines consommateurs.
    owner_team: Équipe Intégration SI
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-abonnement-evenements
    name: Abonnement aux événements client
    description: >-
      Permet aux équipes consommatrices de s'abonner à des topics d'événements
      (création client, modification d'adresse, changement de statut KYC) en
      déclarant leur application et leur clé de consommation dans le registre
      d'abonnements.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-replay-evenements
    name: Rejeu des événements
    description: >-
      Offre aux consommateurs la possibilité de rejouer les événements d'une
      fenêtre temporelle passée en cas d'incident ou de migration. La rétention
      des événements est configurée à 30 jours par défaut.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-monitoring-diffusion
    name: Supervision de la diffusion
    description: >-
      Expose des métriques sur le lag de consommation par abonné et déclenche
      des alertes opérationnelles si un consommateur accuse un retard supérieur
      au seuil paramétré. Un tableau de bord temps réel est disponible pour
      l'équipe exploitation.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-archivage-kyc
    name: Archivage des dossiers KYC
    description: >-
      Conserve les documents d'entrée en relation (pièces d'identité, justificatifs
      de domicile, formulaires de connaissance client) selon les durées légales.
      Fournit une API de restitution sécurisée pour les contrôleurs internes et
      les auditeurs externes.
    owner_team: Équipe Conformité KYC
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-depot-document-kyc
    name: Dépôt d'un document KYC
    description: >-
      Accepte les documents numérisés au format PDF ou JPEG, vérifie leur
      lisibilité et les classe automatiquement par type (CNI, passeport,
      justificatif de domicile). Le document est chiffré avant stockage.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-expiration-documents
    name: Alerte expiration de documents
    description: >-
      Surveille la date de validité des pièces d'identité archivées et envoie
      une notification au conseiller référent 90 jours avant expiration. Un
      second rappel est émis à 30 jours si aucun document actualisé n'a été
      reçu.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-restitution-document
    name: Restitution d'un document archivé
    description: >-
      Expose un endpoint sécurisé permettant aux profils habilités de télécharger
      un document archivé. Toute consultation est tracée dans le journal d'audit
      avec l'identité du demandeur et l'objet de la consultation.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-espace-client-selfcare
    name: Espace client self-care données personnelles
    description: >-
      Interface web permettant au client de consulter et corriger ses données
      personnelles détenues par la banque, d'exercer ses droits RGPD (accès,
      rectification, portabilité) et de suivre l'état de ses demandes en cours.
    owner_team: Équipe Expérience Client
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-demande-rectification
    name: Demande de rectification de données
    description: >-
      Permet au client de signaler une donnée erronée (nom, adresse, date de
      naissance) et de joindre un justificatif. La demande est routée vers
      le conseiller compétent qui dispose de 72 heures pour la traiter.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-export-portabilite
    name: Export de portabilité des données
    description: >-
      Génère un fichier JSON structuré contenant l'ensemble des données
      personnelles du client sur demande. Le fichier est disponible au
      téléchargement pendant 48 heures via un lien sécurisé à usage unique.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-suivi-demandes-rgpd
    name: Suivi des demandes RGPD
    description: >-
      Affiche l'historique et le statut des demandes d'exercice de droits
      déposées par le client (en cours, traitée, rejetée avec motif). Un
      rappel automatique est envoyé à l'opérateur si la demande dépasse le
      délai réglementaire de 30 jours.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-matching-identite
    name: Moteur de correspondance d'identité
    description: >-
      Détermine si deux fiches client décrivent la même personne physique en
      croisant nom, prénom, date de naissance, adresse et numéro de document
      d'identité via un score probabiliste. Sert de socle à la déduplication
      et aux contrôles de sanctions.
    owner_team: Équipe Data Science Client
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-scoring-ressemblance
    name: Scoring de ressemblance inter-fiches
    description: >-
      Produit un score de similarité entre deux fiches client en combinant
      distance de Levenshtein, phonétique Soundex et correspondance d'adresse
      normalisée. Le seuil de fusion automatique est configurable par paramètre
      d'environnement.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-fusion-fiches
    name: Fusion de fiches dupliquées
    description: >-
      Exécute la fusion de deux fiches identifiées comme doublons en conservant
      la fiche maître, en transférant les produits attachés et en archivant la
      fiche obsolète avec un lien de traçabilité vers la fiche résultante.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-recherche-exacte-identite
    name: Recherche exacte par identité
    description: >-
      Expose un endpoint de recherche par combinaison exacte (nom + prénom +
      date de naissance) retournant les fiches correspondantes avec leur score
      de confiance. Utilisé en priorité lors de l'entrée en relation pour
      détecter un client existant.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-gestion-alertes-conformite
    name: Gestionnaire d'alertes conformité client
    description: >-
      Centralise les alertes émises par les contrôles réglementaires (données
      manquantes, documents expirés, profil de risque modifié) et orchestre
      les workflows de traitement par les équipes conformité. Fournit des
      indicateurs de SLA pour le pilotage opérationnel.
    owner_team: Équipe Conformité KYC
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-creation-alerte-conformite
    name: Création d'une alerte conformité
    description: >-
      Enregistre une alerte conformité avec son niveau de priorité, la donnée
      ou le document concerné et la date limite de résolution. L'alerte est
      immédiatement visible dans le tableau de bord du responsable conformité.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-escalade-alerte
    name: Escalade d'alerte non traitée
    description: >-
      Réassigne automatiquement les alertes conformité non traitées dans les
      délais impartis au responsable hiérarchique du gestionnaire initialement
      assigné. Le nombre d'escalades est tracé à des fins de pilotage RH.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-cloture-alerte
    name: Clôture d'une alerte conformité
    description: >-
      Permet au gestionnaire de clôturer une alerte en saisissant l'action
      corrective effectuée et en joignant éventuellement un document probatoire.
      La clôture est soumise à validation par un superviseur pour les alertes
      de niveau critique.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-catalogue-produits-client
    name: Catalogue produits souscrits par client
    description: >-
      Maintient la liste des produits et services actifs rattachés à chaque
      client (comptes, cartes, assurances, coffres). Sert de référence pour les
      parcours de résiliation, les récapitulatifs annuels et les relances
      commerciales ciblées.
    owner_team: Équipe Offres et Produits
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-souscription-produit
    name: Enregistrement d'une souscription produit
    description: >-
      Attache un nouveau produit souscrit à la fiche client avec la date
      d'effet, les conditions tarifaires applicables et l'identifiant du
      conseiller ayant réalisé la vente. Les données sont propagées vers le
      hub de diffusion du référentiel.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-resiliation-produit
    name: Résiliation d'un produit souscrit
    description: >-
      Enregistre la date de fin de souscription d'un produit et déclenche les
      traitements associés (clôture de compte, désactivation de carte). Un
      questionnaire de satisfaction est envoyé au client dans les 24 heures.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-historique-produits
    name: Historique des produits client
    description: >-
      Conserve l'ensemble des produits souscrits et résiliés d'un client depuis
      l'entrée en relation. Accessible aux conseillers pour contextualiser les
      propositions commerciales et aux auditeurs pour reconstituer l'historique
      relationnel.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-segmentation-client
    name: Moteur de segmentation client
    description: >-
      Calcule et maintient le segment commercial de chaque client (particulier
      standard, premium, professionnel, patrimonial) en fonction de critères
      patrimoniniaux, d'usage et de revenus estimés. Le segment est recalculé
      mensuellement et à chaque événement majeur.
    owner_team: Équipe Marketing Client
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-calcul-segment
    name: Calcul du segment commercial
    description: >-
      Applique les règles de segmentation paramétrées (seuils de revenu estimé,
      encours moyen, ancienneté) pour déterminer le segment d'un client. Le
      recalcul peut être déclenché manuellement par un conseiller en cas de
      situation atypique.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-historique-segments
    name: Historique des changements de segment
    description: >-
      Conserve la chronologie des changements de segment de chaque client avec
      la date, la valeur précédente et la valeur nouvelle. Utilisé pour évaluer
      l'impact des campagnes de fidélisation et la mobilité de la clientèle.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-gestion-contacts
    name: Gestionnaire de contacts et coordonnées
    description: >-
      Gère les canaux de contact des clients (téléphone, email, adresse postale,
      préférences de notification) et assure leur cohérence avec les systèmes
      d'envoi. Intègre un mécanisme de préférence de canal par type d'alerte.
    owner_team: Équipe Relation Client
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-mise-a-jour-email
    name: Mise à jour de l'adresse e-mail
    description: >-
      Enregistre la nouvelle adresse e-mail du client après vérification par
      un code envoyé à l'ancienne adresse, ou après authentification renforcée
      en agence. La modification est tracée dans le journal d'audit.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-mise-a-jour-telephone
    name: Mise à jour du numéro de téléphone
    description: >-
      Valide le nouveau numéro via un OTP envoyé par SMS avant de l'enregistrer.
      Si le numéro est déjà associé à un autre client, une alerte de doublon
      est levée pour analyse par l'équipe qualité.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-preferences-notification
    name: Gestion des préférences de notification
    description: >-
      Permet au client de choisir le canal préféré (SMS, email, notification
      push) pour chaque catégorie d'alerte (mouvements, conformité, commercial).
      Les préférences sont appliquées immédiatement par le système d'envoi.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-referentiel-agences
    name: Référentiel des agences et conseillers
    description: >-
      Maintient la liste des agences et des conseillers référents affectés à
      chaque client. Sert de référence pour le routage des demandes entrantes
      et le pilotage de la charge de travail par portefeuille client.
    owner_team: Équipe Réseau Agences
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-affectation-conseiller
    name: Affectation d'un conseiller référent
    description: >-
      Rattache un client à un conseiller référent et à l'agence correspondante.
      L'historique des affectations successives est conservé pour permettre
      une reprise de contexte lors d'un changement de portefeuille.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-transfert-portefeuille
    name: Transfert de portefeuille client
    description: >-
      Permet le transfert en masse d'un ensemble de clients d'un conseiller
      vers un autre lors d'une réorganisation ou d'un départ. Le transfert est
      planifié pour éviter les pics de charge et chaque client est notifié par
      courrier électronique.
    domains: [referentiel-client]
    created_from: synthetic

  - type: feature
    id: feat-dref-consultation-portefeuille
    name: Consultation du portefeuille client
    description: >-
      Fournit au conseiller la liste filtrée et triée de ses clients avec des
      indicateurs clés (segment, ancienneté, alertes en cours). La vue est
      personnalisable par colonnes et exportable en CSV.
    domains: [referentiel-client]
    created_from: synthetic

  - type: system
    id: sys-dref-profilage-risque-client
    name: Module de profilage risque client
    description: >-
      Attribue à chaque client un profil de risque LCB-FT (faible, modéré,
      élevé) en agrégeant les signaux issus des systèmes de surveillance et
      les données déclaratives. Le profil conditionne la fréquence des revues
      KYC périodiques.
    owner_team: Équipe Risques LCB-FT
    domains: [referentiel-client]
    known_risks: [dérive de classification, faux négatifs sur profils politiquement exposés]
