  # === DECISIONS (22 total) ===

  - type: decision
    id: dec-dsoc-bus-asynchrone-standard
    title: Bus asynchrone comme standard d'intégration
    statement: >-
      Tout échange de données entre systèmes du socle doit transiter par le
      bus HERMES sauf contrainte technique documentée. Les appels synchrones
      REST restent permis pour les requêtes à faible latence dûment justifiées.
    rationale: >-
      L'historique des incidents a montré que les couplages synchrones
      généralisent les pannes en cascade. Le bus offre résilience, rejeu et
      traçabilité sans surcoût.
    date: "2022-09-15"
    decided_by: Comité Architecture Socle
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-openapi-obligatoire
    title: OpenAPI obligatoire pour toute nouvelle API
    statement: >-
      Toute API interne exposée par un système du socle doit être décrite par
      une spécification OpenAPI 3.1 publiée dans KATALOG avant mise en
      production. Les API sans spécification sont refusées par le pipeline.
    rationale: >-
      L'absence de contrat formel a généré des intégrations fragiles et des
      régressions non détectées. La spécification préalable force le design
      first et facilite les tests de compatibilité.
    date: "2023-03-01"
    decided_by: Comité Gouvernance API
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-secrets-centralises
    title: Centralisation obligatoire des secrets dans ARKAN
    statement: >-
      Aucun secret ne peut être stocké dans un dépôt de code, une variable
      d'environnement statique ou un fichier de configuration non chiffré.
      Toute exception requiert une dérogation signée par le RSSI.
    rationale: >-
      L'audit de sécurité de 2021 a révélé plusieurs secrets exposés dans
      des dépôts privés. La centralisation dans ARKAN permet la rotation
      automatique et la traçabilité des accès.
    date: "2021-11-01"
    decided_by: RSSI Groupe
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-containers-obligatoires
    title: Conteneurisation obligatoire des nouveaux services
    statement: >-
      Tout nouveau service du socle doit être déployé sous forme de conteneur
      sur KUBOS. Les déploiements sur machines virtuelles dédiées sont
      interdits pour les nouvelles applications depuis 2023.
    rationale: >-
      La plateforme KUBOS a atteint la maturité opérationnelle permettant
      d'absorber l'ensemble du socle. La standardisation réduit la dette
      opérationnelle et facilite la portabilité.
    date: "2023-01-10"
    decided_by: Comité Architecture Socle
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-gitops-only
    title: GitOps comme seul mode de déploiement autorisé
    statement: >-
      À compter de la migration complète dans FORGEFLOW, tout déploiement
      manuel en production est interdit. Les pipelines doivent être la seule
      voie d'acheminement vers les environnements de production.
    rationale: >-
      Les déploiements manuels ont causé trois incidents majeurs en deux ans
      liés à des erreurs humaines. Le GitOps garantit la traçabilité, la
      reproductibilité et la réversibilité des changements.
    date: "2024-06-01"
    decided_by: Comité Change Management
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-retention-metriques-13-mois
    title: Rétention des métriques fixée à treize mois
    statement: >-
      Les métriques d'infrastructure collectées par VIGIL sont conservées
      treize mois, permettant les comparaisons annuelles avec marge. Au-delà,
      seules les agrégations mensuelles sont préservées sur cinq ans.
    rationale: >-
      Treize mois couvrent un cycle annuel complet avec chevauchement pour
      la détection des dérives saisonnières. La conservation plus longue
      en agrégat répond aux besoins de tendance sans coût de stockage excessif.
    date: "2022-04-15"
    decided_by: Comité Exploitation Socle
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-hsm-obligatoire-cles-critiques
    title: HSM obligatoire pour les clés de niveau critique
    statement: >-
      Les clés cryptographiques de niveau CRITIQUE (chiffrement de données
      personnelles, signature de tokens d'authentification) doivent être
      générées et stockées exclusivement dans le HSM de CRYPTA. Aucune
      génération logicielle n'est tolérée pour ces niveaux.
    rationale: >-
      Les modules logiciels de génération de clés présentent une surface
      d'attaque insuffisamment maîtrisée pour les actifs les plus sensibles
      du groupe.
    date: "2023-09-01"
    decided_by: RSSI Groupe
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-oidc-standard-auth
    title: OIDC comme standard d'authentification inter-services
    statement: >-
      Toutes les authentifications machine-à-machine au sein du socle doivent
      utiliser le flux OIDC client_credentials via NEXID. Les mécanismes
      d'authentification propriétaires (IP whitelisting, basic auth) sont
      interdits pour les nouvelles intégrations.
    rationale: >-
      L'harmonisation des mécanismes d'authentification simplifie les audits
      de sécurité et la rotation des credentiels. NEXID offre la traçabilité
      centralisée des accès inter-services.
    date: "2023-06-15"
    decided_by: Comité Sécurité Architecture
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-archivage-scellement-etsi
    title: Scellement ETSI obligatoire pour les archives probantes
    statement: >-
      Tout document conservé dans ARCHON à des fins de preuve légale doit
      porter un sceau horodaté conforme au profil ETSI TS 119 511. Les
      archives sans scellement valide ne peuvent être produites en justice.
    rationale: >-
      La réglementation bancaire impose la valeur probante des archives
      sur les durées légales. Le standard ETSI est le seul profil reconnu
      par les juridictions européennes pour les prestataires de confiance.
    date: "2022-07-01"
    decided_by: Direction Juridique
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-nomex-source-verite
    title: NOMEX comme source de vérité unique des codes de référence
    statement: >-
      Toute liste de valeurs contrôlées partagée entre deux systèmes ou plus
      doit être hébergée dans NOMEX. La duplication locale de ces listes est
      interdite sauf cache en lecture avec invalidation automatique.
    rationale: >-
      La fragmentation des référentiels a engendré des incohérences coûteuses
      lors des intégrations. La centralisation simplifie la gouvernance et
      assure la cohérence sémantique des échanges.
    date: "2023-11-15"
    decided_by: Comité Gouvernance Données
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-sla-disponibilite-99-9
    title: SLA de disponibilité 99,9 % pour les services critiques du socle
    statement: >-
      Les services classés CRITIQUES dans le registre de criticité de VIGIL
      doivent atteindre un taux de disponibilité mensuel de 99,9 % minimum.
      Tout écart fait l'objet d'un post-mortem et d'engagements de remédiation.
    rationale: >-
      Les services du socle sont des dépendances transversales pour les
      applications métier. Un SLA formalisé impose la discipline d'ingénierie
      de fiabilité nécessaire à leur maintien.
    date: "2022-01-01"
    decided_by: Direction des Opérations IT
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-zero-secret-statique
    title: Objectif zéro secret statique d'ici 2025
    statement: >-
      Tous les secrets statiques (mots de passe de base de données, clés API)
      actuellement configurés en dur doivent être migrés vers ARKAN avec
      rotation automatique avant fin 2025. Suivi mensuel en comité sécurité.
    rationale: >-
      Le programme de rotation automatique prouve son efficacité sur les
      nouveaux systèmes. L'extension à l'existant réduit la surface d'exposition
      résiduelle identifiée lors des audits.
    date: "2024-01-15"
    decided_by: RSSI Groupe
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-kafka-protocol-interne
    title: Protocole Kafka pour le bus interne
    statement: >-
      Le bus d'événements HERMES repose sur le protocole Apache Kafka.
      Les équipes consommatrices doivent utiliser les clients SDK fournis
      par l'équipe Intégration Socle plutôt que des clients communautaires
      non qualifiés.
    rationale: >-
      La qualification du SDK maison garantit le respect des conventions
      de nommage, le traçage des corrélations et les bonnes pratiques de
      gestion des offsets pour éviter les pertes de messages.
    date: "2022-09-15"
    decided_by: Comité Architecture Socle
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-revue-droits-annuelle
    title: Revue annuelle obligatoire des habilitations applicatives
    statement: >-
      Toutes les habilitations accordées via PERIMA doivent être recertifiées
      annuellement par le responsable de la ressource concernée. Les droits
      non recertifiés sont automatiquement révoqués à l'échéance.
    rationale: >-
      Le principe du moindre privilège impose de vérifier périodiquement
      la légitimité des accès. La revue annuelle est le standard minimal
      requis par la politique de sécurité groupe.
    date: "2023-04-01"
    decided_by: Comité Sécurité Architecture
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-iso20022-standard-messages
    title: ISO 20022 comme standard des messages financiers
    statement: >-
      Tous les nouveaux types de messages financiers inter-systèmes adoptent
      le standard ISO 20022 pour la structuration des données. La conversion
      vers les formats anciens est assurée par la couche d'adaptation de CORVUS.
    rationale: >-
      La convergence du marché sur ISO 20022 impose l'alignement du socle
      pour faciliter l'interopérabilité avec les nouvelles infrastructures
      de marché et les partenaires européens.
    date: "2023-05-20"
    decided_by: Comité Architecture Socle
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-separation-roles-cle
    title: Séparation des rôles pour la gestion des clés
    statement: >-
      La gestion des clés cryptographiques dans CRYPTA requiert la participation
      d'au moins deux personnes aux rôles différents (Key Custodian et Key
      Administrator) pour toute opération sensible sur une clé de niveau CRITIQUE.
    rationale: >-
      La séparation des rôles empêche qu'une seule personne compromisse
      l'ensemble des actifs cryptographiques. Exigence du standard PCI-HSM
      applicable à nos modules matériels.
    date: "2023-09-01"
    decided_by: RSSI Groupe
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-test-reprise-trimestriel
    title: Tests de reprise sur incident trimestriels
    statement: >-
      Chaque service classé CRITIQUE du socle doit faire l'objet d'un test de
      reprise après sinistre au moins une fois par trimestre. Les résultats
      sont documentés dans INFOCALL et remontés au Comité Risques IT.
    rationale: >-
      Les procédures de reprise non testées deviennent caduques. Les tests
      réguliers valident les délais de rétablissement et maintiennent les
      équipes d'exploitation en condition opérationnelle.
    date: "2022-10-01"
    decided_by: Comité Risques IT
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-semver-api
    title: Versionnement sémantique des API
    statement: >-
      Les API publiées dans KATALOG adoptent le versionnement sémantique
      (MAJOR.MINOR.PATCH). Un changement MAJOR rompt la compatibilité et
      requiert un plan de migration à destination des consommateurs.
    rationale: >-
      Le versionnement sémantique communique clairement l'impact d'un
      changement aux équipes consommatrices et réduit les régressions
      involontaires dues à des mises à jour silencieuses.
    date: "2023-03-01"
    decided_by: Comité Gouvernance API
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-tracing-distribue
    title: Traçage distribué obligatoire
    statement: >-
      Tout service du socle exposant une API ou consommant le bus HERMES doit
      propager un identifiant de corrélation (trace-id) dans tous ses appels
      sortants. La génération et la propagation sont assurées par le SDK fourni.
    rationale: >-
      L'absence de corrélation entre les logs de services différents allonge
      considérablement les investigations d'incident. Le traçage distribué
      permet la reconstruction du chemin d'exécution en moins de dix minutes.
    date: "2023-07-01"
    decided_by: Comité Exploitation Socle
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-backup-quotidien
    title: Sauvegarde quotidienne des données critiques
    statement: >-
      Les bases de données et volumes persistants hébergeant des données
      classées CRITIQUES ou SENSIBLES font l'objet d'une sauvegarde complète
      quotidienne et d'une sauvegarde incrémentale toutes les quatre heures.
    rationale: >-
      Un RPO maximal de quatre heures a été défini en accord avec les
      propriétaires de données. La sauvegarde quotidienne complète facilite
      les restaurations après corruption.
    date: "2021-06-01"
    decided_by: Comité Risques IT
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-alerting-itsm-auto
    title: Intégration automatique alertes VIGIL vers INFOCALL
    statement: >-
      Toute alerte de niveau CRITIQUE émise par VIGIL doit créer automatiquement
      un ticket incident dans INFOCALL sans intervention manuelle. Le titre
      et la description sont construits depuis le contexte de l'alerte.
    rationale: >-
      La création manuelle de tickets introduit des délais d'enregistrement
      et des pertes d'information dans les situations à forte pression. L'automatisation
      garantit la traçabilité dès la détection.
    date: "2024-02-01"
    decided_by: Comité Exploitation Socle
    still_active: true
    domains: [socle-si]
    created_from: synthetic

  - type: decision
    id: dec-dsoc-purge-batch-heure-creuse
    title: Exécution des purges batch en heures creuses
    statement: >-
      Les traitements de purge réglementaire orchestrés par KRONOS doivent
      être planifiés entre 23h00 et 05h00 afin de minimiser leur impact sur
      les performances des systèmes transactionnels.
    rationale: >-
      Les purges volumiques génèrent une charge d'I/O significative sur le
      stockage partagé. Leur exécution nocturne évite la contention avec les
      traitements de journée et les flux de paiement.
    date: "2022-03-15"
    decided_by: Comité Exploitation Socle
    domains: [socle-si]
    created_from: synthetic

  # === CONSTRAINTS (33 total) ===

  - type: constraint
    id: con-dsoc-disponibilite-bus-critique
    title: Disponibilité 99,95 % du bus HERMES
    statement: >-
      Le bus d'événements HERMES doit maintenir une disponibilité mensuelle
      de 99,95 %, soit moins de vingt-deux minutes d'interruption par mois.
      Toute fenêtre de maintenance planifiée doit avoir lieu entre 02h00 et
      04h00 hors jours ouvrés.
    source: Convention de service Socle SI v3.2
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-chiffrement-transit
    title: Chiffrement TLS 1.3 obligatoire en transit
    statement: >-
      Tous les flux de données entre composants du socle traversant le réseau
      doivent utiliser TLS version 1.3 minimum. Les configurations TLS 1.2
      sont tolérées jusqu'au 31 décembre 2025 pour les systèmes legacy en
      cours de migration.
    source: Politique de Sécurité des Échanges - RSSI Groupe
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-rpo-quatre-heures
    title: RPO maximal de quatre heures pour les données critiques
    statement: >-
      Les données classées CRITIQUES dans le registre de sensibilité doivent
      pouvoir être restaurées avec une perte maximale de quatre heures de
      transactions. Cette exigence conditionne la fréquence des sauvegardes.
    source: Plan de Continuité d'Activité Groupe
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-rto-deux-heures
    title: RTO de deux heures pour les services du socle critique
    statement: >-
      Les services classés CRITIQUES doivent être rétablis dans un délai
      maximum de deux heures après détection d'un incident majeur. Les
      procédures de bascule sont testées trimestriellement.
    source: Plan de Continuité d'Activité Groupe
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-audit-annuel-securite
    title: Audit de sécurité annuel obligatoire
    statement: >-
      L'ensemble des composants du socle exposant des interfaces réseau
      ou manipulant des données sensibles est soumis à un audit de sécurité
      externe annuel. Le rapport est transmis au régulateur sur demande.
    source: Politique de Sécurité SI - Direction Générale
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-isolation-prod
    title: Isolation stricte des environnements de production
    statement: >-
      Aucun flux de données réelles ne peut transiter vers les environnements
      hors production. Les données de test sont systématiquement anonymisées
      ou synthétisées avant utilisation en recette ou développement.
    source: Règlement Intérieur SI - Comité Sécurité
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-revue-code-obligatoire
    title: Revue de code obligatoire avant fusion
    statement: >-
      Tout code soumis dans les dépôts du socle doit avoir reçu l'approbation
      d'au moins un pair avant fusion dans la branche principale. Les revues
      automatisées ne se substituent pas à la validation humaine.
    source: Charte Qualité Développement Socle
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-log-retention-un-an
    title: Rétention des logs applicatifs un an minimum
    statement: >-
      Les logs applicatifs des systèmes du socle doivent être conservés au
      moins un an en ligne et cinq ans en archive froide. L'accès aux logs
      archivés est soumis à justification et traçabilité.
    source: Politique de Gestion des Traces - RSSI
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-plafond-latence-api
    title: Latence API interne P99 inférieure à 500 ms
    statement: >-
      Les API synchrones internes du socle doivent respecter un temps de
      réponse P99 inférieur à cinq cents millisecondes en charge nominale.
      Les dépassements persistants déclenchent une revue d'architecture.
    source: Standard de Performance API Socle v1.4
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-mfa-acces-sensible
    title: MFA obligatoire pour les accès aux données sensibles
    statement: >-
      Tout accès humain aux interfaces d'administration des systèmes classés
      SENSIBLES ou CRITIQUES requiert une authentification multifacteur.
      L'utilisation d'un token matériel est imposée pour les environnements
      de production.
    source: Politique d'Authentification - RSSI Groupe
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-fenetre-deploiement
    title: Fenêtres de déploiement contrôlées en production
    statement: >-
      Les déploiements en production de composants classés CRITIQUES sont
      autorisés uniquement le mardi et le jeudi entre 09h00 et 11h30 hors
      périodes de restriction (clôture mensuelle, J-fériés).
    source: Politique de Gestion des Changements IT
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-vulnerabilites-critiques
    title: Correctif des vulnérabilités critiques sous 72 heures
    statement: >-
      Toute vulnérabilité de niveau CRITIQUE (CVSS ≥ 9,0) identifiée sur un
      composant du socle doit être corrigée et déployée dans un délai de
      soixante-douze heures. Un plan de mitigation doit être activé dans
      les quatre heures.
    source: Politique de Gestion des Vulnérabilités - RSSI
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-pas-lib-non-qualifiee
    title: Interdiction des bibliothèques tierces non qualifiées
    statement: >-
      Toute bibliothèque logicielle externe intégrée dans le socle doit avoir
      été qualifiée par l'équipe Sécurité selon le processus SBOM. L'utilisation
      de bibliothèques non référencées dans le catalogue approuvé est bloquée
      par le pipeline.
    source: Politique de Gestion des Composants Tiers - RSSI
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-conservation-messages-bus
    title: Conservation des messages du bus sept jours
    statement: >-
      Les messages publiés dans HERMES sont conservés au minimum sept jours
      pour permettre le rejeu en cas d'incident consommateur. Les topics à
      haute volumétrie peuvent réduire cette rétention à quarante-huit heures
      sur dérogation du Comité Architecture.
    source: Standard d'Exploitation du Bus HERMES v2.1
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-plan-comptable-acbf
    title: Conformité au plan comptable des établissements de crédit
    statement: >-
      Le plan comptable géré par COMPTALIB et NOMEX doit être conforme au
      règlement n°2014-07 de l'Autorité des Normes Comptables applicable aux
      établissements de crédit. Toute modification requiert validation
      de la direction comptable.
    source: Règlement ANC 2014-07
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-conformite-swift-cscf
    title: Conformité SWIFT CSCF obligatoire
    statement: >-
      L'infrastructure de connexion à SWIFTNet doit répondre aux exigences
      du Customer Security Controls Framework (CSCF) de SWIFT, attestée
      annuellement. Le non-respect entraîne la suspension de la connexion.
    source: SWIFT Customer Security Programme
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-bilan-carbone-datacenter
    title: Bilan carbone datacenter limité
    statement: >-
      Les déploiements de nouveaux composants dans le socle doivent s'inscrire
      dans l'enveloppe carbone allouée par le programme Green IT du groupe.
      Tout composant nécessitant plus de cinquante nœuds doit faire l'objet
      d'une évaluation d'impact environnemental préalable.
    source: Politique RSE Groupe - Direction Développement Durable
    severity: low
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-journalisation-acces-donnees
    title: Journalisation de tout accès aux données personnelles
    statement: >-
      Tout accès à des données à caractère personnel stockées dans le socle
      doit être consigné dans le journal d'audit avec l'identité de l'auteur,
      la ressource accédée et la finalité déclarée. Conservation cinq ans.
    source: RGPD Article 30 et politique DPO Groupe
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-tests-charge-avant-prod
    title: Tests de charge obligatoires avant mise en production critique
    statement: >-
      Tout composant du socle classé CRITIQUE ou traitant plus de mille
      requêtes par seconde doit passer des tests de charge validant les
      SLA de performance avant chaque déploiement majeur en production.
    source: Standard de Qualité des Mises en Production Socle
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-documentation-adr
    title: ADR obligatoire pour les décisions d'architecture structurantes
    statement: >-
      Toute décision d'architecture impactant deux systèmes du socle ou plus
      doit être formalisée sous forme d'Architecture Decision Record (ADR)
      et approuvée par le Comité Architecture avant mise en oeuvre.
    source: Charte Architecture Socle SI v2.0
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-segregation-reseau-pci
    title: Ségrégation réseau pour les composants sensibles
    statement: >-
      Les composants du socle manipulant des données financières sensibles
      doivent être déployés dans des namespaces réseau isolés avec des règles
      de flux strictement limitatives. Toute ouverture de flux est soumise
      à validation sécurité.
    source: Politique de Segmentation Réseau - RSSI
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-capacite-bus-evenements
    title: Capacité nominale du bus HERMES
    statement: >-
      Le bus HERMES doit supporter en charge nominale cent mille messages
      par seconde avec un délai de propagation inférieur à dix millisecondes
      pour les topics critiques. Un exercice de capacité est mené semestriellement.
    source: Contrat de Performance HERMES v2.1
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-rotation-secret-max-90j
    title: Durée de vie maximale d'un secret applicatif
    statement: >-
      Tout secret applicatif géré par ARKAN doit être renouvelé au maximum
      tous les quatre-vingt-dix jours. Les secrets non renouvelés dans ce
      délai sont automatiquement révoqués avec notification à l'équipe
      propriétaire.
    source: Politique de Gestion des Secrets - RSSI Groupe
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-couverture-tests-70pct
    title: Couverture de tests unitaires 70 % minimum
    statement: >-
      Le code des composants du socle doit maintenir une couverture de tests
      unitaires d'au moins soixante-dix pour cent. Le pipeline bloque la
      fusion si la couverture passe en dessous de ce seuil sur les nouvelles
      lignes de code ajoutées.
    source: Charte Qualité Développement Socle
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-archivage-traces-audit
    title: Archivage des traces d'audit dans ARCHON
    statement: >-
      Les journaux d'audit générés par le socle doivent être versés dans
      ARCHON dans les vingt-quatre heures suivant leur production. La
      conservation à valeur probante est de dix ans pour les opérations
      financières.
    source: Politique de Conservation des Traces - DPO et Direction Juridique
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-norme-nommage-api
    title: Norme de nommage des API internes
    statement: >-
      Les chemins des API internes du socle respectent la convention
      REST définie dans le standard KATALOG : ressources en minuscules
      kebab-case, pluriels, sans verbe dans l'URI. Les écarts bloquent
      la validation du lint OpenAPI.
    source: Standard de Nommage API Socle v1.2
    severity: low
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-limitation-privilege-compte-technique
    title: Limitation des privilèges des comptes techniques
    statement: >-
      Les comptes techniques provisionnés dans NEXID ne peuvent disposer
      que des droits strictement nécessaires à leur fonction (principe du
      moindre privilège). Les droits d'administration sont interdits aux
      comptes de service applicatifs.
    source: Politique IAM Groupe - RSSI
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-dependances-batch-documentees
    title: Documentation obligatoire des dépendances batch
    statement: >-
      Tout job enregistré dans KRONOS doit déclarer ses dépendances amont
      et les services dont il requiert la disponibilité. Les jobs sans
      documentation de dépendances sont refusés à l'enregistrement.
    source: Standard d'Exploitation KRONOS v1.3
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-schema-avro-obligatoire
    title: Schéma Avro obligatoire pour les topics du bus
    statement: >-
      Tout topic créé dans le bus HERMES doit disposer d'un schéma Avro
      enregistré dans le registre de schémas avant la première publication.
      Les messages non conformes au schéma sont rejetés par le broker.
    source: Standard d'Intégration HERMES v2.0
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-conformite-rgpd-donnees-test
    title: Anonymisation des données pour les environnements hors production
    statement: >-
      Toute donnée à caractère personnel utilisée dans un environnement
      non productif (développement, recette, formation) doit être anonymisée
      ou synthétisée. L'utilisation de données réelles hors production est
      une violation de la politique RGPD groupe.
    source: Politique RGPD Groupe - DPO
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-image-base-approuvee
    title: Images de base de conteneur approuvées obligatoires
    statement: >-
      Les images Docker déployées sur KUBOS doivent utiliser une image de
      base issue du catalogue d'images approuvées, maintenues et scannées
      par l'équipe Sécurité. L'usage d'images communautaires non approuvées
      est bloqué par l'admission controller du cluster.
    source: Politique de Sécurité Conteneurs - RSSI
    severity: high
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-supervision-obligatoire
    title: Supervision VIGIL obligatoire pour les services du socle
    statement: >-
      Tout service déployé dans le socle doit exposer un endpoint /health
      conforme au standard VIGIL et être enregistré dans la plateforme
      de supervision. Les services non supervisés ne peuvent recevoir de
      trafic de production.
    source: Standard d'Exploitation VIGIL v2.3
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  - type: constraint
    id: con-dsoc-format-log-structure
    title: Format de log structuré JSON obligatoire
    statement: >-
      Tous les composants du socle doivent émettre leurs logs en format JSON
      structuré avec les champs obligatoires : timestamp ISO 8601, niveau,
      service, trace-id et message. Les logs non structurés sont refusés par
      l'agrégateur de logs.
    source: Standard de Journalisation Socle v1.5
    severity: medium
    domains: [socle-si]
    created_from: synthetic

  # === RISKS (17 total) ===

  - type: risk
    id: risk-dsoc-panne-bus-evenements
    title: Panne du bus d'événements HERMES
    statement: >-
      Une indisponibilité prolongée d'HERMES interromprait les échanges
      asynchrones entre tous les systèmes du socle, provoquant l'accumulation
      de traitements en attente et des incohérences de données entre systèmes.
    likelihood: low
    impact: high
    mitigations:
      - Architecture multi-broker avec réplication synchrone entre deux datacenters.
      - Tests de bascule trimestriels pour valider les procédures de reprise.
      - Mécanismes de dégradation gracieuse côté producteurs en cas d'indisponibilité.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-compromission-secret
    title: Compromission d'un secret applicatif
    statement: >-
      L'exfiltration d'un secret applicatif via une vulnérabilité ou une erreur
      humaine pourrait permettre l'accès non autorisé à des systèmes ou données
      sensibles. Le risque est amplifié par les secrets longue durée résiduels
      non encore migrés vers ARKAN.
    likelihood: medium
    impact: high
    mitigations:
      - Rotation automatique des secrets applicatifs tous les quatre-vingt-dix jours.
      - Détection d'usage anormal dans les journaux d'audit ARKAN avec alerting.
      - Programme d'élimination des secrets statiques suivi en comité sécurité.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-dette-securite-images
    title: Images de conteneur avec vulnérabilités non patchées
    statement: >-
      L'accumulation de vulnérabilités dans les images de base non mises à jour
      expose le socle à des exploitations connues. Le rythme de mise à jour
      des images de base peut être insuffisant face à la fréquence de
      publication des CVE critiques.
    likelihood: medium
    impact: high
    mitigations:
      - Scan automatique des images à chaque build et en continu sur le registre.
      - Politique de patch critique sous 72 heures avec procédure d'urgence.
      - Mise à jour mensuelle planifiée des images de base approuvées.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-perte-donnees-archivage
    title: Perte d'archives légales
    statement: >-
      Une défaillance du système ARCHON ou une corruption du coffre de
      scellement pourrait entraîner la perte d'archives à valeur probante,
      exposant la banque à des risques juridiques lors de litiges.
    likelihood: low
    impact: high
    mitigations:
      - Triple réplication géographique des archives sur trois datacenters.
      - Tests de restauration semestriels avec vérification des scellements.
      - Supervision continue de l'intégrité cryptographique des archives.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-depassement-capacite-kubos
    title: Saturation de la plateforme KUBOS
    statement: >-
      La croissance non maîtrisée des ressources demandées par les équipes
      pourrait saturer les nœuds de KUBOS, dégradant l'ensemble des services
      déployés. Le manque d'anticipation dans les demandes de capacité est
      un facteur aggravant.
    likelihood: medium
    impact: medium
    mitigations:
      - Quotas par namespace avec alertes automatiques à 80 % d'utilisation.
      - Comité de capacité mensuel avec projection à six mois.
      - Procédure d'extension de capacité en urgence sous quatre heures.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-fragmentation-nomenclature
    title: Fragmentation du référentiel de nomenclature
    statement: >-
      Des équipes pourraient maintenir des copies locales de listes de valeurs
      non synchronisées avec NOMEX, entraînant des incohérences dans les
      échanges inter-systèmes et des rejets lors des contrôles de cohérence.
    likelihood: medium
    impact: medium
    mitigations:
      - Contrôles automatiques de cohérence référentielle dans les pipelines.
      - Campagne d'audit et de migration des listes locales identifiées par domaine.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-incident-batch-cloture
    title: Incident batch lors de la clôture comptable
    statement: >-
      Un échec de job dans KRONOS lors de la séquence de clôture journalière
      peut bloquer l'ensemble de la chaîne comptable et retarder la publication
      des positions, avec impact direct sur les activités de marché et
      les reportings réglementaires.
    likelihood: medium
    impact: high
    mitigations:
      - Simulation de clôture hebdomadaire en environnement hors production.
      - Procédures de reprise documentées et testées pour chaque job critique.
      - Astreinte dédiée planifiée lors des clôtures de fin de mois.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-obsolescence-sdk-bus
    title: Obsolescence des SDK consommateurs du bus
    statement: >-
      Des SDK anciens non mis à jour par les équipes consommatrices pourraient
      perdre la compatibilité avec les évolutions du bus HERMES, entraînant
      des pertes de messages silencieuses ou des erreurs de désérialisation.
    likelihood: medium
    impact: medium
    mitigations:
      - Registre centralisé des versions de SDK déployées en production.
      - Politique de dépréciation formelle avec avertissements automatiques.
      - Tests de compatibilité ascendante systématiques à chaque version du bus.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-interruption-swift
    title: Interruption de la connexion SWIFTNet
    statement: >-
      Une coupure de la connexion SWIFTNet bloquerait tous les échanges
      financiers inter-banques transitant par CORVUS, impactant les opérations
      de correspondance bancaire et potentiellement les positions de liquidité.
    likelihood: low
    impact: high
    mitigations:
      - Second nœud SWIFTNet en mode actif-actif pour éliminer le point unique de défaillance.
      - Procédures dégradées documentées pour les échanges critiques en cas de coupure.
      - Supervision 24/7 de la connexion avec escalade automatique.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-derive-perimetres-droits
    title: Dérive des périmètres de droits applicatifs
    statement: >-
      En l'absence de revues régulières, les habilitations accordées dans PERIMA
      peuvent s'accumuler et dépasser les besoins réels, augmentant la surface
      d'exposition en cas de compromission d'un compte.
    likelihood: high
    impact: medium
    mitigations:
      - Revues annuelles automatisées dans PERIMA avec révocation des droits non recertifiés.
      - Rapport mensuel des droits dormants transmis aux responsables de ressource.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-non-conformite-swift-cscf
    title: Non-conformité SWIFT CSCF
    statement: >-
      Un écart persistant aux exigences du Customer Security Controls Framework
      SWIFT non corrigé dans les délais pourrait conduire à la suspension
      de la connexion SWIFTNet par SWIFT, interrompant les paiements internationaux.
    likelihood: low
    impact: high
    mitigations:
      - Audit CSCF interne semestriel avec rapport à la direction de la sécurité.
      - Suivi des actions correctives en comité mensuel dédié.
      - Correspondant SWIFT dédié dans l'équipe sécurité pour le suivi réglementaire.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-erreur-configuration-prod
    title: Erreur de configuration en production
    statement: >-
      Un paramètre de configuration erroné déployé via CONFIGURA en production
      peut provoquer des dysfonctionnements applicatifs étendus avant détection.
      Le rechargement à chaud augmente la vitesse de propagation.
    likelihood: medium
    impact: high
    mitigations:
      - Validation syntaxique et sémantique automatique avant tout déploiement.
      - Canary deployment sur un sous-ensemble d'instances avant généralisation.
      - Rollback automatique déclenché sur dégradation des health-checks post-déploiement.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-fragmentation-deploiement
    title: Fragmentation des pratiques de déploiement
    statement: >-
      Des équipes continuant des pratiques de déploiement manuel parallèlement
      au pipeline FORGEFLOW créent des incohérences non détectables entre
      l'état du dépôt de code et l'état réel de la production.
    likelihood: medium
    impact: medium
    mitigations:
      - Suppression des accès de déploiement manuel sur les environnements de production.
      - Monitoring des divergences entre registre VERSIO et état réel des pods KUBOS.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-saturation-archivage
    title: Saturation du stockage d'archivage
    statement: >-
      La croissance non anticipée du volume d'archives versées dans ARCHON
      pourrait saturer le stockage et bloquer les nouvelles entrées, créant
      un risque de non-conservation réglementaire.
    likelihood: low
    impact: high
    mitigations:
      - Alertes de capacité automatiques à 70 % et 90 % d'utilisation du stockage.
      - Plan d'extension de capacité préparé et validé pour activation sous vingt-quatre heures.
      - Purge réglementaire automatique planifiée pour libérer les archives échues.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-indisponibilite-iam
    title: Indisponibilité du service IAM NEXID
    statement: >-
      Une panne de NEXID bloquerait toutes les authentifications OIDC des
      applications du socle utilisant le flux client_credentials, paralysant
      potentiellement les intégrations inter-services critiques.
    likelihood: low
    impact: high
    mitigations:
      - Déploiement multi-zone avec basculement automatique entre zones de disponibilité.
      - Cache de tokens court-terme côté client pour absorber les micro-indisponibilités.
      - Tests de résilience mensuels validant les procédures de bascule.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-mauvaise-qualite-regles
    title: Règles métier incorrectes dans AXIOM
    statement: >-
      Une règle métier mal paramétrée dans AXIOM peut produire des décisions
      erronées à grande échelle avant détection, notamment si la phase de
      validation par les experts métier est contournée par pression calendaire.
    likelihood: medium
    impact: high
    mitigations:
      - Double validation obligatoire par les équipes technique et métier avant activation.
      - Déploiement progressif avec monitoring en temps réel des décisions produites.
      - Rollback immédiat de règle sur alerte de dérive statistique.
    domains: [socle-si]
    created_from: synthetic

  - type: risk
    id: risk-dsoc-dette-technique-comptalib
    title: Dette technique de COMPTALIB freinant les évolutions
    statement: >-
      L'ancienneté de certains modules de COMPTALIB rend les évolutions
      coûteuses et risquées. Des adaptations comptables réglementaires
      pourraient nécessiter des refactorisations majeures difficilement
      planifiables dans les délais imposés.
    likelihood: medium
    impact: medium
    mitigations:
      - Cartographie de la dette technique en cours avec priorisation des modules critiques.
      - Projet d'APIisation pour isoler les consommateurs du code legacy sous-jacent.
      - Budget refactoring dédié inclus dans la feuille de route annuelle.
    domains: [socle-si]
    created_from: synthetic

