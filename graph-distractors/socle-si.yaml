nodes:

  # === SYSTEMS (25 total) ===

  - type: system
    id: sys-dsoc-bus-evenements
    name: Bus d'événements HERMES
    description: >-
      Plateforme de messagerie asynchrone centrale qui distribue les événements
      métier entre les applications du socle SI. Garantit la traçabilité et
      l'ordre de livraison des messages critiques.
    owner_team: Équipe Intégration Socle
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-pub-evenement
    name: Publication d'événement
    description: >-
      Permet à une application productrice d'émettre un événement typé vers le
      bus HERMES avec garantie d'au-moins-une-livraison. Les producteurs
      fournissent un schéma Avro versionné lors de l'enregistrement du topic.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-souscription-topic
    name: Souscription à un topic
    description: >-
      Enregistre un consommateur sur un ou plusieurs topics du bus et gère le
      décalage de lecture (offset). En cas d'échec de traitement, le message
      est redirigé vers la file de lettres mortes après trois tentatives.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-replay-evenements
    name: Rejeu d'événements
    description: >-
      Rejoue les événements d'un topic à partir d'un horodatage donné, utile
      pour reconstruire l'état d'un consommateur après une panne. L'accès est
      restreint aux équipes disposant du rôle replay-operator.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-coffre-secrets
    name: Coffre-fort de secrets ARKAN
    description: >-
      Gestionnaire centralisé de secrets applicatifs : mots de passe, clés API,
      certificats TLS et jetons de service. Toute rotation de secret déclenche
      automatiquement une notification aux applications abonnées.
    owner_team: Équipe Sécurité Socle
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-injection-secret
    name: Injection de secret en environnement
    description: >-
      Pousse dynamiquement le secret requis dans la variable d'environnement ou
      le volume partagé du conteneur au démarrage du pod. Évite le stockage en
      clair dans les manifests d'infrastructure.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-rotation-certificat
    name: Rotation automatique de certificat TLS
    description: >-
      Renouvelle les certificats TLS internes trente jours avant expiration et
      distribue le nouveau certificat à l'ensemble des ingress concernés sans
      interruption de service.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-registre-api
    name: Registre d'API KATALOG
    description: >-
      Catalogue central des contrats d'interface exposés par le socle. Stocke
      les spécifications OpenAPI, les politiques de rate-limiting et la matrice
      de compatibilité des versions.
    owner_team: Équipe Gouvernance API
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-publication-spec
    name: Publication de spécification OpenAPI
    description: >-
      Importe et valide une spécification OpenAPI 3.1 avant de la publier dans
      le catalogue. Un lint automatique vérifie la présence des champs
      obligatoires : contact, licence, versioning sémantique.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-portail-dev
    name: Portail développeur
    description: >-
      Expose aux équipes consommatrices la documentation interactive des API
      disponibles avec bac à sable d'essai. L'accès est authentifié via le
      SSO fédéré du groupe.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-deprecation-api
    name: Gestion de la dépréciation d'API
    description: >-
      Marque une version d'API comme dépréciée et déclenche des notifications
      automatiques vers tous les consommateurs enregistrés. Un délai minimal
      de soixante jours est imposé avant suppression effective.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-gestion-identite
    name: Annuaire d'identité NEXID
    description: >-
      Service d'identité fédérée pour les applications internes : authentification
      OIDC, provisionnement SCIM des comptes techniques et gestion des groupes
      d'autorisation par domaine métier.
    owner_team: Équipe IAM
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-auth-oidc
    name: Authentification OIDC
    description: >-
      Délivre des jetons d'accès signés après vérification des credentiels
      applicatifs. Supporte les flux client_credentials et authorization_code
      avec PKCE selon le profil de l'application.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-provision-compte
    name: Provisionnement de compte technique
    description: >-
      Crée ou désactive les comptes de service via l'API SCIM à la demande des
      équipes, avec approbation obligatoire d'un responsable de domaine. La
      suppression est logique pendant quatre-vingt-dix jours avant archivage.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-federation-sso
    name: Fédération SSO multi-domaine
    description: >-
      Établit la confiance entre NEXID et les fournisseurs d'identité externes
      via SAML 2.0. Permet aux collaborateurs de filiales d'accéder aux outils
      du socle sans compte supplémentaire.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-supervision-infra
    name: Plateforme de supervision VIGIL
    description: >-
      Centralise les métriques d'infrastructure et les alertes opérationnelles
      pour l'ensemble du socle SI. Intègre un moteur de corrélation pour
      réduire le bruit d'alerte lors des incidents complexes.
    owner_team: Équipe Exploitation Socle
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-collecte-metriques
    name: Collecte de métriques système
    description: >-
      Scrute les endpoints Prometheus exposés par chaque composant et agrège
      les séries temporelles dans la base de données de métriques. La
      rétention des données brutes est fixée à treize mois.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-alerting-seuil
    name: Alerting par seuil
    description: >-
      Évalue des règles d'alerte paramétrables sur les métriques collectées
      et notifie les équipes de garde via les canaux configurés. Les alertes
      critiques déclenchent automatiquement une entrée dans l'outil ITSM.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-tableau-bord-sla
    name: Tableau de bord SLA
    description: >-
      Affiche en temps réel le taux de disponibilité et les indicateurs de
      performance de chaque service selon les engagements contractuels. Les
      dépassements sont signalés en rouge avec horodatage de début de dérive.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-orchestrateur-jobs
    name: Orchestrateur de traitements KRONOS
    description: >-
      Planifie et exécute les traitements batch du socle : clôtures comptables,
      purges réglementaires et synchronisations inter-systèmes. Gère les
      dépendances entre jobs et les stratégies de reprise sur erreur.
    owner_team: Équipe Batch Socle
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-planification-job
    name: Planification de job
    description: >-
      Enregistre un traitement avec son expression cron, ses ressources cibles
      et sa stratégie de retry. Supporte les fenêtres d'exécution avec
      exclusion des jours non ouvrés selon le calendrier bancaire.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-suivi-execution
    name: Suivi d'exécution de traitement
    description: >-
      Conserve l'historique complet des exécutions d'un job : durée, code de
      retour, volume traité et logs structurés. Les échecs déclenchent une
      notification vers l'équipe propriétaire dans un délai de cinq minutes.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-dependance-jobs
    name: Gestion des dépendances entre jobs
    description: >-
      Modélise les prérequis entre traitements sous forme de graphe orienté
      acyclique. Si un job amont échoue, les jobs dépendants sont mis en
      attente jusqu'à résolution manuelle ou reprise automatique.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-archivage-legale
    name: Système d'archivage légal ARCHON
    description: >-
      Conserve les traces et documents à valeur probante selon les durées
      légales applicables au secteur bancaire. Utilise un coffre à scellement
      horodaté conforme au standard ETSI pour garantir l'intégrité des archives.
    owner_team: Équipe Conformité Archivage
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-depot-archive
    name: Dépôt d'archive
    description: >-
      Réceptionne un document ou un flux de données, calcule son empreinte
      cryptographique et l'enregistre dans le coffre avec horodatage certifié.
      L'identifiant d'archive retourné permet la vérification ultérieure.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-verification-integrite
    name: Vérification d'intégrité d'archive
    description: >-
      Recalcule l'empreinte du document archivé et la compare à la valeur
      scellée. En cas d'écart, une alerte de falsification est émise et
      l'accès au document est suspendu le temps de l'investigation.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-purge-reglementaire
    name: Purge réglementaire
    description: >-
      Supprime définitivement les archives dont la durée légale de conservation
      est échue, après validation par le responsable conformité. Produit un
      procès-verbal de destruction horodaté et signé électroniquement.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-referentiel-nomenclature
    name: Référentiel de nomenclature NOMEX
    description: >-
      Source de vérité pour tous les codes de référence partagés du socle :
      codes pays ISO, codes devise, typologies de comptes et listes de valeurs
      réglementaires. Expose une API de consultation versionnée.
    owner_team: Équipe Données Référence
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-consultation-code
    name: Consultation de code de référence
    description: >-
      Retourne la valeur et le libellé d'un code de référence à partir de son
      identifiant et de la version de nomenclature demandée. Les codes obsolètes
      restent accessibles en lecture pour les historiques.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-gestion-liste-valeurs
    name: Gestion de liste de valeurs
    description: >-
      Permet aux gestionnaires de données de créer, modifier ou archiver des
      entrées dans une liste de valeurs contrôlées. Chaque modification
      génère une version immuable avec l'identité du modificateur.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-passerelle-swift
    name: Passerelle SWIFT CORVUS
    description: >-
      Connecteur certifié SWIFTNet pour l'échange de messages financiers
      inter-banques. Assure la conversion de format entre les messages
      ISO 20022 internes et les formats propriétaires du réseau SWIFT.
    owner_team: Équipe Correspondance Bancaire
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-emission-swift
    name: Émission de message SWIFT
    description: >-
      Construit, valide et achemine un message vers SWIFTNet depuis les
      applications internes. La validation syntaxique et sémantique est
      effectuée avant soumission pour éviter les rejets réseau.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-reception-swift
    name: Réception et routage de message SWIFT
    description: >-
      Reçoit les messages entrants depuis SWIFTNet, les convertit au format
      ISO 20022 interne et les distribue à l'application destinataire via
      le bus d'événements HERMES.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-reconciliation-swift
    name: Réconciliation SWIFT
    description: >-
      Compare les accusés de réception SWIFTNet aux messages émis et signale
      les écarts de statut après le délai de réponse contractuel. Un tableau
      de bord dédié liste les messages en attente de confirmation.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-gestion-config
    name: Gestion de configuration CONFIGURA
    description: >-
      Centralise les paramètres de configuration de toutes les applications
      du socle avec gestion de profils par environnement. Supporte le rechargement
      à chaud des configurations sans redémarrage applicatif.
    owner_team: Équipe DevOps Socle
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-lecture-config
    name: Lecture de configuration applicative
    description: >-
      Fournit à une application ses paramètres de configuration pour
      l'environnement courant via une API REST ou un SDK natif. Les
      valeurs sensibles sont masquées dans les logs de débogage.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-deploiement-config
    name: Déploiement de configuration
    description: >-
      Pousse une nouvelle version de configuration vers les instances
      cibles avec option de rollback automatique si les health-checks
      échouent dans la minute suivant le déploiement.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-moteur-regles
    name: Moteur de règles métier AXIOM
    description: >-
      Évalue des règles de gestion paramétrées par les experts métier sans
      nécessiter de déploiement applicatif. Les règles sont versionnées et
      auditables avec traçabilité complète de chaque évaluation.
    owner_team: Équipe Règles Métier
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-evaluation-regle
    name: Évaluation de règle métier
    description: >-
      Exécute une règle ou un ensemble de règles sur un contexte fourni par
      l'appelant et retourne la décision avec son chemin de dérivation.
      Les temps d'évaluation sont enregistrés pour le suivi des performances.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-parametrage-regle
    name: Paramétrage de règle métier
    description: >-
      Interface de saisie permettant aux analystes métier de modifier les
      seuils et conditions d'une règle sans intervention technique. Chaque
      modification passe par un circuit de validation à deux niveaux.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-entrepot-donnees
    name: Entrepôt de données analytiques DATACORE
    description: >-
      Centralise les données historisées du socle pour les restitutions
      réglementaires et le reporting de gestion. Intègre un moteur de
      transformation en flux pour l'alimentation temps quasi-réel.
    owner_team: Équipe Data Warehouse
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-ingestion-flux
    name: Ingestion de flux de données
    description: >-
      Consomme les événements du bus HERMES et les charge dans les tables
      de staging selon les règles de mapping définies par domaine. Les
      rejets sont journalisés avec le motif de rejet pour correction manuelle.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-transformation-etl
    name: Transformation ETL
    description: >-
      Applique les règles de qualité, de déduplication et d'enrichissement
      aux données de staging avant leur chargement dans les tables de
      présentation. Un rapport de qualité est produit à chaque cycle.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-export-reglementaire
    name: Export réglementaire
    description: >-
      Génère les extractions périodiques destinées aux reportings prudentiels
      dans les formats requis par les autorités de supervision. Chaque export
      est signé et horodaté avant transmission.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-plateforme-containers
    name: Plateforme de conteneurs KUBOS
    description: >-
      Socle d'orchestration de conteneurs mutualisé pour l'ensemble des
      applications du groupe. Propose des namespaces isolés par domaine
      avec quotas de ressources et politiques réseau associées.
    owner_team: Équipe Platform Engineering
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-deploiement-service
    name: Déploiement de service applicatif
    description: >-
      Déploie une nouvelle version d'un service via pipeline GitOps en
      respectant la stratégie rolling-update ou blue-green selon la criticité.
      Le déploiement est automatiquement annulé si le taux d'erreur dépasse
      le seuil défini dans la politique du namespace.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-isolation-reseau
    name: Isolation réseau par namespace
    description: >-
      Applique des NetworkPolicy Kubernetes pour restreindre les flux
      inter-namespaces aux seules communications autorisées dans la matrice
      de flux validée par l'équipe sécurité.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-autoscaling
    name: Mise à l'échelle automatique
    description: >-
      Ajuste le nombre de répliques d'un déploiement en fonction des métriques
      d'utilisation CPU et de file d'attente. Les seuils de mise à l'échelle
      sont définis par SLA et révisés trimestriellement.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-gestion-droits
    name: Gestionnaire de droits d'accès PERIMA
    description: >-
      Gère les habilitations applicatives fines selon le modèle RBAC/ABAC
      pour les systèmes du socle. Centralise les demandes d'accès, les
      workflows de validation et les revues périodiques de droits.
    owner_team: Équipe IAM
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-demande-habilitation
    name: Demande d'habilitation
    description: >-
      Permet à un utilisateur ou à une application de soumettre une demande
      d'accès à une ressource protégée. Le workflow associé route la demande
      vers le ou les approbateurs définis dans la politique de ressource.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-revue-droits
    name: Revue périodique des droits
    description: >-
      Déclenche campagnes de recertification des habilitations actives auprès
      des responsables de ressource. Les droits non reconfirmés dans le délai
      imparti sont automatiquement révoqués.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-gestion-incidents
    name: Gestion des incidents IT INFOCALL
    description: >-
      Outil ITSM interne centralisant la création, le suivi et la résolution
      des incidents d'exploitation. Gère la priorisation selon la matrice
      d'impact/urgence et les escalades vers les équipes de niveau 2 et 3.
    owner_team: Équipe Exploitation Socle
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-creation-incident
    name: Création d'incident
    description: >-
      Enregistre un incident avec sa catégorie, son impact estimé et le
      composant affecté. La priorité est calculée automatiquement selon
      la matrice définie dans le référentiel de criticité des services.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-escalade-incident
    name: Escalade d'incident
    description: >-
      Transfère un incident vers le niveau de support supérieur avec
      enrichissement du contexte collecté. Un compteur d'escalade permet
      d'identifier les composants récurrents et de déclencher des actions
      préventives.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-bilan-post-incident
    name: Bilan post-incident
    description: >-
      Structure la rédaction du retour d'expérience selon un gabarit
      standardisé : chronologie, causes racines, actions correctives et
      indicateurs de non-recurrence. Partagé automatiquement aux équipes
      concernées à la clôture.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-pipeline-ci-cd
    name: Pipeline CI/CD FORGEFLOW
    description: >-
      Chaîne d'intégration et de déploiement continus mutualisée pour les
      équipes du socle. Intègre les étapes de compilation, tests, analyse
      statique, construction d'image et déploiement vers les environnements.
    owner_team: Équipe DevOps Socle
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-analyse-statique
    name: Analyse statique de code
    description: >-
      Exécute un ensemble de règles de qualité et de sécurité sur le code
      source à chaque soumission de merge request. Les violations bloquantes
      empêchent la fusion jusqu'à correction ou justification explicite.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-tests-integration
    name: Tests d'intégration automatisés
    description: >-
      Lance une suite de tests contre un environnement d'intégration dédié
      à chaque version candidate. Les résultats sont publiés dans le tableau
      de bord qualité et archivés dans ARCHON pour traçabilité réglementaire.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-promotion-artifact
    name: Promotion d'artefact
    description: >-
      Déplace un artefact validé du dépôt de staging vers le dépôt de
      production après approbation manuelle d'un responsable de livraison.
      L'artefact est signé cryptographiquement lors de la promotion.
    domains: [socle-si]
    created_from: synthetic

  - type: system
    id: sys-dsoc-tronc-comptable
    name: Tronc comptable partagé COMPTALIB
    description: >-
      Bibliothèque de services comptables mutualisée offrant aux applications
      métier les primitives d'écriture, de validation et d'interrogation du
      plan comptable bancaire. Garantit l'équilibre débit-crédit à chaque
      opération.
    owner_team: Équipe Comptabilité Socle
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-ecriture-comptable
    name: Écriture comptable
    description: >-
      Enregistre un mouvement de débit-crédit sur les comptes du plan
      comptable en respectant les règles d'équilibre et les contrôles
      de compte. Retourne le numéro de pièce comptable généré.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-interrogation-solde
    name: Interrogation de solde comptable
    description: >-
      Calcule le solde d'un compte à une date donnée en agrégeant les
      mouvements enregistrés. Distingue le solde comptable du solde
      disponible après prise en compte des autorisations en cours.
    domains: [socle-si]
    created_from: synthetic

  - type: feature
    id: feat-dsoc-lettrage-ecritures
    name: Lettrage d'écritures
    description: >-
      Rapproche les écritures débitrices et créditrices de même nature
