# graph/nodes/con-sca-ajout-beneficiaire.yaml
type: constraint
id: con-sca-ajout-beneficiaire
title: SCA à l'ajout de bénéficiaire
statement: >-
  L'ajout d'un nouveau bénéficiaire ou la modification de l'IBAN d'un bénéficiaire
  existant exige une authentification forte (SCA) du client titulaire, sur tous
  les canaux sans exception. Cette exigence est d'origine réglementaire DSP2 et
  renforcée par la politique interne de sécurité ; elle ne peut être levée ni
  contournée par une configuration de profil de risque client.
source: DSP2 / politique interne
severity: high
domains: [referentiel-client, dsp2-open-banking]
tags: [sca, beneficiaire, dsp2, securite]
created_from: seed
