[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scopegraph"
version = "0.1.0"
description = "An AI scoping runtime for projects that don't exist in isolation."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "chromadb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "httpx",
]
embeddings = [
    "sentence-transformers",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
